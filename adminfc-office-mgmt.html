<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Office Management | Admin FC</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .card { background:#fff; border:1px solid #bae6fd; border-radius:12px; box-shadow:0 4px 14px rgba(15,23,42,.05); padding:20px; margin-bottom:28px; }
  .card-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; margin:0; color:#0f172a; }
  .stat-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:16px; margin-bottom:24px; }
  .stat-card {
    position:relative; background:#fff; border:1px solid #bae6fd; border-top:4px solid #2563eb;
    border-radius:16px; padding:20px 54px 20px 20px; box-shadow:0 4px 14px rgba(15,23,42,.05);
    display:flex; flex-direction:column; gap:5px; transition:transform .25s,box-shadow .25s;
  }
  .stat-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(37,99,235,.14); }
  .stat-icon { position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:9px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .stat-label { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; color:#64748b; text-transform:uppercase; letter-spacing:.04em; }
  .stat-value { font-family:'Syne',sans-serif; font-weight:700; font-size:28px; color:#0f172a; }
  .stat-sub { font-family:'DM Sans',sans-serif; font-size:11px; color:#94a3b8; }
  .toolbar-row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:none; cursor:pointer; border-radius:10px; padding:10px 16px; font-weight:600; font-family:'DM Sans',sans-serif; font-size:13px; transition:background .2s,transform .2s,box-shadow .2s; }
  .btn:hover:not(:disabled) { transform:translateY(-2px); }
  .btn-secondary { background:#e2e8f0; color:#0f172a; }
  .btn-secondary:hover:not(:disabled) { background:#dbeafe; color:#1e40af; }
  .btn-primary { background:linear-gradient(160deg,#3b82f6,#2563eb,#1d4ed8); color:#fff; box-shadow:0 4px 12px rgba(37,99,235,.28); }
  .btn-primary:disabled { opacity:.6; cursor:default; }
  .btn-add { background:linear-gradient(160deg,#10b981,#059669); color:#fff; box-shadow:0 4px 12px rgba(5,150,105,.28); }
  .search-input-wrap {
    display:flex; align-items:center; gap:8px; height:42px; background:#f8fafc; border:1px solid #bae6fd;
    border-radius:12px; padding:0 14px; flex:1; min-width:200px; transition:border-color .2s;
  }
  .search-input-wrap:focus-within { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); background:#fff; }
  .search-input-wrap input { flex:1; border:none; outline:none; background:transparent; font-family:'DM Sans',sans-serif; font-size:14px; color:#0f172a; }
  .search-input-wrap input::placeholder { color:#94a3b8; }
  .table-wrap { overflow-x:auto; border-radius:12px; border:1px solid #bae6fd; }
  .offices-table { width:100%; border-collapse:collapse; background:#fff; }
  .offices-table th { text-align:left; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#475569; padding:12px 16px; border-bottom:2px solid #bae6fd; background:#f0f9ff; white-space:nowrap; position:sticky; top:0; }
  .offices-table td { padding:13px 16px; border-bottom:1px solid #f0f9ff; font-family:'DM Sans',sans-serif; font-size:13px; color:#334155; vertical-align:middle; }
  .offices-table tbody tr:hover td { background:#f0f9ff; }
  .offices-table tbody tr:hover td:first-child { box-shadow:inset 4px 0 0 #2563eb; }
  .offices-table tbody tr:last-child td { border-bottom:none; }
  .row-index { color:#94a3b8; font-size:12px; }
  .empty-row td { text-align:center; color:#94a3b8; padding:40px 0 !important; }
  .status-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:6px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:12px; white-space:nowrap; }
  .status-badge.active { background:#dcfce7; color:#166534; }
  .status-badge.inactive { background:#fee2e2; color:#991b1b; }
  .btn-edit, .btn-delete { background:none; border:none; font-family:'DM Sans',sans-serif; font-weight:600; font-size:12px; cursor:pointer; padding:4px 8px; border-radius:7px; transition:background .2s; }
  .btn-edit { color:#c2410c; }
  .btn-edit:hover { background:#ffedd5; }
  .btn-delete { color:#dc2626; }
  .btn-delete:hover { background:#fee2e2; }
  /* Modal backdrop */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,27,50,.5); align-items:center; justify-content:center; z-index:999; padding:20px; backdrop-filter:blur(4px); }
  .modal-overlay.open { display:flex; }
  @keyframes cvModalIn { from{opacity:0;transform:translateY(12px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

  /* Modal card */
  .modal-content {
    background:#fff; border-radius:20px; width:100%; max-width:460px;
    box-shadow:0 32px 80px rgba(15,27,50,.26); border:1px solid #e0f2fe;
    max-height:90vh; overflow-y:auto; animation:cvModalIn .22s cubic-bezier(.2,.9,.3,1.1);
    display:flex; flex-direction:column;
  }

  /* Modal header */
  .modal-header {
    display:flex; align-items:center; gap:14px; padding:22px 24px 18px;
    border-bottom:1px solid #f0f9ff; position:relative;
  }
  .modal-header-icon {
    width:46px; height:46px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    background:linear-gradient(135deg,#dbeafe,#bfdbfe);
  }
  .modal-header-icon.edit-mode { background:linear-gradient(135deg,#fef3c7,#fde68a); }
  .modal-header-text { flex:1; min-width:0; }
  .modal-header-text h3 { font-family:'Syne',sans-serif; font-size:17px; font-weight:700; color:#0f172a; margin:0 0 2px; }
  .modal-header-text p  { font-family:'DM Sans',sans-serif; font-size:12px; color:#94a3b8; margin:0; }
  .modal-close-btn {
    position:absolute; top:16px; right:16px; width:32px; height:32px;
    border:none; background:#f1f5f9; border-radius:8px; cursor:pointer;
    font-size:14px; color:#64748b; display:flex; align-items:center; justify-content:center;
    transition:background .2s,color .2s;
  }
  .modal-close-btn:hover { background:#fee2e2; color:#dc2626; }

  /* Modal body */
  .modal-body { padding:20px 24px; display:flex; flex-direction:column; gap:16px; }

  /* Form fields */
  .edit-field { display:flex; flex-direction:column; gap:6px; }
  .edit-field label { font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.06em; }
  .edit-field input {
    width:100%; box-sizing:border-box; height:44px; border:1.5px solid #e2e8f0; border-radius:12px;
    padding:0 14px; font-family:'DM Sans',sans-serif; font-size:14px; color:#0f172a;
    background:#f8fafc; transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .edit-field input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); background:#fff; }
  .edit-field input::placeholder { color:#94a3b8; }
  .field-hint { font-family:'DM Sans',sans-serif; font-size:11px; color:#94a3b8; }

  /* Status toggle buttons */
  .status-toggle-row { display:flex; gap:8px; }
  .status-toggle-btn {
    flex:1; height:42px; border:1.5px solid #e2e8f0; border-radius:12px;
    background:#f8fafc; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600;
    color:#64748b; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
    transition:all .2s;
  }
  .status-toggle-btn:hover { border-color:#bae6fd; background:#f0f9ff; }
  .status-toggle-btn.selected-active   { border-color:#16a34a; background:#dcfce7; color:#15803d; }
  .status-toggle-btn.selected-inactive { border-color:#dc2626; background:#fee2e2; color:#991b1b; }

  /* Modal footer */
  .modal-footer {
    display:flex; gap:10px; padding:16px 24px 20px;
    border-top:1px solid #f0f9ff;
  }
  .modal-footer .btn { flex:1; height:44px; font-size:14px; border-radius:12px; }

  .btn-danger { flex:1; background:#dc2626; color:#fff; border:none; padding:10px 16px; border-radius:12px; font-family:'DM Sans',sans-serif; font-weight:600; cursor:pointer; transition:background .2s,transform .2s; }
  .btn-danger:hover:not(:disabled) { background:#b91c1c; transform:translateY(-1px); }
  .btn-danger:disabled { opacity:.6; cursor:default; }
  /* Category filter tabs */
  .cat-filter-tabs { display:flex; gap:4px; margin-bottom:16px; padding:4px; background:#f1f5f9; border-radius:12px; flex-wrap:wrap; }
  .cat-filter-tab {
    background:none; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-weight:700;
    font-size:12px; color:#64748b; padding:7px 12px; border-radius:8px;
    transition:background .2s,color .2s,box-shadow .2s; white-space:nowrap; display:inline-flex; align-items:center; gap:5px;
  }
  .cat-filter-tab:hover { color:#0f172a; background:#e2e8f0; }
  .cat-filter-tab.active { color:#fff; background:#2563eb; box-shadow:0 4px 10px rgba(37,99,235,.26); }
  .cat-filter-tab[data-cat="Comfort Room"].active { background:#0284c7; box-shadow:0 4px 10px rgba(2,132,199,.26); }
  .cat-filter-tab[data-cat="Surroundings"].active { background:#16a34a; box-shadow:0 4px 10px rgba(22,163,74,.26); }
  .cat-filter-tab[data-cat="Laboratories"].active { background:#7c3aed; box-shadow:0 4px 10px rgba(124,58,237,.26); }
  .tab-count { background:rgba(255,255,255,.3); border-radius:4px; padding:1px 5px; font-size:11px; }
  .cat-filter-tab:not(.active) .tab-count { background:#f1f5f9; color:#64748b; }

  /* Category pills in table */
  .cat-pill { display:inline-flex; align-items:center; gap:3px; padding:3px 7px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; margin:1px 2px 1px 0; }
  .cat-pill.comfort { background:#e0f2fe; color:#0369a1; }
  .cat-pill.surroundings { background:#dcfce7; color:#15803d; }
  .cat-pill.laboratories { background:#ede9fe; color:#6d28d9; }

  /* Category checkbox pills in modal */
  .cat-check-group { display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .cat-check-pill {
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
    border:1.5px solid #bae6fd; background:#f8fafc; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; color:#475569;
    transition:all .2s; user-select:none;
  }
  .cat-check-pill:hover { border-color:#7dd3fc; background:#f0f9ff; }
  .cat-check-pill.checked.comfort { border-color:#0284c7; background:#e0f2fe; color:#0369a1; }
  .cat-check-pill.checked.surroundings { border-color:#16a34a; background:#dcfce7; color:#15803d; }
  .cat-check-pill.checked.laboratories { border-color:#7c3aed; background:#ede9fe; color:#6d28d9; }

  @media(max-width:1200px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:900px){.stat-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.stat-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <main class="main fade-in">
    <div id="topbar-mount"></div>
    <div style="margin-top:28px;">
      <!-- Stats -->
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-icon">🏢</div><div class="stat-label">Total Offices</div><div class="stat-value" id="stat-total">0</div><div class="stat-sub">In Registry</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">Active</div><div class="stat-value" id="stat-active">0</div><div class="stat-sub">Available for Evaluation</div></div>
        <div class="stat-card"><div class="stat-icon">⛔</div><div class="stat-label">Inactive</div><div class="stat-value" id="stat-inactive">0</div><div class="stat-sub">Disabled</div></div>
        <div class="stat-card" style="border-top-color:#0284c7;"><div class="stat-icon">🚿</div><div class="stat-label">Comfort Room</div><div class="stat-value" id="stat-comfort">0</div><div class="stat-sub">Offices</div></div>
        <div class="stat-card" style="border-top-color:#16a34a;"><div class="stat-icon">🌿</div><div class="stat-label">Surroundings</div><div class="stat-value" id="stat-surroundings">0</div><div class="stat-sub">Offices</div></div>
        <div class="stat-card" style="border-top-color:#7c3aed;"><div class="stat-icon">🔬</div><div class="stat-label">Laboratories</div><div class="stat-value" id="stat-labs">0</div><div class="stat-sub">Offices</div></div>
      </div>

      <div class="card">
        <div class="toolbar-row">
          <div class="card-title">Office Registry</div>
        </div>
        <div class="toolbar-row" style="margin-bottom:12px;">
          <div class="search-input-wrap">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="Search offices…">
          </div>
        </div>
        <div class="cat-filter-tabs" id="cat-filter-tabs">
          <button class="cat-filter-tab active" data-cat="all">All <span class="tab-count" id="tab-all">0</span></button>
          <button class="cat-filter-tab" data-cat="Comfort Room">🚿 Comfort Room <span class="tab-count" id="tab-comfort">0</span></button>
          <button class="cat-filter-tab" data-cat="Surroundings">🌿 Surroundings <span class="tab-count" id="tab-surroundings">0</span></button>
          <button class="cat-filter-tab" data-cat="Laboratories">🔬 Laboratories <span class="tab-count" id="tab-labs">0</span></button>
        </div>
        <div class="table-wrap">
          <table class="offices-table">
            <thead><tr><th>#</th><th>Office Name</th><th>Categories</th><th>Status</th><th>Created</th></tr></thead>
            <tbody id="offices-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script type="module">
import { guard as cvGuard } from "./cv-core.js";
await cvGuard(["adminfc"]);

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",authDomain:"kristal-adb78.firebaseapp.com",
  databaseURL:"https://kristal-adb78-default-rtdb.firebaseio.com",projectId:"kristal-adb78",
  storageBucket:"kristal-adb78.firebasestorage.app",messagingSenderId:"1016283938031",
  appId:"1:1016283938031:web:54c4d13409d9784ad7af1a",measurementId:"G-LK8D1CBQ2J"
};
const db = getFirestore(initializeApp(firebaseConfig));

document.getElementById("sidebar-mount").innerHTML = buildSidebar("adminfc","office-mgmt");
document.getElementById("topbar-mount").innerHTML = buildTopbar("Office Management","adminfc");

let offices = [];
let searchTerm = "";
let catFilter = "all";

function officeCategories(o) {
  if (Array.isArray(o.categories) && o.categories.length) return o.categories;
  return [];
}

function catPillsHtml(cats) {
  if (!cats.length) return `<span style="color:#94a3b8;font-size:12px;">—</span>`;
  return cats.map(c => {
    const cls = c === "Surroundings" ? "surroundings" : c === "Laboratories" ? "laboratories" : "comfort";
    const icon = c === "Surroundings" ? "🌿" : c === "Laboratories" ? "🔬" : "🚿";
    return `<span class="cat-pill ${cls}">${icon} ${c}</span>`;
  }).join("");
}

onSnapshot(collection(db,"fc_offices"), snap => {
  offices = snap.docs.map(d => ({ id:d.id, ...d.data() }))
    .sort((a,b) => (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"}));
  renderOffices();
});

function renderOffices() {
  const term = searchTerm.trim().toLowerCase();
  const active = offices.filter(o => (o.status||"active") === "active").length;
  const inactive = offices.length - active;
  const comfortCount = offices.filter(o => officeCategories(o).includes("Comfort Room")).length;
  const surroundingsCount = offices.filter(o => officeCategories(o).includes("Surroundings")).length;
  const labsCount = offices.filter(o => officeCategories(o).includes("Laboratories")).length;

  document.getElementById("stat-total").textContent = offices.length;
  document.getElementById("stat-active").textContent = active;
  document.getElementById("stat-inactive").textContent = inactive;
  document.getElementById("stat-comfort").textContent = comfortCount;
  document.getElementById("stat-surroundings").textContent = surroundingsCount;
  document.getElementById("stat-labs").textContent = labsCount;

  document.getElementById("tab-all").textContent = offices.length;
  document.getElementById("tab-comfort").textContent = comfortCount;
  document.getElementById("tab-surroundings").textContent = surroundingsCount;
  document.getElementById("tab-labs").textContent = labsCount;

  let filtered = offices;
  if (catFilter !== "all") filtered = filtered.filter(o => officeCategories(o).includes(catFilter));
  if (term) filtered = filtered.filter(o => (o.name||"").toLowerCase().includes(term));

  const tbody = document.getElementById("offices-tbody");
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No offices found.</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map((o, i) => {
    const status = o.status || "active";
    const created = o.createdAt ? new Date(o.createdAt).toLocaleDateString() : "-";
    return `<tr>
      <td class="row-index">${i+1}</td>
      <td><strong>${o.name||"-"}</strong></td>
      <td>${catPillsHtml(officeCategories(o))}</td>
      <td><span class="status-badge ${status}">${status === "active" ? "✅ Active" : "⛔ Inactive"}</span></td>
      <td>${created}</td>
    </tr>`;
  }).join("");
}

document.getElementById("cat-filter-tabs").addEventListener("click", ev => {
  const btn = ev.target.closest(".cat-filter-tab");
  if (!btn) return;
  catFilter = btn.dataset.cat;
  document.querySelectorAll(".cat-filter-tab").forEach(t => t.classList.toggle("active", t === btn));
  renderOffices();
});

document.getElementById("search-input").addEventListener("input", ev => { searchTerm = ev.target.value; renderOffices(); });
</script>
</body>
</html>

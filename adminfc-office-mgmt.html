<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Office Management | Admin FC</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .card { background:#fff; border:1px solid #bae6fd; border-radius:12px; box-shadow:0 4px 14px rgba(15,23,42,.05); padding:20px; margin-bottom:28px; }
  .card-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; margin:0; color:#0f172a; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:24px; }
  .stat-card {
    position:relative; background:#fff; border:1px solid #bae6fd; border-top:4px solid #2563eb;
    border-radius:16px; padding:20px 54px 20px 20px; box-shadow:0 4px 14px rgba(15,23,42,.05);
    display:flex; flex-direction:column; gap:5px; transition:transform .25s,box-shadow .25s;
  }
  .stat-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(37,99,235,.14); }
  .stat-icon { position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:9px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .stat-label { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; color:#64748b; text-transform:uppercase; letter-spacing:.04em; }
  .stat-value { font-family:'Syne',sans-serif; font-weight:700; font-size:28px; color:#0f172a; }
  .stat-sub { font-family:'DM Sans',sans-serif; font-size:11px; color:#94a3b8; }
  .toolbar-row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:none; cursor:pointer; border-radius:10px; padding:10px 16px; font-weight:600; font-family:'DM Sans',sans-serif; font-size:13px; transition:background .2s,transform .2s,box-shadow .2s; }
  .btn:hover:not(:disabled) { transform:translateY(-2px); }
  .btn-secondary { background:#e2e8f0; color:#0f172a; }
  .btn-secondary:hover:not(:disabled) { background:#dbeafe; color:#1e40af; }
  .btn-primary { background:linear-gradient(160deg,#3b82f6,#2563eb,#1d4ed8); color:#fff; box-shadow:0 4px 12px rgba(37,99,235,.28); }
  .btn-primary:disabled { opacity:.6; cursor:default; }
  .btn-add { background:linear-gradient(160deg,#10b981,#059669); color:#fff; box-shadow:0 4px 12px rgba(5,150,105,.28); }
  .search-input-wrap {
    display:flex; align-items:center; gap:8px; height:42px; background:#f8fafc; border:1px solid #bae6fd;
    border-radius:12px; padding:0 14px; flex:1; min-width:200px; transition:border-color .2s;
  }
  .search-input-wrap:focus-within { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); background:#fff; }
  .search-input-wrap input { flex:1; border:none; outline:none; background:transparent; font-family:'DM Sans',sans-serif; font-size:14px; color:#0f172a; }
  .search-input-wrap input::placeholder { color:#94a3b8; }
  .table-wrap { overflow-x:auto; border-radius:12px; border:1px solid #bae6fd; }
  .offices-table { width:100%; border-collapse:collapse; background:#fff; }
  .offices-table th { text-align:left; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#475569; padding:12px 16px; border-bottom:2px solid #bae6fd; background:#f0f9ff; white-space:nowrap; position:sticky; top:0; }
  .offices-table td { padding:13px 16px; border-bottom:1px solid #f0f9ff; font-family:'DM Sans',sans-serif; font-size:13px; color:#334155; vertical-align:middle; }
  .offices-table tbody tr:hover td { background:#f0f9ff; }
  .offices-table tbody tr:hover td:first-child { box-shadow:inset 4px 0 0 #2563eb; }
  .offices-table tbody tr:last-child td { border-bottom:none; }
  .row-index { color:#94a3b8; font-size:12px; }
  .empty-row td { text-align:center; color:#94a3b8; padding:40px 0 !important; }
  .status-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:6px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:12px; white-space:nowrap; }
  .status-badge.active { background:#dcfce7; color:#166534; }
  .status-badge.inactive { background:#fee2e2; color:#991b1b; }
  .btn-edit, .btn-delete { background:none; border:none; font-family:'DM Sans',sans-serif; font-weight:600; font-size:12px; cursor:pointer; padding:4px 8px; border-radius:7px; transition:background .2s; }
  .btn-edit { color:#c2410c; }
  .btn-edit:hover { background:#ffedd5; }
  .btn-delete { color:#dc2626; }
  .btn-delete:hover { background:#fee2e2; }
  /* Modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,27,50,.55); align-items:center; justify-content:center; z-index:999; padding:20px; backdrop-filter:blur(2px); }
  .modal-overlay.open { display:flex; }
  .modal-content { background:#fff; border-radius:18px; width:100%; max-width:440px; padding:28px; box-shadow:0 30px 70px rgba(15,27,50,.28); border:1px solid #e0f2fe; max-height:85vh; overflow-y:auto; animation:cvModalIn .2s ease; }
  @keyframes cvModalIn { from{opacity:0;transform:translateY(10px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-content h3 { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; color:#0f172a; margin:0 0 20px 0; }
  .modal-footer { display:flex; gap:10px; margin-top:20px; }
  .edit-field { margin-bottom:14px; }
  .edit-field label { display:block; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .edit-field input, .edit-field select { width:100%; box-sizing:border-box; height:42px; border:1px solid #bae6fd; border-radius:10px; padding:0 12px; font-family:'DM Sans',sans-serif; font-size:13px; color:#0f172a; background:#f8fafc; -webkit-appearance:none; appearance:none; transition:border-color .2s,box-shadow .2s; }
  .edit-field input:focus, .edit-field select:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); background:#fff; }
  .btn-danger { flex:1; background:#dc2626; color:#fff; border:none; padding:10px 16px; border-radius:10px; font-family:'DM Sans',sans-serif; font-weight:600; cursor:pointer; transition:background .2s,transform .2s; }
  .btn-danger:hover:not(:disabled) { background:#b91c1c; transform:translateY(-1px); }
  .btn-danger:disabled { opacity:.6; cursor:default; }
  @media(max-width:900px){.stat-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.stat-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <main class="main fade-in">
    <div id="topbar-mount"></div>
    <div style="margin-top:28px;">
      <!-- Stats -->
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-icon">🏢</div><div class="stat-label">Total Offices</div><div class="stat-value" id="stat-total">0</div><div class="stat-sub">In Registry</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">Active</div><div class="stat-value" id="stat-active">0</div><div class="stat-sub">Available for Evaluation</div></div>
        <div class="stat-card"><div class="stat-icon">⛔</div><div class="stat-label">Inactive</div><div class="stat-value" id="stat-inactive">0</div><div class="stat-sub">Disabled</div></div>
      </div>

      <div class="card">
        <div class="toolbar-row">
          <div class="card-title">Office Registry</div>
          <div class="toolbar-actions">
            <button class="btn btn-add" id="btn-add">➕ Add Office</button>
          </div>
        </div>
        <div class="toolbar-row" style="margin-bottom:16px;">
          <div class="search-input-wrap">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="Search offices…">
          </div>
        </div>
        <div class="table-wrap">
          <table class="offices-table">
            <thead><tr><th>#</th><th>Office Name</th><th>Status</th><th>Created</th><th>Action</th></tr></thead>
            <tbody id="offices-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="form-modal">
  <div class="modal-content">
    <h3 id="form-modal-title">➕ Add Office</h3>
    <div class="edit-field">
      <label>Office Name</label>
      <input type="text" id="form-name" placeholder="Enter office name">
    </div>
    <div class="edit-field">
      <label>Status</label>
      <select id="form-status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="form-cancel">Cancel</button>
      <button class="btn btn-primary" id="form-save">Save</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-content">
    <h3 style="color:#dc2626;">🗑️ Delete Office</h3>
    <p style="font-family:'DM Sans',sans-serif;font-size:14px;color:#334155;margin-bottom:16px;" id="delete-modal-text"></p>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="delete-cancel">Cancel</button>
      <button class="btn btn-danger" id="delete-confirm">Delete</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script type="module">
import { guard as cvGuard } from "./cv-core.js";
await cvGuard(["adminfc"]);

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",authDomain:"kristal-adb78.firebaseapp.com",
  databaseURL:"https://kristal-adb78-default-rtdb.firebaseio.com",projectId:"kristal-adb78",
  storageBucket:"kristal-adb78.firebasestorage.app",messagingSenderId:"1016283938031",
  appId:"1:1016283938031:web:54c4d13409d9784ad7af1a",measurementId:"G-LK8D1CBQ2J"
};
const db = getFirestore(initializeApp(firebaseConfig));

document.getElementById("sidebar-mount").innerHTML = buildSidebar("adminfc","office-mgmt");
document.getElementById("topbar-mount").innerHTML = buildTopbar("Office Management","adminfc");

let offices = [];
let searchTerm = "";
let editingId = null;
let deletingId = null;

onSnapshot(collection(db,"fc_offices"), snap => {
  offices = snap.docs.map(d => ({ id:d.id, ...d.data() }))
    .sort((a,b) => (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"}));
  renderOffices();
});

function renderOffices() {
  const term = searchTerm.trim().toLowerCase();
  const filtered = term ? offices.filter(o => (o.name||"").toLowerCase().includes(term)) : offices;
  const active = offices.filter(o => (o.status||"active") === "active").length;
  const inactive = offices.length - active;
  document.getElementById("stat-total").textContent = offices.length;
  document.getElementById("stat-active").textContent = active;
  document.getElementById("stat-inactive").textContent = inactive;
  const tbody = document.getElementById("offices-tbody");
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No offices found.</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map((o, i) => {
    const status = o.status || "active";
    const created = o.createdAt ? new Date(o.createdAt).toLocaleDateString() : "-";
    return `<tr>
      <td class="row-index">${i+1}</td>
      <td><strong>${o.name||"-"}</strong></td>
      <td><span class="status-badge ${status}">${status === "active" ? "✅ Active" : "⛔ Inactive"}</span></td>
      <td>${created}</td>
      <td style="white-space:nowrap;">
        <button class="btn-edit" data-id="${o.id}">Edit</button>
        <button class="btn-delete" data-id="${o.id}">Delete</button>
      </td>
    </tr>`;
  }).join("");
  tbody.querySelectorAll(".btn-edit").forEach(b => b.addEventListener("click", () => openForm(b.dataset.id)));
  tbody.querySelectorAll(".btn-delete").forEach(b => b.addEventListener("click", () => openDelete(b.dataset.id)));
}

document.getElementById("search-input").addEventListener("input", ev => { searchTerm = ev.target.value; renderOffices(); });

// Form modal
const formModal = document.getElementById("form-modal");
document.getElementById("btn-add").addEventListener("click", () => openForm(null));

function openForm(officeId) {
  editingId = officeId;
  const isEdit = !!officeId;
  document.getElementById("form-modal-title").textContent = isEdit ? "✏️ Edit Office" : "➕ Add Office";
  document.getElementById("form-save").textContent = isEdit ? "Save Changes" : "Add Office";
  if (isEdit) {
    const o = offices.find(x => x.id === officeId);
    if (!o) return;
    document.getElementById("form-name").value = o.name || "";
    document.getElementById("form-status").value = o.status || "active";
  } else {
    document.getElementById("form-name").value = "";
    document.getElementById("form-status").value = "active";
  }
  formModal.classList.add("open");
}

document.getElementById("form-cancel").addEventListener("click", () => { formModal.classList.remove("open"); editingId = null; });
formModal.addEventListener("click", ev => { if (ev.target === formModal) { formModal.classList.remove("open"); editingId = null; } });

document.getElementById("form-save").addEventListener("click", async () => {
  const name = document.getElementById("form-name").value.trim();
  if (!name) { alert("Office name is required."); return; }
  const btn = document.getElementById("form-save");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const payload = { name, status: document.getElementById("form-status").value };
    if (editingId) {
      await updateDoc(doc(db,"fc_offices",editingId), { ...payload, updatedAt: Date.now() });
    } else {
      await addDoc(collection(db,"fc_offices"), { ...payload, createdAt: Date.now() });
    }
    formModal.classList.remove("open"); editingId = null;
  } catch(err) { alert("Failed to save."); console.error(err); }
  finally { btn.disabled = false; btn.textContent = editingId ? "Save Changes" : "Add Office"; }
});

// Delete modal
const deleteModal = document.getElementById("delete-modal");
function openDelete(officeId) {
  const o = offices.find(x => x.id === officeId);
  if (!o) return;
  deletingId = officeId;
  document.getElementById("delete-modal-text").textContent = `Delete "${o.name}"? This cannot be undone.`;
  deleteModal.classList.add("open");
}
document.getElementById("delete-cancel").addEventListener("click", () => { deleteModal.classList.remove("open"); deletingId = null; });
deleteModal.addEventListener("click", ev => { if (ev.target === deleteModal) { deleteModal.classList.remove("open"); deletingId = null; } });
document.getElementById("delete-confirm").addEventListener("click", async () => {
  if (!deletingId) return;
  const btn = document.getElementById("delete-confirm");
  btn.disabled = true; btn.textContent = "Deleting…";
  try {
    await deleteDoc(doc(db,"fc_offices",deletingId));
    deleteModal.classList.remove("open"); deletingId = null;
  } catch(err) { alert("Failed to delete."); console.error(err); }
  finally { btn.disabled = false; btn.textContent = "Delete"; }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Reports | Admin 2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @media print {
    #sidebar-mount, #topbar-mount, .filter-row, .stat-grid, .saved-reports-section, .report-tabs, .preview-bar, #commentsReportPreview { display: none !important; }
    .report-section { break-inside: avoid; }

    @page { margin: 0; }
    html, body { margin: 0 !important; }

    .layout, .main { display: block !important; padding: 0 !important; margin: 0 !important; }

    #reportPreview { display: block !important; margin: 0 !important; }

    .cvr-page {
      box-shadow: none !important;
      border: none !important;
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 auto !important;
      min-height: var(--page-height, 297mm) !important;
    }

    .cvr-page {
      display: table !important;
      table-layout: fixed !important;
    }
    .cvr-page-header {
      display: table-header-group !important;
    }
    .cvr-page-content {
      display: table-row-group !important;
    }
    .cvr-page-footer {
      display: table-footer-group !important;
    }

    .cvr-inner-header,
    .cvr-inner-content,
    .cvr-inner-footer {
      padding-left: var(--cvr-margin-x, 15mm) !important;
      padding-right: var(--cvr-margin-x, 15mm) !important;
    }

    .cvr-inner-header {
      padding-top: var(--cvr-header-pad-top, 4mm) !important;
      padding-bottom: 0 !important;
    }

    .cvr-inner-content {
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }

    .cvr-inner-footer {
      padding-top: var(--cvr-footer-pad-y, 6mm) !important;
      padding-bottom: var(--cvr-footer-pad-y, 6mm) !important;
      border-top: 1px solid #e2e8f0 !important;
    }
  }

  .category-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .category-pill.comfort-room {
    background: #e0f2fe;
    color: #0369a1;
  }

  .category-pill.surroundings {
    background: #dcfce7;
    color: #15803d;
  }

  .filter-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid #bae6fd;
  }

  .filter-select, .filter-date {
    padding: 10px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: #fff;
    cursor: pointer;
  }

  .filter-select:focus, .filter-date:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .filter-date {
    cursor: text;
  }

  .filter-select {
    flex: 1;
    min-width: 160px;
  }

  .btn-generate {
    padding: 10px 18px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-generate:hover {
    background: #1d4ed8;
  }

  .btn-save {
    padding: 10px 18px;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-save:hover {
    background: #15803d;
  }

  .btn-save:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  .btn-print {
    padding: 8px 14px;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-print:hover {
    background: #6d28d9;
  }

  .report-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .report-tab {
    padding: 10px 18px;
    background: #fff;
    color: #64748b;
    border: 1px solid #bae6fd;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .report-tab:hover {
    background: #f8fafc;
  }

  .report-tab.active {
    background: #0f1b32;
    color: #fff;
    border-color: #0f1b32;
  }

  .report-tab.comments-tab.active {
    background: #6d28d9;
    border-color: #6d28d9;
  }

  .empty-state {
    text-align: center;
    color: #94a3b8;
    padding: 40px 0;
    font-family: 'DM Sans', sans-serif;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
    margin-bottom: 24px;
  }

  .stat-card{
    position:relative;
    background:#ffffff;
    border:1px solid #bae6fd;
    border-top:4px solid var(--accent3, #2563eb);
    border-radius:16px;
    padding:20px 20px 22px;
    box-shadow:0 4px 14px rgba(15,23,42,0.05);
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .stat-card.blue{ border-top-color:#2563eb; }
  .stat-card.green{ border-top-color:#2563eb; }

  .stat-icon{
    position:absolute;
    top:18px;
    right:18px;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }

  .stat-label{
    font-family:'DM Sans',sans-serif;
    font-size:13px;
    font-weight:500;
    color:#64748b;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .stat-value{
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:30px;
    color:#0f172a;
    line-height:1.1;
    overflow-wrap:anywhere;
  }

  .stat-sub{
    font-family:'DM Sans',sans-serif;
    font-size:12px;
    color:#94a3b8;
  }

  @media (max-width: 1200px) {
    .stat-value {
      font-size: 30px;
    }
  }

  @media (max-width: 1024px) {
    .stat-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 900px) {
    .stat-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 768px) {
    .stat-grid {
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
  }

  @media (max-width: 600px) {
    .stat-card {
      padding: 16px 16px 18px;
    }
    .stat-value {
      font-size: 26px;
    }
    .stat-icon {
      width: 32px;
      height: 32px;
      font-size: 14px;
      top: 14px;
      right: 14px;
    }
  }

  @media (max-width: 480px) {
    .stat-grid {
      grid-template-columns: 1fr;
    }
    .stat-value {
      font-size: 28px;
    }
  }

  @media (max-width: 360px) {
    .stat-grid {
      gap: 10px;
    }
    .stat-card {
      padding: 14px 14px 18px;
    }
  }

  #reportPreview {
    display: none;
    background: transparent;
    border: none;
    border-radius: 0;
    overflow: visible;
    margin-bottom: 18px;
  }

  #commentsReportPreview {
    display: none;
    background: #fff;
    border: 1px solid #bae6fd;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 32px;
  }

  .preview-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: #f8fafc;
    border: 1px solid #bae6fd;
    border-radius: 14px 14px 0 0;
    border-bottom: 1px solid #bae6fd;
    flex-wrap: wrap;
  }

  .preview-bar .preview-label {
    flex: 1;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
  }

  .btn-close {
    background: #e2e8f0;
    color: #475569;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-close:hover {
    background: #cbd5e1;
  }

  .no-data-message {
    text-align: center;
    padding: 24px;
    color: #94a3b8;
    font-style: italic;
  }

  .saved-reports-section {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    border: 1px solid #bae6fd;
  }

  .saved-reports-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .saved-reports-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    color: #0f1b32;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .saved-reports-count {
    background: #dbeafe;
    color: #1e40af;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
  }

  .saved-reports-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Sans', sans-serif;
  }

  .saved-reports-table th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
    border-bottom: 1px solid #e2e8f0;
  }

  .saved-reports-table td {
    padding: 14px;
    font-size: 13px;
    color: #334155;
    border-bottom: 1px solid #f1f5f9;
  }

  .saved-reports-table tbody tr:last-child td {
    border-bottom: none;
  }

  .saved-reports-table tbody tr:hover {
    background: #f8fafc;
  }

  .saved-office-name {
    font-weight: 700;
    color: #0f1b32;
  }

  .saved-avg {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
  }

  .action-btns {
    display: flex;
    gap: 8px;
  }

  .btn-view {
    background: #0f1b32;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn-view:hover {
    background: #1e293b;
  }

  .btn-delete {
    background: #fee2e2;
    color: #ef4444;
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-delete:hover {
    background: #fecaca;
  }

  .official-report {
    background: #fff;
    font-family: 'Times New Roman', Times, serif;
    color: #000;
    line-height: 1.6;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 40px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.10), 0 1px 2px rgba(15,23,42,0.06);
    border: 1px solid #e2e8f0;
  }

  .cvr-page {
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:var(--page-width, 210mm);
    min-height:var(--page-height, 297mm);
    margin:0 auto;
    box-sizing:border-box;
    background:#fff;
    font-family:'Times New Roman', Times, serif;
    color:#000;
    line-height:1.6;
    box-shadow:0 1px 3px rgba(15,23,42,0.10), 0 1px 2px rgba(15,23,42,0.06);
    border:1px solid #e2e8f0;
  }

  .cvr-page-header {
    width:100%;
    flex:0 0 auto;
  }

  .cvr-page-content {
    width:100%;
    flex:0 1 auto;
  }

  .cvr-page-footer {
    width:100%;
    flex:0 0 auto;
    margin-top:auto;
  }

  .cvr-inner-header,
  .cvr-inner-content,
  .cvr-inner-footer {
    width:100%;
    box-sizing:border-box;
    padding-left: var(--cvr-margin-x, 15mm);
    padding-right: var(--cvr-margin-x, 15mm);
  }

  .cvr-inner-header {
    padding-top: var(--cvr-header-pad-top, 4mm);
    padding-bottom:0;
  }

  .cvr-inner-content {
    padding-top:0;
    padding-bottom:0;
  }

  .cvr-inner-footer {
    padding-top: var(--cvr-footer-pad-y, 6mm);
    padding-bottom: var(--cvr-footer-pad-y, 6mm);
    border-top:1px solid #e2e8f0;
  }

  .cvr-inner-footer .official-footer {
    margin-top: 0;
    padding-top: 0;
  }

  .page-break-sheet {
    margin-top: 44px;
    padding-top: 32px;
    border-top: none;
    position: relative;
  }
  .page-break-sheet::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: repeating-linear-gradient(
      90deg,
      #cbd5e1 0px, #cbd5e1 8px,
      transparent 8px, transparent 16px
    );
  }
  .page-break-sheet::after {
    content: "— New Page —";
    position: absolute;
    top: -9px; left: 50%; transform: translateX(-50%);
    background: #f7fafc;
    padding: 0 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    color: #94a3b8; text-transform: uppercase;
  }

  @media print {
    .page-break-sheet {
      page-break-before: always;
      break-before: page;
      margin-top: 0;
      padding-top: 0;
    }
    .page-break-sheet::before,
    .page-break-sheet::after {
      display: none;
    }
  }

  .lh-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .lh-logo-box, .lh-seal-box {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lh-logo-box {
    width: var(--lh-logo-w, 40mm);
    height: var(--lh-logo-h, 24mm);
  }

  .lh-seal-box {
    width: var(--lh-seal-w, 26mm);
    height: var(--lh-seal-h, 26mm);
  }

  .lh-logo-box img, .lh-seal-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .lh-text {
    flex: 1;
    text-align: center;
    line-height: 1.4;
    font-size: 11pt;
  }

  .lh-text .rep {
    font-size: 9.5pt;
  }

  .lh-text .uni {
    font-size: 11.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.1px;
  }

  .lh-text .dept {
    font-size: 11pt;
    font-weight: bold;
    text-transform: uppercase;
  }

  .lh-text .addr {
    font-size: 8.5pt;
    color: #444;
  }

  .lh-divider {
    border: none;
    border-top: 2.5px solid #1a3a6b;
    margin: 4px 0 10px;
  }

  .official-title {
    text-align: center;
    font-size: 13.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  /*
    SHRINK-TO-FIT: the body content below the header (meta / table /
    narrative / signatures) reads its font-size and vertical spacing
    from --cvr-content-scale (default 1, i.e. unchanged full size).
    buildPaginatedSectionPages() in the script below sets this variable
    on the content wrapper of each generated page: it first tries scale
    1, then shrinks in small steps if that's what it takes to fit ALL
    of a section's content onto a single physical sheet, before ever
    falling back to a second page. The letterhead header and the
    accreditations footer intentionally do NOT read this variable, so
    they always render at their normal, fixed size.
  */
  .official-meta {
    font-size: calc(13pt * var(--cvr-content-scale, 1));
    line-height: 1.9;
    margin-bottom: calc(10px * var(--cvr-content-scale, 1));
  }

  .official-meta b {
    font-weight: bold;
  }

  .official-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: calc(14px * var(--cvr-content-scale, 1));
    font-size: calc(14pt * var(--cvr-content-scale, 1));
  }

  .official-table th {
    background: #1a3a6b;
    color: #fff;
    padding: calc(10px * var(--cvr-content-scale, 1)) calc(11px * var(--cvr-content-scale, 1));
    border: 1px solid #1a3a6b;
    text-align: center;
    font-weight: bold;
  }

  .official-table td {
    border: 1px solid #aaa;
    padding: calc(9px * var(--cvr-content-scale, 1)) calc(11px * var(--cvr-content-scale, 1));
  }

  .official-table tr:nth-child(even) td {
    background: #eef2f9;
  }

  .official-narrative {
    font-size: calc(13pt * var(--cvr-content-scale, 1));
    line-height: 1.8;
    text-align: justify;
    margin-bottom: calc(16px * var(--cvr-content-scale, 1));
  }

  .official-narrative p {
    margin-bottom: calc(10px * var(--cvr-content-scale, 1));
  }

  .official-signatures {
    display: flex;
    gap: calc(40px * var(--cvr-content-scale, 1));
    margin-top: calc(24px * var(--cvr-content-scale, 1));
    font-size: calc(12pt * var(--cvr-content-scale, 1));
  }

  .sig-block {
    flex: 1;
  }

  .sig-label {
    color: #555;
    font-size: calc(11pt * var(--cvr-content-scale, 1));
    margin-bottom: calc(30px * var(--cvr-content-scale, 1));
  }

  .sig-line {
    border-top: 1px solid #000;
    width: 100%;
    margin-bottom: 4px;
  }

  .sig-name {
    font-weight: bold;
    text-transform: uppercase;
    padding-top: 4px;
    display: inline-block;
  }

  .sig-title {
    font-size: calc(11pt * var(--cvr-content-scale, 1));
    font-style: italic;
    color: #333;
    margin-top: 2px;
  }

  .official-footer {
    margin-top: 20px;
    padding-top: 8px;
    display: block;
    width: 100%;
  }

  .official-footer img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }


</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <main class="main fade-in">
    <div id="topbar-mount"></div>

    

    <div class="stat-grid">
      <div class="stat-card blue">
        <div class="stat-icon">📝</div>
        <div class="stat-label">Total Feedback</div>
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-sub" id="stat-total-sub">All Evaluations</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-icon">👍</div>
        <div class="stat-label">Positive (≥4★)</div>
        <div class="stat-value" id="stat-positive">0</div>
        <div class="stat-sub">Highly Rated</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-icon">👎</div>
        <div class="stat-label">Negative (&lt;3★)</div>
        <div class="stat-value" id="stat-negative">0</div>
        <div class="stat-sub">Needs Attention</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon">💾</div>
        <div class="stat-label">Saved Reports</div>
        <div class="stat-value" id="stat-saved">0</div>
        <div class="stat-sub">Generated</div>
      </div>
    </div>

    <div class="filter-row">
      <input type="date" class="filter-date" id="start-date">
      <input type="date" class="filter-date" id="end-date">

      <select class="filter-select" id="category-filter">
        <option value="">Select Category...</option>
        <option value="Comfort Room"> Comfort Room</option>
        <option value="Surroundings"> Surroundings</option>
      </select>

      <select class="filter-select" id="location-filter" disabled>
        <option value="">Select Category First</option>
      </select>

      <select class="filter-select" id="paperSizeFilter" title="Paper size for preview, print, and PDF export" onchange="setPaperSize(this.value)">
        <optgroup label="ISO / International">
          <option value="a3">Paper: A3 (297 × 420 mm)</option>
          <option value="a4" selected>Paper: A4 (210 × 297 mm)</option>
          <option value="a5">Paper: A5 (148 × 210 mm)</option>
          <option value="a6">Paper: A6 (105 × 148 mm)</option>

function parseDateOnly(value) {
  if (!value) return null;
  const str = String(value).trim();
  if (!str) return null;

  const iso = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);
  if (iso) {
    const dt = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
    return isNaN(dt.getTime()) ? null : dt;
  }

  const parsed = new Date(str);
  if (isNaN(parsed.getTime())) return null;
  return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
}

  const highDims = dimensionAverages.filter(d => parseFloat(d.percentage) >= 80).slice(0, 3).map(d => d.dimension);

  const p1 = `The <strong>results</strong> of the Cleanliness Evaluation Report for the <strong>${office}</strong>, Iloilo State University of Fisheries Science and Technology – San Enrique Campus, with <strong>${respondents}</strong> respondent(s), show an <strong>${perfWord} performance</strong> in cleanliness standards with an average satisfaction rate of <strong>${overallPct.toFixed(2)}%</strong>.
    ${topDims.length ? `This indicates that the area excels in ${topDims.join(", ")}, reflecting strong maintenance and cleanliness practices.` : ""}`;

  const p2 = `<strong>Regarding specific evaluation dimensions</strong>,
    ${highDims.length ? `${highDims.join(", ")} demonstrated excellent performance, indicating consistent cleanliness and proper maintenance standards.` : "the facility maintains satisfactory cleanliness levels."}
    ${lowDims.length ? `Additionally, ${lowDims.join(", ")} scored slightly lower, indicating opportunities for improvement in these areas to enhance overall cleanliness and user satisfaction.` : "All dimensions performed at satisfactory levels or above."}`;

// ======================
// DOM-MEASURED PAGINATION HELPERS
//
// The report content (evaluation table rows, comment rows, narrative
// paragraphs, the signature block) is paginated by ACTUALLY MEASURING
// each piece in the live document (off-screen), instead of relying on
// a fixed single-page template or on rasterized image slicing.
//
// SHRINK-TO-FIT: before falling back to a second physical sheet, each
// section first tries to fit ALL of its content (the meta block, the
// table rows, the narrative paragraphs, and the signature block) onto
// ONE page by proportionally shrinking the body text size and vertical
// spacing (via the --cvr-content-scale CSS variable, consumed by
// .official-meta / .official-table / .official-narrative /
// .official-signatures in the stylesheet). The letterhead header and
// the accreditations footer are always rendered at full, fixed size —
// only the body content between them shrinks. A second sheet is only
// ever produced when the content still doesn't fit at the smallest
// readable scale (CVR_CONTENT_MIN_SCALE), i.e. when it genuinely can't
// fit on one page — in which case the (already-shrunk) content is
// greedily packed across as few extra sheets as needed, each with the
// same header pinned to the top and the same footer pinned to the
// bottom.
// ======================

const CVR_CONTENT_MIN_SCALE = 0.62;
const CVR_CONTENT_SCALE_STEP = 0.04;

function mmStringToPx(mmStr) {
  const probe = document.createElement("div");
  probe.style.position = "fixed";
  probe.style.visibility = "hidden";
  probe.style.left = "-99999px";
  probe.style.top = "0";
  probe.style.width = mmStr;
  document.body.appendChild(probe);
  const px = probe.getBoundingClientRect().width;
  document.body.removeChild(probe);
  return px || 0;
}

function measureBlockHeightPx(html, widthPx) {
  const probe = document.createElement("div");
  probe.style.position = "fixed";
  probe.style.visibility = "hidden";
  probe.style.left = "-99999px";
  probe.style.top = "0";
  probe.style.width = widthPx + "px";
  probe.style.boxSizing = "border-box";
  probe.style.fontFamily = "'Times New Roman', Times, serif";
  probe.style.lineHeight = "1.6";
  probe.style.color = "#000";
  probe.innerHTML = html;
  document.body.appendChild(probe);
  const h = probe.getBoundingClientRect().height;
  document.body.removeChild(probe);
  return h || 0;
}

// Measures the same HTML as measureBlockHeightPx, but with the given
// --cvr-content-scale value applied on a wrapping element, so the
// scaled font-size/margin/padding calc() rules in the stylesheet take
// effect for the measurement (mirrors what will actually be rendered).
function measureScaledBlockHeightPx(html, widthPx, scale) {
  return measureBlockHeightPx(`<div style="--cvr-content-scale:${scale};">${html}</div>`, widthPx);
}

function buildPaginatedSectionPages(section) {
  const {
    domId, headerInnerHtml, footerInnerHtml, tableHeadHtml,
    metaHtml, rowsHtml, narrativeParas, signaturesHtml, forceNewSheet
  } = section;

  const pageWidthMm = getComputedStyle(document.documentElement).getPropertyValue("--page-width").trim() || "210mm";
  const pageHeightMm = getComputedStyle(document.documentElement).getPropertyValue("--page-height").trim() || "297mm";
  const pageWidthPx = mmStringToPx(pageWidthMm);
  const pageHeightPx = mmStringToPx(pageHeightMm);

  // Header and footer always render at full, fixed size (never
  // affected by content shrink-to-fit), so their measured height is
  // scale-independent.
  const headerHeightPx = measureBlockHeightPx(`<div class="cvr-inner-header">${headerInnerHtml}</div>`, pageWidthPx);
  const footerHeightPx = measureBlockHeightPx(`<div class="cvr-inner-footer">${footerInnerHtml}</div>`, pageWidthPx);
  const availablePx = Math.max(pageHeightPx - headerHeightPx - footerHeightPx, 40);

  const rawBlocks = [];
  if (metaHtml) rawBlocks.push({ kind: "meta", html: `<div class="official-meta">${metaHtml}</div>` });
  (rowsHtml || []).forEach(r => rawBlocks.push({ kind: "row", html: r }));
  (narrativeParas || []).forEach(p => rawBlocks.push({ kind: "narrative", html: p }));
  if (signaturesHtml) rawBlocks.push({ kind: "signatures", html: signaturesHtml });

  function theadHeightAtScale(scale) {
    if (!tableHeadHtml) return 0;
    return measureScaledBlockHeightPx(`<table class="official-table"><thead>${tableHeadHtml}</thead></table>`, pageWidthPx, scale);
  }

  function measureBlocksAtScale(scale) {
    return rawBlocks.map(b => {
      const wrapped = b.kind === "row"
        ? `<table class="official-table"><tbody>${b.html}</tbody></table>`
        : b.kind === "narrative"
          ? `<div class="official-narrative">${b.html}</div>`
          : b.html;
      return { ...b, height: measureScaledBlockHeightPx(wrapped, pageWidthPx, scale) };
    });
  }

  function pageBlockHeight(list, theadH) {
    const hasRow = list.some(b => b.kind === "row");
    const sum = list.reduce((s, b) => s + b.height, 0);
    return sum + (hasRow ? theadH : 0);
  }

  // ---- SHRINK-TO-FIT: try to place everything on ONE sheet first ----
  let fitScale = null;
  let fitMeasured = null;
  for (let scale = 1; scale >= CVR_CONTENT_MIN_SCALE - 1e-9; scale -= CVR_CONTENT_SCALE_STEP) {
    const roundedScale = Math.round(scale * 100) / 100;
    const measured = measureBlocksAtScale(roundedScale);
    const theadH = theadHeightAtScale(roundedScale);
    if (pageBlockHeight(measured, theadH) <= availablePx) {
      fitScale = roundedScale;
      fitMeasured = measured;
      break;
    }
  }

  function renderPageHtml(pageBlocks, scale, isFirst) {
    let bodyHtml = "";
    let i = 0;
    while (i < pageBlocks.length) {
      const b = pageBlocks[i];
      if (b.kind === "row") {
        let rows = "";
        while (i < pageBlocks.length && pageBlocks[i].kind === "row") {
          rows += pageBlocks[i].html;
          i++;
        }
        bodyHtml += `<table class="official-table">${tableHeadHtml ? `<thead>${tableHeadHtml}</thead>` : ""}<tbody>${rows}</tbody></table>`;
      } else if (b.kind === "narrative") {
        bodyHtml += `<div class="official-narrative">${b.html}</div>`;
        i++;
      } else {
        bodyHtml += b.html;
        i++;
      }
    }

    const idAttr = isFirst && domId ? ` id="${domId}"` : "";
    const sheetClass = (!isFirst || forceNewSheet) ? " page-break-sheet" : "";

    return `
      <div class="cvr-page${sheetClass}"${idAttr}>
        <div class="cvr-page-header"><div class="cvr-inner-header">${headerInnerHtml}</div></div>
        <div class="cvr-page-content"><div class="cvr-inner-content" style="--cvr-content-scale:${scale};">${bodyHtml}</div></div>
        <div class="cvr-page-footer"><div class="cvr-inner-footer">${footerInnerHtml}</div></div>
      </div>
    `;
  }

  if (fitScale !== null) {
    // Everything fits on a single sheet at fitScale — no second page needed.
    return renderPageHtml(fitMeasured, fitScale, true);
  }

  // Content genuinely doesn't fit on one sheet even at the minimum
  // readable scale — fall back to greedy multi-page packing at that
  // minimum scale.
  const fallbackScale = CVR_CONTENT_MIN_SCALE;
  const measured = measureBlocksAtScale(fallbackScale);
  const theadH = theadHeightAtScale(fallbackScale);

  const pages = [];
  let current = [];
  measured.forEach(block => {
    const projected = [...current, block];
    if (current.length > 0 && pageBlockHeight(projected, theadH) > availablePx) {
      pages.push(current);
      current = [block];
    } else {
      current = projected;
    }
  });
  if (current.length > 0) pages.push(current);
  if (pages.length === 0) pages.push([]);

  return pages.map((pageBlocks, idx) => renderPageHtml(pageBlocks, fallbackScale, idx === 0)).join("");
}

function createOfficialDocument(report) {
  const reportStart = new Date(report.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const reportEnd = new Date(report.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const category = report.category || DEFAULT_CATEGORY;

  const narrative = generateNarrative(report.office, report.respondents, parseFloat(report.avgSatisfaction), report.dimensionAverages);

  const headerInnerHtml = `

      </div>
      <div class="lh-text">
        <div class="rep">Republic of the Philippines</div>
        <div class="uni">Iloilo State University of Fisheries Science and Technology</div>
        <div class="dept">General Services Office</div>
        <div class="addr">San Enrique, Iloilo &nbsp;|&nbsp; rdo@isufst.edu.ph &nbsp;|&nbsp; Contact No: (033) 323-2050 / (033) 323-3400</div>
        <div class="addr">Website: www.isufst.edu.ph</div>
      </div>
      <div class="lh-seal-box">
        <img src="3.jpg" alt="Bagong Pilipinas Seal" crossorigin="anonymous" style="width:100%; height:100%; object-fit:contain;">
      </div>
    </div>

    <hr class="lh-divider">

    <div class="official-title">Cleanliness Evaluation Report (CER)</div>

function generateReport() {
  if (!startDate || !endDate) {
    alert("Please select both start and end dates");
    return;
  }

  if (!selectedCategory) {
    alert("Please select a category (Comfort Room or Surroundings)");
    return;
  }

  if (!selectedOffice) {
    alert("Please select an office");
    return;
  }

  const officeEvals = evaluations.filter(e => e.cleanlinessCategory === selectedCategory && e.officeName === selectedOffice);

  const start = parseDateOnly(startDate);
  const end = parseDateOnly(endDate);

  if (!start || !end) {
    alert("Invalid date range selected.");
    return;
  }

  start.setHours(0, 0, 0, 0);
  end.setHours(23, 59, 59, 999);

  const startTs = start.getTime();
  const endTs = end.getTime();

  const filteredEvals = officeEvals.filter(e => e.timestamp >= startTs && e.timestamp <= endTs);

  renderStats();

  if (filteredEvals.length === 0) {
    document.getElementById("report-container").innerHTML = `
      <div class="empty-state">No evaluations found for the selected category, office, and date range.</div>
    `;
    currentReport = null;
    document.getElementById("btn-save-report").disabled = true;
    document.getElementById("reportPreview").style.display = "block";
    switchToRatingsTab();
    return;
  }

  const dimensionAverages = [];

  dimensionsForCategory(selectedCategory).forEach(dim => {
    const values = filteredEvals.map(e => e[dim.field]).filter(v => v > 0);
    if (values.length > 0) {
      const avg = values.reduce((a, b) => a + b, 0) / values.length;
      const percentage = (avg / 5) * 100;
      const rating = getRatingLabel(percentage);
      dimensionAverages.push({
        dimension: dim.label,
        percentage: percentage.toFixed(1),
        rating
      });
    }
  });

  const overallPct = dimensionAverages.reduce((sum, d) => sum + parseFloat(d.percentage), 0) / dimensionAverages.length;
  const overallRating = getRatingLabel(overallPct);

  const commentsPayload = buildCommentsPayload(filteredEvals);

  currentReport = {
    office: selectedOffice,
    category: selectedCategory,
    startDate,
    endDate,
    respondents: filteredEvals.length,
    avgSatisfaction: overallPct.toFixed(1),
    ratingLabel: overallRating.label,
    ratingClass: overallRating.class,
    dimensionAverages,
    commentsCount: commentsPayload.commentsCount,
    comments: commentsPayload.comments,
    generatedAt: new Date().toISOString()
  };

  renderCombinedReport(currentReport);

  document.getElementById("previewLabel").textContent = `📄 Report Preview — ${selectedOffice} (${selectedCategory})  (${startDate} → ${endDate})`;
  document.getElementById("reportPreview").style.display = "block";
  document.getElementById("reportPreview").scrollIntoView({ behavior: "smooth", block: "start" });

  document.getElementById("btn-save-report").disabled = false;
  switchToRatingsTab();
}

async function renderElementToPdf(pdf, element, { usableW, usableH, addPageBefore }) {
  const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
  const scale = usableW / canvas.width;
  const pdfH = canvas.height * scale;

  if (addPageBefore) pdf.addPage();

  if (pdfH <= usableH) {
    pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, usableW, pdfH);
  } else {
    const slicePx = Math.floor(usableH / scale);
    let offset = 0;
    while (offset < canvas.height) {
      const sc = document.createElement("canvas");
      sc.width = canvas.width;
      sc.height = Math.min(slicePx, canvas.height - offset);
      sc.getContext("2d").drawImage(canvas, 0, -offset);
      pdf.addImage(sc.toDataURL("image/png"), "PNG", 0, 0, usableW, sc.height * scale);
      offset += slicePx;
      if (offset < canvas.height) pdf.addPage();
    }
  }
}

async function renderCvrPageToPdf(pdf, pageEl, { usableW, usableH, addPageBefore }) {
  const headerEl = pageEl.querySelector(".cvr-page-header");
  const contentEl = pageEl.querySelector(".cvr-page-content");
  const footerEl = pageEl.querySelector(".cvr-page-footer");

  const captureOpts = { scale: 2, useCORS: true, backgroundColor: "#ffffff" };
  const [headerCanvas, contentCanvas, footerCanvas] = await Promise.all([
    html2canvas(headerEl, captureOpts),
    html2canvas(contentEl, captureOpts),
    html2canvas(footerEl, captureOpts)
  ]);

  const scale = usableW / headerCanvas.width;
  const headerHmm = headerCanvas.height * scale;
  const footerHmm = footerCanvas.height * scale;
  const contentHmm = contentCanvas.height * scale;

  const availableContentHmm = Math.max(usableH - headerHmm - footerHmm, 10);
  const contentPxPerPage = Math.max(1, Math.floor(availableContentHmm / scale));
  const totalPages = Math.max(1, Math.ceil(contentCanvas.height / contentPxPerPage));

  if (addPageBefore) pdf.addPage();

  for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
    if (pageIdx > 0) pdf.addPage();

    pdf.addImage(headerCanvas.toDataURL("image/png"), "PNG", 0, 0, usableW, headerHmm);

    const offsetPx = pageIdx * contentPxPerPage;
    const sliceHeightPx = Math.min(contentPxPerPage, contentCanvas.height - offsetPx);
    if (sliceHeightPx > 0) {
      const sliceCanvas = document.createElement("canvas");
      sliceCanvas.width = contentCanvas.width;
      sliceCanvas.height = sliceHeightPx;
      sliceCanvas.getContext("2d").drawImage(contentCanvas, 0, -offsetPx);
      const sliceHmm = sliceHeightPx * scale;
      pdf.addImage(sliceCanvas.toDataURL("image/png"), "PNG", 0, headerHmm, usableW, sliceHmm);
    }

    pdf.addImage(footerCanvas.toDataURL("image/png"), "PNG", 0, usableH - footerHmm, usableW, footerHmm);
  }
}

window.exportPDF = async () => {
  if (document.getElementById("reportPreview").style.display === "none" || !currentReport) {
    alert("Please generate or view a report first.");
    return;
  }

  const paperSelect = document.getElementById("paperSizeFilter");
  if (paperSelect) setPaperSize(paperSelect.value);

  const { jsPDF } = window.jspdf;
  const activeSize = PAPER_SIZES[currentPaperSizeKey] || PAPER_SIZES.a4;
  const pdf = new jsPDF({ unit: "mm", format: [activeSize.width, activeSize.height] });
  const usableW = pdf.internal.pageSize.getWidth();
  const usableH = pdf.internal.pageSize.getHeight();

  try {
    await renderCvrPageToPdf(pdf, document.getElementById("csmPage"), { usableW, usableH, addPageBefore: false });
    const commentsEl = document.getElementById("csmCommentsPage");
    if (commentsEl) {
      await renderCvrPageToPdf(pdf, commentsEl, { usableW, usableH, addPageBefore: true });
    }
  } catch (err) {
    console.error(err);
    alert("⚠ PDF export blocked by the browser.\n\nPlease serve this page over HTTP instead of opening it directly from disk.");
    return;
  }

  const name = (currentReport?.office || "report").replace(/\s+/g, "_");
  pdf.save(`CER_Report_${name}.pdf`);
};

    return;
  }

  const { jsPDF } = window.jspdf;
  const margin = 10;
  const pageWidthMM = 210;
  const usableW = pageWidthMM - margin * 2;
  const scale = usableW / canvas.width;
  const pdfH = canvas.height * scale;
  const pageHeightMM = pdfH + margin * 2;

  const pdf = new jsPDF({ unit: "mm", format: [pageWidthMM, pageHeightMM] });
  pdf.addImage(img, "PNG", margin, margin, usableW, pdfH);

  const name = (currentCommentsReport?.office || "report").replace(/\s+/g, "_");
  pdf.save(`CSR_Comments_Report_${name}.pdf`);

  document.getElementById("officialCommentsDocument").innerHTML = "";
};

function renderSavedCommentsReports() {
  const container = document.getElementById("saved-comments-reports-container");
  document.getElementById("saved-comments-reports-count").textContent = `${savedCommentsReports.length} report${savedCommentsReports.length === 1 ? "" : "s"}`;

  if (savedCommentsReports.length === 0) {
    container.innerHTML = `<div class="empty-state">No saved comments reports yet.</div>`;
    return;
  }

  container.innerHTML = `
    <table class="saved-reports-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Office</th>
          <th>Category</th>
          <th>Date Range</th>
          <th>Respondents</th>
          <th>Comments</th>
          <th>Saved On</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${savedCommentsReports.map((r, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td class="saved-office-name">${r.office}</td>
            <td>${categoryPillHtml(r.category || DEFAULT_CATEGORY)}</td>
            <td>${r.startDate} → ${r.endDate}</td>
            <td>${r.respondents}</td>
            <td>${r.commentsCount ?? (r.comments || []).length}</td>
            <td>${r.savedOn ? new Date(r.savedOn).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : "-"}</td>
            <td>
              <div class="action-btns">
                <button class="btn-view-comments" data-id="${r.id}">👁 View</button>
                <button class="btn-delete-comments" data-id="${r.id}">🗑</button>
              </div>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  container.querySelectorAll(".btn-view-comments").forEach(btn => {
    btn.classList.add("btn-view");
    btn.addEventListener("click", () => viewSavedCommentsReport(btn.dataset.id));
  });
  container.querySelectorAll(".btn-delete-comments").forEach(btn => {
    btn.classList.add("btn-delete");
    btn.addEventListener("click", () => deleteSavedCommentsReport(btn.dataset.id));
  });
}

function viewSavedCommentsReport(id) {
  const r = savedCommentsReports.find(sr => sr.id === id);
  if (!r) return;

  const category = CLEANLINESS_CATEGORIES.includes(r.category) ? r.category : DEFAULT_CATEGORY;

  selectedCategory = category;
  document.getElementById("category-filter").value = category;
  populateLocationFilter();

  const officialDoc = createCommentsDocument(r);
  document.getElementById("comments-report-container").innerHTML = officialDoc;

  document.getElementById("commentsPreviewLabel").textContent = `💬 Comments Report Preview — ${r.office} (${category})  (${r.startDate} → ${r.endDate})`;
  document.getElementById("commentsReportPreview").style.display = "block";
  document.getElementById("commentsReportPreview").scrollIntoView({ behavior: "smooth", block: "start" });

  document.getElementById("location-filter").value = r.office;
  document.getElementById("start-date").value = r.startDate;
  document.getElementById("end-date").value = r.endDate;
  selectedOffice = r.office;
  startDate = r.startDate;
  endDate = r.endDate;
  currentCommentsReport = r;

  renderStats();
}

function deleteSavedCommentsReport(id) {
  if (!confirm("Delete this saved comments report? This cannot be undone.")) return;
  deleteDoc(doc(db, SAVED_COMMENTS_REPORTS_COLLECTION, id)).catch(err => {
    alert("Could not delete comments report: " + err.message);
  });
}

function switchToRatingsTab() {
  document.getElementById("ratingsTabPanel").style.display = "block";
  document.getElementById("commentsTabPanel").style.display = "none";
  document.getElementById("tab-ratings-reports").classList.add("active");
}

document.getElementById("tab-ratings-reports").addEventListener("click", switchToRatingsTab);

document.getElementById("location-filter").addEventListener("change", (e) => {
  selectedOffice = e.target.value;
});

document.getElementById("start-date").addEventListener("change", (e) => {
  startDate = e.target.value;
});

document.getElementById("end-date").addEventListener("change", (e) => {
  endDate = e.target.value;
});

document.getElementById("btn-generate-report").addEventListener("click", generateReport);
document.getElementById("btn-save-report").addEventListener("click", saveReport);
</script>
</body>
</html>

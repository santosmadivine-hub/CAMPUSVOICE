<style>
  @media print {
    #sidebar-mount, #topbar-mount, .filter-row, .stat-grid, .saved-reports-section, .report-tabs, .preview-bar, #commentsReportPreview { display: none !important; }
    .report-section { break-inside: avoid; }

    /*
      FIX: paper-size aware print alignment (ported from Admin 1).
      @page margin is zeroed out so the printed sheet has no browser
      margin of its own — all spacing instead comes from the
      .cvr-inner-header / .cvr-inner-content / .cvr-inner-footer padding
      below, which keeps the header pinned to the top of the page and
      the footer pinned to the bottom regardless of which paper size
      (A3/A4/A5/A6, B4/B5, Letter, Legal, Long/Folio, Statement, Executive, Tabloid) is selected.
    */
    @page { margin: 0; }
    html, body { margin: 0 !important; }

    .layout, .main { display: block !important; padding: 0 !important; margin: 0 !important; }

    #reportPreview { display: block !important; margin: 0 !important; }

    .cvr-page {
      box-shadow: none !important;
      border: none !important;
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 auto !important;
      min-height: var(--page-height, 297mm) !important;
    }

    /*
      FIX: repeat the header and footer on EVERY physical page, not just
      the first one, when a page's content is too long to fit on a
      single sheet (e.g. an office with a long list of comments).
      Giving the page 'display:table', the header
      'display:table-header-group', the content
      'display:table-row-group', and the footer
      'display:table-footer-group' is the standard CSS technique for
      repeating table headers/footers across print pages — the
      browser's print engine reproduces the header at the top and the
      footer at the bottom of every page it has to create, for
      whichever paper size is selected, exactly like a real
      <table>/<thead>/<tfoot> would.
    */
    .cvr-page {
      display: table !important;
      table-layout: fixed !important;
    }
    .cvr-page-header {
      display: table-header-group !important;
    }
    .cvr-page-content {
      display: table-row-group !important;
    }
    .cvr-page-footer {
      display: table-footer-group !important;
    }

    /*
      FIX: padding/border on table-header-group, table-row-group, and
      table-footer-group boxes is ignored by the CSS table layout model
      (per spec, only 'table' and 'table-cell' boxes render padding and
      border). That's why, before this fix, switching .cvr-page to
      display:table for print silently collapsed the header's top
      inset, the 15mm left/right margins, and the footer's top border +
      padding to zero — the header ended up flush with the very top of
      the sheet and the footer flush with the very bottom edge, instead
      of matching the reference report's spacing. The .cvr-inner-*
      wrappers below are plain block boxes nested *inside* each
      table-role element, so their padding renders correctly in print
      while the outer elements keep doing their job of repeating on
      every page.
    */
    .cvr-inner-header,
    .cvr-inner-content,
    .cvr-inner-footer {
      padding-left: 15mm !important;
      padding-right: 15mm !important;
    }

    .cvr-inner-header {
      padding-top: 3mm !important;
      padding-bottom: 0 !important;
    }

    .cvr-inner-content {
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }

    .cvr-inner-footer {
      padding-top: 6mm !important;
      padding-bottom: 6mm !important;
      border-top: 1px solid #e2e8f0 !important;
    }
  }

  /* Official Document Style (like Admin 1) — each generated page is a
     distinct "sheet of bond paper": white background, subtle border and
     drop shadow, so page 1 and page 2 read as two separate pages.
     Used by the legacy standalone Comments & Suggestions report
     (#ccsPage), which is no longer reachable from the UI. The main
     Generate Report / Print / PDF flow (page 1 + auto-attached page 2)
     uses the paper-size aware .cvr-page system below instead — see the
     note above .cvr-page. */
  .official-report {
    background: #fff;
    font-family: 'Times New Roman', Times, serif;
    color: #000;
    line-height: 1.6;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 40px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.10), 0 1px 2px rgba(15,23,42,0.06);
    border: 1px solid #e2e8f0;
  }

  /*
    Paper-size aware report page (ported from Admin 1's
    .generated-report system). Used only by the main Generate Report /
    Print / PDF flow (#csmPage and #csmCommentsPage) so that the
    on-screen preview, the printed page, and the exported PDF all use
    the same paper size (A3/A4/A5/A6, B4/B5, Letter, Legal, Long/Folio, Statement, Executive, Tabloid) chosen in the
    "Paper" dropdown, with the header pinned to the top of the sheet and
    the footer pinned to the bottom via margin-top:auto on the footer.
    The legacy standalone Comments & Suggestions report (#ccsPage) is
    left untouched and keeps using the fixed .official-report layout
    above.

    NOTE ON THE .cvr-inner-* WRAPPERS BELOW: .cvr-page-header,
    .cvr-page-content and .cvr-page-footer are kept free of any
    padding/border of their own. That styling instead lives on a plain
    block <div> nested just inside each of them (.cvr-inner-header /
    .cvr-inner-content / .cvr-inner-footer). This is required because
    in print, .cvr-page switches to display:table and these three
    elements become table-header-group / table-row-group /
    table-footer-group (see the @media print block above) so the
    browser repeats them on every physical page — and padding/border on
    those table-role boxes is ignored by the CSS table layout model. By
    keeping the actual spacing on an ordinary block element inside them
    instead, the 15mm side margins, the header's top inset, and the
    footer's top border + padding render correctly in BOTH the on-screen
    preview and the print/PDF output, on every paper size.
  */
  .cvr-page {
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:var(--page-width, 210mm);
    min-height:var(--page-height, 297mm);
    margin:0 auto;
    box-sizing:border-box;
    background:#fff;
    font-family:'Times New Roman', Times, serif;
    color:#000;
    line-height:1.6;
    box-shadow:0 1px 3px rgba(15,23,42,0.10), 0 1px 2px rgba(15,23,42,0.06);
    border:1px solid #e2e8f0;
  }

  .cvr-page-header {
    width:100%;
    flex:0 0 auto;
  }

  .cvr-page-content {
    width:100%;
    flex:0 1 auto;
  }

  .cvr-page-footer {
    width:100%;
    flex:0 0 auto;
    margin-top:auto;
  }

  /* Inner wrappers — see the note above .cvr-page for why the padding
     and border live here instead of on .cvr-page-header/-content/-footer
     directly. On screen these behave exactly like the old padded
     elements did; in print they're what actually keeps the header
     pinned to the top and the footer pinned to the bottom of every
     page. */
  .cvr-inner-header,
  .cvr-inner-content,
  .cvr-inner-footer {
    width:100%;
    box-sizing:border-box;
    padding-left:15mm;
    padding-right:15mm;
  }

  .cvr-inner-header {
    padding-top:6px;
    padding-bottom:0;
  }

  .cvr-inner-content {
    padding-top:0;
    padding-bottom:0;
  }

  .cvr-inner-footer {
    padding-top:10px;
    padding-bottom:10px;
    border-top:1px solid #e2e8f0;
  }

  /* Neutralize the legacy .official-footer spacing when it's nested
     inside the new .cvr-inner-footer wrapper, since the wrapper already
     provides its own top padding — avoids doubled spacing above the
     accreditations footer image. */
  .cvr-inner-footer .official-footer {
    margin-top: 0;
    padding-top: 0;
  }

  /* A visually distinct "next sheet" — separated by real blank space plus
     a torn-paper style divider, so it reads as page 2, not a
     continuation of page 1's content. Mirrors Admin 1's report layout. */
  .page-break-sheet {
    margin-top: 44px;
    padding-top: 32px;
    border-top: none;
    position: relative;
  }
  .page-break-sheet::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: repeating-linear-gradient(
      90deg,
      #cbd5e1 0px, #cbd5e1 8px,
      transparent 8px, transparent 16px
    );
  }
  .page-break-sheet::after {
    content: "— New Page —";
    position: absolute;
    top: -9px; left: 50%; transform: translateX(-50%);
    background: #f7fafc;
    padding: 0 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    color: #94a3b8; text-transform: uppercase;
  }

  /* Ensures the comments sheet always starts on its own page when the
     browser's native print / "Save as PDF" is used too. */
  @media print {
    .page-break-sheet {
      page-break-before: always;
      break-before: page;
      margin-top: 0;
      padding-top: 0;
    }
    .page-break-sheet::before,
    .page-break-sheet::after {
      display: none;
    }
  }

  .official-narrative {

<script type="module">

  onSnapshot,
  query,

  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("sidebar-mount").innerHTML = buildSidebar("admin2", "reports");
document.getElementById("topbar-mount").innerHTML = buildTopbar("Reports", "admin2");

// ======================
// PAPER SIZE SELECTION (ported from Admin 1) — drives the on-screen
// preview size via the --page-width/--page-height CSS vars (consumed
// by .cvr-page), the print @page size (via the injected
// #dynamicPageSize <style> tag), and the jsPDF export format/page
// dimensions used in exportPDF(). Does not touch any Cleanliness data
// or evaluation logic below.
// ======================
const PAPER_SIZES = {
  // ISO A series
  a3:        { width: 297,   height: 420   },
  a4:        { width: 210,   height: 297   },
  a5:        { width: 148,   height: 210   },
  a6:        { width: 105,   height: 148   },
  // ISO/JIS B series
  b4:        { width: 257,   height: 364   },
  b5:        { width: 182,   height: 257   },
  // US / ANSI sizes
  letter:    { width: 215.9, height: 279.4 },
  legal:     { width: 215.9, height: 355.6 },
  long:      { width: 215.9, height: 330.2 }, // Long / Folio (8.5 x 13 in)
  statement: { width: 139.7, height: 215.9 },
  executive: { width: 184.15,height: 266.7 },
  tabloid:   { width: 279.4, height: 431.8 }  // Tabloid / Ledger
};

let currentPaperSizeKey = "a4";

window.setPaperSize = (key) => {
  const size = PAPER_SIZES[key] || PAPER_SIZES.a4;
  currentPaperSizeKey = PAPER_SIZES[key] ? key : "a4";

  document.documentElement.style.setProperty("--page-width",  size.width  + "mm");
  document.documentElement.style.setProperty("--page-height", size.height + "mm");

  let pageSizeTag = document.getElementById("dynamicPageSize");
  if (!pageSizeTag) {
    pageSizeTag = document.createElement("style");
    pageSizeTag.id = "dynamicPageSize";
    document.head.appendChild(pageSizeTag);
  }
  pageSizeTag.textContent =
    `@media print { @page { size: ${size.width}mm ${size.height}mm; margin: 0; } }`;
};

setPaperSize(currentPaperSizeKey);

// ======================
// FIRESTORE COLLECTION NAME / SCHEMA CONSTANTS
// (matches Evaluation Management / Office Management exactly)
// ======================

// Each cleanliness category keeps its own office list, in a separately
// named Firestore collection (mirrors
// CleanOfficeSelectActivity.officeCollectionName() and Office
// Management's OFFICE_COLLECTIONS). Kept exactly as named in the app,
// including the differing hyphen vs underscore convention.
const OFFICE_COLLECTIONS = {
  "Comfort Room": "office-names-comfort-room",
  "Surroundings": "office_names_surroundings"
};
const CLEANLINESS_CATEGORIES = Object.keys(OFFICE_COLLECTIONS);
const DEFAULT_CATEGORY = "Comfort Room"; // fallback for any legacy record saved before cleanlinessCategory existed

// Read from the flat evaluation_history mirror — the same source
// Evaluation Management and Office Management read from — instead of
// the raw nested cleanliness_evaluations tree, so Reports always
// matches what those pages show (including status edits/deletes made
// there).
const EVAL_HISTORY_COLLECTION = "evaluation_history";
const SAVED_REPORTS_COLLECTION = "savedReports";

// Kept for the (now UI-unreachable) standalone Comments & Suggestions
// report feature — see the note near generateCommentsReport() below.
const SAVED_COMMENTS_REPORTS_COLLECTION = "savedCommentsReports";

// ComfortRoomEvalActivity / SurroundingsEvalActivity both set
// TOTAL_QUESTIONS = 5 and only ever write rating1...rating5 (confirmed
// directly from the submission code — see Evaluation Management). Every
// place that loops over the rating questions drives off this constant.
const TOTAL_RATING_QUESTIONS = 5;

// ======================
// STATE
// ======================
let evaluations = [];
let comfortOffices = {};      // name -> name, from office-names-comfort-room
let surroundingsOffices = {}; // name -> name, from office_names_surroundings
let selectedCategory = "";    // "" | "Comfort Room" | "Surroundings" — from the Category dropdown
let selectedOffice = "";
let startDate = "";
let endDate = "";
let savedReports = [];
let currentReport = null; // snapshot of the last generated report (ratings + attached comments), ready to save

// Kept for the (now UI-unreachable) standalone Comments & Suggestions
// report feature.
let savedCommentsReports = [];
let currentCommentsReport = null;

// Per-category question labels. The two 5-question Android forms
// (ComfortRoomEvalActivity / SurroundingsEvalActivity) were split out of
// the old single 15-question form; these labels are carried over from
// the matching old dimensions (old Q11-15 -> Comfort Room, old Q1-5 ->
// Surroundings). Confirm against the actual Android form copy and
// adjust here if the wording has since changed.
const DIMENSION_LABELS_BY_CATEGORY = {
  "Comfort Room": {
    1: "The comfort room floor is clean and dry.",
    2: "The toilets and urinals are clean and sanitary.",
    3: "The door provides sufficient privacy for users.",
    4: "Trash bins inside the comfort room are clean and regularly emptied.",
    5: "There are no unpleasant odors inside the comfort room."
  },
  "Surroundings": {
    1: "Outdoor trash bins are available and regularly emptied.",
    2: "The office surroundings are free from dirt and dust.",
    3: "The office area is free from litter and scattered waste.",
    4: "The office area provides a clean and comfortable environment.",
    5: "The office area is clean and well-maintained"
  }
};

function dimensionsForCategory(category) {
  const labels = DIMENSION_LABELS_BY_CATEGORY[category] || {};
  const dims = [];
  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    dims.push({
      id: i,
      field: "rating" + i,
      label: labels[i] || `Evaluation Question ${i}`
    });
  }
  return dims;
}

const RATING_SCALE = [
  { min: 90, label: "Outstanding", class: "rating-outstanding" },
  { min: 75, label: "Very Satisfactory", class: "rating-very-satisfactory" },
  { min: 60, label: "Satisfactory", class: "rating-satisfactory" },
  { min: 0, label: "Needs Improvement", class: "rating-poor" }
];

// ======================
// HELPERS (safe, timezone-consistent date-only parsing)
// ======================
// The date filters (#start-date / #end-date) are <input type="date">,
// which give "YYYY-MM-DD" strings. new Date("YYYY-MM-DD") parses that
// as UTC midnight, which can silently shift to the previous/next local
// day depending on timezone and drop evaluations on the boundary dates.
// This parses the Y/M/D components directly as LOCAL midnight instead,
// so the comparison against evaluation timestamps lines up correctly.
function parseDateOnly(value) {
  if (!value) return null;
  const str = String(value).trim();
  if (!str) return null;

  const iso = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);
  if (iso) {
    const dt = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
    return isNaN(dt.getTime()) ? null : dt;
  }

  const parsed = new Date(str);
  if (isNaN(parsed.getTime())) return null;
  return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
}

function categoryPillHtml(category) {
  const cls = category === "Surroundings" ? "surroundings" : "comfort-room";
  const icon = category === "Surroundings" ? "🌳" : "🚻";
  return `<span class="category-pill ${cls}">${icon} ${category}</span>`;
}

// ======================
// LOAD OFFICES (both category collections, always on — used to build the
// office dropdown once a category is picked)
// ======================
onSnapshot(collection(db, OFFICE_COLLECTIONS["Comfort Room"]), (snapshot) => {
  comfortOffices = {};
  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const name = data.name || data.officeName || docSnap.id;
    comfortOffices[name] = name;
  });
  if (selectedCategory === "Comfort Room") populateLocationFilter();
});

onSnapshot(collection(db, OFFICE_COLLECTIONS["Surroundings"]), (snapshot) => {
  surroundingsOffices = {};
  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const name = data.name || data.officeName || docSnap.id;
    surroundingsOffices[name] = name;
  });
  if (selectedCategory === "Surroundings") populateLocationFilter();
});

function currentOffices() {
  return selectedCategory === "Comfort Room" ? comfortOffices : surroundingsOffices;
}

// ======================
// LOAD EVALUATIONS (Firestore: evaluation_history)
// ======================
const evalQuery = query(collection(db, EVAL_HISTORY_COLLECTION), orderBy("timestamp", "desc"));

onSnapshot(evalQuery, (snapshot) => {
  evaluations = [];
  snapshot.forEach((docSnap) => {
    const ev = docSnap.data();

    const rawCategory = ev.cleanlinessCategory;
    const category = CLEANLINESS_CATEGORIES.includes(rawCategory) ? rawCategory : DEFAULT_CATEGORY;

    const record = {
      id: docSnap.id,
      officeName: ev.officeName || "Unknown",
      cleanlinessCategory: category,
      comments: ev.comments || "",
      status: (ev.status || "").toString().toLowerCase() === "resolved" ? "resolved" : "pending",
      timestamp: Number(ev.timestamp) || 0
    };
    for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
      record["rating" + i] = Number(ev["rating" + i]) || 0;
    }
    evaluations.push(record);
  });
  // Auto-render stats whenever evaluations load
  renderStats();
});

// ======================
// LOAD SAVED REPORTS (Firestore: savedReports)
// ======================
const savedReportsQuery = query(collection(db, SAVED_REPORTS_COLLECTION), orderBy("savedOn", "desc"));

onSnapshot(savedReportsQuery, (snapshot) => {
  savedReports = [];
  snapshot.forEach((docSnap) => {
    savedReports.push({ id: docSnap.id, ...docSnap.data() });
  });
  renderSavedReports();
  document.getElementById("stat-saved").textContent = savedReports.length;
});

// ======================
// HELPERS
// ======================
function getRatingLabel(percentage) {
  for (const rating of RATING_SCALE) {
    if (percentage >= rating.min) {
      return { label: rating.label, class: rating.class };
    }
  }
  return { label: "Needs Improvement", class: "rating-poor" };
}

function evalAvgScore(e) {
  let sum = 0;
  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    sum += e["rating" + i] || 0;
  }
  return sum / TOTAL_RATING_QUESTIONS;
}

function populateLocationFilter() {
  const select = document.getElementById("location-filter");

  if (!selectedCategory) {
    select.innerHTML = '<option value="">Select Category First</option>';
    select.value = "";
    select.disabled = true;
    selectedOffice = "";
    return;
  }

  const current = select.value;
  select.disabled = false;
  const names = Object.values(currentOffices()).sort((a, b) => a.localeCompare(b));
  select.innerHTML = ['<option value="">Select Office...</option>']
    .concat(names.map(n => `<option value="${n}">${n}</option>`)).join("");
  select.value = names.includes(current) ? current : "";
  selectedOffice = select.value;
}

// ======================
// CATEGORY DROPDOWN
// ======================
document.getElementById("category-filter").addEventListener("change", (ev) => {
  selectedCategory = ev.target.value;

  // Switching (or clearing) category invalidates the previously selected office
  selectedOffice = "";
  populateLocationFilter();
});

// ======================
// STATS — combined across both categories (Comfort Room + Surroundings)
// ======================
function renderStats() {
  const total = evaluations.length;

  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-total-sub").textContent = "All Categories";

  const positive = evaluations.filter(e => evalAvgScore(e) >= 4).length;
  const negative = evaluations.filter(e => evalAvgScore(e) < 3).length;
  document.getElementById("stat-positive").textContent = positive;
  document.getElementById("stat-negative").textContent = negative;
}

// ======================
// GENERATE NARRATIVE (like Admin 1)
// ======================
function generateNarrative(office, respondents, overallPct, dimensionAverages) {
  const perfWord = overallPct >= 90 ? "outstanding" : overallPct >= 75 ? "very satisfactory" : overallPct >= 60 ? "satisfactory" : "needs improvement";
  const topDims = dimensionAverages.filter(d => parseFloat(d.percentage) >= 90).map(d => d.dimension);
  const lowDims = dimensionAverages.filter(d => parseFloat(d.percentage) < 75).map(d => d.dimension);
  const highDims = dimensionAverages.filter(d => parseFloat(d.percentage) >= 80).slice(0, 3).map(d => d.dimension);

  const p1 = `The <strong>results</strong> of the Cleanliness Evaluation Report for the <strong>${office}</strong>, Iloilo State University of Fisheries Science and Technology – San Enrique Campus, with <strong>${respondents}</strong> respondent(s), show an <strong>${perfWord} performance</strong> in cleanliness standards with an average satisfaction rate of <strong>${overallPct.toFixed(2)}%</strong>.
    ${topDims.length ? `This indicates that the area excels in ${topDims.join(", ")}, reflecting strong maintenance and cleanliness practices.` : ""}`;

  const p2 = `<strong>Regarding specific evaluation dimensions</strong>,
    ${highDims.length ? `${highDims.join(", ")} demonstrated excellent performance, indicating consistent cleanliness and proper maintenance standards.` : "the facility maintains satisfactory cleanliness levels."}
    ${lowDims.length ? `Additionally, ${lowDims.join(", ")} scored slightly lower, indicating opportunities for improvement in these areas to enhance overall cleanliness and user satisfaction.` : "All dimensions performed at satisfactory levels or above."}`;

  const p3 = `<strong>Overall</strong>, the facility continues to maintain <strong>${perfWord} cleanliness standards</strong>. Continued attention to maintenance protocols and regular evaluations will help sustain and improve these results. Any identified areas for improvement should be prioritized to ensure the highest standards of cleanliness and facility management.`;

  return [p1, p2, p3];
}

// ======================
// PULLS A COMMENT/SUGGESTION STRING out of an evaluation record, trying
// a handful of likely field names so it keeps working even if the
// Firestore field name ever changes. `comments` is the one confirmed
// field on evaluation_history records; the rest are just safety nets.
// ======================
function getCommentText(item) {
  const candidates = [
    item.comments, item.comment,
    item.suggestion, item.suggestions,
    item.commentsSuggestions, item.commentSuggestion,
    item.feedback, item.remarks, item.message
  ];
  for (const c of candidates) {
    if (typeof c === "string" && c.trim()) return c.trim();
  }
  return "";
}

// Given the same filteredEvals used to build the ratings report, builds
// the comments payload (count + chronologically sorted list) that gets
// auto-attached as page 2 of the report.
function buildCommentsPayload(filteredEvals) {
  const comments = filteredEvals
    .map(e => ({ text: getCommentText(e), timestamp: e.timestamp }))
    .filter(c => c.text)
    .sort((a, b) => a.timestamp - b.timestamp);

  return { commentsCount: comments.length, comments };
}

// ======================
// CREATE OFFICIAL DOCUMENT (page 1 — CER ratings report, like Admin 1's
// CSM page). Uses the paper-size aware .cvr-page / .cvr-page-header /
// .cvr-page-content / .cvr-page-footer structure (ported from Admin 1),
// with the actual padding/border living on the nested .cvr-inner-*
// wrappers (see the note above .cvr-page in <style>), so the letterhead
// stays pinned to the top and the accreditations footer stays pinned to
// the bottom of the selected paper size — in the on-screen preview AND
// in print.
// ======================

  const reportEnd = new Date(report.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const category = report.category || DEFAULT_CATEGORY;

  const narrative = generateNarrative(report.office, report.respondents, parseFloat(report.avgSatisfaction), report.dimensionAverages);
  const officialHTML = `
    <div class="cvr-page" id="csmPage">

      <div class="cvr-page-header"><div class="cvr-inner-header">
        <!-- LETTERHEAD WITH LOGOS -->
        <div class="lh-row">
          <div class="lh-logo-box" style="width:150px; height:90px;">
            <img src="2.png" alt="ISUFST Logo" crossorigin="anonymous" style="width:100%; height:100%; object-fit:contain;">
          </div>
          <div class="lh-text">
            <div class="rep">Republic of the Philippines</div>
            <div class="uni">Iloilo State University of Fisheries Science and Technology</div>
            <div class="dept">General Services Office</div>
            <div class="addr">San Enrique, Iloilo &nbsp;|&nbsp; rdo@isufst.edu.ph &nbsp;|&nbsp; Contact No: (033) 323-2050 / (033) 323-3400</div>
            <div class="addr">Website: www.isufst.edu.ph</div>

// ======================
// GENERATE REPORT
// ======================
function generateReport() {
  // Validated in the same order as the filter bar: Start Date → End Date
  // → Category → Office.
  if (!startDate || !endDate) {
    alert("Please select both start and end dates");
    return;
  }

  if (!selectedCategory) {
    alert("Please select a category (Comfort Room or Surroundings)");
    return;
  }

  if (!selectedOffice) {
    alert("Please select an office");
    return;
  }

  // Scope to the selected category AND the selected office — a name
  // could in theory appear in both office lists, so the category match
  // matters, not just the office name.
  const officeEvals = evaluations.filter(e => e.cleanlinessCategory === selectedCategory && e.officeName === selectedOffice);

  // Normalize the picked range to LOCAL start-of-day / end-of-day so
  // evaluations dated on either boundary are always included, without
  // any UTC/timezone shift and without requiring leading-zero dates.
  const start = parseDateOnly(startDate);
  const end = parseDateOnly(endDate);

  if (!start || !end) {
    alert("Invalid date range selected.");
    return;
  }

  start.setHours(0, 0, 0, 0);
  end.setHours(23, 59, 59, 999);

  const startTs = start.getTime();
  const endTs = end.getTime();

  const filteredEvals = officeEvals.filter(e => e.timestamp >= startTs && e.timestamp <= endTs);

  renderStats();

  if (filteredEvals.length === 0) {
    document.getElementById("report-container").innerHTML = `
      <div class="empty-state">No evaluations found for the selected category, office, and date range.</div>
    `;
    currentReport = null;
    document.getElementById("btn-save-report").disabled = true;
    document.getElementById("reportPreview").style.display = "block";
    switchToRatingsTab();
    return;
  }

  // Calculate averages for each dimension (rating1 -> rating5), using
  // the question labels for the selected category.
  const dimensionAverages = [];

  dimensionsForCategory(selectedCategory).forEach(dim => {
    const values = filteredEvals.map(e => e[dim.field]).filter(v => v > 0);
    if (values.length > 0) {
      const avg = values.reduce((a, b) => a + b, 0) / values.length;
      const percentage = (avg / 5) * 100; // Convert 1-5 scale to 0-100%
      const rating = getRatingLabel(percentage);
      dimensionAverages.push({
        dimension: dim.label,
        percentage: percentage.toFixed(1),
        rating
      });
    }
  });

  const overallPct = dimensionAverages.reduce((sum, d) => sum + parseFloat(d.percentage), 0) / dimensionAverages.length;
  const overallRating = getRatingLabel(overallPct);

  // Automatically gather the Comments & Suggestions for the same
  // office/category/date-range so they can be attached as page 2 below.
  const commentsPayload = buildCommentsPayload(filteredEvals);

  // Snapshot ready to be saved — ratings AND comments together, in one document.
  currentReport = {
    office: selectedOffice,
    category: selectedCategory,
    startDate,
    endDate,
    respondents: filteredEvals.length,
    avgSatisfaction: overallPct.toFixed(1),
    ratingLabel: overallRating.label,
    ratingClass: overallRating.class,
    dimensionAverages,
    commentsCount: commentsPayload.commentsCount,
    comments: commentsPayload.comments,
    generatedAt: new Date().toISOString()
  };

  renderCombinedReport(currentReport);

  document.getElementById("previewLabel").textContent = `📄 Report Preview — ${selectedOffice} (${selectedCategory})  (${startDate} → ${endDate})`;
  document.getElementById("reportPreview").style.display = "block";
  document.getElementById("reportPreview").scrollIntoView({ behavior: "smooth", block: "start" });

  document.getElementById("btn-save-report").disabled = false;
  switchToRatingsTab();
}

// ======================
// PRINT REPORT — opens the browser's native print dialog for the
// on-screen CER preview (#reportPreview: page 1 ratings + auto-attached
// page 2 comments). Everything else (sidebar, topbar, filters, stat
// cards, saved-reports table, tabs, the standalone comments preview)
// is hidden for print via the @media print rules at the top of <style>,
// and the two pages inside the preview always land on separate physical
// sheets because of .page-break-sheet's page-break-before rule. Before
// printing, the currently selected "Paper" dropdown value is re-applied
// via setPaperSize() so the injected @page size rule (and the
// --page-width/--page-height vars driving .cvr-page) match what's
// showing on screen, keeping the header pinned to the top and the
// footer pinned to the bottom for whichever paper size is selected —
// then the browser's own print dialog "Pages" field (e.g. "1" for CER
// only, or "1-2" / "All" for both) lets the admin choose what actually
// prints.
// ======================
window.printReport = () => {
  if (document.getElementById("reportPreview").style.display === "none") {
    alert("Please generate or view a report first.");
    return;
  }
  const paperSelect = document.getElementById("paperSizeFilter");
  if (paperSelect) setPaperSize(paperSelect.value);

  window.print();
};

// ======================
// SHARED PDF HELPER — draws one html2canvas canvas onto a jsPDF
// document, slicing it across multiple pages if it's taller than one
// sheet, and adding a fresh PDF page beforehand when `addPageBefore` is
// true. The image is placed edge-to-edge (no extra jsPDF-side margin)
// because the 15mm inset already lives entirely in the on-screen
// .cvr-inner-header / .cvr-inner-content / .cvr-inner-footer padding
// (captured by html2canvas) — same approach as Admin 1 — which is what
// guarantees the comments sheet is exported as a real, separate PDF
// page with the header/footer aligned correctly for the selected paper
// size.
// ======================
async function renderElementToPdf(pdf, element, { usableW, usableH, addPageBefore }) {
  const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
  const scale = usableW / canvas.width;
  const pdfH = canvas.height * scale;

  if (addPageBefore) pdf.addPage();

  if (pdfH <= usableH) {
    pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, usableW, pdfH);
  } else {
    const slicePx = Math.floor(usableH / scale);
    let offset = 0;
    while (offset < canvas.height) {
      const sc = document.createElement("canvas");
      sc.width = canvas.width;
      sc.height = Math.min(slicePx, canvas.height - offset);
      sc.getContext("2d").drawImage(canvas, 0, -offset);
      pdf.addImage(sc.toDataURL("image/png"), "PNG", 0, 0, usableW, sc.height * scale);
      offset += slicePx;
      if (offset < canvas.height) pdf.addPage();
    }
  }
}

// ======================
// EXPORT PDF — exports the CER report as page 1 and the auto-attached
// Comments & Suggestions sheet as page 2 of the same PDF, using
// whichever paper size is currently selected in the "Paper" dropdown
// (A3/A4/A5/A6, B4/B5, Letter, Legal, Long/Folio, Statement, Executive, Tabloid) — mirrors Admin 1's exportPDF().
// ======================
window.exportPDF = async () => {
  if (document.getElementById("reportPreview").style.display === "none" || !currentReport) {
    alert("Please generate or view a report first.");
    return;
  }

  const paperSelect = document.getElementById("paperSizeFilter");
  if (paperSelect) setPaperSize(paperSelect.value);

  const { jsPDF } = window.jspdf;
  const activeSize = PAPER_SIZES[currentPaperSizeKey] || PAPER_SIZES.a4;
  const pdf = new jsPDF({ unit: "mm", format: [activeSize.width, activeSize.height] });
  const usableW = pdf.internal.pageSize.getWidth();
  const usableH = pdf.internal.pageSize.getHeight();

  try {
    // Page 1: CER ratings page
    await renderElementToPdf(pdf, document.getElementById("csmPage"), { usableW, usableH, addPageBefore: false });
    // Page 2 (separate sheet): auto-attached Comments & Suggestions page
    const commentsEl = document.getElementById("csmCommentsPage");
    if (commentsEl) {
      await renderElementToPdf(pdf, commentsEl, { usableW, usableH, addPageBefore: true });
    }
  } catch (err) {
    console.error(err);
    alert("⚠ PDF export blocked by the browser.\n\nPlease serve this page over HTTP instead of opening it directly from disk.");
    return;
  }

  const name = (currentReport?.office || "report").replace(/\s+/g, "_");
  pdf.save(`CER_Report_${name}.pdf`);
};

  const r = savedReports.find(sr => sr.id === id);

  const category = CLEANLINESS_CATEGORIES.includes(r.category) ? r.category : DEFAULT_CATEGORY;

  // Switch the Category dropdown to the saved report's category first, so
  // the office dropdown is rebuilt from the right collection before we

  selectedCategory = category;
  document.getElementById("category-filter").value = category;
  populateLocationFilter();

  renderCombinedReport(r);

  document.getElementById("previewLabel").textContent = `📄 Report Preview — ${r.office} (${category})  (${r.startDate} → ${r.endDate})`;

  switchToRatingsTab();

  deleteDoc(doc(db, SAVED_REPORTS_COLLECTION, id)).catch(err => {
    alert("Could not delete report: " + err.message);

}

// ======================
// GENERATE COMMENTS REPORT (standalone) — no longer reachable from the
// UI (its button was removed since Generate Report auto-attaches
// comments), kept only so the underlying data plumbing still works if
// re-wired in the future.
// ======================
function generateCommentsReport() {
  if (!startDate || !endDate) {
    alert("Please select both start and end dates");
    return;
  }

  if (!selectedCategory) {
    alert("Please select a category (Comfort Room or Surroundings)");
    return;
  }

  if (!selectedOffice) {
    alert("Please select an office");
    return;
  }

  const officeEvals = evaluations.filter(e => e.cleanlinessCategory === selectedCategory && e.officeName === selectedOffice);

  const start = parseDateOnly(startDate);
  const end = parseDateOnly(endDate);

  if (!start || !end) {
    alert("Invalid date range selected.");
    return;
  }

  start.setHours(0, 0, 0, 0);
  end.setHours(23, 59, 59, 999);

  const startTs = start.getTime();
  const endTs = end.getTime();

  const filteredEvals = officeEvals.filter(e => e.timestamp >= startTs && e.timestamp <= endTs);

  if (filteredEvals.length === 0) {
    document.getElementById("comments-report-container").innerHTML = `
      <div class="empty-state">No evaluations found for the selected category, office, and date range.</div>
    `;
    currentCommentsReport = null;
    document.getElementById("commentsReportPreview").style.display = "block";
    return;
  }

  const commentsPayload = buildCommentsPayload(filteredEvals);

  currentCommentsReport = {
    office: selectedOffice,
    category: selectedCategory,
    startDate,
    endDate,
    respondents: filteredEvals.length,
    commentsCount: commentsPayload.commentsCount,
    comments: commentsPayload.comments,
    generatedAt: new Date().toISOString()
  };

  const officialDoc = createCommentsDocument(currentCommentsReport);
  document.getElementById("comments-report-container").innerHTML = officialDoc;

  document.getElementById("commentsPreviewLabel").textContent = `💬 Comments Report Preview — ${selectedOffice} (${selectedCategory})  (${startDate} → ${endDate})`;
  document.getElementById("commentsReportPreview").style.display = "block";
  document.getElementById("commentsReportPreview").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ======================
// CLOSE COMMENTS REPORT
// ======================
window.closeCommentsReport = () => {
  document.getElementById("commentsReportPreview").style.display = "none";
};

// ======================
// EXPORT COMMENTS PDF (standalone comments-only report)
// ======================
window.exportCommentsPDF = async () => {
  if (document.getElementById("commentsReportPreview").style.display === "none" || !currentCommentsReport) {
    alert("Please generate or view a comments report first.");
    return;
  }

  const officialDoc = createCommentsDocument(currentCommentsReport);
  document.getElementById("officialCommentsDocument").innerHTML = officialDoc;

  let canvas;
  try {
    canvas = await html2canvas(document.getElementById("ccsPage"), {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff"
    });
    var img = canvas.toDataURL("image/png");
  } catch (err) {
    console.error(err);
    alert("⚠ PDF export blocked by the browser.\n\nPlease serve this page over HTTP instead of opening it directly from disk.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const margin = 10;
  const pageWidthMM = 210;
  const usableW = pageWidthMM - margin * 2;
  const scale = usableW / canvas.width;
  const pdfH = canvas.height * scale;
  const pageHeightMM = pdfH + margin * 2;

  const pdf = new jsPDF({ unit: "mm", format: [pageWidthMM, pageHeightMM] });
  pdf.addImage(img, "PNG", margin, margin, usableW, pdfH);

  const name = (currentCommentsReport?.office || "report").replace(/\s+/g, "_");
  pdf.save(`CSR_Comments_Report_${name}.pdf`);

  document.getElementById("officialCommentsDocument").innerHTML = "";
};

// ======================
// SAVED COMMENTS REPORTS TABLE (still rendered into the DOM, just
// unreachable from the UI now)
// ======================
function renderSavedCommentsReports() {
  const container = document.getElementById("saved-comments-reports-container");
  document.getElementById("saved-comments-reports-count").textContent = `${savedCommentsReports.length} report${savedCommentsReports.length === 1 ? "" : "s"}`;

  if (savedCommentsReports.length === 0) {
    container.innerHTML = `<div class="empty-state">No saved comments reports yet.</div>`;
    return;
  }

  container.innerHTML = `
    <table class="saved-reports-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Office</th>
          <th>Category</th>
          <th>Date Range</th>
          <th>Respondents</th>
          <th>Comments</th>
          <th>Saved On</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${savedCommentsReports.map((r, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td class="saved-office-name">${r.office}</td>
            <td>${categoryPillHtml(r.category || DEFAULT_CATEGORY)}</td>
            <td>${r.startDate} → ${r.endDate}</td>
            <td>${r.respondents}</td>
            <td>${r.commentsCount ?? (r.comments || []).length}</td>
            <td>${r.savedOn ? new Date(r.savedOn).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : "-"}</td>
            <td>
              <div class="action-btns">
                <button class="btn-view-comments" data-id="${r.id}">👁 View</button>
                <button class="btn-delete-comments" data-id="${r.id}">🗑</button>
              </div>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  container.querySelectorAll(".btn-view-comments").forEach(btn => {
    btn.classList.add("btn-view");
    btn.addEventListener("click", () => viewSavedCommentsReport(btn.dataset.id));
  });
  container.querySelectorAll(".btn-delete-comments").forEach(btn => {
    btn.classList.add("btn-delete");
    btn.addEventListener("click", () => deleteSavedCommentsReport(btn.dataset.id));
  });
}

function viewSavedCommentsReport(id) {
  const r = savedCommentsReports.find(sr => sr.id === id);
  if (!r) return;

  const category = CLEANLINESS_CATEGORIES.includes(r.category) ? r.category : DEFAULT_CATEGORY;

  selectedCategory = category;
  document.getElementById("category-filter").value = category;
  populateLocationFilter();

  const officialDoc = createCommentsDocument(r);
  document.getElementById("comments-report-container").innerHTML = officialDoc;

  document.getElementById("commentsPreviewLabel").textContent = `💬 Comments Report Preview — ${r.office} (${category})  (${r.startDate} → ${r.endDate})`;
  document.getElementById("commentsReportPreview").style.display = "block";
  document.getElementById("commentsReportPreview").scrollIntoView({ behavior: "smooth", block: "start" });

  document.getElementById("location-filter").value = r.office;
  document.getElementById("start-date").value = r.startDate;
  document.getElementById("end-date").value = r.endDate;
  selectedOffice = r.office;
  startDate = r.startDate;
  endDate = r.endDate;
  currentCommentsReport = r;

  renderStats();
}

function deleteSavedCommentsReport(id) {
  if (!confirm("Delete this saved comments report? This cannot be undone.")) return;
  deleteDoc(doc(db, SAVED_COMMENTS_REPORTS_COLLECTION, id)).catch(err => {
    alert("Could not delete comments report: " + err.message);
  });
}

// Comments-tab switch function is kept in case it's re-wired later.

  document.getElementById("ratingsTabPanel").style.display = "block";
  document.getElementById("commentsTabPanel").style.display = "none";

document.getElementById("location-filter").addEventListener("change", (e) => {

});

document.getElementById("start-date").addEventListener("change", (e) => {
  startDate = e.target.value;
});

document.getElementById("end-date").addEventListener("change", (e) => {
  endDate = e.target.value;
});

document.getElementById("btn-generate-report").addEventListener("click", generateReport);
document.getElementById("btn-save-report").addEventListener("click", saveReport);
</script>

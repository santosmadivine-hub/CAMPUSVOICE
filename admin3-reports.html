<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Reports | Admin 3</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @media print {
    @page { size: A4; margin: 0; }
    #sidebar-mount, #topbar-mount, .filter-row, .stats-row, .saved-reports-section, #rsCard { display: none !important; }
    .preview-bar { display: none !important; }
    #reportPreview { border: none !important; border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
    .report-section { break-inside: avoid; }
    .report-page-2 { border-top: none !important; margin-top: 0 !important; padding-top: 0 !important; }
    .page-break-label { display: none !important; }
    body, .layout, .main { margin: 0 !important; padding: 0 !important; }

    /* Each report page is exactly one A4 sheet (1mm short so rounding never
       spills the footer onto a blank extra page). */
    .official-report {
      min-height: 296mm !important;
      height: 296mm !important;
      overflow: hidden;
      page-break-inside: avoid;
    }

    /* The wrapper carries an inline margin/padding for the on-screen layout;
       zero it for print so Page 1's letterhead aligns with every other page. */
    .page-content-wrap {
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Keep background colors (table header, badges) when printing. */
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
  }

  /* Filter Bar */
  .filter-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
    background: #ffffff;
    border-radius: 12px;
    padding: 18px;
    border: 1px solid #bae6fd;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }

  .filter-select, .filter-date {
    padding: 10px 14px;
    border: 1px solid #bae6fd;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: #f8fafc;
    cursor: pointer;
    color: #0f172a;
  }

  .filter-select:focus, .filter-date:focus {
    outline: none;
    border-color: #0284c7;
  }

  .filter-date {
    cursor: text;
  }

  .filter-select {
    flex: 1;
    min-width: 160px;
  }

  .btn-generate {
    padding: 10px 18px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-generate:hover {
    background: #1d4ed8;
  }

  .btn-save {
    padding: 10px 18px;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-save:hover {
    background: #15803d;
  }

  .btn-save:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  .btn-print {
    padding: 8px 14px;
    background: #0284c7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-print:hover {
    background: #0369a1;
  }

  .btn-print:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  .empty-state {
    text-align: center;
    color: #94a3b8;
    padding: 40px 0;
    font-family: 'DM Sans', sans-serif;
  }

  /* Marks the start of the second page (Comments & Suggestions). On screen
     it's a dashed divider + label; in print/PDF it forces a real page break. */
  .page-break-label {
    text-align: center;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 8px 0;
  }

  .report-page-2 {
    page-break-before: always;
    border-top: 2px dashed #bae6fd;
    padding-top: 24px;
    margin-top: 8px;
  }

  /* Stat Cards Grid */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 24px;
  }

  .stat-card {
    position: relative;
    background: #ffffff;
    border: 1px solid #bae6fd;
    border-top: 4px solid #2563eb;
    border-radius: 16px;
    padding: 20px 20px 22px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-card::before {
    content: attr(data-icon);
    position: absolute;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .stat-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #0f172a;
    line-height: 1.1;
  }

  /* Report Preview Wrapper */
  #reportPreview {
    display: none;
    background: #fff;
    border: 1px solid #bae6fd;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 32px;
  }

  /* Preview Bar */
  .preview-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: #f0f9ff;
    border-bottom: 1px solid #bae6fd;
    flex-wrap: wrap;
  }

  .preview-bar .preview-label {
    flex: 1;
    font-size: 13px;
    font-weight: 700;
    color: #0c4a6e;
  }

  .btn-close {
    background: #e2e8f0;
    color: #475569;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-close:hover {
    background: #cbd5e1;
  }

  /* Report Section */
  .report-section {
    background: #fff;
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 32px;
    border: 1px solid #bae6fd;
  }

  .report-header {
    margin-bottom: 28px;
  }

  .report-office-name {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #0f1b32;
    margin-bottom: 8px;
  }

  .report-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: #64748b;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .meta-label {
    font-weight: 600;
    color: #475569;
  }

  .meta-value {
    color: #64748b;
  }

  /* Summary Table */
  .report-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-family: 'DM Sans', sans-serif;
  }

  .report-table thead {
    background: #dbeafe;
    color: #1e40af;
  }

  .report-table th {
    padding: 14px 16px;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .report-table td {
    padding: 14px 16px;
    border-bottom: 1px solid #bae6fd;
    font-size: 13px;
  }

  .report-table tbody tr:last-child td {
    border-bottom: none;
  }

  .report-table tbody tr:hover {
    background: #f0f9ff;
  }

  .dimension-name {
    font-weight: 600;
    color: #0f1b32;
  }

  .percentage {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #0f1b32;
  }

  .rating-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .rating-outstanding {
    background: #d1fae5;
    color: #065f46;
  }

  .rating-very-satisfactory {
    background: #dbeafe;
    color: #1e40af;
  }

  .rating-satisfactory {
    background: #fef3c7;
    color: #92400e;
  }

  .rating-poor {
    background: #fee2e2;
    color: #991b1b;
  }

  .no-data-message {
    text-align: center;
    padding: 24px;
    color: #94a3b8;
    font-style: italic;
  }

  /* Saved Reports */
  .saved-reports-section {
    background: #ffffff;
    border-radius: 12px;
    padding: 24px;
    border: 1px solid #bae6fd;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }

  .saved-reports-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .saved-reports-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    color: #0f1b32;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .saved-reports-count {
    background: #dbeafe;
    color: #0c4a6e;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
  }

  .saved-reports-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Sans', sans-serif;
  }

  .saved-reports-table th {
    text-align: left;
    padding: 14px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #475569;
    border-bottom: 2px solid #bae6fd;
    background: #f0f9ff;
  }

  .saved-reports-table td {
    padding: 14px 16px;
    font-size: 13px;
    color: #334155;
    border-bottom: 1px solid #f0f9ff;
  }

  .saved-reports-table tbody tr:last-child td {
    border-bottom: none;
  }

  .saved-reports-table tbody tr:hover {
    background: #f0f9ff;
  }

  .saved-office-name {
    font-weight: 700;
    color: #0f1b32;
  }

  .saved-avg {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
  }

  .saved-comments-count {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    color: #7c3aed;
  }

  .action-btns {
    display: flex;
    gap: 8px;
  }

  .btn-view {
    background: #dbeafe;
    color: #1e40af;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn-view:hover {
    background: #bfdbfe;
  }

  .btn-delete {
    background: #fee2e2;
    color: #991b1b;
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-delete:hover {
    background: #fecaca;
  }

  /* Report Header & Footer */
  .report-header-box {
    background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
    color: #fff;
    padding: 24px 32px;
    margin-bottom: 24px;
    border-radius: 8px;
  }

  .report-header-box h1 {
    margin: 0 0 8px 0;
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
  }

  .report-header-box p {
    margin: 4px 0;
    font-size: 13px;
    opacity: 0.95;
  }

  .report-footer-box {
    background: #f8fafc;
    
    padding: 20px 32px;
    margin-top: 24px;
    border-radius: 8px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
  }

  .report-footer-box p {
    margin: 4px 0;
  }

  /* Official Document Style — one A4 sheet (210mm x 297mm). Flex column keeps
     the letterhead at the top and pushes .official-footer (last child,
     margin-top:auto) to the bottom of THIS page. Each physical page is its own
     .official-report div (see paginateReportDocument). PAGE_V_PADDING_PX below
     must stay in sync with this top+bottom padding total. */
  .official-report {
    display: flex;
    flex-direction: column;
    background: #fff;
    font-family: 'Times New Roman', Times, serif;
    color: #000;
    line-height: 1.5;
    width: 100%;
    max-width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 10px 40px 20px;
  }

  /* Letterhead */
  .lh-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 4px;
  }

  .lh-logo-box, .lh-seal-box {
    width: 110px;
    height: 100px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lh-logo-box img, .lh-seal-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .lh-text {
    flex: 1;
    text-align: center;
    line-height: 1.35;
    font-size: 11pt;
  }

  .lh-text .rep {
    font-size: 9.5pt;
    color: #1a3a6b;
  }

  .lh-text .uni {
    font-size: 11.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.1px;
    color: #000000;
    line-height: 1.25;
    display: inline-block;
    margin: 2px 0;
  }

  .lh-text .dept {
    font-size: 11pt;
    font-weight: bold;
    text-transform: uppercase;
    color: #000000;
  }

  .lh-text .addr {
    font-size: 8.5pt;
    color: #64748b;
  }

  .lh-divider {
    border: none;
    border-top: 2.5px solid #1a3a6b;
    margin: 2px 0 6px;
  }

  .official-title {
    text-align: center;
    font-size: 13.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .official-meta {
    font-size: 11.5pt;
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .official-meta b {
    font-weight: bold;
  }

  .official-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
    font-size: 11pt;
    border: 1px solid #a9c2e0;
  }

  .official-table th {
    background: #1e3a5f;
    color: #ffffff;
    padding: 7px 11px;
    border: 1px solid #a9c2e0;
    text-align: center;
    font-weight: bold;
    font-size: 10.5pt;
  }

  .official-table td {
    border: 1px solid #cddcef;
    padding: 6px 11px;
    vertical-align: middle;
    font-size: 10.5pt;
  }

  .official-table tbody tr:nth-child(even) td {
    background: #eef2f9;
  }

  .official-table .dim-cell {
    color: #000000;
    font-weight: 500;
  }

  .official-narrative {
    font-size: 11pt;
    line-height: 1.5;
    text-align: justify;
    margin-bottom: 10px;
  }

  .official-narrative p {
    margin-bottom: 6px;
  }

  /* Compact signature block (lives inside the footer) */
  .official-signatures {
    display: flex;
    gap: 24px;
    margin-top: 8px;
    font-size: 10pt;
  }

  .sig-block {
    flex: 1;
  }

  .sig-label {
    color: #555;
    font-size: 9.5pt;
    margin-bottom: 6px;
  }

  .sig-line {
    border-top: 1px solid #000;
    width: 100%;
    margin-bottom: 4px;
  }

  .sig-name {
    font-weight: bold;
    text-transform: uppercase;
    padding-top: 0;
    display: inline-block;
    font-size: 10pt;
  }

  .sig-title {
    font-size: 9pt;
    font-style: italic;
    color: #333;
    margin-top: 0;
    line-height: 1.2;
  }

  /* Footer pinned to the bottom of its page via margin-top:auto. Safe because
     paginateReportDocument() subtracts footerHeight from every page's capacity
     before placing content, so there's always reserved room for it. */
  .official-footer {
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px solid #dfe6ee;
    display: block;
    width: 100%;
  }

  .official-footer img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  /* Prepared by / Noted by live INSIDE the footer (like Admin 2): they sit
     right above the footer image at the bottom of every page. */
  .official-footer .official-signatures {
    margin-top: 0;
    margin-bottom: 6px;
  }

  /* ─── Responsive ─── */
  @media (max-width: 1200px) {
    .stats-row {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 768px) {
    .stats-row {
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .filter-row {
      flex-direction: column;
      align-items: stretch;
    }

    .filter-select {
      width: 100%;
      min-width: unset;
    }

    .filter-date {
      width: 100%;
    }

    .btn-generate, .btn-save {
      width: 100%;
      justify-content: center;
    }
  }

  @media (max-width: 600px) {
    .stats-row {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .stat-card {
      padding: 16px 16px 18px;
    }

    .stat-value {
      font-size: 26px;
    }

    .stat-card::before {
      width: 32px;
      height: 32px;
      font-size: 14px;
      top: 14px;
      right: 14px;
    }
  }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <main class="main fade-in">
    <div id="topbar-mount"></div>

    <div class="page-content-wrap" style="margin-top: 28px; padding: 0 20px 40px;">
      <!-- Stat Cards Grid -->
      <div class="stats-row">
        <div class="stat-card" data-icon="📋">
          <div class="stat-label">Total Feedback</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card" data-icon="👍">
          <div class="stat-label">Positive (≥4★)</div>
          <div class="stat-value" id="stat-positive">0</div>
        </div>
        <div class="stat-card" data-icon="👎">
          <div class="stat-label">Negative (&lt;3★)</div>
          <div class="stat-value" id="stat-negative">0</div>
        </div>
        <div class="stat-card" data-icon="💾">
          <div class="stat-label">Saved Reports</div>
          <div class="stat-value" id="stat-saved">0</div>
        </div>
      </div>

      <!-- "Generate Report" builds BOTH pages: Page 1 is the Facilities
           Evaluation Report (ratings), Page 2 is the Comments & Suggestions
           Report. "Save Report" saves the whole two-page report as one record. -->
      <div class="filter-row">
        <input type="date" class="filter-date" id="start-date">
        <input type="date" class="filter-date" id="end-date">

        <select class="filter-select" id="location-filter">
          <option value="">Select Office...</option>
        </select>

        <button class="btn-generate" id="btn-generate-report">📊 Generate Report</button>
        <button class="btn-save" id="btn-save-report" disabled>💾 Save Report</button>
      </div>

      <!-- The "Report Header & Footer Settings" card (#rsCard) is inserted
           here, right before #reportPreview, by admin3-report-settings.js -->

      <div id="reportPreview">
        <div class="preview-bar">
          <span class="preview-label" id="previewLabel">📄 Report Preview</span>
          <button class="btn-print" id="btn-print-report" disabled>🖨️ Print</button>
          <button class="btn btn-green" onclick="exportPDF()" style="padding:8px 14px;font-size:13px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-family:'DM Sans';font-weight:600;cursor:pointer;">⬇ PDF</button>
          <button class="btn-close" onclick="closeReport()">✕ Close</button>
        </div>
        <div id="report-container"></div>
      </div>

      <div class="saved-reports-section">
        <div class="saved-reports-header">
          <h2>📋 Saved Reports</h2>
          <span class="saved-reports-count" id="saved-reports-count">0 reports</span>
        </div>
        <div id="saved-reports-container"></div>
      </div>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  addDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ======================
// HELPERS (date/timestamp parsing — matches admin3-eval-mgmt.html)
// ======================
// FacilitiesEvalActivity.kt stores "date" as a human-readable string, not
// always a numeric "timestamp". Derive a real millisecond timestamp from
// whichever field is present so date-range filtering works.
function parseEvalTimestamp(ev) {
  if (ev.timestamp !== undefined && ev.timestamp !== null && ev.timestamp !== "") {
    const t = Number(ev.timestamp);
    if (!Number.isNaN(t) && t > 0) return t;
  }
  if (ev.date) {
    if (typeof ev.date === "object" && typeof ev.date.toMillis === "function") {
      return ev.date.toMillis();
    }
    const parsed = new Date(ev.date).getTime();
    if (!Number.isNaN(parsed)) return parsed;
  }
  return 0;
}

// Parses "YYYY-MM-DD" as LOCAL midnight (new Date("YYYY-MM-DD") is UTC and can
// shift the day, dropping boundary-date evaluations).
function parseDateOnly(value) {
  if (!value) return null;
  const str = String(value).trim();
  if (!str) return null;

  const iso = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);
  if (iso) {
    const dt = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
    return isNaN(dt.getTime()) ? null : dt;
  }

  const parsed = new Date(str);
  if (isNaN(parsed.getTime())) return null;
  return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
}

// Pulls a comment/suggestion string from an evaluation record, trying a few
// likely field names. `comments` is the confirmed one; the rest are fallbacks.
function getCommentText(item) {
  const candidates = [
    item.comments, item.comment,
    item.suggestion, item.suggestions,
    item.commentsSuggestions, item.commentSuggestion,
    item.feedback, item.remarks, item.message
  ];
  for (const c of candidates) {
    if (typeof c === "string" && c.trim()) return c.trim();
  }
  return "";
}

function getRatingLabel(percentage) {
  for (const rating of RATING_SCALE) {
    if (percentage >= rating.min) {
      return { label: rating.label, class: rating.class };
    }
  }
  return { label: "Needs Improvement", class: "rating-poor" };
}

function evalAvgScore(e) {
  const ratings = [
    e.rating1, e.rating2, e.rating3, e.rating4, e.rating5,
    e.rating6, e.rating7, e.rating8, e.rating9, e.rating10
  ];
  return ratings.reduce((sum, r) => sum + r, 0) / ratings.length;
}

function populateLocationFilter() {
  const select = document.getElementById("location-filter");
  const current = select.value;
  const names = Object.values(offices).sort((a, b) => a.localeCompare(b));
  select.innerHTML = ['<option value="">Select Office...</option>']
    .concat(names.map(n => `<option value="${n}">${n}</option>`)).join("");
  select.value = current;
}

function formatDateShort(dateStr) {
  if (!dateStr) return "-";
  return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }).split('/').reverse().join('-');
}

// STATS — calculated from ALL evaluations

function renderStats(filteredEvals) {
  const total = evaluations.length;
  document.getElementById("stat-total").textContent = total;

  if (total === 0) {
    document.getElementById("stat-positive").textContent = "0";
    document.getElementById("stat-negative").textContent = "0";

  }

  const positive = evaluations.filter(e => evalAvgScore(e) >= 4).length;
  const negative = evaluations.filter(e => evalAvgScore(e) < 3).length;
  document.getElementById("stat-positive").textContent = positive;
  document.getElementById("stat-negative").textContent = negative;
}

// ======================
// GENERATE NARRATIVE (page 1 — ratings)
// Organization / campus names now come from the header & footer settings.
// ======================
function generateNarrative(office, respondents, overallPct, dimensionAverages) {
  const s = window.ReportSettings.get();
  const orgLine = [s.orgName, s.campusName].filter(Boolean).join(" – ");

  const perfWord = overallPct >= 90 ? "outstanding" : overallPct >= 75 ? "very satisfactory" : overallPct >= 60 ? "satisfactory" : "needs improvement";
  const topDims = dimensionAverages.filter(d => parseFloat(d.percentage) >= 90).map(d => d.dimension);
  const lowDims = dimensionAverages.filter(d => parseFloat(d.percentage) < 75).map(d => d.dimension);
  const highDims = dimensionAverages.filter(d => parseFloat(d.percentage) >= 80).slice(0, 3).map(d => d.dimension);

  const p1 = `The <strong>results</strong> of the Facilities Evaluation Report for the <strong>${office}</strong>, ${orgLine}, with <strong>${respondents}</strong> respondent(s), show an <strong>${perfWord} performance</strong> in facility quality and service with an average satisfaction rate of <strong>${overallPct.toFixed(2)}%</strong>.
    ${topDims.length ? `This indicates that the facility excels in ${topDims.join(", ")}, reflecting strong upkeep and service delivery.` : ""}`;

  const p2 = `<strong>Regarding specific evaluation dimensions</strong>,
    ${highDims.length ? `${highDims.join(", ")} demonstrated excellent performance, indicating consistent quality and proper maintenance standards.` : "the facility maintains satisfactory standards across the evaluated dimensions."}
    ${lowDims.length ? `Additionally, ${lowDims.join(", ")} scored slightly lower, indicating opportunities for improvement in these areas to enhance overall facility quality and user satisfaction.` : "All dimensions performed at satisfactory levels or above."}`;

  const p3 = `<strong>Overall</strong>, the facility continues to maintain <strong>${perfWord} standards</strong>. Continued attention to maintenance protocols and regular evaluations will help sustain and improve these results. Any identified areas for improvement should be prioritized to ensure the highest standards of facility management and user satisfaction.`;

  return [p1, p2, p3];
}

// ======================
// PAGINATION HELPERS
// ======================
// Splits a table + trailing content (narrative/signatures/footer) across as
// many physical A4 pages as needed. Every page repeats the letterhead, and
// the footer stays pinned to the bottom of every page.
const MM_TO_PX = 96 / 25.4;
const A4_HEIGHT_PX = 297 * MM_TO_PX;
const PAGE_V_PADDING_PX = 10 + 20; // matches .official-report's 10px top + 20px bottom padding
const PAGE_SAFETY_BUFFER_PX = 24; // cushion so rounding/print-engine differences never push the footer onto an extra page
// Width available to the footer image: .official-report's content box
// (210mm) minus its 40px left + 40px right padding.
const PAGE_CONTENT_WIDTH_PX = 210 * MM_TO_PX - 80;

// ======================
// FOOTER IMAGE SIZING
// The footer image is preloaded and its natural aspect ratio is converted
// into a FIXED pixel height baked into the <img> tag, so the height measured
// during pagination always matches what actually renders. The image source
// comes from the header & footer settings (admin3-report-settings.js)
// and the ratio is cached per image source.
// ======================
let footerRatioCache = { src: null, ratio: null };

function preloadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function getFooterAspectRatio() {
  const rs = window.ReportSettings;
  await rs.loadReportSettings();
  const src = rs.get().footerImage;
  if (!src) return null;
  if (footerRatioCache.src === src) return footerRatioCache.ratio;
  const dims = await preloadImage(src);
  const ratio = (dims && dims.w) ? (dims.h / dims.w) : 0.18; // sane fallback if the image fails to load
  footerRatioCache = { src, ratio };
  return ratio;
}

const FOOTER_MAX_HEIGHT_PX = 56; // keeps the accreditation banner compact so it always fits below the text

function buildFooterInnerHtml(ratio, src) {
  if (!src) return "";
  const safe = window.ReportSettings.esc(src);
  const r = ratio || 0.18;
  const naturalH = PAGE_CONTENT_WIDTH_PX * r;
  if (naturalH <= FOOTER_MAX_HEIGHT_PX) {
    return `<img src="${safe}" alt="Footer" crossorigin="anonymous" style="display:block;width:100%;height:${Math.round(naturalH)}px;object-fit:contain;">`;
  }
  const w = Math.round(FOOTER_MAX_HEIGHT_PX / r);
  return `<img src="${safe}" alt="Footer" crossorigin="anonymous" style="display:block;width:${w}px;height:${FOOTER_MAX_HEIGHT_PX}px;object-fit:contain;margin:0 auto;">`;
}

// Renders HTML inside a hidden, off-screen element sized like a real
// .official-report page, measures it, then cleans up.
function withMeasuringPage(fn) {
  const root = document.createElement("div");
  root.style.cssText = "position:fixed;left:-99999px;top:0;width:210mm;visibility:hidden;pointer-events:none;";
  const page = document.createElement("div");
  page.className = "official-report";
  page.style.minHeight = "0";
  page.style.height = "auto";
  root.appendChild(page);
  document.body.appendChild(root);
  try {
    return fn(page);
  } finally {
    document.body.removeChild(root);
  }
}

// Measures a fragment's height EXCLUDING the page div's own fixed top+bottom
// padding (otherwise PAGE_V_PADDING_PX would be double-counted per fragment).
function measureFragmentHeight(page, html) {
  page.innerHTML = html;
  return Math.max(page.getBoundingClientRect().height - PAGE_V_PADDING_PX, 0);
}

function measureRowHeights(page, theadHtml, rowHtmls) {
  page.innerHTML = `<table class="official-table">${theadHtml}<tbody>${rowHtmls.join("")}</tbody></table>`;
  return Array.from(page.querySelectorAll("tbody tr")).map(tr => tr.getBoundingClientRect().height);
}

/**
 * Lays out a table (with a repeating thead) plus trailing content
 * (narrative paragraphs + signatures) across one or more A4 pages.
 *
 * Trailing content is a sequence of atomic BLOCKS packed greedily: as many as
 * fit go directly under the table on the same page, and only the true
 * overflow flows onto additional pages (which repeat the letterhead but omit
 * the table). footerHeight is always subtracted from each page's capacity, so
 * the footer never overlaps content and never needs a page of its own.
 *
 * `trailing` may be a single HTML string (one atomic block) or an array of
 * HTML strings (each its own block).
 *
 * @param {string} idPrefix     id used for page 1; further pages get `${idPrefix}_2`, `_3`, ...
 * @param {(isContinuation:boolean) => string} buildChrome  letterhead + title + meta HTML for a page
 * @param {string} theadHtml    the <thead>...</thead> markup (identical on every page)
 * @param {string[]} rowHtmls   array of <tr>...</tr> strings (at least one row)
 * @param {string|string[]} trailing  narrative/signature content
 * @param {string} footerInnerHtml the footer's inner HTML (repeated on every page)
 * @returns {{id:string, html:string}[]}
 */
function paginateReportDocument(idPrefix, buildChrome, theadHtml, rowHtmls, trailing, footerInnerHtml) {
  return withMeasuringPage((page) => {
    const trailingBlocks = Array.isArray(trailing) ? trailing.filter(Boolean) : (trailing ? [trailing] : []);
    const footerHtml = `<div class="official-footer">${footerInnerHtml}</div>`;

    const chromeWithTableHeight = measureFragmentHeight(page, buildChrome(false) + `<table class="official-table">${theadHtml}<tbody></tbody></table>`);
    const chromeOnlyHeight = measureFragmentHeight(page, buildChrome(true));
    const footerHeight = measureFragmentHeight(page, footerHtml) || 60;
    const blockHeights = trailingBlocks.map(b => measureFragmentHeight(page, b));
    const rowHeights = measureRowHeights(page, theadHtml, rowHtmls);

    const capacityWithTable = Math.max(A4_HEIGHT_PX - PAGE_V_PADDING_PX - chromeWithTableHeight - footerHeight - PAGE_SAFETY_BUFFER_PX, 0);
    const capacityNoTable = Math.max(A4_HEIGHT_PX - PAGE_V_PADDING_PX - chromeOnlyHeight - footerHeight - PAGE_SAFETY_BUFFER_PX, 0);

    // Bucket table rows into pages that fit within capacityWithTable.
    const pagesRows = [];
    let current = { rows: [], height: 0 };
    rowHtmls.forEach((rowHtml, i) => {
      const h = rowHeights[i] || 0;
      if (current.rows.length > 0 && current.height + h > capacityWithTable) {
        pagesRows.push(current);
        current = { rows: [], height: 0 };
      }
      current.rows.push(rowHtml);
      current.height += h;
    });
    pagesRows.push(current);

    const pages = [];

    // Every table page EXCEPT the last carries just its rows.
    pagesRows.slice(0, -1).forEach((bucket, idx) => {
      const isContinuation = idx > 0;
      const id = idx === 0 ? idPrefix : `${idPrefix}_${idx + 1}`;
      pages.push({
        id,
        html: `
          <div class="official-report" id="${id}">
            ${buildChrome(isContinuation)}
            <table class="official-table">
              ${theadHtml}
              <tbody>${bucket.rows.join("")}</tbody>
            </table>
            ${footerHtml}
          </div>
        `
      });
    });

    // On the LAST table page, pack as many trailing blocks as fit under the rows.
    const lastPageIdx = pagesRows.length - 1;
    const lastBucket = pagesRows[lastPageIdx];
    let blockIdx = 0;
    let leftover = capacityWithTable - lastBucket.height;
    const blocksOnLastTablePage = [];
    while (blockIdx < blockHeights.length && blockHeights[blockIdx] <= leftover) {
      blocksOnLastTablePage.push(trailingBlocks[blockIdx]);
      leftover -= blockHeights[blockIdx];
      blockIdx++;
    }

    const lastTablePageId = lastPageIdx === 0 ? idPrefix : `${idPrefix}_${lastPageIdx + 1}`;
    pages.push({
      id: lastTablePageId,
      html: `
        <div class="official-report" id="${lastTablePageId}">
          ${buildChrome(lastPageIdx > 0)}
          <table class="official-table">
            ${theadHtml}
            <tbody>${lastBucket.rows.join("")}</tbody>
          </table>
          ${blocksOnLastTablePage.join("")}
          ${footerHtml}
        </div>
      `
    });

    // Remaining trailing blocks continue onto additional pages (letterhead,
    // no table). A block too tall for even an empty page is still placed so
    // nothing is ever dropped.
    while (blockIdx < blockHeights.length) {
      const pageBlocks = [];
      let remaining = capacityNoTable;
      while (blockIdx < blockHeights.length && (pageBlocks.length === 0 || blockHeights[blockIdx] <= remaining)) {
        pageBlocks.push(trailingBlocks[blockIdx]);
        remaining -= blockHeights[blockIdx];
        blockIdx++;
      }
      const id = `${idPrefix}_${pages.length + 1}`;
      pages.push({
        id,
        html: `
          <div class="official-report" id="${id}">
            ${buildChrome(true)}
            ${pageBlocks.join("")}
            ${footerHtml}
          </div>
        `
      });
    }

    return pages;
  });
}

// ======================
// CREATE OFFICIAL DOCUMENT — PAGE 1 (ratings)
// Letterhead, title, office line, signatures and footer image all come from
// the header & footer settings (window.ReportSettings).
// ======================
function createOfficialDocument(report, footerRatio) {
  const rs = window.ReportSettings;
  const s = rs.get();

  const reportStart = new Date(report.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const reportEnd = new Date(report.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

  const narrative = generateNarrative(report.office, report.respondents, parseFloat(report.avgSatisfaction), report.dimensionAverages);

  // Letterhead + title + meta — identical on every page. Continuation pages
  // repeat only the letterhead.
  const buildChrome = (isContinuation) => `
      ${rs.headerHtml(s, null)}
      ${isContinuation ? "" : `
      ${rs.titleHtml(s.reportTitle)}

      <div class="official-meta">
        <b>Office:</b> ${rs.officeLine(report.office)}<br>
        <b>Covered Period:</b> ${reportStart} – ${reportEnd}<br>
        <b>No. of Respondents:</b> ${report.respondents}
      </div>
      `}
  `;

  const theadHtml = `
        <thead>
          <tr>
            <th style="width:50%;text-align:left;padding-left:10px;">Evaluation Question</th>
            <th style="width:25%;">Percentage (%)</th>
            <th style="width:25%;">Rating</th>
          </tr>
        </thead>
  `;

  const rowHtmls = report.dimensionAverages.map(d => `
            <tr>
              <td class="dim-cell" style="padding-left:10px;">${d.dimension}</td>
              <td style="text-align:center;">${d.percentage}</td>
              <td style="text-align:center;">${d.rating.label}</td>
            </tr>
  `);

  // Trailing content: one block per narrative paragraph. The signatures are
  // no longer a trailing block — they live in the footer (below), so they
  // appear at the bottom of every page, above the footer image.
  const trailingBlocks = narrative.map(p => `<div class="official-narrative"><p>${p}</p></div>`);

  const footerInnerHtml = rs.signaturesHtml(s) + buildFooterInnerHtml(footerRatio, s.footerImage);

  return paginateReportDocument("csmPage", buildChrome, theadHtml, rowHtmls, trailingBlocks, footerInnerHtml);
}

// ======================
// CREATE COMMENTS DOCUMENT — PAGE 2 (comments & suggestions).
// Same letterhead system, lists individual comments/suggestions. Uses its
// own page id ("ccsPage").
// ======================
function createCommentsDocument(report, footerRatio) {
  const rs = window.ReportSettings;
  const s = rs.get();

  const reportStart = new Date(report.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const reportEnd = new Date(report.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const comments = report.comments || [];
  const commentsCount = report.commentsCount ?? comments.length;

  const rowHtmls = comments.length
    ? comments.map(c => `
        <tr>
          <td style="text-align:center;white-space:nowrap;">${c.timestamp ? new Date(c.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : "-"}</td>
          <td style="padding-left:10px;">${c.text.replace(/</g, "&lt;")}</td>
        </tr>
      `)
    : [`<tr><td colspan="2" style="text-align:center;color:#777;font-style:italic;padding:18px;">No comments or suggestions were submitted for this period.</td></tr>`];

  const summaryLine = commentsCount
    ? `During the covered period, the <strong>${report.office}</strong> received <strong>${commentsCount}</strong> written comment(s) and suggestion(s) out of <strong>${report.respondents}</strong> total respondent(s). These qualitative responses provide additional context to the quantitative ratings in the preceding page and are provided here to support the office in identifying areas for continuous improvement.`
    : `No written comments or suggestions were submitted by respondents of the <strong>${report.office}</strong> during the covered period.`;

  const buildChrome = (isContinuation) => `
      ${rs.headerHtml(s, null)}
      ${rs.titleHtml(s.commentsTitle, isContinuation ? " (Continued)" : "")}

      <div class="official-meta">
        <b>Office:</b> ${rs.officeLine(report.office)}<br>
        <b>Covered Period:</b> ${reportStart} – ${reportEnd}<br>
        <b>No. of Respondents:</b> ${report.respondents}<br>
        <b>No. of Comments/Suggestions Received:</b> ${commentsCount}
      </div>
  `;

  const theadHtml = `
        <thead>
          <tr>
            <th style="width:18%;">Date</th>
            <th style="width:82%;text-align:left;padding-left:10px;">Comment / Suggestion</th>
          </tr>
        </thead>
  `;

  const trailingHtml = `
      <div class="official-narrative">
        <p>${summaryLine}</p>
      </div>
  `;

  // Signatures live in the footer, above the footer image (like Admin 2).
  const footerInnerHtml = rs.signaturesHtml(s) + buildFooterInnerHtml(footerRatio, s.footerImage);

  return paginateReportDocument("ccsPage", buildChrome, theadHtml, rowHtmls, trailingHtml, footerInnerHtml);
}

// ======================
// BUILD THE FULL REPORT PREVIEW HTML — the ratings document followed by the
// comments & suggestions document, separated by a page-break divider. Either
// document may expand into several physical pages.
// ======================
async function buildReportPreviewHtml(report) {
  const footerRatio = await getFooterAspectRatio();
  const ratingsPages = createOfficialDocument(report, footerRatio);
  const commentsPages = createCommentsDocument(report, footerRatio);

  let html = "";

  ratingsPages.forEach((p, idx) => {
    html += idx === 0 ? p.html : `<div class="report-page-2">${p.html}</div>`;
  });

  commentsPages.forEach((p, idx) => {
    if (idx === 0) {
      html += `<div class="page-break-label">— Page ${ratingsPages.length + 1}: Comments &amp; Suggestions —</div>`;
    }
    html += `<div class="report-page-2">${p.html}</div>`;
  });

  return html;
}

// ======================
// GENERATE REPORT — builds page 1 (ratings) AND page 2 (comments &
// suggestions) from the same filtered evaluations.
// ======================
async function generateReport() {
  if (!selectedOffice) {
    alert("Please select an office");
    return;
  }

  if (!startDate || !endDate) {
    alert("Please select both start and end dates");
    return;
  }

  const officeEvals = evaluations.filter(e => e.officeName === selectedOffice);

  const start = parseDateOnly(startDate);
  const end = parseDateOnly(endDate);

  if (!start || !end) {
    alert("Invalid date range selected.");
    return;
  }

  start.setHours(0, 0, 0, 0);
  end.setHours(23, 59, 59, 999);

  const startTs = start.getTime();
  const endTs = end.getTime();

  const filteredEvals = officeEvals.filter(e => e.timestamp >= startTs && e.timestamp <= endTs);

  renderStats(filteredEvals);

  if (filteredEvals.length === 0) {
    document.getElementById("report-container").innerHTML = `
      <div class="empty-state">No evaluations found for the selected office and date range.</div>
    `;
    currentReport = null;
    document.getElementById("btn-save-report").disabled = true;
    document.getElementById("btn-print-report").disabled = true;
    document.getElementById("reportPreview").style.display = "block";
    return;
  }

  // Averages for each dimension (rating1 -> rating10). This is Page 1.
  const dimensionAverages = [];

  DIMENSIONS.forEach(dim => {
    const values = filteredEvals.map(e => e[dim.field]).filter(v => v > 0);
    if (values.length > 0) {
      const avg = values.reduce((a, b) => a + b, 0) / values.length;
      const percentage = (avg / 5) * 100; // 1-5 scale -> 0-100%
      const rating = getRatingLabel(percentage);
      dimensionAverages.push({
        dimension: dim.label,
        percentage: percentage.toFixed(1),
        rating
      });
    }
  });

  const overallPct = dimensionAverages.reduce((sum, d) => sum + parseFloat(d.percentage), 0) / dimensionAverages.length;
  const overallRating = getRatingLabel(overallPct);

  // Comments & suggestions from the same filtered evaluations (Page 2).
  const comments = filteredEvals
    .map(e => ({ text: getCommentText(e), timestamp: e.timestamp }))
    .filter(c => c.text)
    .sort((a, b) => a.timestamp - b.timestamp);

  currentReport = {
    office: selectedOffice,
    startDate,
    endDate,
    respondents: filteredEvals.length,
    avgSatisfaction: overallPct.toFixed(1),
    ratingLabel: overallRating.label,
    ratingClass: overallRating.class,
    dimensionAverages,
    commentsCount: comments.length,
    comments,
    generatedAt: new Date().toISOString()
  };

  document.getElementById("report-container").innerHTML = await buildReportPreviewHtml(currentReport);

  document.getElementById("previewLabel").textContent = `📄 Report Preview — ${selectedOffice}  (${startDate} → ${endDate})`;
  document.getElementById("reportPreview").style.display = "block";
  document.getElementById("reportPreview").scrollIntoView({ behavior: "smooth", block: "start" });

  document.getElementById("btn-save-report").disabled = false;
  document.getElementById("btn-print-report").disabled = false;
}

// ======================
// CLOSE REPORT
// ======================
window.closeReport = () => {
  document.getElementById("reportPreview").style.display = "none";
};

// ======================
// EXPORT PDF — captures every generated .official-report page from the live
// preview as its own PDF page, in document order.
// ======================
window.exportPDF = async () => {
  if (document.getElementById("reportPreview").style.display === "none" || !currentReport) {
    alert("Please generate or view a report first.");
    return;
  }

  const margin = 10; // left/right/bottom margin
  const marginTop = 3; // small top margin so the letterhead sits at the top
  const pageWidthMM = 210;
  const usableW = pageWidthMM - margin * 2;
  const { jsPDF } = window.jspdf;
  let pdf = null;

  async function addCanvasPage(el) {
    if (!el) return;

    let canvas;
    try {
      canvas = await html2canvas(el, {
        scale: 2,
        useCORS: true,
        backgroundColor: "#ffffff",
        // Cancel the leftover scroll offset (the preview auto-scrolls into
        // view) so every page is captured from its own top.
        scrollX: 0,
        scrollY: -window.scrollY
      });
    } catch (err) {
      console.error(err);
      alert("⚠ PDF export blocked by the browser.\n\nPlease serve this page over HTTP instead of opening it directly from disk.");
      throw err;
    }

    const img = canvas.toDataURL("image/png");
    const scale = usableW / canvas.width;
    const pdfH = canvas.height * scale;
    const pageHeightMM = pdfH + marginTop + margin; // page height hugs the content

    if (!pdf) {
      pdf = new jsPDF({ unit: "mm", format: [pageWidthMM, pageHeightMM] });
    } else {
      pdf.addPage([pageWidthMM, pageHeightMM]);
    }
    pdf.addImage(img, "PNG", margin, marginTop, usableW, pdfH);
  }

  const pageElements = document.querySelectorAll("#report-container .official-report");

  try {
    for (const el of pageElements) {
      await addCanvasPage(el);
    }
  } catch (err) {
    return; // error already alerted inside addCanvasPage
  }

  if (!pdf) {
    alert("Nothing to export.");
    return;
  }

  const name = (currentReport?.office || "report").replace(/\s+/g, "_");
  pdf.save(`FER_Report_${name}.pdf`);
};

// ======================
// SAVE REPORT — saves the whole two-page report (ratings + comments) as a
// single facility_saved_reports document.
// ======================
function saveReport() {
  if (!currentReport) return;

  const payload = { ...currentReport, savedOn: Date.now() };
  addDoc(collection(db, SAVED_REPORTS_COLLECTION), payload)
    .then(() => {
      document.getElementById("btn-save-report").disabled = true;
    })
    .catch(err => {
      alert("Could not save report: " + err.message);
    });
}

// ======================
// PRINT REPORT — opens the browser's print dialog for the generated report.
// Pages are separated by CSS page breaks; use the dialog's page-range
// control to print just Page 1, just Page 2, or both.
// ======================
function printReport() {
  if (document.getElementById("reportPreview").style.display === "none" || !currentReport) {
    alert("Please generate or view a report first.");
    return;
  }
  window.print();
}

// ======================
// SAVED REPORTS TABLE
// ======================
function renderSavedReports() {
  const container = document.getElementById("saved-reports-container");
  document.getElementById("saved-reports-count").textContent = `${savedReports.length} report${savedReports.length === 1 ? "" : "s"}`;

  if (savedReports.length === 0) {
    container.innerHTML = `<div class="empty-state">No saved reports yet.</div>`;
    return;
  }

  container.innerHTML = `
    <table class="saved-reports-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Office</th>
          <th>Date Range</th>
          <th>Respondents</th>
          <th>Avg Satisfaction</th>
          <th>Rating</th>
          <th>Comments</th>
          <th>Saved On</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${savedReports.map((r, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td class="saved-office-name">${r.office}</td>
            <td>${r.startDate} → ${r.endDate}</td>
            <td>${r.respondents}</td>
            <td class="saved-avg">${r.avgSatisfaction}%</td>
            <td><span class="rating-badge ${r.ratingClass}">${r.ratingLabel}</span></td>
            <td class="saved-comments-count">${r.commentsCount ?? (r.comments || []).length}</td>
            <td>${r.savedOn ? new Date(r.savedOn).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : "-"}</td>
            <td>
              <div class="action-btns">
                <button class="btn-view" data-id="${r.id}">👁 View</button>
                <button class="btn-delete" data-id="${r.id}">🗑</button>
              </div>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  container.querySelectorAll(".btn-view").forEach(btn => {
    btn.addEventListener("click", () => viewSavedReport(btn.dataset.id));
  });
  container.querySelectorAll(".btn-delete").forEach(btn => {
    btn.addEventListener("click", () => deleteSavedReport(btn.dataset.id));
  });
}

async function viewSavedReport(id) {
  const r = savedReports.find(sr => sr.id === id);
  if (!r) return;

  document.getElementById("report-container").innerHTML = await buildReportPreviewHtml(r);

  document.getElementById("previewLabel").textContent = `📄 Report Preview — ${r.office}  (${r.startDate} → ${r.endDate})`;
  document.getElementById("reportPreview").style.display = "block";
  document.getElementById("reportPreview").scrollIntoView({ behavior: "smooth", block: "start" });

  // Reflect the saved report's filters back into the filter bar
  document.getElementById("location-filter").value = r.office;
  document.getElementById("start-date").value = r.startDate;
  document.getElementById("end-date").value = r.endDate;
  selectedOffice = r.office;
  startDate = r.startDate;
  endDate = r.endDate;
  currentReport = r;  // Set to enable printing
  document.getElementById("btn-save-report").disabled = true;
  document.getElementById("btn-print-report").disabled = false;
}

function deleteSavedReport(id) {
  if (!confirm("Delete this saved report? This cannot be undone.")) return;
  deleteDoc(doc(db, SAVED_REPORTS_COLLECTION, id)).catch(err => {
    alert("Could not delete report: " + err.message);
  });
}

// ======================
// EVENT LISTENERS
// ======================
document.getElementById("location-filter").addEventListener("change", (e) => {
  selectedOffice = e.target.value;
});

document.getElementById("start-date").addEventListener("change", (e) => {
  startDate = e.target.value;
});

document.getElementById("end-date").addEventListener("change", (e) => {
  endDate = e.target.value;
});

document.getElementById("btn-generate-report").addEventListener("click", generateReport);
document.getElementById("btn-save-report").addEventListener("click", saveReport);
document.getElementById("btn-print-report").addEventListener("click", printReport);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Reports | Admin 3</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @media print {
    #sidebar-mount, #topbar-mount, .filter-row, .stats-row, .saved-reports-section { display: none !important; }
    .report-section { break-inside: avoid; }
  }

  /* Filter Bar */
  .filter-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
    background: #ffffff;
    border-radius: 12px;
    padding: 18px;
    border: 1px solid #bae6fd;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }

  .filter-select, .filter-date {
    padding: 10px 14px;
    border: 1px solid #bae6fd;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: #f8fafc;
    cursor: pointer;
    color: #0f172a;
  }

  .filter-select:focus, .filter-date:focus {
    outline: none;
    border-color: #0284c7;
  }

  .filter-date {
    cursor: text;
  }

  .filter-select {
    flex: 1;
    min-width: 160px;
  }

  .btn-generate {
    padding: 10px 18px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-generate:hover {
    background: #1d4ed8;
  }

  .btn-save {
    padding: 10px 18px;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-save:hover {
    background: #15803d;
  }

  .btn-save:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  /* ─── Comments & Suggestions Reports (new, self-contained feature,
       mirrors Admin 2's implementation) ─── */
  .btn-generate-comments {
    padding: 10px 18px;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-generate-comments:hover {
    background: #6d28d9;
  }

  .btn-save-comments {
    padding: 10px 18px;
    background: #9333ea;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-save-comments:hover {
    background: #7e22ce;
  }

  .btn-save-comments:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  /* Ratings / Comments tab switcher above the saved-reports tables */
  .report-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .report-tab {
    padding: 10px 18px;
    background: #fff;
    color: #64748b;
    border: 1px solid #bae6fd;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .report-tab:hover {
    background: #f0f9ff;
  }

  .report-tab.active {
    background: #0f1b32;
    color: #fff;
    border-color: #0f1b32;
  }

  .report-tab.comments-tab.active {
    background: #6d28d9;
    border-color: #6d28d9;
  }

  /* Separate preview wrapper for the Comments & Suggestions report —
     same look as #reportPreview, own ID, never shared with it. */
  #commentsReportPreview {
    display: none;
    background: #fff;
    border: 1px solid #bae6fd;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 32px;
  }

  .empty-state {
    text-align: center;
    color: #94a3b8;
    padding: 40px 0;
    font-family: 'DM Sans', sans-serif;
  }

  /* Stat Cards Grid */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 24px;
  }

  .stat-card {
    position: relative;
    background: #ffffff;
    border: 1px solid #bae6fd;
    border-top: 4px solid #2563eb;
    border-radius: 16px;
    padding: 20px 20px 22px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-card::before {
    content: attr(data-icon);
    position: absolute;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .stat-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #0f172a;
    line-height: 1.1;
  }

  /* Report Preview Wrapper */
  #reportPreview {
    display: none;
    background: #fff;
    border: 1px solid #bae6fd;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 32px;
  }

  /* Preview Bar */
  .preview-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: #f0f9ff;
    border-bottom: 1px solid #bae6fd;
    flex-wrap: wrap;
  }

  .preview-bar .preview-label {
    flex: 1;
    font-size: 13px;
    font-weight: 700;
    color: #0c4a6e;
  }

  .btn-close {
    background: #e2e8f0;
    color: #475569;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-close:hover {
    background: #cbd5e1;
  }

  /* Report Section */
  .report-section {
    background: #fff;
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 32px;
    border: 1px solid #bae6fd;
  }

  .report-header {
    margin-bottom: 28px;
  }

  .report-office-name {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #0f1b32;
    margin-bottom: 8px;
  }

  .report-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: #64748b;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .meta-label {
    font-weight: 600;
    color: #475569;
  }

  .meta-value {
    color: #64748b;
  }

  /* Summary Table */
  .report-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-family: 'DM Sans', sans-serif;
  }

  .report-table thead {
    background: #dbeafe;
    color: #1e40af;
  }

  .report-table th {
    padding: 14px 16px;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .report-table td {
    padding: 14px 16px;
    border-bottom: 1px solid #bae6fd;
    font-size: 13px;
  }

  .report-table tbody tr:last-child td {
    border-bottom: none;
  }

  .report-table tbody tr:hover {
    background: #f0f9ff;
  }

  .dimension-name {
    font-weight: 600;
    color: #0f1b32;
  }

  .percentage {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #0f1b32;
  }

  .rating-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .rating-outstanding {
    background: #d1fae5;
    color: #065f46;
  }

  .rating-very-satisfactory {
    background: #dbeafe;
    color: #1e40af;
  }

  .rating-satisfactory {
    background: #fef3c7;
    color: #92400e;
  }

  .rating-poor {
    background: #fee2e2;
    color: #991b1b;
  }

  .no-data-message {
    text-align: center;
    padding: 24px;
    color: #94a3b8;
    font-style: italic;
  }

  /* Saved Reports */
  .saved-reports-section {
    background: #ffffff;
    border-radius: 12px;
    padding: 24px;
    border: 1px solid #bae6fd;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }

  .saved-reports-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .saved-reports-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    color: #0f1b32;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .saved-reports-count {
    background: #dbeafe;
    color: #0c4a6e;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
  }

  .saved-reports-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Sans', sans-serif;
  }

  .saved-reports-table th {
    text-align: left;
    padding: 14px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #475569;
    border-bottom: 2px solid #bae6fd;
    background: #f0f9ff;
  }

  .saved-reports-table td {
    padding: 14px 16px;
    font-size: 13px;
    color: #334155;
    border-bottom: 1px solid #f0f9ff;
  }

  .saved-reports-table tbody tr:last-child td {
    border-bottom: none;
  }

  .saved-reports-table tbody tr:hover {
    background: #f0f9ff;
  }

  .saved-office-name {
    font-weight: 700;
    color: #0f1b32;
  }

  .saved-avg {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
  }

  .action-btns {
    display: flex;
    gap: 8px;
  }

  .btn-view {
    background: #dbeafe;
    color: #1e40af;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn-view:hover {
    background: #bfdbfe;
  }

  .btn-delete {
    background: #fee2e2;
    color: #991b1b;
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-delete:hover {
    background: #fecaca;
  }

  /* Report Header & Footer */
  .report-header-box {
    background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
    color: #fff;
    padding: 24px 32px;
    margin-bottom: 24px;
    border-radius: 8px;
  }

  .report-header-box h1 {
    margin: 0 0 8px 0;
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
  }

  .report-header-box p {
    margin: 4px 0;
    font-size: 13px;
    opacity: 0.95;
  }

  .report-footer-box {
    background: #f8fafc;
    border-top: 2px solid #bae6fd;
    padding: 20px 32px;
    margin-top: 24px;
    border-radius: 8px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
  }

  .report-footer-box p {
    margin: 4px 0;
  }

  /* Official Document Style */
  .official-report {
    background: #fff;
    font-family: 'Times New Roman', Times, serif;
    color: #000;
    line-height: 1.6;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 40px;
  }

  /* Letterhead */
  .lh-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .lh-logo-box, .lh-seal-box {
    width: 150px;
    height: 90px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lh-logo-box img, .lh-seal-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .lh-text {
    flex: 1;
    text-align: center;
    line-height: 1.4;
    font-size: 11pt;
  }

  .lh-text .rep {
    font-size: 9.5pt;
  }

  .lh-text .uni {
    font-size: 11.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.1px;
  }

  .lh-text .dept {
    font-size: 11pt;
    font-weight: bold;
    text-transform: uppercase;
  }

  .lh-text .addr {
    font-size: 8.5pt;
    color: #444;
  }

  .lh-divider {
    border: none;
    border-top: 2.5px solid #1a3a6b;
    margin: 4px 0 10px;
  }

  .official-title {
    text-align: center;
    font-size: 13.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  .official-meta {
    font-size: 13pt;
    line-height: 1.9;
    margin-bottom: 10px;
  }

  .official-meta b {
    font-weight: bold;
  }

  .official-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
    font-size: 14pt;
  }

  .official-table th {
    background: #1a3a6b;
    color: #fff;
    padding: 10px 11px;
    border: 1px solid #1a3a6b;
    text-align: center;
    font-weight: bold;
  }

  .official-table td {
    border: 1px solid #aaa;
    padding: 9px 11px;
  }

  .official-table tr:nth-child(even) td {
    background: #eef2f9;
  }

  .official-narrative {
    font-size: 13pt;
    line-height: 1.8;
    text-align: justify;
    margin-bottom: 16px;
  }

  .official-narrative p {
    margin-bottom: 10px;
  }

  .official-signatures {
    display: flex;
    gap: 40px;
    margin-top: 24px;
    font-size: 12pt;
  }

  .sig-block {
    flex: 1;
  }

  .sig-label {
    color: #555;
    font-size: 11pt;
    margin-bottom: 30px;
  }

  .sig-line {
    border-top: 1px solid #000;
    width: 100%;
    margin-bottom: 4px;
  }

  .sig-name {
    font-weight: bold;
    text-transform: uppercase;
    padding-top: 4px;
    display: inline-block;
  }

  .sig-title {
    font-size: 11pt;
    font-style: italic;
    color: #333;
    margin-top: 2px;
  }

  .official-footer {
    margin-top: 20px;
    padding-top: 8px;
    display: block;
    width: 100%;
  }

  .official-footer img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  /* ─── Responsive ─── */
  @media (max-width: 1200px) {
    .stats-row {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 768px) {
    .stats-row {
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .filter-row {
      flex-direction: column;
      align-items: stretch;
    }

    .filter-select {
      width: 100%;
      min-width: unset;
    }

    .filter-date {
      width: 100%;
    }

    .btn-generate, .btn-save, .btn-generate-comments, .btn-save-comments {
      width: 100%;
      justify-content: center;
    }
  }

  @media (max-width: 600px) {
    .stats-row {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .stat-card {
      padding: 16px 16px 18px;
    }

    .stat-value {
      font-size: 26px;
    }

    .stat-card::before {
      width: 32px;
      height: 32px;
      font-size: 14px;
      top: 14px;
      right: 14px;
    }
  }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <main class="main fade-in">
    <div id="topbar-mount"></div>

    <div style="margin-top: 28px; padding: 0 20px 40px;">
      <!-- Stat Cards Grid -->
      <div class="stats-row">
        <div class="stat-card" data-icon="📋">
          <div class="stat-label">Total Feedback</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card" data-icon="👍">
          <div class="stat-label">Positive (≥4★)</div>
          <div class="stat-value" id="stat-positive">0</div>
        </div>
        <div class="stat-card" data-icon="👎">
          <div class="stat-label">Negative (&lt;3★)</div>
          <div class="stat-value" id="stat-negative">0</div>
        </div>
        <div class="stat-card" data-icon="💾">
          <div class="stat-label">Saved Reports</div>
          <div class="stat-value" id="stat-saved">0</div>
        </div>
      </div>

      <div class="filter-row">
        <input type="date" class="filter-date" id="start-date">
        <input type="date" class="filter-date" id="end-date">

        <select class="filter-select" id="location-filter">
          <option value="">Select Office...</option>
        </select>

        <button class="btn-generate" id="btn-generate-report">📊 Generate Report</button>
        <button class="btn-save" id="btn-save-report" disabled>💾 Save Report</button>
        <button class="btn-generate-comments" id="btn-generate-comments-report">💬 Generate Comments Report</button>
        <button class="btn-save-comments" id="btn-save-comments-report" disabled>💾 Save Comments Report</button>
      </div>

      <!-- REPORT PREVIEW (shown/hidden like Admin 1) -->
      <div id="reportPreview">
        <div class="preview-bar">
          <span class="preview-label" id="previewLabel">📄 Report Preview</span>
          <button class="btn btn-green" onclick="exportPDF()" style="padding:8px 14px;font-size:13px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-family:'DM Sans';font-weight:600;cursor:pointer;">⬇ PDF</button>
          <button class="btn-close" onclick="closeReport()">✕ Close</button>
        </div>
        <div id="report-container"></div>
        <div id="officialDocument" style="display:none;"></div>
      </div>

      <!-- COMMENTS & SUGGESTIONS REPORT PREVIEW — separate panel, mirrors
           #reportPreview but is entirely new markup/IDs so the ratings
           preview above is never touched. -->
      <div id="commentsReportPreview">
        <div class="preview-bar">
          <span class="preview-label" id="commentsPreviewLabel">💬 Comments Report Preview</span>
          <button class="btn btn-green" onclick="exportCommentsPDF()" style="padding:8px 14px;font-size:13px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-family:'DM Sans';font-weight:600;cursor:pointer;">⬇ PDF</button>
          <button class="btn-close" onclick="closeCommentsReport()">✕ Close</button>
        </div>
        <div id="comments-report-container"></div>
        <div id="officialCommentsDocument" style="display:none;"></div>
      </div>

      <!-- Tab switcher — decides which of the two saved-reports tables
           below is visible. Purely a display toggle; does not touch the
           Firestore listeners or generate/save logic for either report
           type. -->
      <div class="report-tabs">
        <button class="report-tab active" id="tab-ratings-reports">📊 Ratings Reports</button>
        <button class="report-tab comments-tab" id="tab-comments-reports">💬 Comments Reports</button>
      </div>

      <div id="ratingsTabPanel">
        <div class="saved-reports-section">
          <div class="saved-reports-header">
            <h2>📋 Saved Reports</h2>
            <span class="saved-reports-count" id="saved-reports-count">0 reports</span>
          </div>
          <div id="saved-reports-container"></div>
        </div>
      </div>

      <!-- NEW saved-reports table, entirely separate from the ratings one
           above: own container, own count badge, own Firestore-backed
           data (facility_saved_comments_reports collection). -->
      <div id="commentsTabPanel" style="display:none;">
        <div class="saved-reports-section">
          <div class="saved-reports-header">
            <h2>💬 Saved Comments &amp; Suggestions Reports</h2>
            <span class="saved-reports-count" id="saved-comments-reports-count">0 reports</span>
          </div>
          <div id="saved-comments-reports-container"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">

// ======================
// HELPERS (date/timestamp parsing — matches admin3-eval-mgmt.html)
// ======================
// FacilitiesEvalActivity.kt stores "date" as a human-readable string
// (e.g. "July 02, 2026 10:29 AM") rather than always having a numeric
// "timestamp". This derives a real millisecond timestamp from whichever
// field is actually present, so date-range filtering works correctly.
function parseEvalTimestamp(ev) {
  if (ev.timestamp !== undefined && ev.timestamp !== null && ev.timestamp !== "") {
    const t = Number(ev.timestamp);
    if (!Number.isNaN(t) && t > 0) return t;
  }
  if (ev.date) {
    // Firestore Timestamp objects expose toMillis()
    if (typeof ev.date === "object" && typeof ev.date.toMillis === "function") {
      return ev.date.toMillis();
    }
    const parsed = new Date(ev.date).getTime();
    if (!Number.isNaN(parsed)) return parsed;
  }
  return 0;
}

// Safe, timezone-consistent date-only parsing for the report filter
// inputs (#start-date / #end-date). These are <input type="date">,
// which give "YYYY-MM-DD" strings. new Date("YYYY-MM-DD") parses that
// as UTC midnight, which can silently shift to the previous/next local
// day depending on timezone and drop evaluations on the boundary dates.
// This parses the Y/M/D components directly as LOCAL midnight instead,
// so the comparison against evaluation timestamps lines up correctly.
function parseDateOnly(value) {
  if (!value) return null;
  const str = String(value).trim();
  if (!str) return null;

  const iso = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);
  if (iso) {
    const dt = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
    return isNaN(dt.getTime()) ? null : dt;
  }

  const parsed = new Date(str);
  if (isNaN(parsed.getTime())) return null;
  return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
}

// ======================

function getRatingLabel(percentage) {
  for (const rating of RATING_SCALE) {
    if (percentage >= rating.min) {
      return { label: rating.label, class: rating.class };
    }
  }
  return { label: "Needs Improvement", class: "rating-poor" };
}

function evalAvgScore(e) {
  const ratings = [
    e.rating1, e.rating2, e.rating3, e.rating4, e.rating5,
    e.rating6, e.rating7, e.rating8, e.rating9, e.rating10
  ];
  return ratings.reduce((sum, r) => sum + r, 0) / ratings.length;
}

function populateLocationFilter() {
  const select = document.getElementById("location-filter");
  const current = select.value;
  const names = Object.values(offices).sort((a, b) => a.localeCompare(b));
  select.innerHTML = ['<option value="">Select Office...</option>']
    .concat(names.map(n => `<option value="${n}">${n}</option>`)).join("");
  select.value = current;
}

function formatDateShort(dateStr) {
  if (!dateStr) return "-";
  return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }).split('/').reverse().join('-');
}

// Pulls a comment/suggestion string out of an evaluation record, trying
// a handful of likely field names so it keeps working even if the
// Firestore field name ever changes. `comments` is the confirmed field
// on facility_evaluations records; the rest are just safety nets
// (mirrors Admin 2's getCommentText).
function getCommentText(item) {
  const candidates = [
    item.comments, item.comment,
    item.suggestion, item.suggestions,
    item.commentsSuggestions, item.commentSuggestion,
    item.feedback, item.remarks, item.message
  ];
  for (const c of candidates) {
    if (typeof c === "string" && c.trim()) return c.trim();
  }
  return "";
}

// ======================

// ======================
function renderStats(filteredEvals) {
  // Render KPIs from ALL evaluations in the system
  const total = evaluations.length;
  document.getElementById("stat-total").textContent = total;

  if (total === 0) {
    document.getElementById("stat-positive").textContent = "0";
    document.getElementById("stat-negative").textContent = "0";
    return;
  }

  const positive = evaluations.filter(e => evalAvgScore(e) >= 4).length;
  const negative = evaluations.filter(e => evalAvgScore(e) < 3).length;
  document.getElementById("stat-positive").textContent = positive;
  document.getElementById("stat-negative").textContent = negative;
}

function generateNarrative(office, respondents, overallPct, dimensionAverages) {
  const perfWord = overallPct >= 90 ? "outstanding" : overallPct >= 75 ? "very satisfactory" : overallPct >= 60 ? "satisfactory" : "needs improvement";
  const topDims = dimensionAverages.filter(d => parseFloat(d.percentage) >= 90).map(d => d.dimension);
  const lowDims = dimensionAverages.filter(d => parseFloat(d.percentage) < 75).map(d => d.dimension);
  const highDims = dimensionAverages.filter(d => parseFloat(d.percentage) >= 80).slice(0, 3).map(d => d.dimension);

  const p1 = `The <strong>results</strong> of the Facilities Evaluation Report for the <strong>${office}</strong>, Iloilo State University of Fisheries Science and Technology – San Enrique Campus, with <strong>${respondents}</strong> respondent(s), show an <strong>${perfWord} performance</strong> in facility quality and service with an average satisfaction rate of <strong>${overallPct.toFixed(2)}%</strong>.
    ${topDims.length ? `This indicates that the facility excels in ${topDims.join(", ")}, reflecting strong upkeep and service delivery.` : ""}`;

  const p2 = `<strong>Regarding specific evaluation dimensions</strong>,
    ${highDims.length ? `${highDims.join(", ")} demonstrated excellent performance, indicating consistent quality and proper maintenance standards.` : "the facility maintains satisfactory standards across the evaluated dimensions."}
    ${lowDims.length ? `Additionally, ${lowDims.join(", ")} scored slightly lower, indicating opportunities for improvement in these areas to enhance overall facility quality and user satisfaction.` : "All dimensions performed at satisfactory levels or above."}`;

  const p3 = `<strong>Overall</strong>, the facility continues to maintain <strong>${perfWord} standards</strong>. Continued attention to maintenance protocols and regular evaluations will help sustain and improve these results. Any identified areas for improvement should be prioritized to ensure the highest standards of facility management and user satisfaction.`;

  return [p1, p2, p3];
}

// ======================
// GENERATE REPORT
// ======================
function generateReport() {
  if (!selectedOffice) {
    alert("Please select an office");
    return;
  }

  if (!startDate || !endDate) {
    alert("Please select both start and end dates");
    return;
  }

  const officeEvals = evaluations.filter(e => e.officeName === selectedOffice);

  // Normalize the picked range to LOCAL start-of-day / end-of-day so
  // evaluations dated on either boundary are always included, without
  // any UTC/timezone shift and without requiring leading-zero dates.
  const start = parseDateOnly(startDate);
  const end = parseDateOnly(endDate);

  if (!start || !end) {
    alert("Invalid date range selected.");
    return;
  }

  start.setHours(0, 0, 0, 0);
  end.setHours(23, 59, 59, 999);

  const startTs = start.getTime();
  const endTs = end.getTime();

  const filteredEvals = officeEvals.filter(e => e.timestamp >= startTs && e.timestamp <= endTs);

  renderStats(filteredEvals);

  if (filteredEvals.length === 0) {
    document.getElementById("report-container").innerHTML = `
      <div class="empty-state">No evaluations found for the selected office and date range.</div>
    `;
    currentReport = null;
    document.getElementById("btn-save-report").disabled = true;
    document.getElementById("reportPreview").style.display = "block";
    switchToRatingsTab(); // COMMENTS TAB AUTO-SWITCH HOOK
    return;
  }

  // Calculate averages for each dimension (rating1 -> rating10)
  const dimensionAverages = [];

  DIMENSIONS.forEach(dim => {
    const values = filteredEvals.map(e => e[dim.field]).filter(v => v > 0);
    if (values.length > 0) {
      const avg = values.reduce((a, b) => a + b, 0) / values.length;
      const percentage = (avg / 5) * 100; // Convert 1-5 scale to 0-100%
      const rating = getRatingLabel(percentage);
      dimensionAverages.push({
        dimension: dim.label,
        percentage: percentage.toFixed(1),
        rating
      });
    }
  });

  const overallPct = dimensionAverages.reduce((sum, d) => sum + parseFloat(d.percentage), 0) / dimensionAverages.length;
  const overallRating = getRatingLabel(overallPct);

  // Snapshot ready to be saved
  currentReport = {
    office: selectedOffice,
    startDate,
    endDate,
    respondents: filteredEvals.length,
    avgSatisfaction: overallPct.toFixed(1),
    ratingLabel: overallRating.label,
    ratingClass: overallRating.class,
    dimensionAverages,
    generatedAt: new Date().toISOString()
  };

  // Create official document (with letterhead, narrative, signatures, footer)
  const officialDoc = createOfficialDocument(currentReport);
  document.getElementById("report-container").innerHTML = officialDoc;

  document.getElementById("previewLabel").textContent = `📄 Report Preview — ${selectedOffice}  (${startDate} → ${endDate})`;
  document.getElementById("reportPreview").style.display = "block";
  document.getElementById("reportPreview").scrollIntoView({ behavior: "smooth", block: "start" });

  document.getElementById("btn-save-report").disabled = false;
  switchToRatingsTab(); // COMMENTS TAB AUTO-SWITCH HOOK
}

  if (document.getElementById("reportPreview").style.display === "none" || !currentReport) {

    return;

  const officialDoc = createOfficialDocument(currentReport);
  document.getElementById("officialDocument").innerHTML = officialDoc;

  let canvas;
  try {
    canvas = await html2canvas(document.getElementById("csmPage"), {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff"
    });
    var img = canvas.toDataURL("image/png");
  } catch (err) {
    console.error(err);
    alert("⚠ PDF export blocked by the browser.\n\nPlease serve this page over HTTP instead of opening it directly from disk.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const margin = 10;
  const pageWidthMM = 210; // A4 width, kept for a familiar page width
  const usableW = pageWidthMM - margin * 2;
  const scale = usableW / canvas.width;
  const pdfH = canvas.height * scale;
  const pageHeightMM = pdfH + margin * 2; // page height hugs the content instead of a fixed A4 length

  const pdf = new jsPDF({ unit: "mm", format: [pageWidthMM, pageHeightMM] });
  pdf.addImage(img, "PNG", margin, margin, usableW, pdfH);

  const name = (currentReport?.office || "report").replace(/\s+/g, "_");
  pdf.save(`FER_Report_${name}.pdf`);
  
  document.getElementById("officialDocument").innerHTML = "";
};

// ======================================================================
// COMMENTS & SUGGESTIONS REPORTS — NEW, SELF-CONTAINED FEATURE
// Everything below reads the same in-memory `evaluations` array and the
// same filter state (selectedOffice / startDate / endDate) the ratings
// report already tracks, but writes to its own Firestore collection
// (SAVED_COMMENTS_REPORTS_COLLECTION) and renders into its own DOM
// containers. Nothing above this block is modified by this section
// other than two tiny one-line hooks (search "COMMENTS TAB AUTO-SWITCH
// HOOK") that jump the tab switcher over to Ratings whenever a ratings
// report is generated or viewed. Mirrors Admin 2's implementation.
// ======================================================================

// ======================
// GENERATE COMMENTS REPORT — reuses the same filter-bar selections
// (office / date range) as the ratings report, but pulls the
// `comments` field instead of rating1-10 and never writes into
// currentReport / dimensionAverages.
// ======================
function generateCommentsReport() {
  if (!selectedOffice) {
    alert("Please select an office");
    return;
  }

  if (!startDate || !endDate) {
    alert("Please select both start and end dates");
    return;
  }

  const officeEvals = evaluations.filter(e => e.officeName === selectedOffice);

  const start = parseDateOnly(startDate);
  const end = parseDateOnly(endDate);

  if (!start || !end) {
    alert("Invalid date range selected.");
    return;
  }

  start.setHours(0, 0, 0, 0);
  end.setHours(23, 59, 59, 999);

  const startTs = start.getTime();
  const endTs = end.getTime();

  const filteredEvals = officeEvals.filter(e => e.timestamp >= startTs && e.timestamp <= endTs);

  if (filteredEvals.length === 0) {
    document.getElementById("comments-report-container").innerHTML = `
      <div class="empty-state">No evaluations found for the selected office and date range.</div>
    `;
    currentCommentsReport = null;
    document.getElementById("btn-save-comments-report").disabled = true;
    document.getElementById("commentsReportPreview").style.display = "block";
    switchToCommentsTab();
    return;
  }

  const comments = filteredEvals
    .map(e => ({ text: getCommentText(e), timestamp: e.timestamp }))
    .filter(c => c.text)
    .sort((a, b) => a.timestamp - b.timestamp);

  currentCommentsReport = {
    office: selectedOffice,
    startDate,
    endDate,
    respondents: filteredEvals.length,
    commentsCount: comments.length,
    comments,
    generatedAt: new Date().toISOString()
  };

  const officialDoc = createCommentsDocument(currentCommentsReport);
  document.getElementById("comments-report-container").innerHTML = officialDoc;

  document.getElementById("commentsPreviewLabel").textContent = `💬 Comments Report Preview — ${selectedOffice}  (${startDate} → ${endDate})`;
  document.getElementById("commentsReportPreview").style.display = "block";
  document.getElementById("commentsReportPreview").scrollIntoView({ behavior: "smooth", block: "start" });

  document.getElementById("btn-save-comments-report").disabled = false;

  // Land on the Comments tab so the saved-comments table below is
  // immediately visible after generating.
  switchToCommentsTab();
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Office Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .forward {
    max-width: 520px;
    margin: 18vh auto 0;
    padding: 32px 28px;
    background: #fff;
    border: 1px solid #bae6fd;
    border-radius: 18px;
    box-shadow: 0 4px 14px rgba(15,23,42,.05);
    text-align: center;
    font-family: 'DM Sans', sans-serif;
    color: #334155;
    line-height: 1.6;
  }
  .forward h1 {
    font-family: 'Syne', sans-serif;
    font-size: 19px;
    color: #0b1220;
    margin: 0 0 8px;
  }
  .forward a { color: #2563eb; font-weight: 700; }
</style>
</head>
<body>

<!--
  Summary Analytics is no longer a separate page — it now lives inside
  office-dashboard.html, which serves both Admin 1 and the individual office
  accounts from one implementation, combining the dashboard overview and the
  analytics charts/filters into a single page.

  This page is kept so existing links and bookmarks still work: it forwards,
  preserving the ?office= parameter used by Office Management.
-->
<div class="forward">
  <h1>Opening the Office Dashboard…</h1>
  <p>
    If you are not redirected automatically,
    <a id="manual-link" href="office-dashboard.html">continue to the Office Dashboard</a>.
  </p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const office = params.get("office") || "";
  const target = office
    ? `office-dashboard.html?office=${encodeURIComponent(office)}`
    : "office-dashboard.html";

  document.getElementById("manual-link").setAttribute("href", target);
  window.location.replace(target);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Evaluation Mgmt | Admin 2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .card { background: #fff; border-radius: 18px; padding: 18px; border: 1px solid #bae6fd; margin-bottom: 28px; }
  .card-title { font-size: 18px; font-weight: 700; margin: 0; }

  /* ─── Summary stat cards ─── */
  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-bottom: 24px; }
  .stat-card {
    position: relative; background: #ffffff; border: 1px solid #bae6fd;
    border-top: 4px solid var(--accent3, #2563eb); border-radius: 16px;
    padding: 20px 20px 22px; box-shadow: 0 4px 14px rgba(15,23,42,0.05);
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat-card.blue { border-top-color: #2563eb; }
  .stat-card.green { border-top-color: #2563eb; }
  .stat-icon {
    position: absolute; top: 18px; right: 18px; width: 38px; height: 38px; border-radius: 10px;
    background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .stat-label {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #64748b;
    text-transform: uppercase; letter-spacing: .04em; padding-right: 44px;
  }
  .stat-value {
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 30px; color: #0f172a;
    line-height: 1.1; overflow-wrap: anywhere;
  }
  .stat-sub { font-family: 'DM Sans', sans-serif; font-size: 12px; color: #94a3b8; }

  @media (max-width: 1400px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 1200px) { .stat-value { font-size: 30px; } }
  @media (max-width: 1024px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 768px) { .stat-grid { grid-template-columns: 1fr 1fr; gap: 14px; } }
  @media (max-width: 600px) {
    .stat-card { padding: 16px 16px 18px; }
    .stat-value { font-size: 26px; }
    .stat-icon { width: 32px; height: 32px; font-size: 14px; top: 14px; right: 14px; }
  }
  @media (max-width: 480px) { .stat-grid { grid-template-columns: 1fr; } .stat-value { font-size: 28px; } }
  @media (max-width: 360px) { .stat-grid { gap: 10px; } .stat-card { padding: 14px 14px 18px; } }

  /* Toolbar */
  .submissions-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: none; cursor: pointer; border-radius: 10px; padding: 10px 16px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; font-size: 13px; -webkit-tap-highlight-color: transparent;
  }
  .btn-secondary { background: #e2e8f0; color: #0f172a; }
  .btn-secondary:hover { background: #cbd5e1; }

  /* Category tabs */
  .category-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .category-tab {
    border: 1px solid #bae6fd; background: #ffffff; color: #0369a1; padding: 9px 16px; border-radius: 999px;
    cursor: pointer; font-weight: 700; font-size: 13px; font-family: 'DM Sans', sans-serif;
    transition: background .2s, color .2s, transform .2s, border-color .2s;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  }
  .category-tab:hover { border-color: #0284c7; transform: translateY(-1px); }
  .category-tab.active { background: #0284c7; border-color: #0284c7; color: #ffffff; box-shadow: 0 4px 14px rgba(2,132,199,.3); }
  .category-tab.active[data-category="Surroundings"] { background: #16a34a; border-color: #16a34a; box-shadow: 0 4px 14px rgba(22,163,74,.3); }
  .category-tab .tab-count { background: rgba(255,255,255,0.35); border-radius: 4px; padding: 1px 7px; font-size: 11px; }
  .category-tab:not(.active) .tab-count { background: #f1f5f9; color: #64748b; }
  .category-pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .category-pill.comfort-room { background: #e0f2fe; color: #0369a1; }
  .category-pill.surroundings { background: #dcfce7; color: #15803d; }

  /* Status tabs */
  .eval-tabs { display: flex; gap: 4px; margin-bottom: 20px; padding: 5px; background: #f1f5f9; border-radius: 12px; flex-wrap: wrap; }
  .eval-tab {
    background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 700;
    font-size: 13px; color: #64748b; padding: 10px 14px; border-radius: 8px; display: flex; align-items: center;
    gap: 8px; transition: background .2s ease, color .2s ease, box-shadow .2s ease; white-space: nowrap;
  }
  .eval-tab:hover { color: #0f172a; background: #e2e8f0; }
  .eval-tab.active { color: #ffffff; background: #2563eb; box-shadow: 0 4px 12px rgba(37,99,235,.28); }
  .tab-count {
    background: #e2e8f0; color: #64748b; border-radius: 999px; padding: 2px 9px; font-size: 11px;
    font-weight: 700; min-width: 18px; text-align: center; line-height: 1.5;
  }
  .eval-tab.active .tab-count { background: rgba(255,255,255,0.28); color: #ffffff; }

  /* Filters */
  .submissions-filter-row { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .search-input-wrap {
    flex: 1; min-width: 250px; display: flex; align-items: center; gap: 8px; height: 46px;
    background: #f8fafc; border: 1px solid #dbe4ee; border-radius: 12px; padding: 0 14px;
  }
  .search-input-wrap input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: #0f172a;
  }
  .office-filter-select {
    height: 46px; background: #f8fafc; border: 1px solid #dbe4ee; border-radius: 12px; padding: 0 14px;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: #0f172a; min-width: 180px;
    -webkit-appearance: none; appearance: none;
  }

  /* Table */
  .table-wrap {
    overflow-x: auto; overflow-y: auto; max-height: 620px; -webkit-overflow-scrolling: touch;
    border: 1px solid #edf2f7; border-radius: 12px;
  }
  .table-wrap::-webkit-scrollbar { width: 7px; height: 7px; }
  .table-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  .table-wrap::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .table-wrap::-webkit-scrollbar-track { background: transparent; }
  .submissions-table { width: 100%; border-collapse: collapse; }
  .submissions-table th {
    text-align: left; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; color: #94a3b8; padding: 14px 10px;
    border-bottom: 1px solid #e2e8f0; white-space: nowrap; position: sticky; top: 0;
    background: #fff; z-index: 2; box-shadow: 0 1px 0 #e2e8f0;
  }
  .submissions-table td {
    padding: 14px 10px; border-bottom: 1px solid #edf2f7; font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: #334155; vertical-align: middle;
  }
  .submissions-table tbody tr:last-child td { border-bottom: none; }
  .row-index { color: #94a3b8; font-size: 12px; }
  .rating-q-cell { text-align: center; }
  .empty-row td { text-align: center; color: #94a3b8; padding: 40px 0 !important; }

  /* Status Badge */
  .status-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 12px; white-space: nowrap;
  }
  .status-badge.pending { background: #fef3c7; color: #b45309; }
  .status-badge.no_action { background: #e0e7ff; color: #4338ca; }
  .status-badge.resolved { background: #dcfce7; color: #166534; }

  /* Action Links */
  .btn-view, .btn-edit {
    background: none; border: none; font-family: 'DM Sans', sans-serif; font-weight: 600;
    font-size: 13px; cursor: pointer; padding: 0;
  }
  .btn-view { color: #2563eb; margin-right: 14px; }
  .btn-edit { color: #c2410c; }
  .btn-view:hover, .btn-edit:hover { text-decoration: underline; }

  /* Message User button + unread badge */
  .btn-message {
    position: relative; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 12px; cursor: pointer;
    padding: 4px 10px; border-radius: 8px; white-space: nowrap; margin-right: 14px;
  }
  .btn-message:hover { background: #dbeafe; }
  .btn-message .unread-dot {
    position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 3px;
    border-radius: 999px; background: #ef4444; color: #fff; font-size: 10px; font-weight: 700;
    line-height: 16px; text-align: center;
  }

  /* Modals */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(15, 27, 50, 0.55);
    align-items: center; justify-content: center; z-index: 999; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-content {
    background: #ffffff; border-radius: 18px; width: 100%; max-width: 480px; padding: 28px;
    box-shadow: 0 20px 60px rgba(15, 27, 50, 0.15); max-height: 85vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-content h3 { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: #0f172a; margin: 0 0 20px 0; }
  .modal-row {
    display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: #334155; gap: 12px;
  }
  .modal-row:last-of-type { border-bottom: none; }
  .modal-row span:first-child { color: #94a3b8; font-weight: 600; min-width: 120px; }
  .modal-row span:last-child { word-break: break-word; text-align: right; }
  .modal-footer { display: flex; gap: 10px; margin-top: 24px; }

  /* Edit Form Fields */
  .edit-field { margin-bottom: 16px; }
  .edit-field label {
    display: block; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700;
    color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .edit-field select {
    width: 100%; box-sizing: border-box; height: 44px; border: 1px solid #dbe4ee; border-radius: 10px;
    padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #0f172a;
    background: #f8fafc; -webkit-appearance: none; appearance: none;
  }
  .btn-primary {
    flex: 1; background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer;
  }
  .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-secondary {
    flex: 1; background: #e2e8f0; color: #0f172a; border: none; padding: 10px 16px; border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer;
  }
  .btn-secondary:hover { background: #cbd5e1; }

  /* Evidence column & gallery */
  .evidence-cell { cursor: pointer; }
  .evidence-badge {
    display: inline-flex; align-items: center; gap: 6px; background: #f1f5f9; border: 1px solid #e2e8f0;
    border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #334155; white-space: nowrap;
  }
  .evidence-badge:hover { background: #e2e8f0; }
  .evidence-badge.empty { color: #94a3b8; cursor: default; }
  .evidence-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 4px; }
  .evidence-gallery-item {
    position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0;
    background: #0f172a; display: block; text-decoration: none;
  }
  .evidence-gallery-item img, .evidence-gallery-item video { width: 100%; height: 90px; object-fit: cover; display: block; }
  .evidence-gallery-item .evidence-type-tag {
    position: absolute; bottom: 4px; right: 4px; background: rgba(15, 23, 42, 0.75); color: #fff;
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
  }
  .evidence-empty-note { font-size: 13px; color: #94a3b8; }

  /* Chat Modal */
  .chat-modal-content {
    background: #ffffff; border-radius: 18px; width: 100%; max-width: 480px;
    box-shadow: 0 20px 60px rgba(15, 27, 50, 0.15); display: flex; flex-direction: column;
    height: 640px; max-height: 85vh; overflow: hidden;
  }
  .chat-header {
    padding: 18px 20px; border-bottom: 1px solid #edf2f7; flex-shrink: 0; display: flex;
    align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .chat-header-text { min-width: 0; }
  .chat-header h3 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: #0f172a; margin: 0 0 3px 0; }
  .chat-header p { font-family: 'DM Sans', sans-serif; font-size: 12px; color: #64748b; margin: 0; }
  .chat-close-btn {
    background: #f1f5f9; border: none; color: #64748b; width: 30px; height: 30px; border-radius: 8px;
    font-size: 16px; line-height: 1; cursor: pointer; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; transition: background .2s, color .2s;
  }
  .chat-close-btn:hover { background: #e2e8f0; color: #0f172a; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column;
    gap: 10px; background: #f8fafc;
  }
  .chat-bubble-row { display: flex; flex-direction: column; max-width: 78%; }
  .chat-bubble-row.admin { align-self: flex-end; align-items: flex-end; }
  .chat-bubble-row.user { align-self: flex-start; align-items: flex-start; }
  .chat-bubble {
    font-family: 'DM Sans', sans-serif; font-size: 13.5px; line-height: 1.4; padding: 9px 13px;
    border-radius: 14px; word-break: break-word; white-space: pre-wrap;
  }
  .chat-bubble-row.admin .chat-bubble { background: #2563eb; color: #ffffff; border-bottom-right-radius: 4px; }
  .chat-bubble-row.user .chat-bubble { background: #e2e8f0; color: #0f172a; border-bottom-left-radius: 4px; }
  .chat-meta { font-family: 'DM Sans', sans-serif; font-size: 10.5px; color: #94a3b8; margin-top: 3px; padding: 0 3px; }
  .chat-empty-note { margin: auto; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #94a3b8; text-align: center; }
  .chat-input-row { display: flex; gap: 8px; padding: 14px 16px; border-top: 1px solid #edf2f7; flex-shrink: 0; background: #ffffff; }
  .chat-input-row textarea {
    flex: 1; resize: none; border: 1px solid #dbe4ee; border-radius: 12px; padding: 10px 12px;
    font-family: 'DM Sans', sans-serif; font-size: 13.5px; color: #0f172a; max-height: 90px; background: #f8fafc;
  }
  .chat-input-row textarea:focus { outline: none; border-color: #0284c7; }
  .chat-send-btn {
    background: #2563eb; color: #fff; border: none; border-radius: 12px; padding: 0 18px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0;
  }
  .chat-send-btn:hover:not(:disabled) { background: #1d4ed8; }
  .chat-send-btn:disabled { opacity: 0.55; cursor: default; }

  @media (max-width: 768px) {
    .submissions-filter-row { flex-direction: column; }
    .search-input-wrap, .office-filter-select { width: 100%; min-width: unset; }
    .modal-content { padding: 20px; }
    .table-wrap { max-height: 480px; }
    .chat-modal-content { height: 100%; max-height: 100%; border-radius: 0; }
  }
/* ================= HOVER + DESIGN POLISH ================= */

@keyframes cvRise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes cvModalIn {
  from { opacity: 0; transform: translateY(10px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.stat-card, main .card {
  animation: cvRise .5s cubic-bezier(.2,.7,.2,1) backwards;
}
.stat-card:nth-child(2) { animation-delay: .06s; }
.stat-card:nth-child(3) { animation-delay: .12s; }
.stat-card:nth-child(4) { animation-delay: .18s; }
.stat-card:nth-child(5) { animation-delay: .24s; }
main .card { animation-delay: .3s; }

/* Stat cards */
.stat-card {
  background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
  overflow: hidden;
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.stat-card::after {
  content: "";
  position: absolute;
  right: -30px; bottom: -30px;
  width: 110px; height: 110px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(37,99,235,.10), transparent 70%);
  transition: transform .35s ease;
  pointer-events: none;
}
.stat-card:hover {
  transform: translateY(-6px);
  border-color: #7dd3fc;
  box-shadow: 0 14px 30px rgba(37,99,235,.16);
}
.stat-card:hover::after { transform: scale(1.5); }
.stat-icon { transition: transform .3s ease, background .3s ease; }
.stat-card:hover .stat-icon {
  background: #dbeafe;
  transform: rotate(-8deg) scale(1.12);
}
.stat-value { transition: color .25s ease; }
.stat-card:hover .stat-value { color: #2563eb; }

/* Main card */
.card {
  box-shadow: 0 4px 14px rgba(15,23,42,.05);
  transition: box-shadow .25s ease, border-color .25s ease;
}
.card:hover {
  border-color: #7dd3fc;
  box-shadow: 0 12px 28px rgba(15,23,42,.08);
}
.card-title { font-family: 'Syne', sans-serif; }
.card-title::after {
  content: "";
  display: block;
  width: 28px; height: 3px;
  margin-top: 6px;
  border-radius: 3px;
  background: #2563eb;
  transition: width .3s ease;
}
.card:hover .card-title::after { width: 56px; }

/* Buttons */
.btn, .btn-primary, .btn-secondary, .chat-send-btn {
  transition: background .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease;
}
.btn:hover:not(:disabled),
.btn-primary:hover:not(:disabled),
.btn-secondary:hover:not(:disabled),
.chat-send-btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:active:not(:disabled),
.btn-primary:active:not(:disabled),
.btn-secondary:active:not(:disabled),
.chat-send-btn:active:not(:disabled) { transform: translateY(0); }
.btn-primary, .chat-send-btn {
  background: linear-gradient(160deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%);
  box-shadow: 0 4px 12px rgba(37,99,235,.28);
}
.btn-primary:hover:not(:disabled),
.chat-send-btn:hover:not(:disabled) {
  background: linear-gradient(160deg, #60a5fa 0%, #2563eb 55%, #1e40af 100%);
  box-shadow: 0 8px 18px rgba(37,99,235,.35);
}
.btn-secondary:hover:not(:disabled) {
  background: #dbeafe;
  color: #1e40af;
  box-shadow: 0 6px 14px rgba(37,99,235,.15);
}
.btn:focus-visible, .btn-primary:focus-visible, .btn-secondary:focus-visible,
.chat-send-btn:focus-visible, .category-tab:focus-visible, .eval-tab:focus-visible,
.btn-view:focus-visible, .btn-edit:focus-visible, .btn-message:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}

/* Category + status tabs */
.category-tab { transition: background .2s ease, color .2s ease, transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
.category-tab:not(.active):hover {
  background: #f0f9ff;
  border-color: #0284c7;
  box-shadow: 0 6px 14px rgba(2,132,199,.15);
  transform: translateY(-2px);
}
.category-tab[data-category="Surroundings"]:not(.active):hover {
  background: #f0fdf4;
  border-color: #16a34a;
  color: #15803d;
  box-shadow: 0 6px 14px rgba(22,163,74,.15);
}
.category-tab.active:hover { transform: translateY(-1px); }
.eval-tab:not(.active):hover { transform: translateY(-1px); }
.tab-count { transition: background .2s ease, color .2s ease; }
.eval-tab:not(.active):hover .tab-count { background: #cbd5e1; color: #0f172a; }

/* Search + filters */
.search-input-wrap, .office-filter-select, .edit-field select, .chat-input-row textarea {
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
.search-input-wrap:hover, .office-filter-select:hover,
.edit-field select:hover, .chat-input-row textarea:hover { border-color: #7dd3fc; }
.search-input-wrap:focus-within, .office-filter-select:focus,
.edit-field select:focus, .chat-input-row textarea:focus {
  background: #ffffff;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  outline: none;
}
.office-filter-select, .edit-field select { cursor: pointer; }

/* Table */
.submissions-table td { transition: background .2s ease; }
.submissions-table tbody tr:hover td { background: #f0f9ff; }
.submissions-table tbody tr:hover td:first-child { box-shadow: inset 4px 0 0 #2563eb; }
.empty-row:hover td { background: transparent !important; box-shadow: none !important; }
.category-pill, .status-badge { transition: transform .2s ease, box-shadow .2s ease; }
.submissions-table tbody tr:hover .category-pill,
.submissions-table tbody tr:hover .status-badge { transform: scale(1.06); }

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  doc,
  updateDoc,
  addDoc,
  setDoc,
  increment,
  writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",
  authDomain: "kristal-adb78.firebaseapp.com",
  projectId: "kristal-adb78",
  storageBucket: "kristal-adb78.firebasestorage.app",
  messagingSenderId: "1016283938031",
  appId: "1:1016283938031:web:54c4d13409d9784ad7af1a",
  measurementId: "G-LK8D1CBQ2J"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Build Sidebar & Topbar
document.getElementById("sidebar-mount").innerHTML =
  buildSidebar("admin2", "eval-mgmt");

document.getElementById("topbar-mount").innerHTML =
  buildTopbar("Evaluation Management", "admin2");

// ======================
// FIRESTORE COLLECTION NAME / SCHEMA CONSTANTS
// ======================
const EVAL_HISTORY_COLLECTION = "evaluation_history";
const NESTED_EVAL_ROOT = "cleanliness_evaluations";
const NOTIFICATIONS_COLLECTION = "notifications";
const USERS_COLLECTION = "users";
const CONVERSATIONS_COLLECTION = "conversations";
const ADMIN_SENDER_ID = "cleanliness_admin";

const OFFICE_COLLECTIONS = {
  "Comfort Room": "office-names-comfort-room",
  "Surroundings": "office_names_surroundings"
};
const CLEANLINESS_CATEGORIES = Object.keys(OFFICE_COLLECTIONS);
const DEFAULT_CATEGORY = "Comfort Room";

const TOTAL_RATING_QUESTIONS = 5;
const LOW_RATING_THRESHOLD = 3;

const STATUS_META = {
  pending: { label: "Pending" },
  no_action: { label: "No Action Required" },
  resolved: { label: "Resolved" }
};

// ======================
// STATE
// ======================
let evaluations = [];
let comfortOffices = {};
let surroundingsOffices = {};
let usersMap = {};          // userId -> display name
let conversationsMap = {};  // evaluationId -> conversation doc data
let searchTerm = "";
let officeFilter = "";
let categoryFilter = "all";
let currentTab = "recent";
let editingId = null;

let activeChatEvalId = null;
let chatMessagesUnsub = null;

// ======================
// HELPERS
// ======================
function makeCode(officeName, id) {
  const prefix = (officeName || "GEN")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .slice(0, 4) || "GEN";
  const suffix = id.slice(-6).toUpperCase();
  return `${prefix}-${suffix}`;
}

function evalAvg(record) {
  let sum = 0;
  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    sum += record["rating" + i];
  }
  return sum / TOTAL_RATING_QUESTIONS;
}

function parseEvidence(data) {
  const items = [];

  if (Array.isArray(data.evidenceUrls) && data.evidenceUrls.length) {
    const urls = data.evidenceUrls;
    const types = Array.isArray(data.evidenceTypes) ? data.evidenceTypes : [];
    urls.forEach((url, i) => {
      if (url) items.push({ url, type: types[i] === "video" ? "video" : "image" });
    });
    return items;
  }

  if (data.evidenceUrl) {
    items.push({ url: data.evidenceUrl, type: data.evidenceType === "video" ? "video" : "image" });
    return items;
  }

  if (data.fileUrl) {
    const isVideo = /\.(mp4|mov|webm|mkv|avi)(\?|$)/i.test(data.fileUrl);
    items.push({ url: data.fileUrl, type: isVideo ? "video" : "image" });
    return items;
  }

  return items;
}

function parseEvalStatus(data, avgRating) {
  const stored = (data.status || "").toString().toLowerCase();
  if (stored === "resolved" || stored === "pending" || stored === "no_action") {
    return stored;
  }
  return avgRating < LOW_RATING_THRESHOLD ? "pending" : "no_action";
}

// Matches the stored category to Comfort Room / Surroundings ignoring
// case and extra spaces, checking cleanlinessCategory first and then the
// generic category field. Returns null when the record is neither.
function normalizeCleanlinessCategory(data) {
  const candidates = [data.cleanlinessCategory, data.category];
  for (const raw of candidates) {
    if (typeof raw !== "string") continue;
    const match = CLEANLINESS_CATEGORIES.find(
      c => c.toLowerCase() === raw.trim().toLowerCase()
    );
    if (match) return match;
  }
  return null;
}

// One evaluator = one distinct userId. Records saved without a userId
// fall back to the evaluator's name so they are still counted once.
function evaluatorKey(e) {
  if (e.userId && e.userId !== "-") return "id:" + e.userId;
  if (e.evaluatorName && e.evaluatorName !== "-") {
    return "name:" + e.evaluatorName.trim().toLowerCase();
  }
  return null;
}

function countEvaluators(list) {
  const keys = new Set();
  list.forEach(e => {
    const key = evaluatorKey(e);
    if (key) keys.add(key);
  });
  return keys.size;
}

function categoryPillHtml(category) {
  const cls = category === "Surroundings" ? "surroundings" : "comfort-room";
  return `<span class="category-pill ${cls}">${category}</span>`;
}

// Resolves the evaluator's display name, preferring a live lookup in the
// `users` collection by userId, falling back to the name stored on the
// evaluation document.
function getEvaluatorName(e) {
  if (e.userId && e.userId !== "-" && usersMap[e.userId]) {
    return usersMap[e.userId];
  }
  return e.evaluatorName || "-";
}

// ======================
// BUILD TABLE HEADER
// ======================
function renderTableHeader() {
  const headRow = document.getElementById("submissions-thead-row");

  let questionHeaders = "";
  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    questionHeaders += `<th>Q${i}</th>`;
  }

  headRow.innerHTML = `
    <th>#</th>
    <th>Office</th>
    <th>Category</th>
    <th>Evaluator</th>
    ${questionHeaders}
    <th>Comments</th>
    <th>Evidence</th>
    <th>Status</th>
    <th>Date</th>
    <th>Message</th>
    <th id="action-col-header">Action</th>
  `;
}
renderTableHeader();

// ======================
// LOAD OFFICES
// ======================
onSnapshot(collection(db, OFFICE_COLLECTIONS["Comfort Room"]), (snapshot) => {
  comfortOffices = {};
  snapshot.forEach((doc) => {
    const data = doc.data();
    comfortOffices[doc.id] = data.name || data.officeName || doc.id;
  });
  populateOfficeFilter();
});

onSnapshot(collection(db, OFFICE_COLLECTIONS["Surroundings"]), (snapshot) => {
  surroundingsOffices = {};
  snapshot.forEach((doc) => {
    const data = doc.data();
    surroundingsOffices[doc.id] = data.name || data.officeName || doc.id;
  });
  populateOfficeFilter();
});

// ======================
// LOAD USERS (evaluator name lookup by userId)
// ======================
onSnapshot(collection(db, USERS_COLLECTION), (snapshot) => {
  usersMap = {};
  snapshot.forEach((doc) => {
    const data = doc.data();
    usersMap[doc.id] = data.name || data.fullName || data.email || doc.id;
  });
  renderSubmissions();
});

// ======================
// LOAD CONVERSATIONS (unread badges)
// ======================
onSnapshot(collection(db, CONVERSATIONS_COLLECTION), (snapshot) => {
  conversationsMap = {};
  snapshot.forEach((docSnap) => {
    conversationsMap[docSnap.id] = docSnap.data();
  });
  renderSubmissions();
}, (err) => {
  console.error("Failed to load conversations:", err);
});

// ======================
// LOAD EVALUATIONS
// Reads the whole collection with no orderBy: Firestore silently drops
// documents that lack the ordered field, which made the total too low.
// Records are sorted by timestamp on the client instead.
// ======================
const evalCollectionRef = collection(db, EVAL_HISTORY_COLLECTION);

onSnapshot(evalCollectionRef, (snapshot) => {
  evaluations = [];
  let skipped = 0;

  snapshot.forEach((doc) => {
    const data = doc.data();

    const category = normalizeCleanlinessCategory(data);
    if (!category) {
      skipped++;
      return;
    }

    const record = {
      id: doc.id,
      officeName: data.officeName || "Unknown",
      cleanlinessCategory: category,
      comments: data.comments || "",
      timestamp: getTimestampMillis(data.timestamp ?? data.date ?? data.submittedAt) ?? 0,
      evidence: parseEvidence(data),
      sex: data.sex || "-",
      userCategory: data.userCategory || "-",
      userId: data.userId || "-",
      evaluatorName: data.evaluatorName || data.userName || data.name || data.fullName || "-",
      evaluationId: data.evaluationId || doc.id
    };

    for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
      record["rating" + i] = Number(data["rating" + i]) || 0;
    }

    record.avgRating = evalAvg(record);
    record.status = parseEvalStatus(data, record.avgRating);

    evaluations.push(record);
  });

  evaluations.forEach(ev => {
    ev.code = makeCode(ev.officeName, ev.id);
  });

  if (skipped > 0) {
    console.warn(
      `${skipped} of ${snapshot.size} records in "${EVAL_HISTORY_COLLECTION}" are not counted ` +
      `because they have no Comfort Room / Surroundings category.`
    );
  }

  populateOfficeFilter();
  renderSubmissions();
}, (err) => {
  console.error("Failed to load evaluations:", err);
});

// ======================
// CATEGORY TABS
// ======================
document.getElementById("category-tabs").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".category-tab");
  if (!btn) return;
  categoryFilter = btn.getAttribute("data-category");
  document.querySelectorAll(".category-tab").forEach(t => t.classList.toggle("active", t === btn));
  officeFilter = "";
  document.getElementById("office-filter").value = "";
  populateOfficeFilter();
  renderSubmissions();
});

// ======================
// TABS
// ======================
document.getElementById("eval-tabs").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".eval-tab");
  if (!btn) return;
  currentTab = btn.getAttribute("data-tab");
  document.querySelectorAll(".eval-tab").forEach(t => t.classList.toggle("active", t === btn));
  renderSubmissions();
});

// ======================
// RENDER
// ======================
function officesForCategory(category) {
  if (category === "Comfort Room") return comfortOffices;
  if (category === "Surroundings") return surroundingsOffices;
  return { ...comfortOffices, ...surroundingsOffices };
}

function populateOfficeFilter() {
  const select = document.getElementById("office-filter");
  const currentValue = select.value;

  const officeNames = Array.from(new Set(Object.values(officesForCategory(categoryFilter)))).sort((a, b) =>
    a.localeCompare(b, undefined, { sensitivity: "base" })
  );

  const options = ['<option value="">All Offices</option>']
    .concat(officeNames.map(name => `<option value="${name}">${name}</option>`));

  select.innerHTML = options.join("");
  select.value = currentValue;
}

function getCategoryFilteredSubmissions() {
  return evaluations.filter(e => categoryFilter === "all" ? true : e.cleanlinessCategory === categoryFilter);
}

function getFilteredSubmissions() {
  const term = searchTerm.trim().toLowerCase();

  return getCategoryFilteredSubmissions()
    .filter(e => currentTab === "recent" ? true : e.status === currentTab)
    .filter(e => !officeFilter || e.officeName === officeFilter)
    .filter(e => {
      if (!term) return true;
      return (
        e.officeName.toLowerCase().includes(term) ||
        e.comments.toLowerCase().includes(term) ||
        (getEvaluatorName(e) || "").toLowerCase().includes(term)
      );
    })
    .sort((a, b) => b.timestamp - a.timestamp);
}

function ratingCellsHtml(e) {
  let html = "";
  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    html += `<td class="rating-q-cell">${e["rating" + i]}</td>`;
  }
  return html;
}

function evidenceCellHtml(e) {
  const imgCount = e.evidence.filter(item => item.type === "image").length;
  const vidCount = e.evidence.filter(item => item.type === "video").length;

  if (imgCount === 0 && vidCount === 0) {
    return `<span class="evidence-badge empty">No evidence</span>`;
  }

  const parts = [];
  if (imgCount) parts.push(`📷 ${imgCount}`);
  if (vidCount) parts.push(`🎥 ${vidCount}`);

  return `<span class="evidence-badge evidence-cell" data-eval-id="${e.id}">${parts.join("  ")}</span>`;
}

// "💬 Message" button, with a red unread-count badge when the
// conversation has unread messages waiting on the admin's side.
function messageCellHtml(e) {
  const convo = conversationsMap[e.id];
  const unread = convo ? (Number(convo.unreadForAdmin) || 0) : 0;
  const dot = unread > 0 ? `<span class="unread-dot">${unread > 9 ? "9+" : unread}</span>` : "";
  return `<button class="btn-message" data-eval-id="${e.id}">💬 Message${dot}</button>`;
}

function renderSubmissions() {
  const categoryScoped = getCategoryFilteredSubmissions();
  const filtered = getFilteredSubmissions();

  document.getElementById("cat-count-all").textContent = evaluations.length;
  document.getElementById("cat-count-comfort").textContent = evaluations.filter(e => e.cleanlinessCategory === "Comfort Room").length;
  document.getElementById("cat-count-surroundings").textContent = evaluations.filter(e => e.cleanlinessCategory === "Surroundings").length;

  document.getElementById("stat-total").textContent = categoryScoped.length;
  document.getElementById("stat-total-sub").textContent = categoryFilter === "all" ? "All Submissions" : categoryFilter;
  document.getElementById("stat-evaluators").textContent = countEvaluators(categoryScoped);

  const pendingCount = categoryScoped.filter(e => e.status === "pending").length;
  const noActionCount = categoryScoped.filter(e => e.status === "no_action").length;
  const resolvedCount = categoryScoped.filter(e => e.status === "resolved").length;
  document.getElementById("stat-pending").textContent = pendingCount;
  document.getElementById("stat-no-action").textContent = noActionCount;
  document.getElementById("stat-resolved").textContent = resolvedCount;

  document.getElementById("tab-count-recent").textContent = categoryScoped.length;
  document.getElementById("tab-count-pending").textContent = pendingCount;
  document.getElementById("tab-count-no_action").textContent = noActionCount;
  document.getElementById("tab-count-resolved").textContent = resolvedCount;

  const tbody = document.getElementById("submissions-tbody");

  const showActionColumn = currentTab !== "recent";
  document.getElementById("action-col-header").style.display = showActionColumn ? "" : "none";

  const colCount = showActionColumn ? 4 + TOTAL_RATING_QUESTIONS + 6 : 4 + TOTAL_RATING_QUESTIONS + 5;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${colCount}">No submissions found.</td></tr>`;
    return;
  }

  // Edit is hidden on the "No Action Required" tab.
  const showEditButtonForTab = showActionColumn && currentTab !== "no_action";

  tbody.innerHTML = filtered.map((e, i) => {
    const date = e.timestamp ? new Date(e.timestamp).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "-";
    const meta = STATUS_META[e.status] || STATUS_META.pending;
    const messageCell = `<td>${messageCellHtml(e)}</td>`;
    const actionCell = showActionColumn ? `
        <td>
          <button class="btn-view" data-eval-id="${e.id}">View</button>
          ${showEditButtonForTab ? `<button class="btn-edit" data-eval-id="${e.id}">Edit</button>` : ""}
        </td>` : "";
    return `
      <tr>
        <td class="row-index">${i + 1}</td>
        <td>${e.officeName}</td>
        <td>${categoryPillHtml(e.cleanlinessCategory)}</td>
        <td>${getEvaluatorName(e)}</td>
        ${ratingCellsHtml(e)}
        <td>${e.comments || "-"}</td>
        <td>${evidenceCellHtml(e)}</td>
        <td><span class="status-badge ${e.status}">${meta.label}</span></td>
        <td>${date}</td>${messageCell}${actionCell}
      </tr>
    `;
  }).join("");

  tbody.querySelectorAll(".btn-view").forEach(btn => {
    btn.addEventListener("click", () => openDetailModal(btn.getAttribute("data-eval-id")));
  });
  tbody.querySelectorAll(".btn-edit").forEach(btn => {
    btn.addEventListener("click", () => openEditModal(btn.getAttribute("data-eval-id")));
  });
  tbody.querySelectorAll(".evidence-cell").forEach(badge => {
    badge.addEventListener("click", () => openDetailModal(badge.getAttribute("data-eval-id")));
  });
  tbody.querySelectorAll(".btn-message").forEach(btn => {
    btn.addEventListener("click", () => openChatModal(btn.getAttribute("data-eval-id")));
  });
}

// ======================
// EXPORT CSV
// ======================
document.getElementById("btn-export").addEventListener("click", () => {
  const filtered = getFilteredSubmissions();

  if (filtered.length === 0) {
    alert("No submissions to export.");
    return;
  }

  const questionHeaders = [];
  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    questionHeaders.push("Q" + i);
  }

  const header = ["#", "Office", "Category", "Evaluator", ...questionHeaders, "Avg", "Comments", "Sex", "Respondent Type",
                  "User ID", "Evaluation ID", "Image URLs", "Video URLs", "Status", "Date"];

  const rows = filtered.map((e, i) => {
    const date = e.timestamp ? new Date(e.timestamp).toLocaleDateString() : "-";
    const comments = `"${(e.comments || "").replace(/"/g, '""')}"`;
    const evaluatorName = `"${getEvaluatorName(e).replace(/"/g, '""')}"`;
    const status = (STATUS_META[e.status] || STATUS_META.pending).label;

    const ratingValues = [];
    for (let q = 1; q <= TOTAL_RATING_QUESTIONS; q++) {
      ratingValues.push(e["rating" + q]);
    }

    const imageUrls = `"${e.evidence.filter(item => item.type === "image").map(item => item.url).join(" | ")}"`;
    const videoUrls = `"${e.evidence.filter(item => item.type === "video").map(item => item.url).join(" | ")}"`;

    return [
      i + 1,
      e.officeName,
      e.cleanlinessCategory,
      evaluatorName,
      ...ratingValues,
      e.avgRating.toFixed(1),
      comments,
      e.sex,
      e.userCategory,
      e.userId,
      e.evaluationId,
      imageUrls,
      videoUrls,
      status,
      date
    ].join(",");
  });

  const csvContent = [header.join(","), ...rows].join("\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = `cleanliness-submissions-${categoryFilter === "all" ? "all" : categoryFilter.toLowerCase().replace(/\s+/g, "-")}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
});

const detailModal = document.getElementById("detail-modal");
const detailModalBody = document.getElementById("detail-modal-body");

function openDetailModal(evalId) {
  const e = evaluations.find(item => item.id === evalId);
  if (!e) return;

  const date = e.timestamp ? new Date(e.timestamp).toLocaleString() : "-";

  let questionRows = "";
  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    questionRows += `<div class="modal-row"><span>Q${i}</span><span>${e["rating" + i]}</span></div>`;
  }

  detailModalBody.innerHTML = `
    <div class="modal-row"><span>Office</span><span>${e.officeName}</span></div>
    <div class="modal-row"><span>Category</span><span>${categoryPillHtml(e.cleanlinessCategory)}</span></div>
    <div class="modal-row"><span>Evaluator</span><span>${getEvaluatorName(e)}</span></div>
    <div class="modal-row"><span>Avg Rating</span><span>${e.avgRating.toFixed(1)} / 5</span></div>
    ${questionRows}
    <div class="modal-row"><span>Comments</span><span>${e.comments || "-"}</span></div>
    <div class="modal-row"><span>Sex</span><span>${e.sex}</span></div>
    <div class="modal-row"><span>Respondent Type</span><span>${e.userCategory}</span></div>
    <div class="modal-row"><span>User ID</span><span>${e.userId}</span></div>
    <div class="modal-row"><span>Evaluation ID</span><span>${e.evaluationId}</span></div>
    <div class="modal-row"><span>Status</span><span>${statusLabel}</span></div>
    <div class="modal-row"><span>Submitted</span><span>${date}</span></div>
    <div class="modal-row" style="display:block;">
      <span style="display:block; margin-bottom:8px;">Evidence</span>
      ${evidenceGalleryHtml(e)}
    </div>
  `;

  detailModal.classList.add("open");
}

function evidenceGalleryHtml(e) {
  if (!e.evidence.length) {
    return `<div class="evidence-empty-note">No images or videos were attached.</div>`;
  }

  const items = e.evidence.map(item => {
    if (item.type === "video") {
      return `
        <a class="evidence-gallery-item" href="${item.url}" target="_blank" rel="noopener">
          <video src="${item.url}" muted></video>
          <span class="evidence-type-tag">Video</span>
        </a>`;
    }
    return `
      <a class="evidence-gallery-item" href="${item.url}" target="_blank" rel="noopener">
        <img src="${item.url}" alt="Evidence" loading="lazy">
        <span class="evidence-type-tag">Image</span>
      </a>`;
  }).join("");

  return `<div class="evidence-gallery">${items}</div>`;
}

document.getElementById("detail-modal-close").addEventListener("click", () => {
  detailModal.classList.remove("open");
});
detailModal.addEventListener("click", (ev) => {
  if (ev.target === detailModal) detailModal.classList.remove("open");
});

    editModal.classList.remove("open");

async function saveStatusUpdate(record, newStatus) {
  const flatRef = doc(db, EVAL_HISTORY_COLLECTION, record.id);
  const nestedRef = doc(
    db,
    NESTED_EVAL_ROOT,
    record.cleanlinessCategory,
    "offices",
    record.officeName,
    "evaluations",
    record.id
  );

  await Promise.all([
    updateDoc(flatRef, { status: newStatus }),
    updateDoc(nestedRef, { status: newStatus }).catch(() => {})
  ]);
}

// ======================
// NOTIFY USER OF STATUS CHANGE
// Writes to notifications/{userId}/items so the submitter sees it in the
// Android app's Profile notification bell (type: "eval_status").
// ======================
async function notifyUserOfStatusChange(record, newStatus) {
  if (!record.userId || record.userId === "-") return;

  const label = (STATUS_META[newStatus] || STATUS_META.pending).label;
  const timestamp = Date.now();
  const date = new Date(timestamp).toLocaleString("en-US", {
    month: "long",
    day: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });

  try {
    await addDoc(collection(db, NOTIFICATIONS_COLLECTION, record.userId, "items"), {
      message: `Your cleanliness evaluation for ${record.officeName} was marked as "${label}".`,
      date,
      timestamp,
      type: "eval_status",
      status: newStatus,
      office: record.officeName,
      category: record.cleanlinessCategory,
      evaluationId: record.evaluationId,
      read: false
    });
  } catch (err) {
    // Don't block the status save if the notification write fails.
    console.error("Failed to send status notification", err);
  }
}

editSaveBtn.addEventListener("click", async () => {
  if (!editingId) return;

  const record = evaluations.find(item => item.id === editingId);
  if (!record) return;

  const newStatus = editStatusSelect.value;
  const statusChanged = record.status !== newStatus;

  editSaveBtn.disabled = true;
  editSaveBtn.textContent = "Saving...";

  try {
    await saveStatusUpdate(record, newStatus);

    if (statusChanged) {
      await notifyUserOfStatusChange(record, newStatus);
    }

    editModal.classList.remove("open");
    editingId = null;
  } catch (err) {
    alert("Failed to save changes. Please try again.");
    console.error(err);
  } finally {
    editSaveBtn.disabled = false;
    editSaveBtn.textContent = "Save Changes";
  }
});

// ======================
// CHAT MODAL
// ======================
const chatModal = document.getElementById("chat-modal");
const chatHeaderTitle = document.getElementById("chat-header-title");
const chatHeaderSub = document.getElementById("chat-header-sub");
const chatMessagesEl = document.getElementById("chat-messages");
const chatInput = document.getElementById("chat-input");
const chatSendBtn = document.getElementById("chat-send-btn");
const chatCloseBtn = document.getElementById("chat-modal-close");

// Normalizes every timestamp format (number, numeric string, date string,
// Firestore Timestamp, {seconds}, Date) to epoch milliseconds.
function getTimestampMillis(value) {
  if (value === undefined || value === null || value === "") return null;

  if (typeof value === "number") {
    return value;
  }

  if (typeof value === "string") {
    const n = Number(value);
    if (!Number.isNaN(n)) {
      return n;
    }
    const parsed = Date.parse(value);
    return Number.isNaN(parsed) ? null : parsed;
  }

  if (typeof value.toMillis === "function") {
    return value.toMillis();
  }

  if (typeof value.seconds === "number") {
    return value.seconds * 1000 + Math.floor((value.nanoseconds || 0) / 1e6);
  }

  if (value instanceof Date) {
    return value.getTime();
  }

  return null;
}

function getMessageMillis(m) {
  return getTimestampMillis(m && m.timestamp);
}

function formatChatTimestamp(m) {
  const ms = getMessageMillis(m);
  if (!ms) return "Sending…";
  const d = new Date(ms);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const timePart = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  if (sameDay) return timePart;
  return `${d.toLocaleDateString("en-US", { month: "short", day: "numeric" })}, ${timePart}`;
}

function renderChatMessages(messages) {
  if (!messages.length) {
    chatMessagesEl.innerHTML = `<div class="chat-empty-note">No messages yet. Say hello 👋</div>`;
    return;
  }

  chatMessagesEl.innerHTML = messages.map(m => {
    const role = m.senderRole === "admin" ? "admin" : "user";
    const text = (m.text || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return `
      <div class="chat-bubble-row ${role}">
        <div class="chat-bubble">${text}</div>
        <div class="chat-meta">${role === "admin" ? "You" : "User"} · ${formatChatTimestamp(m)}</div>
      </div>
    `;
  }).join("");

  chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
}

// Marks unread user-sent messages as read and zeroes the admin's unread
// counter so the badge clears when the admin opens the thread.
async function markMessagesReadForAdmin(evalId, messages) {
  const unreadFromUser = messages.filter(m => m.senderRole === "user" && m.read === false);

  if (unreadFromUser.length === 0) return;

  try {
    const batch = writeBatch(db);
    unreadFromUser.forEach(m => {
      batch.update(doc(db, CONVERSATIONS_COLLECTION, evalId, "messages", m.id), { read: true });
    });
    batch.update(doc(db, CONVERSATIONS_COLLECTION, evalId), { unreadForAdmin: 0 });
    await batch.commit();
  } catch (err) {
    console.warn("Failed to mark messages as read:", err);
  }
}

function openChatModal(evalId) {
  const e = evaluations.find(item => item.id === evalId);
  if (!e) return;

  activeChatEvalId = evalId;
  chatHeaderTitle.textContent = `💬 ${getEvaluatorName(e)}`;
  chatHeaderSub.textContent = `${e.officeName} · ${e.cleanlinessCategory} Evaluation`;
  chatMessagesEl.innerHTML = `<div class="chat-empty-note">Loading conversation…</div>`;
  chatInput.value = "";

  chatModal.classList.add("open");
  chatInput.focus();

  if (chatMessagesUnsub) {
    chatMessagesUnsub();
    chatMessagesUnsub = null;
  }

  const messagesRef = collection(db, CONVERSATIONS_COLLECTION, evalId, "messages");
  const messagesQuery = query(messagesRef, orderBy("timestamp", "asc"));

  chatMessagesUnsub = onSnapshot(messagesQuery, (snapshot) => {
    const messages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    // Defensive client-side sort (oldest first) on top of the Firestore
    // orderBy, so messages stay in send order even with identical or
    // briefly-null timestamps while a serverTimestamp() write resolves.
    const sortedMessages = messages.slice().sort((a, b) => {
      const tA = getMessageMillis(a);
      const tB = getMessageMillis(b);

      if (tA === null && tB === null) return 0;
      if (tA === null) return 1;
      if (tB === null) return -1;

      return tA - tB;
    });
    renderChatMessages(sortedMessages);
    markMessagesReadForAdmin(evalId, sortedMessages);
  }, (err) => {
    console.error("Failed to load conversation messages:", err);
    chatMessagesEl.innerHTML = `<div class="chat-empty-note">Couldn't load messages.</div>`;
  });
}

function closeChatModal() {
  chatModal.classList.remove("open");
  if (chatMessagesUnsub) {
    chatMessagesUnsub();
    chatMessagesUnsub = null;
  }
  activeChatEvalId = null;
}

chatCloseBtn.addEventListener("click", closeChatModal);

chatModal.addEventListener("click", (ev) => {
  if (ev.target === chatModal) closeChatModal();
});

async function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text || !activeChatEvalId) return;

  const e = evaluations.find(item => item.id === activeChatEvalId);
  if (!e) return;

  chatSendBtn.disabled = true;

  try {
    const convoRef = doc(db, CONVERSATIONS_COLLECTION, activeChatEvalId);

    await setDoc(convoRef, {
      evaluationId: activeChatEvalId,
      userId: e.userId || "",
      officeName: e.officeName || "",
      category: "Cleanliness",
      lastMessage: text,
      lastMessageAt: Date.now(),
      lastSenderRole: "admin",
      unreadForAdmin: 0,
      unreadForUser: increment(1)
    }, { merge: true });

    await addDoc(collection(db, CONVERSATIONS_COLLECTION, activeChatEvalId, "messages"), {
      senderRole: "admin",
      senderId: ADMIN_SENDER_ID,
      text,
      timestamp: Date.now(),
      read: false
    });

    chatInput.value = "";
  } catch (err) {
    console.error("Failed to send message:", err);
    alert("Failed to send message. Please try again.");
  } finally {
    chatSendBtn.disabled = false;
    chatInput.focus();
  }
}

chatSendBtn.addEventListener("click", sendChatMessage);
chatInput.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault();
    sendChatMessage();
  }
});

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Multimedia Feedback | Admin 2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .toolbar-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .toolbar-note {
    font-size: 13px;
    color: #64748b;
    font-family: 'DM Sans', sans-serif;
  }

  .toolbar-filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-select,
  .filter-date,
  .filter-search {
    height: 40px;
    background: #f8fafc;
    border: 1px solid #dbe4ee;
    border-radius: 10px;
    padding: 0 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: #0f172a;
  }

  .filter-search {
    min-width: 200px;
  }

  .btn-sm {
    height: 40px;
    padding: 0 14px;
    border-radius: 10px;
    border: none;
    background: #e2e8f0;
    color: #0f172a;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-sm:hover {
    background: #cbd5e1;
  }

  /* ── Category tabs (Comfort Room / Surroundings) — same pattern as
       Office Management / Evaluation Management ── */
  .category-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .category-tab {
    border: 1px solid #bae6fd;
    background: #ffffff;
    color: #0369a1;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    transition: background .2s, color .2s, transform .2s, border-color .2s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .category-tab:hover {
    border-color: #0284c7;
    transform: translateY(-1px);
  }

  .category-tab.active {
    background: #0284c7;
    border-color: #0284c7;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(2,132,199,.3);
  }

  .category-tab.active[data-category="Surroundings"] {
    background: #16a34a;
    border-color: #16a34a;
    box-shadow: 0 4px 14px rgba(22,163,74,.3);
  }

  .category-tab .tab-count {
    background: rgba(255,255,255,0.35);
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 11px;
  }

  .category-tab:not(.active) .tab-count {
    background: #f1f5f9;
    color: #64748b;
  }

  .category-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .category-pill.comfort-room {
    background: #e0f2fe;
    color: #0369a1;
  }

  .category-pill.surroundings {
    background: #dcfce7;
    color: #15803d;
  }

  /* ─── Summary stat cards — identical to Admin 1's stat-card system ─── */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
    margin-bottom: 24px;
  }

  .stat-card{
    position:relative;
    background:#ffffff;
    border:1px solid #bae6fd;
    border-top:4px solid var(--accent3, #2563eb);
    border-radius:16px;
    padding:20px 20px 22px;
    box-shadow:0 4px 14px rgba(15,23,42,0.05);
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .stat-card.blue{ border-top-color:#2563eb; }
  .stat-card.green{ border-top-color:#2563eb; }

  .stat-icon{
    position:absolute;
    top:18px;
    right:18px;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }

  .stat-label{
    font-family:'DM Sans',sans-serif;
    font-size:13px;
    font-weight:500;
    color:#64748b;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .stat-value{
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:30px;
    color:#0f172a;
    line-height:1.1;
    overflow-wrap:anywhere;
  }

  .stat-sub{
    font-family:'DM Sans',sans-serif;
    font-size:12px;
    color:#94a3b8;
  }

  @media (max-width: 1200px) {
    .stat-value {
      font-size: 30px;
    }
  }

  @media (max-width: 1024px) {
    .stat-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 900px) {
    .stat-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 768px) {
    .stat-grid {
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
  }

  @media (max-width: 600px) {
    .stat-card {
      padding: 16px 16px 18px;
    }
    .stat-value {
      font-size: 26px;
    }
    .stat-icon {
      width: 32px;
      height: 32px;
      font-size: 14px;
      top: 14px;
      right: 14px;
    }
  }

  @media (max-width: 480px) {
    .stat-grid {
      grid-template-columns: 1fr;
    }
    .stat-value {
      font-size: 28px;
    }
  }

  @media (max-width: 360px) {
    .stat-grid {
      gap: 10px;
    }
    .stat-card {
      padding: 14px 14px 18px;
    }
  }

  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .media-thumb {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
    display: flex;
    flex-direction: column;
  }

  .media-thumb:hover {
    box-shadow: 0 8px 20px rgba(15, 27, 50, 0.10);
    transform: translateY(-2px);
  }

  .media-thumb-visual {
    position: relative;
    width: 100%;
    height: 120px;
    background: #0f172a;
  }

  .media-thumb-visual img,
  .media-thumb-visual video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .media-tag {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(15, 23, 42, 0.75);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .media-thumb-body {
    padding: 10px 12px 12px;
    font-family: 'DM Sans', sans-serif;
  }

  .media-office {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .media-office-name {
    font-size: 13px;
    font-weight: 700;
    color: #0f172a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .media-date {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
  }

  .empty-media {
    text-align: center;
    padding: 60px 20px;
    color: #94a3b8;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    grid-column: 1 / -1;
  }

  .limits-note {
    margin-top: 24px;
    font-size: 12px;
    color: #94a3b8;
    font-family: 'DM Sans', sans-serif;
  }

  /* Media viewer modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 27, 50, 0.65);
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .media-modal-content {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 560px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(15, 27, 50, 0.2);
    max-height: 88vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .media-modal-visual {
    width: 100%;
    max-height: 380px;
    border-radius: 12px;
    overflow: hidden;
    background: #0f172a;
    margin-bottom: 16px;
  }

  .media-modal-visual img,
  .media-modal-visual video {
    width: 100%;
    max-height: 380px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .modal-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f1f5f9;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: #334155;
    gap: 12px;
  }

  .modal-row:last-of-type {
    border-bottom: none;
  }

  .modal-row span:first-child {
    color: #94a3b8;
    font-weight: 600;
    min-width: 100px;
  }

  .modal-row span:last-child {
    word-break: break-word;
    text-align: right;
  }

  .media-modal-footer {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-primary {
    flex: 1;
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary:hover {
    background: #1d4ed8;
  }

  .btn-secondary {
    flex: 1;
    background: #e2e8f0;
    color: #0f172a;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-secondary:hover {
    background: #cbd5e1;
  }

  @media (max-width: 768px) {
    .toolbar-row {
      flex-direction: column;
      align-items: flex-start;
    }
    .toolbar-filters {
      width: 100%;
    }
    .filter-search {
      flex: 1;
      min-width: 0;
    }
  }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <main class="main fade-in">
    <div id="topbar-mount"></div>

    <div style="margin-top: 28px;">

      <div class="stat-grid">
        <div class="stat-card blue">
          <div class="stat-icon">🗂️</div>
          <div class="stat-label">Total Files</div>
          <div class="stat-value" id="stat-total-files">0</div>
          <div class="stat-sub" id="stat-total-files-sub">All Evidence</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">📷</div>
          <div class="stat-label">Images</div>
          <div class="stat-value" id="stat-total-images">0</div>
          <div class="stat-sub">Photos Submitted</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">🎥</div>
          <div class="stat-label">Videos</div>
          <div class="stat-value" id="stat-total-videos">0</div>
          <div class="stat-sub">Clips Submitted</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon">🏢</div>
          <div class="stat-label">Offices</div>
          <div class="stat-value" id="stat-total-offices">0</div>
          <div class="stat-sub">With Evidence</div>
        </div>
      </div>

      <!-- Category tabs: cleanliness evaluations are split into Comfort
           Room and Surroundings (separate office lists + separate
           Firestore subtree per the Android app). Switching tabs filters
           the stats, the office dropdown, and the media grid to just
           that category's evidence. -->
      <div class="category-tabs" id="category-tabs">
        <button class="category-tab active" data-category="all">All Categories <span class="tab-count" id="cat-count-all">0</span></button>
        <button class="category-tab" data-category="Comfort Room"> Comfort Room <span class="tab-count" id="cat-count-comfort">0</span></button>
        <button class="category-tab" data-category="Surroundings"> Surroundings <span class="tab-count" id="cat-count-surroundings">0</span></button>
      </div>

      <div class="toolbar-row">
        <div class="toolbar-note">User-submitted photos and videos as evaluation evidence</div>
        <div class="toolbar-filters">
          <input type="text" id="media-search" class="filter-search" placeholder="Search by office…">
          <select id="office-filter" class="filter-select">
            <option value="">All Offices</option>
          </select>
          <select id="type-filter" class="filter-select">
            <option value="">All Types</option>
            <option value="image">Images Only</option>
            <option value="video">Videos Only</option>
          </select>
          <input type="date" id="date-filter" class="filter-date">
          <button class="btn-sm" id="btn-clear-filters">Clear</button>
        </div>
      </div>

      <div class="media-grid" id="media-grid">
        <div class="empty-media">Loading evidence…</div>
      </div>

      <div class="limits-note">
        File limits: Images (.png, .jpg, .jpeg) max 10 MB &nbsp;·&nbsp; Videos max 60 MB &nbsp;·&nbsp; Comments: 1–300 words
      </div>

    </div>
  </main>
</div>

<!-- MEDIA VIEWER MODAL -->
<div class="modal-overlay" id="media-modal">
  <div class="media-modal-content">
    <div class="media-modal-visual" id="media-modal-visual"></div>
    <div id="media-modal-body"></div>
    <div class="media-modal-footer">
      <button class="btn-secondary" id="media-modal-close">Close</button>
      <a class="btn-primary" id="media-modal-open-new" href="#" target="_blank" rel="noopener" style="text-align:center; text-decoration:none;">Open Full Size</a>
    </div>
  </div>
</div>

<script src="shared.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",
  authDomain: "kristal-adb78.firebaseapp.com",
  projectId: "kristal-adb78",
  storageBucket: "kristal-adb78.firebasestorage.app",
  messagingSenderId: "1016283938031",
  appId: "1:1016283938031:web:54c4d13409d9784ad7af1a",
  measurementId: "G-LK8D1CBQ2J"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('sidebar-mount').innerHTML = buildSidebar('admin2', 'multimedia');
document.getElementById('topbar-mount').innerHTML = buildTopbar('Multimedia Feedback', 'admin2');

// ======================
// FIRESTORE COLLECTION NAME / SCHEMA CONSTANTS
// (matches Evaluation Management / Office Management exactly)
// ======================
// Read from the flat evaluation_history mirror instead of the raw nested
// cleanliness_evaluations tree — same source Evaluation Management and
// Office Management read from — so evidence shown here (and the counts
// on the category tabs) always match those pages, including status
// edits/deletes made there (deletes remove from this mirror too).
const EVAL_HISTORY_COLLECTION = "evaluation_history";

// Each cleanliness category (Comfort Room / Surroundings) is tagged on
// every evaluation_history record via "cleanlinessCategory", written by
// ComfortRoomEvalActivity / SurroundingsEvalActivity respectively.
const CLEANLINESS_CATEGORIES = ["Comfort Room", "Surroundings"];
const DEFAULT_CATEGORY = "Comfort Room"; // fallback for any legacy record saved before cleanlinessCategory existed

// ======================
// STATE
// ======================
let evaluations = [];       // raw evaluation_history records (with category)
let mediaItems = [];        // flattened: one entry per image/video across all evaluations
let searchTerm = "";
let officeFilter = "";
let typeFilter = "";
let dateFilter = "";
let categoryFilter = "all"; // "all" | "Comfort Room" | "Surroundings"

// ======================
// HELPERS
// ======================

// Same normalization used on the Evaluation Management page: supports
// the current multi-file Android schema (evidenceUrls[]/evidenceTypes[]),
// the earlier single-file schema (evidenceUrl/evidenceType), and the
// original fileUrl-only schema (type guessed from extension).
function parseEvidence(data) {
  const items = [];

  if (Array.isArray(data.evidenceUrls) && data.evidenceUrls.length) {
    const urls = data.evidenceUrls;
    const types = Array.isArray(data.evidenceTypes) ? data.evidenceTypes : [];
    urls.forEach((url, i) => {
      if (url) items.push({ url, type: types[i] === "video" ? "video" : "image" });
    });
    return items;
  }

  if (data.evidenceUrl) {
    items.push({ url: data.evidenceUrl, type: data.evidenceType === "video" ? "video" : "image" });
    return items;
  }

  if (data.fileUrl) {
    const isVideo = /\.(mp4|mov|webm|mkv|avi)(\?|$)/i.test(data.fileUrl);
    items.push({ url: data.fileUrl, type: isVideo ? "video" : "image" });
    return items;
  }

  return items;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function categoryPillHtml(category) {
  const cls = category === "Surroundings" ? "surroundings" : "comfort-room";
  const icon = category === "Surroundings" ? "🌳" : "🚻";
  return `<span class="category-pill ${cls}">${icon} ${escapeHtml(category)}</span>`;
}

// ======================
// LOAD EVALUATIONS (real-time — new Android submissions with evidence
// appear here automatically, no refresh needed)
// ======================
const evalCollectionRef = collection(db, EVAL_HISTORY_COLLECTION);
const evalQuery = query(evalCollectionRef, orderBy("timestamp", "desc"));

onSnapshot(evalQuery, (snapshot) => {
  evaluations = [];
  mediaItems = [];

  snapshot.forEach((doc) => {
    const data = doc.data();
    const officeName = data.officeName || "Unknown Office";
    const timestamp = Number(data.timestamp) || 0;
    const comments = data.comments || "";
    const evidence = parseEvidence(data);

    const rawCategory = data.cleanlinessCategory;
    const category = CLEANLINESS_CATEGORIES.includes(rawCategory) ? rawCategory : DEFAULT_CATEGORY;

    evaluations.push({ id: doc.id, officeName, timestamp, category });

    evidence.forEach((item, index) => {
      mediaItems.push({
        evalId: doc.id,
        url: item.url,
        type: item.type,
        officeName,
        timestamp,
        comments,
        category,
        index
      });
    });
  });

  populateOfficeFilter();
  renderMediaGrid();
});

// ======================
// CATEGORY TABS
// ======================
document.getElementById("category-tabs").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".category-tab");
  if (!btn) return;
  categoryFilter = btn.getAttribute("data-category");
  document.querySelectorAll(".category-tab").forEach(t => t.classList.toggle("active", t === btn));
  officeFilter = ""; // switching category invalidates the previously selected office
  document.getElementById("office-filter").value = "";
  populateOfficeFilter();
  renderMediaGrid();
});

// ======================
// FILTER DROPDOWN (scoped to the active category tab)
// ======================
function mediaForCategory(category) {
  return mediaItems.filter(m => category === "all" ? true : m.category === category);
}

function populateOfficeFilter() {
  const select = document.getElementById("office-filter");
  const currentValue = select.value;

  const offices = [...new Set(mediaForCategory(categoryFilter).map(m => m.officeName))].sort();
  select.innerHTML = ['<option value="">All Offices</option>']
    .concat(offices.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`))
    .join("");

  select.value = currentValue;
}

// ======================
// FILTERING
// ======================
function getFilteredMedia() {
  const term = searchTerm.trim().toLowerCase();

  return mediaForCategory(categoryFilter).filter(m => {
    if (officeFilter && m.officeName !== officeFilter) return false;
    if (typeFilter && m.type !== typeFilter) return false;
    if (term && !m.officeName.toLowerCase().includes(term)) return false;

    if (dateFilter) {
      const itemDate = m.timestamp ? new Date(m.timestamp).toISOString().slice(0, 10) : "";
      if (itemDate !== dateFilter) return false;
    }

    return true;
  }).sort((a, b) => b.timestamp - a.timestamp);
}

// ======================
// RENDER GRID
// ======================
function renderMediaGrid() {
  // Category tab counts always reflect ALL evaluation records (not media
  // items, and unfiltered by the other filters), so the tabs read as a
  // stable overview — matches Evaluation Management.
  document.getElementById("cat-count-all").textContent = evaluations.length;
  document.getElementById("cat-count-comfort").textContent = evaluations.filter(e => e.category === "Comfort Room").length;
  document.getElementById("cat-count-surroundings").textContent = evaluations.filter(e => e.category === "Surroundings").length;

  // Stats reflect the active category tab
  const categoryScoped = mediaForCategory(categoryFilter);
  const totalImages = categoryScoped.filter(m => m.type === "image").length;
  const totalVideos = categoryScoped.filter(m => m.type === "video").length;
  const distinctOffices = new Set(categoryScoped.map(m => m.officeName));

  document.getElementById("stat-total-files").textContent = categoryScoped.length;
  document.getElementById("stat-total-files-sub").textContent = categoryFilter === "all" ? "All Evidence" : categoryFilter;
  document.getElementById("stat-total-images").textContent = totalImages;
  document.getElementById("stat-total-videos").textContent = totalVideos;
  document.getElementById("stat-total-offices").textContent = distinctOffices.size;

  const grid = document.getElementById("media-grid");
  const filtered = getFilteredMedia();

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-media">No matching evidence found.</div>`;
    return;
  }

  grid.innerHTML = filtered.map((m, i) => {
    const date = m.timestamp
      ? new Date(m.timestamp).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
      : "-";

    const visual = m.type === "video"
      ? `<video src="${m.url}" muted></video>`
      : `<img src="${m.url}" alt="Evidence" loading="lazy">`;

    return `
      <div class="media-thumb" data-media-index="${i}">
        <div class="media-thumb-visual">
          ${visual}
          <span class="media-tag">${m.type === "video" ? "Video" : "Image"}</span>
        </div>
        <div class="media-thumb-body">
          <div class="media-office">
            <span class="media-office-name">${escapeHtml(m.officeName)}</span>
            ${categoryPillHtml(m.category)}
          </div>
          <div class="media-date">${date}</div>
        </div>
      </div>
    `;
  }).join("");

  // Store the filtered list on a module-level variable so click handlers
  // can look items up by index.
  currentFilteredMedia = filtered;

  grid.querySelectorAll(".media-thumb").forEach(el => {
    el.addEventListener("click", () => {
      const idx = Number(el.getAttribute("data-media-index"));
      openMediaModal(currentFilteredMedia[idx]);
    });
  });
}

let currentFilteredMedia = [];

// ======================
// FILTER EVENT LISTENERS
// ======================
document.getElementById("media-search").addEventListener("input", (ev) => {
  searchTerm = ev.target.value;
  renderMediaGrid();
});

document.getElementById("office-filter").addEventListener("change", (ev) => {
  officeFilter = ev.target.value;
  renderMediaGrid();
});

document.getElementById("type-filter").addEventListener("change", (ev) => {
  typeFilter = ev.target.value;
  renderMediaGrid();
});

document.getElementById("date-filter").addEventListener("change", (ev) => {
  dateFilter = ev.target.value;
  renderMediaGrid();
});

document.getElementById("btn-clear-filters").addEventListener("click", () => {
  searchTerm = "";
  officeFilter = "";
  typeFilter = "";
  dateFilter = "";
  document.getElementById("media-search").value = "";
  document.getElementById("office-filter").value = "";
  document.getElementById("type-filter").value = "";
  document.getElementById("date-filter").value = "";
  renderMediaGrid();
});

// ======================
// MEDIA VIEWER MODAL
// ======================
const mediaModal = document.getElementById("media-modal");
const mediaModalVisual = document.getElementById("media-modal-visual");
const mediaModalBody = document.getElementById("media-modal-body");
const mediaModalOpenNew = document.getElementById("media-modal-open-new");

function openMediaModal(m) {
  if (!m) return;

  const date = m.timestamp ? new Date(m.timestamp).toLocaleString() : "-";

  mediaModalVisual.innerHTML = m.type === "video"
    ? `<video src="${m.url}" controls autoplay></video>`
    : `<img src="${m.url}" alt="Evidence">`;

  mediaModalBody.innerHTML = `
    <div class="modal-row"><span>Office</span><span>${escapeHtml(m.officeName)}</span></div>
    <div class="modal-row"><span>Category</span><span>${categoryPillHtml(m.category)}</span></div>
    <div class="modal-row"><span>Type</span><span>${m.type === "video" ? "Video" : "Image"}</span></div>
    <div class="modal-row"><span>Submitted</span><span>${date}</span></div>
    <div class="modal-row"><span>Comments</span><span>${escapeHtml(m.comments) || "-"}</span></div>
  `;

  mediaModalOpenNew.href = m.url;
  mediaModal.classList.add("open");
}

document.getElementById("media-modal-close").addEventListener("click", closeMediaModal);
mediaModal.addEventListener("click", (ev) => {
  if (ev.target === mediaModal) closeMediaModal();
});

function closeMediaModal() {
  mediaModal.classList.remove("open");
  mediaModalVisual.innerHTML = ""; // stop video playback
}

</script>
</body>
</html>

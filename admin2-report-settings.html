<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Report Settings | Admin 2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* settings form */
#rsCard{background:#fff;border:1px solid #bae6fd;border-radius:14px;padding:18px;margin-bottom:18px;font-family:'DM Sans',sans-serif}
#rsCard .rs-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#rsCard .rs-title{font-size:16px;font-weight:700;color:#0f172a}
#rsCard .rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
#rsCard .rs-grid>*{min-width:0}
#rsCard h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:#64748b}
#rsCard label{display:block;font-size:12px;font-weight:600;color:#475569;margin:10px 0 4px}
#rsCard input[type=text],#rsCard select,#rsCard textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #dbe4ee;border-radius:10px;background:#f8fafc;font-family:'DM Sans',sans-serif;font-size:14px;color:#0f172a}
#rsCard textarea{min-height:70px;resize:vertical}
#rsCard .rs-img{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#rsCard .rs-img img{max-width:90px;max-height:44px;border:1px solid #e2e8f0;border-radius:6px;background:#fff}
#rsCard .rs-btn{padding:10px 16px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-family:'DM Sans',sans-serif;font-size:14px}
#rsCard .rs-gray{background:#e2e8f0;color:#475569}#rsCard .rs-green{background:#16a34a;color:#fff}#rsCard .rs-purple{background:#7c3aed;color:#fff}
#rsCard .rs-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#rsCard .rs-preview{background:#f1f5f9;border-radius:12px;padding:14px;position:sticky;top:12px;overflow:hidden}
#rsCard .rs-preview .cvr-page{min-height:0;max-width:100%}
#rsCard .rs-note{font-size:12px;color:#94a3b8;margin:6px 0 0}
@media(max-width:1100px){#rsCard .rs-grid{grid-template-columns:1fr}}

/* report header/footer look (same as the reports page) */
.cvr-page{display:flex;flex-direction:column;width:100%;max-width:var(--page-width,210mm);min-height:var(--page-height,297mm);margin:0 auto;box-sizing:border-box;background:#fff;font-family:'Times New Roman',Times,serif;color:#000;line-height:1.6;box-shadow:0 1px 3px rgba(15,23,42,.10),0 1px 2px rgba(15,23,42,.06);border:1px solid #e2e8f0}
.cvr-page-header{width:100%;flex:0 0 auto}
.cvr-page-content{width:100%;flex:0 1 auto}
.cvr-page-footer{width:100%;flex:0 0 auto;margin-top:auto}
.cvr-inner-header,.cvr-inner-content,.cvr-inner-footer{width:100%;box-sizing:border-box;padding-left:var(--cvr-margin-x,15mm);padding-right:var(--cvr-margin-x,15mm)}
.cvr-inner-header{padding-top:var(--cvr-header-pad-top,4mm);padding-bottom:0}
.cvr-inner-content{padding-top:0;padding-bottom:0}
.cvr-inner-footer{padding-top:var(--cvr-footer-pad-y,6mm);padding-bottom:var(--cvr-footer-pad-y,6mm)}
.cvr-inner-footer .official-footer{margin-top:0;padding-top:0}
.cvr-inner-footer .official-signatures{margin-top:0;margin-bottom:10px}

.lh-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.lh-logo-box,.lh-seal-box{flex-shrink:0;display:flex;align-items:center;justify-content:center}
.lh-logo-box{width:var(--lh-logo-w,33mm);height:var(--lh-logo-h,20mm)}
.lh-seal-box{width:var(--lh-seal-w,26mm);height:var(--lh-seal-h,22.5mm)}
.lh-logo-box img,.lh-seal-box img{width:100%;height:100%;object-fit:contain}
.lh-text{flex:1;text-align:center;line-height:1.3}
.lh-text .rep{font-family:'Times New Roman',Times,serif;font-size:10pt;color:#000}
.lh-text .uni{font-family:'Times New Roman',Times,serif;font-size:11.5pt;font-weight:bold;color:#0f172a}
.lh-text .dept{font-family:Arial,Helvetica,sans-serif;font-size:11pt;font-weight:bold;text-transform:uppercase;color:#1f4e9c}
.lh-text .addr{font-family:Arial,Helvetica,sans-serif;font-size:7.5pt;color:#222}
.lh-divider{border:none;border-top:2px solid #1f4e9c;margin:3px 0 8px}
.official-title{text-align:center;font-size:11.5pt;font-weight:bold;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.official-signatures{display:flex;gap:40px;margin-top:35px;font-size:10pt}
.sig-block{flex:1}
.sig-label{color:#555;font-size:11pt;margin-bottom:30px}
.sig-name{font-weight:bold;text-transform:uppercase;padding-top:4px;display:inline-block}
.sig-title{font-size:11pt;font-style:italic;color:#333;margin-top:2px}
.official-footer{margin-top:20px;padding-top:8px;display:block;width:100%}
.official-footer img{display:block;width:100%;height:auto;object-fit:contain}
/* ================= HOVER + DESIGN POLISH ================= */

@keyframes cvRise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
#rsCard {
  animation: cvRise .5s cubic-bezier(.2,.7,.2,1) backwards;
  box-shadow: 0 4px 14px rgba(15,23,42,.05);
  transition: box-shadow .25s ease, border-color .25s ease;
}
#rsCard:hover {
  border-color: #7dd3fc;
  box-shadow: 0 12px 28px rgba(15,23,42,.08);
}

/* Section headings */
#rsCard h4 {
  font-family: 'Syne', sans-serif;
  padding-left: 10px;
  border-left: 3px solid #2563eb;
}

/* Labels react when their field is focused */
#rsCard label { transition: color .2s ease; }
#rsCard label:has(+ input:focus),
#rsCard label:has(+ textarea:focus),
#rsCard label:has(+ select:focus) { color: #2563eb; }

/* Inputs */
#rsCard input[type=text], #rsCard select, #rsCard textarea {
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
#rsCard input[type=text]:hover, #rsCard select:hover, #rsCard textarea:hover { border-color: #7dd3fc; }
#rsCard input[type=text]:focus, #rsCard select:focus, #rsCard textarea:focus {
  background: #ffffff;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  outline: none;
}
#rsCard select { cursor: pointer; }

/* Image upload rows */
#rsCard .rs-img img {
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
#rsCard .rs-img img:hover {
  transform: scale(1.08);
  border-color: #7dd3fc;
  box-shadow: 0 6px 14px rgba(15,23,42,.15);
}
#rsCard .rs-img input[type=file] { font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; }
#rsCard .rs-img input[type=file]::file-selector-button {
  border: none;
  border-radius: 8px;
  padding: 7px 12px;
  margin-right: 10px;
  background: #dbeafe;
  color: #1e40af;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: background .2s ease, box-shadow .2s ease;
}
#rsCard .rs-img input[type=file]::file-selector-button:hover {
  background: #bfdbfe;
  box-shadow: 0 3px 10px rgba(37,99,235,.2);
}

/* Buttons */
#rsCard .rs-btn {
  transition: background .2s ease, box-shadow .2s ease, transform .2s ease, color .2s ease;
}
#rsCard .rs-btn:hover { transform: translateY(-2px); }
#rsCard .rs-btn:active { transform: translateY(0); }
#rsCard .rs-green { box-shadow: 0 4px 12px rgba(22,163,74,.25); }
#rsCard .rs-green:hover { background: #15803d; box-shadow: 0 8px 18px rgba(22,163,74,.35); }
#rsCard .rs-purple { box-shadow: 0 4px 12px rgba(124,58,237,.25); }
#rsCard .rs-purple:hover { background: #6d28d9; box-shadow: 0 8px 18px rgba(124,58,237,.35); }
#rsCard .rs-gray:hover { background: #dbeafe; color: #1e40af; box-shadow: 0 6px 14px rgba(37,99,235,.15); }
#rsCard .rs-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }

/* Live preview panel (not the paper inside it) */
#rsCard .rs-preview {
  border: 1px solid #e2e8f0;
  box-shadow: inset 0 1px 3px rgba(15,23,42,.05);
  transition: border-color .25s ease, box-shadow .25s ease;
}
#rsCard .rs-preview:hover {
  border-color: #7dd3fc;
  box-shadow: inset 0 1px 3px rgba(15,23,42,.05), 0 8px 20px rgba(15,23,42,.08);
}

/* Footer note */
#rsCard .rs-note { font-style: italic; }

/* Accessibility: reduced motion */
@media (prefers-reduced-motion: reduce) {
  #rsCard { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <main class="main fade-in">
    <div id="topbar-mount"></div>

    <div id="rsCard">
      <div class="rs-head">
        <button class="rs-btn rs-gray" id="rsBack" type="button">← Back to Reports</button>
      </div>

      <div class="rs-grid">
        <div id="rsForm"></div>
        <div>
          <h4 style="margin-top:0">Live preview</h4>
          <div class="rs-preview"><div class="cvr-page">
            <div class="cvr-page-header"><div class="cvr-inner-header" id="rsPvH"></div></div>
            <div class="cvr-page-content"><div class="cvr-inner-content" id="rsPvS"></div></div>
            <div class="cvr-page-footer"><div class="cvr-inner-footer" id="rsPvF"></div></div>
          </div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="shared.js"></script>

<!-- 1) Initialize Firebase FIRST (the core module below uses getApp()) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
initializeApp({
  apiKey: "AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",
  authDomain: "kristal-adb78.firebaseapp.com",
  projectId: "kristal-adb78",
  storageBucket: "kristal-adb78.firebasestorage.app",
  messagingSenderId: "1016283938031",
  appId: "1:1016283938031:web:54c4d13409d9784ad7af1a",
  measurementId: "G-LK8D1CBQ2J"
});
</script>

<!-- 2) Settings editor -->
<script type="module">
import { GROUPS, ALL, DEFAULTS, curRef, defRef, headerHtml, footerHtml, signaturesHtml }
  from "./admin2-report-settings.js";
import { getFirestore, getDoc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

getFirestore(getApp());
const $ = id => document.getElementById(id);

document.getElementById("sidebar-mount").innerHTML = buildSidebar("admin2", "reports");
document.getElementById("topbar-mount").innerHTML  = buildTopbar("Report Settings", "admin2");

let draft = {};
let formDirty = false;

/* ---------- build the form ---------- */
$("rsForm").innerHTML =
  GROUPS.map(g => `<h4>${g.title} settings</h4>` + g.fields.map(f => `
    <label for="rs_${f.k}">${f.l}</label>` + (
    f.t === "text"  ? `<input type="text" id="rs_${f.k}" data-k="${f.k}">` :
    f.t === "area"  ? `<textarea id="rs_${f.k}" data-k="${f.k}"></textarea>` :
    f.t === "align" ? `<select id="rs_${f.k}" data-k="${f.k}"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>` :
    `<div class="rs-img"><img id="rs_${f.k}_img" style="display:none"><input type="file" accept="image/*" data-img="${f.k}" data-max="${f.max}"><button class="rs-btn rs-gray" type="button" data-clear="${f.k}">Remove</button></div>`
  )).join("")).join("") + `
  <div class="rs-actions">
    <button class="rs-btn rs-green"  id="rsSave" type="button">💾 Save Changes</button>
    <button class="rs-btn rs-gray"   id="rsReset" type="button">↺ Reset to Default</button>
    <button class="rs-btn rs-purple" id="rsSaveDefault" type="button">⭐ Save as Default</button>
  </div>
  <p class="rs-note">Saved to Firebase and used by the preview, print, PDF export and all reports.</p>`;

function fillForm() {
  ALL.forEach(f => {
    if (f.t === "image") {
      const img = $(`rs_${f.k}_img`);
      img.src = draft[f.k] || ""; img.style.display = draft[f.k] ? "block" : "none";
    } else $(`rs_${f.k}`).value = draft[f.k] ?? (f.t === "align" ? "center" : "");
  });
  livePreview();
}
function livePreview() {
  $("rsPvH").innerHTML = headerHtml(draft, "reportTitle");
  $("rsPvS").innerHTML = "";
  // Signatures live in the footer (same as Admin 1): Prepared by / Noted by, then the footer image
  $("rsPvF").innerHTML = signaturesHtml(draft) + footerHtml(draft);
}

/* ---------- load from Firestore (does not overwrite unsaved edits) ---------- */
onSnapshot(curRef, snap => {
  if (formDirty) return;
  draft = snap.exists() ? { ...DEFAULTS, ...snap.data() } : { ...DEFAULTS };
  fillForm();
}, err => alert("Could not load report settings: " + err.message));

/* ---------- editing ---------- */
const card = $("rsCard");
card.addEventListener("input", e => {
  const k = e.target.dataset.k; if (!k) return;
  draft[k] = e.target.value; formDirty = true; livePreview();
});
card.addEventListener("change", async e => {
  const k = e.target.dataset.img; if (!k || !e.target.files[0]) return;
  try {
    draft[k] = await fileToDataUrl(e.target.files[0], +e.target.dataset.max || 400);
    formDirty = true; fillForm();
  } catch { alert("Could not read that image."); }
});
card.addEventListener("click", e => {
  const k = e.target.dataset.clear; if (!k) return;
  draft[k] = ""; formDirty = true; fillForm();
});

function fileToDataUrl(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", 0.8));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const payload = () => { const o = {}; ALL.forEach(f => o[f.k] = draft[f.k] ?? ""); o.updatedAt = new Date().toISOString(); return o; };
const tooBig = p => JSON.stringify(p).length > 900000;   // Firestore documents max out at 1 MiB

$("rsSave").onclick = async () => {
  const p = payload();
  if (tooBig(p)) { alert("❌ The images are too large. Please use smaller images."); return; }
  try { await setDoc(curRef, p); formDirty = false; alert("✅ Header & footer settings saved."); }
  catch (err) { alert("❌ Failed to save: " + err.message); }
};
$("rsSaveDefault").onclick = async () => {
  if (!confirm("Use the current form values as the default that “Reset to Default” restores?")) return;
  const p = payload();
  if (tooBig(p)) { alert("❌ The images are too large. Please use smaller images."); return; }
  try { await setDoc(defRef, p); alert("✅ Default saved."); }
  catch (err) { alert("❌ Failed to save default: " + err.message); }
};
$("rsReset").onclick = async () => {
  try {
    const snap = await getDoc(defRef);
    if (!confirm("Replace the current settings with the default?")) return;
    draft = snap.exists() ? { ...DEFAULTS, ...snap.data() } : { ...DEFAULTS };
    await setDoc(curRef, payload()); formDirty = false; fillForm();
  } catch (err) { alert("❌ Failed to reset: " + err.message); }
};

/* ---------- back to reports ---------- */
$("rsBack").onclick = () => {
  if (formDirty && !confirm("You have unsaved changes. Leave without saving?")) return;
  formDirty = false;
  window.location.href = "admin2-reports.html";
};
window.addEventListener("beforeunload", e => { if (formDirty) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>

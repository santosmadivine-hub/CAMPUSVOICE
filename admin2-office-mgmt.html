<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Office Management | Admin 2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ── Office Management Page Styles ── */
.office-section {
  max-width: 1200px;
  margin: 0 auto;
}

/* Row that holds the search box + Add Office button side by side */
.search-add-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.search-input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #bae6fd;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
  box-sizing: border-box;
  color: #1e293b;
  flex: 1;
  min-width: 0;
}
.search-input:focus { border-color: #0284c7; }
.search-input::placeholder { color: #94a3b8; }

/* ── Category tabs (Comfort Room / Surroundings) ── */
.category-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.category-tab {
  border: 1px solid #bae6fd;
  background: #ffffff;
  color: #0369a1;
  padding: 9px 16px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  transition: background .2s, color .2s, transform .2s, border-color .2s;
  white-space: nowrap;
}

.category-tab:hover {
  border-color: #0284c7;
  transform: translateY(-1px);
}

.category-tab.active {
  background: #0284c7;
  border-color: #0284c7;
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(2,132,199,.3);
}

.category-tab.active[data-category="Surroundings"] {
  background: #16a34a;
  border-color: #16a34a;
  box-shadow: 0 4px 14px rgba(22,163,74,.3);
}

/* Office table */
.office-table-wrap {
  max-height: 600px;
  overflow-y: auto;
  border-radius: 12px;
  border: 1px solid #bae6fd;
}
.office-table-wrap::-webkit-scrollbar { width: 6px; }
.office-table-wrap::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 999px; }
.office-table-wrap::-webkit-scrollbar-track { background: transparent; }

.office-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

.office-table th {
  text-align: left;
  padding: 14px 16px;
  font-size: 11px;
  color: #475569;
  letter-spacing: .06em;
  text-transform: uppercase;
  border-bottom: 2px solid #bae6fd;
  background: #f0f9ff;
  position: sticky;
  top: 0;
  font-weight: 700;
}

.office-table td {
  padding: 14px 16px;
  border-bottom: 1px solid #f0f9ff;
  font-size: 14px;
  color: #1e293b;
}

.office-table tr:hover td {
  background: #f0f9ff;
}

.rating-cell {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 220px;
}

.rating-track {
  flex: 1;
  height: 8px;
  background: #bae6fd;
  border-radius: 999px;
  overflow: hidden;
  min-width: 130px;
}

.rating-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg,#0284c7,#0ea5e9);
  transition: width .6s ease;
}

.rating-number {
  font-weight: 700;
  color: #0c4a6e;
  width: 34px;
  flex-shrink: 0;
  text-align: right;
}

.eval-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  padding: 4px 10px;
  background: #e0f2fe;
  color: #0c4a6e;
  font-weight: 700;
  font-size: 13px;
  border-radius: 999px;
}

.action-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.action-btn {
  border: none;
  padding: 7px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  transition: opacity .2s, transform .2s;
}

.action-btn:hover {
  opacity: .85;
  transform: translateY(-1px);
}

.view-btn {
  background: #dbeafe;
  color: #1e40af;
}

.edit-btn {
  background: linear-gradient(160deg, #fef9e7 0%, #fef3c7 100%);
  color: #92400e;
  border: 1px solid #fde68a;
  box-shadow: 0 1px 2px rgba(146,64,14,.08);
}

.action-btn.edit-btn:hover {
  opacity: 1;
  background: linear-gradient(160deg, #fef3c7 0%, #fde68a 100%);
  border-color: #fbbf24;
  box-shadow: 0 3px 10px rgba(146,64,14,.2);
  transform: translateY(-1px);
}

.action-btn.edit-btn:active {
  transform: translateY(0);
  box-shadow: 0 1px 2px rgba(146,64,14,.15);
}

.action-btn.edit-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(217,119,6,.2), 0 1px 2px rgba(146,64,14,.15);
}

.delete-btn {
  background: #fee2e2;
  color: #991b1b;
}

.action-view { background: #dbeafe; color: #1e40af; }
.action-edit { background: linear-gradient(160deg, #fef9e7 0%, #fef3c7 100%); color: #92400e; border: 1px solid #fde68a; box-shadow: 0 1px 2px rgba(146,64,14,.08); }
.action-edit:hover { opacity: 1; background: linear-gradient(160deg, #fef3c7 0%, #fde68a 100%); border-color: #fbbf24; box-shadow: 0 3px 10px rgba(146,64,14,.2); transform: translateY(-1px); }
.action-delete { background: #fee2e2; color: #991b1b; }

.primary-btn {
  border: 1px solid rgba(255,255,255,.12);
  background: linear-gradient(160deg, #0ea5e9 0%, #0284c7 55%, #0369a1 100%);
  color: white;
  padding: 11px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  letter-spacing: .01em;
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 4px 12px rgba(2,132,199,.28), 0 1px 2px rgba(2,132,199,.35);
  transition: background .25s ease, box-shadow .2s ease, transform .15s ease;
  white-space: nowrap;
  flex-shrink: 0;
}

.primary-btn:hover {
  background: linear-gradient(160deg, #38bdf8 0%, #0369a1 55%, #075985 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 8px 20px rgba(2,132,199,.35), 0 2px 4px rgba(2,132,199,.4);
  transform: translateY(-1.5px);
}

.primary-btn:active {
  transform: translateY(0);
  box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 2px 6px rgba(2,132,199,.3);
}

.primary-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(2,132,199,.25), 0 4px 12px rgba(2,132,199,.28);
}

.no-results {
  padding: 40px 20px;
  text-align: center;
  color: #64748b;
  font-size: 14px;
}

/* ─── Stat cards — identical to Admin 1's Office Management page ─── */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
  margin-bottom: 24px;
}

.stat-card{
  position:relative;
  background:#ffffff;
  border:1px solid #bae6fd;
  border-top:4px solid var(--accent3, #2563eb);
  border-radius:16px;
  padding:20px 20px 22px;
  box-shadow:0 4px 14px rgba(15,23,42,0.05);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.stat-card.blue{ border-top-color:#2563eb; }
.stat-card.green{ border-top-color:#2563eb; }

.stat-icon{
  position:absolute;
  top:18px;
  right:18px;
  width:38px;
  height:38px;
  border-radius:10px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.stat-label{
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.stat-value{
  font-family:'Syne',sans-serif;
  font-weight:700;
  font-size:30px;
  color:#0f172a;
  line-height:1.1;
  overflow-wrap:anywhere;
}

.stat-sub{
  font-family:'DM Sans',sans-serif;
  font-size:12px;
  color:#94a3b8;
}

/* Office-name stat values (Highest/Lowest Rating) are text, not numbers —
   reduced from 30px to 18px to keep text readable without overlapping
   the icon. Uses clamping to limit to 2 lines with ellipsis. */
.stat-value-text{
  font-size:18px;
  line-height:1.3;
  max-width: calc(100% - 50px);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  text-overflow: ellipsis;
  word-break: break-word;
  padding-right: 8px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #bae6fd;
}

.office-name-cell {
  font-weight: 700;
  color: #1e293b;
}

.evals-cell {
  text-align: center;
}

.actions-cell {
  text-align: right;
}

@media (max-width: 1200px) {
  .stat-value {
    font-size: 30px;
  }
  .stat-value-text {
    font-size: 16px;
  }
}

@media (max-width: 1024px) {
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 900px) {
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 768px) {
  .stat-grid {
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .stat-value-text {
    font-size: 14px;
    max-width: calc(100% - 45px);
  }

  .search-add-row {
    flex-direction: column;
    align-items: stretch;
  }

  .search-add-row .primary-btn {
    width: 100%;
  }

  .rating-cell {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
    text-align: center;
  }

  .office-table-wrap {
    max-height: 400px;
  }
}

@media (max-width: 600px) {
  .stat-card {
    padding: 16px 16px 18px;
  }
  .stat-value {
    font-size: 26px;
  }
  .stat-value-text {
    font-size: 13px;
    max-width: calc(100% - 40px);
    -webkit-line-clamp: 2;
  }
  .stat-icon {
    width: 32px;
    height: 32px;
    font-size: 14px;
    top: 14px;
    right: 14px;
  }
}

@media (max-width: 480px) {
  .stat-grid {
    grid-template-columns: 1fr;
  }
  .stat-value {
    font-size: 28px;
  }
  .stat-value-text {
    font-size: 15px;
    max-width: calc(100% - 40px);
    -webkit-line-clamp: 2;
  }
}

@media (max-width: 360px) {
  .stat-grid {
    gap: 10px;
  }
  .stat-card {
    padding: 14px 14px 18px;
  }
}

/* ---------- Office Add/Edit modal dialogs (ported from admin1 — replaces prompt()/confirm()/alert()) ---------- */

.cv-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(2px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}
.cv-modal-overlay.open { display: flex; }

.cv-modal {
  background: #ffffff;
  border-radius: 18px;
  width: 440px;
  max-width: 100%;
  box-shadow: 0 24px 60px rgba(15,23,42,.25);
  overflow: hidden;
  animation: cvModalIn .18s ease;
}

@keyframes cvModalIn {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.cv-modal-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 22px 24px 16px;
  border-bottom: 1px solid #f0f9ff;
}

.cv-modal-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: #e0f2fe;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
}
.cv-modal-icon.warn { background: #ffedd5; }

.cv-modal-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 17px;
  color: #0f172a;
  line-height: 1.3;
}

.cv-modal-sub {
  font-size: 12.5px;
  color: #64748b;
  margin-top: 4px;
  line-height: 1.45;
}

.cv-modal-body {
  padding: 18px 24px 6px;
}

.cv-field-label {
  display: block;
  font-size: 11.5px;
  font-weight: 700;
  color: #334155;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 8px;
}

.cv-field-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #bae6fd;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: #0f172a;
  outline: none;
  box-sizing: border-box;
  background: #f8fafc;
  transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.cv-field-input:focus {
  border-color: #0284c7;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(2,132,199,.12);
}
.cv-field-input.error {
  border-color: #f87171;
}

.cv-field-error {
  min-height: 18px;
  font-size: 12px;
  color: #dc2626;
  margin-top: 8px;
  font-weight: 600;
}

.cv-modal-text {
  font-size: 13.5px;
  color: #334155;
  line-height: 1.65;
  margin: 0;
}

.cv-modal-text strong { color: #0f172a; }

.cv-modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 18px 24px 22px;
}

.cv-btn {
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s ease, box-shadow .18s ease, transform .12s ease;
}

.cv-btn-ghost {
  background: #f1f5f9;
  color: #334155;
}
.cv-btn-ghost:hover { background: #e2e8f0; }

.cv-btn-primary {
  background: linear-gradient(160deg, #0ea5e9 0%, #0284c7 55%, #0369a1 100%);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(2,132,199,.28);
}
.cv-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(2,132,199,.32); }
.cv-btn-primary:active { transform: translateY(0); }

.cv-btn-warn {
  background: linear-gradient(160deg, #fb923c 0%, #f97316 55%, #ea580c 100%);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(234,88,12,.28);
}
.cv-btn-warn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(234,88,12,.32); }
.cv-btn-warn:active { transform: translateY(0); }

.cv-toast-stack {
  position: fixed;
  bottom: 26px;
  right: 26px;
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
  z-index: 1100;
  max-width: calc(100vw - 40px);
}

.cv-toast {
  background: #0f172a;
  color: #ffffff;
  padding: 13px 18px;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  box-shadow: 0 10px 24px rgba(15,23,42,.28);
  max-width: 340px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .2s ease, transform .2s ease;
}
.cv-toast.show { opacity: 1; transform: translateY(0); }
.cv-toast.error { background: #7f1d1d; }

@media (max-width: 480px) {
  .cv-modal-header { padding: 20px 18px 14px; }
  .cv-modal-body { padding: 16px 18px 4px; }
  .cv-modal-footer { padding: 16px 18px 20px; flex-direction: column-reverse; }
  .cv-modal-footer .cv-btn { width: 100%; }
}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>

  <main class="main fade-in">
    <div id="topbar-mount"></div>

    <div class="office-section">
      <!-- Stats Grid -->
      <div class="stat-grid">
        <div class="stat-card blue">
          <div class="stat-icon">🏢</div>
          <div class="stat-label">Total Offices</div>
          <div class="stat-value" id="totalOffices">0</div>
          <div class="stat-sub">All Offices</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">📋</div>
          <div class="stat-label">Total Evaluations</div>
          <div class="stat-value" id="totalEvals">0</div>
          <div class="stat-sub" id="totalEvalsSub">All Time</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">⭐</div>
          <div class="stat-label">Highest Rating</div>
          <div class="stat-value stat-value-text" id="highestOffice">—</div>
          <div class="stat-sub">Top Office</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon">📊</div>
          <div class="stat-label">Lowest Rating</div>
          <div class="stat-value stat-value-text" id="lowestOffice">—</div>
          <div class="stat-sub">Needs Support</div>
        </div>
      </div>

      <!-- Main Card -->
      <div class="card">
        <!-- Category tabs: each category has its own Firestore office
             collection (office-names-comfort-room / office_names_surroundings),
             so switching tabs swaps which office list + stats are shown,
             and which collection "+ Add Office" writes to. -->
        <div class="category-tabs" id="category-tabs">
          <button type="button" class="category-tab active" data-category="Comfort Room">🚻 Comfort Room</button>
          <button type="button" class="category-tab" data-category="Surroundings">🌳 Surroundings</button>
        </div>

        <!-- Search box + Add Office button, side by side -->
        <div class="search-add-row">
          <input type="text" id="office-search-input" class="search-input" placeholder="🔍 Search offices by name...">
          <button id="btn-add-office" class="primary-btn">+ Add Comfort Room Office</button>
        </div>

        <div class="office-table-wrap">
          <table class="office-table">
            <thead>
              <tr>
                <th>Office Name</th>
                <th>Avg Rating</th>
                <th>Total Evaluations</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="office-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="cv-modal-overlay" id="cvInputOverlay">
  <div class="cv-modal">
    <div class="cv-modal-header">
      <div class="cv-modal-icon" id="cvInputIcon">🏢</div>
      <div>
        <div class="cv-modal-title" id="cvInputTitle">Add Office</div>
        <div class="cv-modal-sub" id="cvInputSub">Create a new office record for evaluations.</div>
      </div>
    </div>
    <div class="cv-modal-body">
      <label class="cv-field-label" for="cvInputField">Office Name</label>
      <input type="text" id="cvInputField" class="cv-field-input" placeholder="e.g. Registrar's Office" autocomplete="off"/>
      <div class="cv-field-error" id="cvInputError"></div>
    </div>
    <div class="cv-modal-footer">
      <button class="cv-btn cv-btn-ghost" id="cvInputCancel">Cancel</button>
      <button class="cv-btn cv-btn-primary" id="cvInputConfirm">Add Office</button>
    </div>
  </div>
</div>

<div class="cv-modal-overlay" id="cvConfirmOverlay">
  <div class="cv-modal">
    <div class="cv-modal-header">
      <div class="cv-modal-icon" id="cvConfirmIcon">❓</div>
      <div>
        <div class="cv-modal-title" id="cvConfirmTitle">Confirm</div>
      </div>
    </div>
    <div class="cv-modal-body">
      <p class="cv-modal-text" id="cvConfirmMessage"></p>
    </div>
    <div class="cv-modal-footer">
      <button class="cv-btn cv-btn-ghost" id="cvConfirmCancel">Cancel</button>
      <button class="cv-btn cv-btn-primary" id="cvConfirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="cv-toast-stack" id="cvToastStack"></div>

<script src="shared.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  where,
  getDocs,
  writeBatch,
  addDoc,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",
  authDomain: "kristal-adb78.firebaseapp.com",
  projectId: "kristal-adb78",
  storageBucket: "kristal-adb78.firebasestorage.app",
  messagingSenderId: "1016283938031",
  appId: "1:1016283938031:web:54c4d13409d9784ad7af1a",
  measurementId: "G-LK8D1CBQ2J"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Build UI
document.getElementById("sidebar-mount").innerHTML = buildSidebar("admin2", "office-mgmt");
document.getElementById("topbar-mount").innerHTML = buildTopbar("Office Management", "admin2");

// ComfortRoomEvalActivity / SurroundingsEvalActivity both set
// TOTAL_QUESTIONS = 5 and only ever write rating1...rating5 — confirmed
// directly from the submission code (see admin2-eval-mgmt.html), not
// rating1-15. Avg Rating and eval counts below are wrong unless this
// matches.
const TOTAL_RATING_QUESTIONS = 5;

// Mirrors CleanOfficeSelectActivity.officeCollectionName() in the Android
// app: Comfort Room and Surroundings each keep their own office list,
// in collections with different naming conventions (hyphen vs underscore) —
// kept exactly as-is so this matches the real Firestore data.
const OFFICE_COLLECTIONS = {
  "Comfort Room": "office-names-comfort-room",
  "Surroundings": "office_names_surroundings"
};

// The two cleanliness categories chosen on the Android app's
// CleanlinessCategorySelectActivity screen. Evaluations submitted from
// that screen are tagged with one of these via the "cleanlinessCategory"
// field on the Firestore document, so an evaluation can be matched back
// to the right office list even if a name were ever reused across categories.
const CLEANLINESS_CATEGORIES = Object.keys(OFFICE_COLLECTIONS);
const DEFAULT_CATEGORY = "Comfort Room"; // fallback for older eval records saved before the category field existed

let evaluations = [];
let comfortOffices = {};      // docs from office-names-comfort-room
let surroundingsOffices = {}; // docs from office_names_surroundings
let activeCategory = "Comfort Room"; // "Comfort Room" | "Surroundings" — which tab is selected
let renameInProgress = false; // guards against double-submit races during an office rename/merge

function currentOffices() {
  return activeCategory === "Comfort Room" ? comfortOffices : surroundingsOffices;
}

function currentOfficeCollectionName() {
  return OFFICE_COLLECTIONS[activeCategory];
}

function normalizeName(name) {
  return (name || "").toString().trim().toLowerCase();
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function avgOf(ev) {
  let sum = 0;
  let count = 0;

  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    const val = ev["rating" + i];
    if (typeof val === "number" && !isNaN(val)) {
      sum += val;
      count++;
    }
  }

  return count > 0 ? sum / count : 0;
}

function evaluationsForActiveCategory() {
  return evaluations.filter(e => e.cleanlinessCategory === activeCategory);
}

function buildOfficeStats() {
  const statsByKey = {};
  const offices = currentOffices();

  Object.entries(offices).forEach(([key, office]) => {
    statsByKey[key] = { displayName: office.name, total: 0, sum: 0 };
  });

  evaluationsForActiveCategory().forEach(e => {
    const matchingOfficeKey = Object.entries(offices).find(([_, office]) => 
      normalizeName(office.name) === normalizeName(e.officeName)
    )?.[0];
    
    if (matchingOfficeKey) {
      statsByKey[matchingOfficeKey].total += 1;
      statsByKey[matchingOfficeKey].sum += avgOf(e);
    }
  });

  return statsByKey;
}

// Two permanent listeners — one per category's office collection — so
// switching tabs is instant and doesn't need to re-subscribe.
onSnapshot(query(collection(db, OFFICE_COLLECTIONS["Comfort Room"]), orderBy("name", "asc")), (snapshot) => {
  comfortOffices = {};
  snapshot.forEach((doc) => {
    const data = doc.data();
    comfortOffices[doc.id] = { id: doc.id, name: data.name || data.officeName || doc.id };
  });
  renderOfficeTable();
});

onSnapshot(query(collection(db, OFFICE_COLLECTIONS["Surroundings"]), orderBy("name", "asc")), (snapshot) => {
  surroundingsOffices = {};
  snapshot.forEach((doc) => {
    const data = doc.data();
    surroundingsOffices[doc.id] = { id: doc.id, name: data.name || data.officeName || doc.id };
  });
  renderOfficeTable();
});

// Reads from the flat evaluation_history mirror — the same source
// admin2-eval-mgmt.html reads from — instead of the raw
// cleanliness_evaluations tree, so Avg Rating / Total Evaluations here
// always match what Eval Mgmt shows (including any status edits/deletes
// made there, since deletes there remove from this mirror too).
const EVAL_HISTORY_COLLECTION = "evaluation_history";
const evalCollectionRef = collection(db, EVAL_HISTORY_COLLECTION);

onSnapshot(evalCollectionRef, (snapshot) => {
  evaluations = [];
  snapshot.forEach((doc) => {
    const data = doc.data();

    // cleanlinessCategory comes from CleanlinessCategorySelectActivity
    // ("Comfort Room" or "Surroundings"). Older docs saved before this
    // field existed fall back to DEFAULT_CATEGORY so they still show up
    // under a tab instead of disappearing from stats.
    const rawCategory = data.cleanlinessCategory;
    const category = CLEANLINESS_CATEGORIES.includes(rawCategory) ? rawCategory : DEFAULT_CATEGORY;

    const record = {
      id: doc.id,
      officeName: data.officeName || "Unknown",
      cleanlinessCategory: category,
      comments: data.comments || "",
      timestamp: Number(data.timestamp) || 0
    };

    for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
      record["rating" + i] = Number(data["rating" + i]) || 0;
    }

    evaluations.push(record);
  });

  renderOfficeTable();
});

const officeTableBody = document.getElementById("office-table-body");
const officeSearchInput = document.getElementById("office-search-input");
const categoryTabsEl = document.getElementById("category-tabs");
const totalEvalsSubEl = document.getElementById("totalEvalsSub");
const addOfficeBtn = document.getElementById("btn-add-office");

let officeSearchTerm = "";

officeSearchInput.addEventListener("input", (e) => {
  officeSearchTerm = e.target.value.toLowerCase();
  renderOfficeTable();
});

// Category tab clicks — swap which office collection + evaluations
// (stat cards + table) are shown, and re-label the Add Office button
// so it's clear which list a new office will be added to.
categoryTabsEl.querySelectorAll(".category-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    activeCategory = btn.getAttribute("data-category");

    categoryTabsEl.querySelectorAll(".category-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    addOfficeBtn.textContent = `+ Add ${activeCategory} Office`;

    renderOfficeTable();
  });
});

function updateSummary() {
  const offices = currentOffices();
  const keys = Object.keys(offices);
  const totalOffices = keys.length;

  const statsByKey = buildOfficeStats();

  let totalEvals = 0;
  let highestOffice = "—";
  let lowestOffice = "—";
  let highestRating = -1;
  let lowestRating = 6;

  Object.values(statsByKey).forEach(stats => {
    totalEvals += stats.total;

    if (stats.total > 0) {
      const avg = stats.sum / stats.total;

      if (avg > highestRating) {
        highestRating = avg;
        highestOffice = stats.displayName;
      }

      if (avg < lowestRating) {
        lowestRating = avg;
        lowestOffice = stats.displayName;
      }
    }
  });

  document.getElementById("totalOffices").textContent = totalOffices;
  document.getElementById("totalEvals").textContent = totalEvals;
  document.getElementById("highestOffice").textContent = highestOffice;
  document.getElementById("lowestOffice").textContent = lowestOffice;
  totalEvalsSubEl.textContent = activeCategory;
}

function renderOfficeTable() {
  updateSummary();

  const offices = currentOffices();
  const keys = Object.keys(offices).sort((a, b) =>
    offices[a].name.localeCompare(offices[b].name, undefined, {
      sensitivity: "base"
    })
  );

  if (keys.length === 0) {
    officeTableBody.innerHTML = `<tr><td colspan="4" class="no-results">No ${activeCategory} offices added yet.</td></tr>`;
    return;
  }

  const statsByKey = buildOfficeStats();

  let filteredKeys = keys;
  if (officeSearchTerm) {
    filteredKeys = keys.filter(key => offices[key].name.toLowerCase().includes(officeSearchTerm));
  }

  if (filteredKeys.length === 0) {
    officeTableBody.innerHTML = `<tr><td colspan="4" class="no-results">No offices match your search.</td></tr>`;
    return;
  }

  officeTableBody.innerHTML = filteredKeys.map(key => {
    const office = offices[key];
    const name = office.name;
    const stats = statsByKey[key] || { total: 0, sum: 0 };
    const avg = stats.total > 0 ? stats.sum / stats.total : 0;
    const ratingPercent = (avg / 5) * 100;

    return `
      <tr>
        <td class="office-name-cell"><strong>${escapeHtml(name)}</strong></td>
        <td>
          <div class="rating-cell">
            <div class="rating-track"><div class="rating-fill" style="width:${ratingPercent}%"></div></div>
            <span class="rating-number">${avg.toFixed(1)}</span>
          </div>
        </td>
        <td class="evals-cell"><span class="eval-count">${stats.total}</span></td>
        <td class="actions-cell">
          <div class="action-buttons">
            <button class="action-btn action-view" data-office-key="${key}" data-action="view">👁 View</button>
            <button class="action-btn action-edit" data-office-key="${key}" data-action="edit">✏ Edit</button>
            <button class="action-btn action-delete" data-office-key="${key}" data-action="delete">🗑 Delete</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");

  officeTableBody.querySelectorAll("[data-action='view']").forEach(btn => {
    btn.addEventListener("click", () => viewOfficeAnalytics(btn.getAttribute("data-office-key")));
  });
  officeTableBody.querySelectorAll("[data-action='edit']").forEach(btn => {
    btn.addEventListener("click", () => editOffice(btn.getAttribute("data-office-key")));
  });
  officeTableBody.querySelectorAll("[data-action='delete']").forEach(btn => {
    btn.addEventListener("click", () => deleteOffice(btn.getAttribute("data-office-key")));
  });
}

window.viewOfficeAnalytics = function(key) {
  const office = currentOffices()[key];
  const name = office.name || "";
  // Pass the active category along so the analytics page knows to match
  // evaluations against this office's cleanlinessCategory too.
  const url = `admin2-office-analytics.html?office=${encodeURIComponent(key)}&name=${encodeURIComponent(name)}&category=${encodeURIComponent(activeCategory)}`;
  window.location.href = url;
};

/* ---------- Modal & toast helpers (ported from admin1 — replace prompt()/confirm()/alert()) ---------- */

const cvInputOverlay   = document.getElementById("cvInputOverlay");
const cvInputIcon      = document.getElementById("cvInputIcon");
const cvInputTitle     = document.getElementById("cvInputTitle");
const cvInputSub       = document.getElementById("cvInputSub");
const cvInputField     = document.getElementById("cvInputField");
const cvInputError     = document.getElementById("cvInputError");
const cvInputCancelBtn = document.getElementById("cvInputCancel");
const cvInputConfirmBtn = document.getElementById("cvInputConfirm");

let cvInputResolve = null;

// Opens the styled input modal and resolves with the entered text, or
// `null` if the user cancels / closes it. Call again with `error` set to
// re-open pre-filled with a validation message (used for inline duplicate /
// empty-name feedback instead of a blocking alert()).
function openInputModal({ title, subtitle, icon, placeholder, value, confirmText, error }) {
  cvInputTitle.textContent = title || "";
  cvInputSub.textContent = subtitle || "";
  cvInputIcon.textContent = icon || "🏢";
  cvInputField.placeholder = placeholder || "";
  cvInputField.value = value || "";
  cvInputError.textContent = error || "";
  cvInputField.classList.toggle("error", !!error);
  cvInputConfirmBtn.textContent = confirmText || "Save";
  cvInputOverlay.classList.add("open");
  requestAnimationFrame(() => { cvInputField.focus(); cvInputField.select(); });

  return new Promise((resolve) => { cvInputResolve = resolve; });
}

function closeInputModal(result) {
  cvInputOverlay.classList.remove("open");
  if (cvInputResolve) {
    const r = cvInputResolve;
    cvInputResolve = null;
    r(result);
  }
}

cvInputConfirmBtn.addEventListener("click", () => closeInputModal(cvInputField.value));
cvInputCancelBtn.addEventListener("click", () => closeInputModal(null));
cvInputField.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); closeInputModal(cvInputField.value); }
  if (e.key === "Escape") { e.preventDefault(); closeInputModal(null); }
});
cvInputOverlay.addEventListener("click", (e) => {
  if (e.target === cvInputOverlay) closeInputModal(null);
});

const cvConfirmOverlay   = document.getElementById("cvConfirmOverlay");
const cvConfirmIcon      = document.getElementById("cvConfirmIcon");
const cvConfirmTitle     = document.getElementById("cvConfirmTitle");
const cvConfirmMessage   = document.getElementById("cvConfirmMessage");
const cvConfirmCancelBtn = document.getElementById("cvConfirmCancel");
const cvConfirmOkBtn     = document.getElementById("cvConfirmOk");

let cvConfirmResolve = null;

// Opens the styled confirm modal and resolves true/false. `message` may
// contain simple inline HTML (e.g. <strong>) for emphasis.
function openConfirmModal({ title, message, icon, confirmText, tone }) {
  cvConfirmTitle.textContent = title || "Confirm";
  cvConfirmMessage.innerHTML = message || "";
  cvConfirmIcon.textContent = icon || "❓";
  cvConfirmIcon.classList.toggle("warn", tone === "warn");
  cvConfirmOkBtn.textContent = confirmText || "Confirm";
  cvConfirmOkBtn.classList.toggle("cv-btn-warn", tone === "warn");
  cvConfirmOkBtn.classList.toggle("cv-btn-primary", tone !== "warn");
  cvConfirmOverlay.classList.add("open");

  return new Promise((resolve) => { cvConfirmResolve = resolve; });
}

function closeConfirmModal(result) {
  cvConfirmOverlay.classList.remove("open");
  if (cvConfirmResolve) {
    const r = cvConfirmResolve;
    cvConfirmResolve = null;
    r(result);
  }
}

cvConfirmOkBtn.addEventListener("click", () => closeConfirmModal(true));
cvConfirmCancelBtn.addEventListener("click", () => closeConfirmModal(false));
cvConfirmOverlay.addEventListener("click", (e) => {
  if (e.target === cvConfirmOverlay) closeConfirmModal(false);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && cvConfirmOverlay.classList.contains("open")) closeConfirmModal(false);
});

const cvToastStack = document.getElementById("cvToastStack");

// Non-blocking success/error notification, replacing alert().
function showToast(message, isError) {
  const el = document.createElement("div");
  el.className = "cv-toast" + (isError ? " error" : "");
  el.textContent = message;
  cvToastStack.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, 3800);
}

/* ---------- Add Office ---------- */

// Adds to whichever category is currently active — Comfort Room offices
// and Surroundings offices are never mixed into the same collection.
async function addOffice() {
  let prefillValue = "";
  let fieldError = "";

  while (true) {
    const result = await openInputModal({
      title: `Add ${activeCategory} Office`,
      subtitle: `Create a new ${activeCategory} office record for evaluations.`,
      icon: activeCategory === "Comfort Room" ? "🚻" : "🌳",
      placeholder: "e.g. Registrar's Office",
      value: prefillValue,
      confirmText: "Add Office",
      error: fieldError
    });

    if (result === null) return; // cancelled

    const trimmed = result.trim();

    if (!trimmed) {
      prefillValue = "";
      fieldError = "Office name is required.";
      continue;
    }

    const duplicate = Object.values(currentOffices()).some(
      o => normalizeName(o.name) === normalizeName(trimmed)
    );
    if (duplicate) {
      prefillValue = trimmed;
      fieldError = `A ${activeCategory} office named "${trimmed}" already exists.`;
      continue;
    }

    try {
      await addDoc(collection(db, currentOfficeCollectionName()), { name: trimmed });
      showToast(`✓ Office added to ${activeCategory} successfully!`);
      return;
    } catch (err) {
      prefillValue = trimmed;
      fieldError = "Couldn't add office: " + err.message;
      continue;
    }
  }
}

addOfficeBtn.addEventListener("click", addOffice);

/* ---------- Edit / Rename Office ---------- */

/**
 * Renames an office while keeping it fully connected to its existing data.
 *
 * The office document itself never moves. It's updated with `updateDoc(...)`,
 * so its Firestore doc ID — the permanent identifier — stays the same before
 * and after the rename.
 *
 * Evaluations matching the old office name (within the same cleanliness
 * category) are found with a `where("officeName","==",oldName)` +
 * `where("cleanlinessCategory","==",activeCategory)` query and batch-updated
 * to the new name, plus a new `officeId` stamp for future-proofing.
 *
 * A duplicate-name guard (case-insensitive, scoped to the active category)
 * stops a plain rename from silently colliding with another office — instead
 * it offers to merge the two, moving every evaluation from the old office
 * onto the existing one and removing the now-empty source record. A
 * `renameInProgress` flag stops double-submits from racing each other.
 */
async function editOffice(key) {
  if (renameInProgress) {
    showToast("A rename is already in progress. Please wait for it to finish.", true);
    return;
  }

  const offices = currentOffices();
  const office = offices[key];
  if (!office) {
    showToast("Could not find this office's record. Please refresh and try again.", true);
    return;
  }

  const currentName = office.name || "";
  let prefillValue = currentName;
  let fieldError = "";

  while (true) {
    const result = await openInputModal({
      title: `Edit ${activeCategory} Office`,
      subtitle: `Rename "${currentName}"`,
      icon: "✏️",
      placeholder: "Office name",
      value: prefillValue,
      confirmText: "Save Changes",
      error: fieldError
    });

    if (result === null) return; // cancelled

    const trimmedNew = result.trim();

    if (!trimmedNew) {
      prefillValue = "";
      fieldError = "Office name is required.";
      continue;
    }

    if (trimmedNew === currentName) {
      showToast("No changes made.");
      return;
    }

    // Does a DIFFERENT office in this category already use the target name?
    // If so this isn't a simple rename anymore — it's a merge — so we never
    // end up with two offices sharing the same name in the same category.
    const existingTargetKey = Object.keys(offices).find(
      k => k !== key && normalizeName(offices[k].name) === normalizeName(trimmedNew)
    );

    renameInProgress = true;

    try {
      if (existingTargetKey) {
        const existingTargetName = offices[existingTargetKey].name;
        const targetCount = evaluationsForActiveCategory().filter(
          e => normalizeName(e.officeName) === normalizeName(existingTargetName)
        ).length;

        const confirmed = await openConfirmModal({
          title: "Merge Offices?",
          icon: "🔀",
          tone: "warn",
          confirmText: "Merge Offices",
          message:
            `A ${activeCategory} office named "<strong>${escapeHtml(existingTargetName)}</strong>" already exists ` +
            `(${targetCount} evaluation${targetCount === 1 ? "" : "s"}).<br><br>` +
            `Merge "<strong>${escapeHtml(currentName)}</strong>" into "<strong>${escapeHtml(existingTargetName)}</strong>"? ` +
            `All evaluations currently under "${escapeHtml(currentName)}" will be moved onto ` +
            `"${escapeHtml(existingTargetName)}", and the "${escapeHtml(currentName)}" record will be removed. ` +
            `Nothing is deleted — everything is combined under "${escapeHtml(existingTargetName)}".`
        });

        if (!confirmed) {
          renameInProgress = false;
          prefillValue = trimmedNew;
          fieldError = "";
          continue;
        }

        await migrateOfficeEvaluations(currentName, existingTargetName, existingTargetKey);

        // All of the source office's evaluations have moved to the existing
        // target office, so this record is now empty — remove it so it
        // doesn't show up as a duplicate/leftover row.
        await deleteDoc(doc(db, currentOfficeCollectionName(), key));

        showToast(`✓ Merged "${currentName}" into "${existingTargetName}" successfully!`);
      } else {
        const confirmed = await openConfirmModal({
          title: "Rename Office?",
          icon: "✏️",
          tone: "primary",
          confirmText: "Rename Office",
          message:
            `Rename "<strong>${escapeHtml(currentName)}</strong>" to "<strong>${escapeHtml(trimmedNew)}</strong>"?<br><br>` +
            `All existing evaluations linked to "${escapeHtml(currentName)}" will be moved to ` +
            `"${escapeHtml(trimmedNew)}". No data will be deleted.`
        });

        if (!confirmed) {
          renameInProgress = false;
          prefillValue = trimmedNew;
          fieldError = "";
          continue;
        }

        // Same doc ID (key) before and after — only the name field changes.
        await updateDoc(doc(db, currentOfficeCollectionName(), key), { name: trimmedNew });
        await migrateOfficeEvaluations(currentName, trimmedNew, key);

        showToast(`✓ Office renamed to "${trimmedNew}" successfully!`);
      }

      renameInProgress = false;
      return;
    } catch (err) {
      renameInProgress = false;
      console.error("Office rename/merge failed:", err);
      showToast(
        "Error updating office: " + err.message +
        ". Some records may have already been migrated — please re-check the office's data and retry if needed.",
        true
      );
      return;
    }
  }
}

// Batch-updates every evaluation_history doc where officeName === oldName
// AND cleanlinessCategory === activeCategory, setting officeName to newName
// and stamping officeId (the target office's permanent doc ID) for
// future-proofing. Chunked to stay under Firestore's 500-writes-per-batch
// limit.
async function migrateOfficeEvaluations(oldName, newName, officeId) {
  const q = query(
    evalCollectionRef,
    where("officeName", "==", oldName),
    where("cleanlinessCategory", "==", activeCategory)
  );
  const snap = await getDocs(q);
  if (snap.empty) return;

  const docs = snap.docs;
  const CHUNK = 450;

  for (let i = 0; i < docs.length; i += CHUNK) {
    const batch = writeBatch(db);
    docs.slice(i, i + CHUNK).forEach(d => {
      batch.update(d.ref, { officeName: newName, officeId });
    });
    await batch.commit();
  }
}

window.editOffice = editOffice;

/* ---------- Delete Office ---------- */

async function deleteOffice(key) {
  const office = currentOffices()[key];
  const name = office?.name || "this office";

  const confirmed = await openConfirmModal({
    title: "Delete Office?",
    icon: "🗑",
    tone: "warn",
    confirmText: "Delete Office",
    message: `Remove "<strong>${escapeHtml(name)}</strong>" from the ${activeCategory} office list? This action cannot be undone.`
  });
  if (!confirmed) return;

  try {
    await deleteDoc(doc(db, currentOfficeCollectionName(), key));
    showToast("✓ Office deleted successfully!");
  } catch (err) {
    showToast("Couldn't remove office: " + err.message, true);
  }
}

window.deleteOffice = deleteOffice;

</script>

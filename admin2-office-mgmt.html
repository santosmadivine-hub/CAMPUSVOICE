<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Office Management | Admin 2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ── Office Management Page Styles ── */
.office-section {
  max-width: 1200px;
  margin: 0 auto;
}

/* Row that holds the search box + Add Office button side by side */
.search-add-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.search-input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #bae6fd;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
  box-sizing: border-box;
  color: #1e293b;
  flex: 1;
  min-width: 0;
}
.search-input:focus { border-color: #0284c7; }
.search-input::placeholder { color: #94a3b8; }

/* ── Category tabs (Comfort Room / Surroundings) ── */
.category-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.category-tab {
  border: 1px solid #bae6fd;
  background: #ffffff;
  color: #0369a1;
  padding: 9px 16px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  transition: background .2s, color .2s, transform .2s, border-color .2s;
  white-space: nowrap;
}

.category-tab:hover {
  border-color: #0284c7;
  transform: translateY(-1px);
}

.category-tab.active {
  background: #0284c7;
  border-color: #0284c7;
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(2,132,199,.3);
}

.category-tab.active[data-category="Surroundings"] {
  background: #16a34a;
  border-color: #16a34a;
  box-shadow: 0 4px 14px rgba(22,163,74,.3);
}

/* Office table */
.office-table-wrap {
  max-height: 600px;
  overflow-y: auto;
  border-radius: 12px;
  border: 1px solid #bae6fd;
}
.office-table-wrap::-webkit-scrollbar { width: 6px; }
.office-table-wrap::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 999px; }
.office-table-wrap::-webkit-scrollbar-track { background: transparent; }

.office-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

.office-table th {
  text-align: left;
  padding: 14px 16px;
  font-size: 11px;
  color: #475569;
  letter-spacing: .06em;
  text-transform: uppercase;
  border-bottom: 2px solid #bae6fd;
  background: #f0f9ff;
  position: sticky;
  top: 0;
  font-weight: 700;
}

.office-table td {
  padding: 14px 16px;
  border-bottom: 1px solid #f0f9ff;
  font-size: 14px;
  color: #1e293b;
}

.office-table tr:hover td {
  background: #f0f9ff;
}

.rating-cell {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 220px;
}

.rating-track {
  flex: 1;
  height: 8px;
  background: #bae6fd;
  border-radius: 999px;
  overflow: hidden;
  min-width: 130px;
}

.rating-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg,#0284c7,#0ea5e9);
  transition: width .6s ease;
}

.rating-number {
  font-weight: 700;
  color: #0c4a6e;
  width: 34px;
  flex-shrink: 0;
  text-align: right;
}

.eval-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  padding: 4px 10px;
  background: #e0f2fe;
  color: #0c4a6e;
  font-weight: 700;
  font-size: 13px;
  border-radius: 999px;
}

.action-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.action-btn {
  border: none;
  padding: 7px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  transition: opacity .2s, transform .2s;
}

.action-btn:hover {
  opacity: .85;
  transform: translateY(-1px);
}

.view-btn {
  background: #dbeafe;
  color: #1e40af;
}

.edit-btn {
  background: #fef3c7;
  color: #92400e;
}

.delete-btn {
  background: #fee2e2;
  color: #991b1b;
}

.action-view { background: #dbeafe; color: #1e40af; }
.action-edit { background: #fef3c7; color: #92400e; }
.action-delete { background: #fee2e2; color: #991b1b; }

.primary-btn {
  border: none;
  background: #0284c7;
  color: white;
  padding: 11px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  box-shadow: 0 4px 14px rgba(2,132,199,.3);
  transition: background .2s, transform .2s;
  white-space: nowrap;
  flex-shrink: 0;
}

.primary-btn:hover {
  background: #0369a1;
  transform: translateY(-1px);
}

.no-results {
  padding: 40px 20px;
  text-align: center;
  color: #64748b;
  font-size: 14px;
}

/* ─── Stat cards — identical to Admin 1's Office Management page ─── */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
  margin-bottom: 24px;
}

.stat-card{
  position:relative;
  background:#ffffff;
  border:1px solid #bae6fd;
  border-top:4px solid var(--accent3, #2563eb);
  border-radius:16px;
  padding:20px 20px 22px;
  box-shadow:0 4px 14px rgba(15,23,42,0.05);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.stat-card.blue{ border-top-color:#2563eb; }
.stat-card.green{ border-top-color:#2563eb; }

.stat-icon{
  position:absolute;
  top:18px;
  right:18px;
  width:38px;
  height:38px;
  border-radius:10px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.stat-label{
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.stat-value{
  font-family:'Syne',sans-serif;
  font-weight:700;
  font-size:30px;
  color:#0f172a;
  line-height:1.1;
  overflow-wrap:anywhere;
}

.stat-sub{
  font-family:'DM Sans',sans-serif;
  font-size:12px;
  color:#94a3b8;
}

/* Office-name stat values (Highest/Lowest Rating) are text, not numbers —
   30px is too large for names, so they get a smaller size while keeping
   the same font family/weight/color as the rest of the card. */
.stat-value-text{
  font-size:20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #bae6fd;
}

.office-name-cell {
  font-weight: 700;
  color: #1e293b;
}

.evals-cell {
  text-align: center;
}

.actions-cell {
  text-align: right;
}

@media (max-width: 1200px) {
  .stat-value {
    font-size: 30px;
  }
  .stat-value-text {
    font-size: 18px;
  }
}

@media (max-width: 1024px) {
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 900px) {
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 768px) {
  .stat-grid {
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .search-add-row {
    flex-direction: column;
    align-items: stretch;
  }

  .search-add-row .primary-btn {
    width: 100%;
  }

  .rating-cell {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
    text-align: center;
  }

  .office-table-wrap {
    max-height: 400px;
  }
}

@media (max-width: 600px) {
  .stat-card {
    padding: 16px 16px 18px;
  }
  .stat-value {
    font-size: 26px;
  }
  .stat-value-text {
    font-size: 16px;
  }
  .stat-icon {
    width: 32px;
    height: 32px;
    font-size: 14px;
    top: 14px;
    right: 14px;
  }
}

@media (max-width: 480px) {
  .stat-grid {
    grid-template-columns: 1fr;
  }
  .stat-value {
    font-size: 28px;
  }
  .stat-value-text {
    font-size: 18px;
  }
}

@media (max-width: 360px) {
  .stat-grid {
    gap: 10px;
  }
  .stat-card {
    padding: 14px 14px 18px;
  }
}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>

  <main class="main fade-in">
    <div id="topbar-mount"></div>

    <div class="office-section">
      <!-- Stats Grid -->
      <div class="stat-grid">
        <div class="stat-card blue">
          <div class="stat-icon">🏢</div>
          <div class="stat-label">Total Offices</div>
          <div class="stat-value" id="totalOffices">0</div>
          <div class="stat-sub">All Offices</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">📋</div>
          <div class="stat-label">Total Evaluations</div>
          <div class="stat-value" id="totalEvals">0</div>
          <div class="stat-sub" id="totalEvalsSub">All Time</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">⭐</div>
          <div class="stat-label">Highest Rating</div>
          <div class="stat-value stat-value-text" id="highestOffice">—</div>
          <div class="stat-sub">Top Office</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon">📊</div>
          <div class="stat-label">Lowest Rating</div>
          <div class="stat-value stat-value-text" id="lowestOffice">—</div>
          <div class="stat-sub">Needs Support</div>
        </div>
      </div>

      <!-- Main Card -->
      <div class="card">
        <!-- Category tabs: each category has its own Firestore office
             collection (office-names-comfort-room / office_names_surroundings),
             so switching tabs swaps which office list + stats are shown,
             and which collection "+ Add Office" writes to. -->
        <div class="category-tabs" id="category-tabs">
          <button type="button" class="category-tab active" data-category="Comfort Room">🚻 Comfort Room</button>
          <button type="button" class="category-tab" data-category="Surroundings">🌳 Surroundings</button>
        </div>

        <!-- Search box + Add Office button, side by side -->
        <div class="search-add-row">
          <input type="text" id="office-search-input" class="search-input" placeholder="🔍 Search offices by name...">
          <button id="btn-add-office" class="primary-btn">+ Add Comfort Room Office</button>
        </div>

        <div class="office-table-wrap">
          <table class="office-table">
            <thead>
              <tr>
                <th>Office Name</th>
                <th>Avg Rating</th>
                <th>Total Evaluations</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="office-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  addDoc,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",
  authDomain: "kristal-adb78.firebaseapp.com",
  projectId: "kristal-adb78",
  storageBucket: "kristal-adb78.firebasestorage.app",
  messagingSenderId: "1016283938031",
  appId: "1:1016283938031:web:54c4d13409d9784ad7af1a",
  measurementId: "G-LK8D1CBQ2J"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Build UI
document.getElementById("sidebar-mount").innerHTML = buildSidebar("admin2", "office-mgmt");
document.getElementById("topbar-mount").innerHTML = buildTopbar("Office Management", "admin2");

// ComfortRoomEvalActivity / SurroundingsEvalActivity both set
// TOTAL_QUESTIONS = 5 and only ever write rating1...rating5 — confirmed
// directly from the submission code (see admin2-eval-mgmt.html), not
// rating1-15. Avg Rating and eval counts below are wrong unless this
// matches.
const TOTAL_RATING_QUESTIONS = 5;

// Mirrors CleanOfficeSelectActivity.officeCollectionName() in the Android
// app: Comfort Room and Surroundings each keep their own office list,
// in collections with different naming conventions (hyphen vs underscore) —
// kept exactly as-is so this matches the real Firestore data.
const OFFICE_COLLECTIONS = {
  "Comfort Room": "office-names-comfort-room",
  "Surroundings": "office_names_surroundings"
};

// The two cleanliness categories chosen on the Android app's
// CleanlinessCategorySelectActivity screen. Evaluations submitted from
// that screen are tagged with one of these via the "cleanlinessCategory"
// field on the Firestore document, so an evaluation can be matched back
// to the right office list even if a name were ever reused across categories.
const CLEANLINESS_CATEGORIES = Object.keys(OFFICE_COLLECTIONS);
const DEFAULT_CATEGORY = "Comfort Room"; // fallback for older eval records saved before the category field existed

let evaluations = [];
let comfortOffices = {};      // docs from office-names-comfort-room
let surroundingsOffices = {}; // docs from office_names_surroundings
let activeCategory = "Comfort Room"; // "Comfort Room" | "Surroundings" — which tab is selected

function currentOffices() {
  return activeCategory === "Comfort Room" ? comfortOffices : surroundingsOffices;
}

function currentOfficeCollectionName() {
  return OFFICE_COLLECTIONS[activeCategory];
}

function normalizeName(name) {
  return (name || "").toString().trim().toLowerCase();
}

function avgOf(ev) {
  let sum = 0;
  let count = 0;

  for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
    const val = ev["rating" + i];
    if (typeof val === "number" && !isNaN(val)) {
      sum += val;
      count++;
    }
  }

  return count > 0 ? sum / count : 0;
}

function evaluationsForActiveCategory() {
  return evaluations.filter(e => e.cleanlinessCategory === activeCategory);
}

function buildOfficeStats() {
  const statsByKey = {};
  const offices = currentOffices();

  Object.entries(offices).forEach(([key, office]) => {
    statsByKey[key] = { displayName: office.name, total: 0, sum: 0 };
  });

  evaluationsForActiveCategory().forEach(e => {
    const matchingOfficeKey = Object.entries(offices).find(([_, office]) => 
      normalizeName(office.name) === normalizeName(e.officeName)
    )?.[0];
    
    if (matchingOfficeKey) {
      statsByKey[matchingOfficeKey].total += 1;
      statsByKey[matchingOfficeKey].sum += avgOf(e);
    }
  });

  return statsByKey;
}

// Two permanent listeners — one per category's office collection — so
// switching tabs is instant and doesn't need to re-subscribe.
onSnapshot(query(collection(db, OFFICE_COLLECTIONS["Comfort Room"]), orderBy("name", "asc")), (snapshot) => {
  comfortOffices = {};
  snapshot.forEach((doc) => {
    const data = doc.data();
    comfortOffices[doc.id] = { id: doc.id, name: data.name || data.officeName || doc.id };
  });
  renderOfficeTable();
});

onSnapshot(query(collection(db, OFFICE_COLLECTIONS["Surroundings"]), orderBy("name", "asc")), (snapshot) => {
  surroundingsOffices = {};
  snapshot.forEach((doc) => {
    const data = doc.data();
    surroundingsOffices[doc.id] = { id: doc.id, name: data.name || data.officeName || doc.id };
  });
  renderOfficeTable();
});

// Reads from the flat evaluation_history mirror — the same source
// admin2-eval-mgmt.html reads from — instead of the raw
// cleanliness_evaluations tree, so Avg Rating / Total Evaluations here
// always match what Eval Mgmt shows (including any status edits/deletes
// made there, since deletes there remove from this mirror too).
const EVAL_HISTORY_COLLECTION = "evaluation_history";
const evalCollectionRef = collection(db, EVAL_HISTORY_COLLECTION);

onSnapshot(evalCollectionRef, (snapshot) => {
  evaluations = [];
  snapshot.forEach((doc) => {
    const data = doc.data();

    // cleanlinessCategory comes from CleanlinessCategorySelectActivity
    // ("Comfort Room" or "Surroundings"). Older docs saved before this
    // field existed fall back to DEFAULT_CATEGORY so they still show up
    // under a tab instead of disappearing from stats.
    const rawCategory = data.cleanlinessCategory;
    const category = CLEANLINESS_CATEGORIES.includes(rawCategory) ? rawCategory : DEFAULT_CATEGORY;

    const record = {
      id: doc.id,
      officeName: data.officeName || "Unknown",
      cleanlinessCategory: category,
      comments: data.comments || "",
      timestamp: Number(data.timestamp) || 0
    };

    for (let i = 1; i <= TOTAL_RATING_QUESTIONS; i++) {
      record["rating" + i] = Number(data["rating" + i]) || 0;
    }

    evaluations.push(record);
  });

  renderOfficeTable();
});

const officeTableBody = document.getElementById("office-table-body");
const officeSearchInput = document.getElementById("office-search-input");
const categoryTabsEl = document.getElementById("category-tabs");
const totalEvalsSubEl = document.getElementById("totalEvalsSub");
const addOfficeBtn = document.getElementById("btn-add-office");

let officeSearchTerm = "";

officeSearchInput.addEventListener("input", (e) => {
  officeSearchTerm = e.target.value.toLowerCase();
  renderOfficeTable();
});

// Category tab clicks — swap which office collection + evaluations
// (stat cards + table) are shown, and re-label the Add Office button
// so it's clear which list a new office will be added to.
categoryTabsEl.querySelectorAll(".category-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    activeCategory = btn.getAttribute("data-category");

    categoryTabsEl.querySelectorAll(".category-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    addOfficeBtn.textContent = `+ Add ${activeCategory} Office`;

    renderOfficeTable();
  });
});

function updateSummary() {
  const offices = currentOffices();
  const keys = Object.keys(offices);
  const totalOffices = keys.length;

  const statsByKey = buildOfficeStats();

  let totalEvals = 0;
  let highestOffice = "—";
  let lowestOffice = "—";
  let highestRating = -1;
  let lowestRating = 6;

  Object.values(statsByKey).forEach(stats => {
    totalEvals += stats.total;

    if (stats.total > 0) {
      const avg = stats.sum / stats.total;

      if (avg > highestRating) {
        highestRating = avg;
        highestOffice = stats.displayName;
      }

      if (avg < lowestRating) {
        lowestRating = avg;
        lowestOffice = stats.displayName;
      }
    }
  });

  document.getElementById("totalOffices").textContent = totalOffices;
  document.getElementById("totalEvals").textContent = totalEvals;
  document.getElementById("highestOffice").textContent = highestOffice;
  document.getElementById("lowestOffice").textContent = lowestOffice;
  totalEvalsSubEl.textContent = activeCategory;
}

function renderOfficeTable() {
  updateSummary();

  const offices = currentOffices();
  const keys = Object.keys(offices).sort((a, b) =>
    offices[a].name.localeCompare(offices[b].name, undefined, {
      sensitivity: "base"
    })
  );

  if (keys.length === 0) {
    officeTableBody.innerHTML = `<tr><td colspan="4" class="no-results">No ${activeCategory} offices added yet.</td></tr>`;
    return;
  }

  const statsByKey = buildOfficeStats();

  let filteredKeys = keys;
  if (officeSearchTerm) {
    filteredKeys = keys.filter(key => offices[key].name.toLowerCase().includes(officeSearchTerm));
  }

  if (filteredKeys.length === 0) {
    officeTableBody.innerHTML = `<tr><td colspan="4" class="no-results">No offices match your search.</td></tr>`;
    return;
  }

  officeTableBody.innerHTML = filteredKeys.map(key => {
    const office = offices[key];
    const name = office.name;
    const stats = statsByKey[key] || { total: 0, sum: 0 };
    const avg = stats.total > 0 ? stats.sum / stats.total : 0;
    const ratingPercent = (avg / 5) * 100;

    return `
      <tr>
        <td class="office-name-cell"><strong>${name}</strong></td>
        <td>
          <div class="rating-cell">
            <div class="rating-track"><div class="rating-fill" style="width:${ratingPercent}%"></div></div>
            <span class="rating-number">${avg.toFixed(1)}</span>
          </div>
        </td>
        <td class="evals-cell"><span class="eval-count">${stats.total}</span></td>
        <td class="actions-cell">
          <div class="action-buttons">
            <button class="action-btn action-view" data-office-key="${key}" data-action="view">👁 View</button>
            <button class="action-btn action-edit" data-office-key="${key}" data-action="edit">✏ Edit</button>
            <button class="action-btn action-delete" data-office-key="${key}" data-action="delete">🗑 Delete</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");

  officeTableBody.querySelectorAll("[data-action='view']").forEach(btn => {
    btn.addEventListener("click", () => viewOfficeAnalytics(btn.getAttribute("data-office-key")));
  });
  officeTableBody.querySelectorAll("[data-action='edit']").forEach(btn => {
    btn.addEventListener("click", () => editOffice(btn.getAttribute("data-office-key")));
  });
  officeTableBody.querySelectorAll("[data-action='delete']").forEach(btn => {
    btn.addEventListener("click", () => deleteOffice(btn.getAttribute("data-office-key")));
  });
}

window.viewOfficeAnalytics = function(key) {
  const office = currentOffices()[key];
  const name = office.name || "";
  // Pass the active category along so the analytics page knows to match
  // evaluations against this office's cleanlinessCategory too.
  const url = `admin2-office-analytics.html?office=${encodeURIComponent(key)}&name=${encodeURIComponent(name)}&category=${encodeURIComponent(activeCategory)}`;
  window.location.href = url;
};

window.editOffice = async function(key) {
  const office = currentOffices()[key];
  const currentName = office.name || "";
  const newName = prompt(`Edit ${activeCategory} office name:`, currentName);
  if (newName === null) return;
  const trimmed = newName.trim();
  if (!trimmed || trimmed === currentName) return;

  try {
    await updateDoc(doc(db, currentOfficeCollectionName(), key), { name: trimmed });
    alert("✓ Office updated successfully!");
  } catch (err) {
    alert("Couldn't update office: " + err.message);
  }
};

window.deleteOffice = async function(key) {
  const office = currentOffices()[key];
  const name = office.name || "this office";
  if (!confirm(`Remove "${name}" from the ${activeCategory} office list?`)) return;

  try {
    await deleteDoc(doc(db, currentOfficeCollectionName(), key));
    alert("✓ Office deleted successfully!");
  } catch (err) {
    alert("Couldn't remove office: " + err.message);
  }
};

// Adds to whichever category is currently active — Comfort Room offices
// and Surroundings offices are never mixed into the same collection.
window.addOffice = async function() {
  const name = prompt(`New ${activeCategory} office name (e.g. Registrar):`);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;

  try {
    await addDoc(collection(db, currentOfficeCollectionName()), { name: trimmed });
    alert(`✓ Office added to ${activeCategory} successfully!`);
  } catch (err) {
    alert("Couldn't add office: " + err.message);
  }
};

addOfficeBtn.addEventListener("click", addOffice);

</script>
</body>

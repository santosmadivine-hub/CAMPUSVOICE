<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Dashboard | Super Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.dashboard-container { flex:1; padding:28px 32px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:24px; }
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
@media(max-width:900px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:520px){ .stat-grid{grid-template-columns:1fr;} }
.stat-card {
  position:relative; background:#fff; border:1px solid #ede9fe;
  border-top:4px solid #7c3aed; border-radius:16px; padding:20px 54px 20px 20px;
  box-shadow:0 4px 14px rgba(124,58,237,.08); display:flex; flex-direction:column;
  gap:5px; transition:transform .25s,box-shadow .25s;
}
.stat-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(124,58,237,.18); }
.stat-icon { position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:10px; background:#f5f3ff; display:flex; align-items:center; justify-content:center; font-size:17px; }
.stat-label { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; color:#64748b; text-transform:uppercase; letter-spacing:.04em; }
.stat-value { font-family:'Syne',sans-serif; font-weight:700; font-size:30px; color:#0f172a; line-height:1.1; }
.stat-sub { font-family:'DM Sans',sans-serif; font-size:11px; color:#94a3b8; }
.section-title { font-family:'Syne',sans-serif; font-size:17px; font-weight:700; color:#0f172a; margin-bottom:4px; }
.card { background:#fff; border:1px solid #ede9fe; border-radius:14px; box-shadow:0 4px 14px rgba(124,58,237,.06); padding:22px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media(max-width:700px){ .two-col{grid-template-columns:1fr;} }
.quick-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:14px; }
.quick-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding:20px 14px; background:linear-gradient(135deg,#f5f3ff 0%,#ede9fe 100%);
  border:1.5px solid #ddd6fe; border-radius:14px; text-decoration:none; color:#0f172a;
  transition:all .25s; cursor:pointer; font-family:'Syne',sans-serif;
}
.quick-btn:hover { border-color:#a78bfa; box-shadow:0 4px 12px rgba(124,58,237,.15); transform:translateY(-2px); }
.qa-icon { font-size:28px; line-height:1; }
.qa-label { font-family:'Syne',sans-serif; font-weight:600; font-size:13px; color:#0f172a; text-align:center; }
.office-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; max-height:280px; overflow-y:auto; }
.office-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 14px; background:#fafafa; border:1px solid #f0ebff; border-radius:10px;
  font-family:'DM Sans',sans-serif; font-size:13px; color:#334155;
}
.office-name { font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.badge { display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:6px; font-size:12px; font-weight:600; white-space:nowrap; }
.badge-active { background:#dcfce7; color:#166534; }
.badge-inactive { background:#fee2e2; color:#991b1b; }
.empty-state { text-align:center; color:#94a3b8; padding:30px 0; font-family:'DM Sans',sans-serif; font-size:14px; }
.accounts-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; max-height:280px; overflow-y:auto; }
.account-row {
  display:flex; align-items:center; gap:12px; padding:10px 14px;
  background:#fafafa; border:1px solid #f0ebff; border-radius:10px;
  font-family:'DM Sans',sans-serif; font-size:13px;
}
.account-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#a78bfa); display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; font-weight:700; flex-shrink:0; }
.account-info { flex:1; min-width:0; }
.account-name { font-weight:600; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.account-email { font-size:11px; color:#94a3b8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <div class="sidebar-overlay"></div>
  <main class="main fade-in">
    <div id="topbar-mount"></div>
    <div class="dashboard-container">

      <div class="stat-grid" id="statGrid">
        <div class="stat-card"><div class="stat-icon">🏢</div><div class="stat-label">Total Offices</div><div class="stat-value" id="statOffices">—</div><div class="stat-sub">Registered offices</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">Active Offices</div><div class="stat-value" id="statActiveOffices">—</div><div class="stat-sub">Currently enabled</div></div>
        <div class="stat-card"><div class="stat-icon">🔑</div><div class="stat-label">FC Office Accounts</div><div class="stat-value" id="statAccounts">—</div><div class="stat-sub">Accounts created</div></div>
        <div class="stat-card"><div class="stat-icon">🟢</div><div class="stat-label">Active Accounts</div><div class="stat-value" id="statActiveAccounts">—</div><div class="stat-sub">Currently active</div></div>
      </div>

      <!-- Office Overview -->
      <div class="card" style="margin-top:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div class="section-title" style="margin:0;">Office Overview</div>
          <a href="superadmin-office-mgmt.html" style="font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#2563eb;text-decoration:none;">Manage →</a>
        </div>
        <!-- Search + Filter + Sort toolbar -->
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
          <div style="flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 12px;background:#f8fafc;">
            <span style="font-size:15px;color:#94a3b8;">🔍</span>
            <input id="oo-search" type="text" placeholder="Search offices…"
              style="border:none;outline:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:#0f172a;width:100%;">
          </div>
          <div id="oo-filter-btns" style="display:flex;gap:6px;">
            <button class="oo-filter active" data-filter="all"      style="padding:7px 16px;border-radius:999px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;background:#7c3aed;color:#fff;">All</button>
            <button class="oo-filter"        data-filter="active"   style="padding:7px 16px;border-radius:999px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;background:transparent;color:#374151;">Active</button>
            <button class="oo-filter"        data-filter="inactive" style="padding:7px 16px;border-radius:999px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;background:transparent;color:#374151;">Inactive</button>
          </div>
          <div style="position:relative;">
            <select id="oo-sort"
              style="padding:7px 32px 7px 12px;border-radius:10px;border:1.5px solid #e2e8f0;background:#f8fafc;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#374151;cursor:pointer;appearance:none;outline:none;">
              <option value="most-evals">Sort: Most Evaluations</option>
              <option value="highest-avg">Sort: Highest Avg</option>
              <option value="lowest-avg">Sort: Lowest Avg</option>
              <option value="name-az">Sort: Name A–Z</option>
              <option value="pending-first">Sort: Pending First</option>
            </select>
            <span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:11px;color:#94a3b8;">▼</span>
          </div>
        </div>
        <div id="office-overview-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;"></div>
      </div>

      <!-- FC Office Accounts Table -->
      <div class="card" style="margin-top:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <div class="section-title" style="margin:0;">FC Office Accounts</div>
          <a href="superadmin-accounts.html" style="font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#2563eb;text-decoration:none;">Manage →</a>
        </div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-family:'DM Sans',sans-serif;font-size:13px;" id="accounts-table">
            <thead>
              <tr style="border-bottom:2px solid #e2e8f0;">
                <th style="text-align:left;padding:8px 12px;color:#64748b;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em;">#</th>
                <th style="text-align:left;padding:8px 12px;color:#64748b;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em;">Name</th>
                <th style="text-align:left;padding:8px 12px;color:#64748b;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em;">Linked Office</th>
                <th style="text-align:left;padding:8px 12px;color:#64748b;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em;">Avg Rating</th>
                <th style="text-align:left;padding:8px 12px;color:#64748b;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em;">Status</th>
              </tr>
            </thead>
            <tbody id="accounts-tbody">
              <tr><td colspan="5" style="padding:20px;text-align:center;color:#94a3b8;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Offices Coverage -->
      <div class="card" style="margin-top:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <div class="section-title" style="margin:0;">Offices Coverage</div>
          <a href="superadmin-office-mgmt.html" style="font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#2563eb;text-decoration:none;">Manage →</a>
        </div>
        <div id="offices-coverage" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;"></div>
      </div>

    </div>
  </main>
</div>

<script src="shared.js"></script>
<script type="module">
import {
  guard, db, collection, query, where, onSnapshot
} from './cv-core.js';

await guard(['superadmin']);
document.getElementById('sidebar-mount').innerHTML = buildSidebar('superadmin', 'dashboard');
document.getElementById('topbar-mount').innerHTML  = buildTopbar('Dashboard', 'superadmin');

const fcOffices  = collection(db, 'fc_offices');
const fcAccounts = query(collection(db, 'accounts'), where('role', '==', 'fc_office'));
const fcEvals    = collection(db, 'facilities_cleanliness_evaluations');

let officesData  = [];
let accountsData = [];
let evalsData    = [];

function officeAvg(officeName) {
  const evals = evalsData.filter(e => e.officeName === officeName);
  if (!evals.length) return null;
  let sum = 0, count = 0;
  evals.forEach(e => {
    for (let i = 1; i <= 5; i++) { const v = Number(e[`cleanlinessRating${i}`]); if (v > 0) { sum += v; count++; } }
    for (let i = 1; i <= 8; i++) { const v = Number(e[`facilitiesRating${i}`]);  if (v > 0) { sum += v; count++; } }
  });
  return count > 0 ? sum / count : null;
}

function updateStats() {
  document.getElementById('statOffices').textContent        = officesData.length;
  document.getElementById('statActiveOffices').textContent  = officesData.filter(o => (o.status || 'active') === 'active').length;
  document.getElementById('statAccounts').textContent       = accountsData.length;
  document.getElementById('statActiveAccounts').textContent = accountsData.filter(a => (a.status || 'active') === 'active').length;
}

function renderAccountsTable() {
  const tbody = document.getElementById('accounts-tbody');
  if (!accountsData.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="padding:20px;text-align:center;color:#94a3b8;">No FC office accounts created yet.</td></tr>';
    return;
  }

  const withAvg = accountsData.map(a => ({ ...a, avg: officeAvg(a.linkedOfficeName) }));
  // Sort: accounts with ratings first (highest→lowest), then no-rating accounts
  withAvg.sort((a, b) => {
    if (a.avg === null && b.avg === null) return 0;
    if (a.avg === null) return 1;
    if (b.avg === null) return -1;
    return b.avg - a.avg;
  });

  tbody.innerHTML = withAvg.map((a, i) => {
    const isActive   = (a.status || 'active') === 'active';
    const badgeStyle = isActive ? 'background:#dcfce7;color:#166534;' : 'background:#fee2e2;color:#991b1b;';
    const rankColor  = i === 0 && a.avg !== null ? '#f59e0b' : i === 1 && a.avg !== null ? '#94a3b8' : i === 2 && a.avg !== null ? '#b45309' : '#cbd5e1';
    const avgDisplay = a.avg !== null
      ? (() => {
          const color = a.avg >= 4 ? '#16a34a' : a.avg >= 3 ? '#2563eb' : a.avg >= 2 ? '#f59e0b' : '#dc2626';
          const stars = '★'.repeat(Math.round(a.avg)) + '☆'.repeat(5 - Math.round(a.avg));
          return `<span style="font-weight:700;color:${color};font-size:13px;">${a.avg.toFixed(2)}<span style="font-size:10px;color:#94a3b8;">/5</span></span>
                  <div style="font-size:11px;color:#f59e0b;letter-spacing:1px;">${stars}</div>`;
        })()
      : '<span style="color:#cbd5e1;font-size:12px;">No data</span>';

    return `<tr style="border-bottom:1px solid #f1f5f9;">
      <td style="padding:10px 12px;font-weight:700;color:${rankColor};font-size:13px;">${a.avg !== null ? `#${i + 1}` : '—'}</td>
      <td style="padding:10px 12px;font-weight:600;color:#0f172a;">${a.displayName || '(no name)'}</td>
      <td style="padding:10px 12px;color:#1d4ed8;font-weight:500;">🏢 ${a.linkedOfficeName || '—'}</td>
      <td style="padding:10px 12px;">${avgDisplay}</td>
      <td style="padding:10px 12px;"><span style="padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;${badgeStyle}">${isActive ? 'Active' : 'Inactive'}</span></td>
    </tr>`;
  }).join('');
}

function renderOfficesCoverage() {
  const el = document.getElementById('offices-coverage');
  if (!officesData.length) {
    el.innerHTML = '<div style="color:#94a3b8;font-family:\'DM Sans\',sans-serif;font-size:13px;">No offices yet.</div>';
    return;
  }
  const linkedOfficeNames = new Set(accountsData.map(a => a.linkedOfficeName).filter(Boolean));
  el.innerHTML = officesData.map(o => {
    const name     = o.name || '(unnamed)';
    const isActive = (o.status || 'active') === 'active';
    const hasAcct  = linkedOfficeNames.has(name);
    const acctCount = accountsData.filter(a => a.linkedOfficeName === name).length;
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid ${hasAcct ? '#bbf7d0' : '#e2e8f0'};background:${hasAcct ? '#f0fdf4' : '#f8fafc'};">
      <div style="font-size:22px;">${hasAcct ? '✅' : '⬜'}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:11px;color:${hasAcct ? '#16a34a' : '#94a3b8'};margin-top:2px;">
          ${hasAcct ? `${acctCount} account${acctCount > 1 ? 's' : ''} linked` : 'No account linked'}
          · <span style="color:${isActive ? '#16a34a' : '#dc2626'}">${isActive ? 'Active' : 'Inactive'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

let ooFilter = 'all';
let ooSort   = 'most-evals';
let ooSearch = '';

function renderOfficeOverview() {
  const el = document.getElementById('office-overview-grid');
  if (!officesData.length) {
    el.innerHTML = '<div style="color:#94a3b8;font-family:\'DM Sans\',sans-serif;font-size:13px;padding:12px 0;">No offices yet.</div>';
    return;
  }

  function cleanAvg(evals) {
    let sum = 0, count = 0;
    evals.forEach(e => { for (let i = 1; i <= 5; i++) { const v = Number(e[`cleanlinessRating${i}`]); if (v > 0) { sum += v; count++; } } });
    return count > 0 ? sum / count : null;
  }
  function facAvg(evals) {
    let sum = 0, count = 0;
    evals.forEach(e => { for (let i = 1; i <= 8; i++) { const v = Number(e[`facilitiesRating${i}`]); if (v > 0) { sum += v; count++; } } });
    return count > 0 ? sum / count : null;
  }
  function ratingColor(v) {
    if (v === null) return '#94a3b8';
    if (v >= 4) return '#16a34a';
    if (v >= 3) return '#2563eb';
    if (v >= 2) return '#f59e0b';
    return '#dc2626';
  }
  function ratingEmoji(v) {
    if (v === null) return '❓';
    if (v >= 4) return '😄';
    if (v >= 3) return '😊';
    if (v >= 2) return '😟';
    return '😢';
  }

  // Build enriched list first so we can sort/filter
  let list = officesData.map(o => {
    const name     = o.name || '(unnamed)';
    const isActive = (o.status || 'active') === 'active';
    const evals    = evalsData.filter(e => e.officeName === name);
    const count    = evals.length;
    const pending  = evals.filter(e => (e.status || '') === 'pending').length;
    const ca       = cleanAvg(evals);
    const fa       = facAvg(evals);
    let oSum = 0, oCount = 0;
    if (ca !== null) { oSum += ca; oCount++; }
    if (fa !== null) { oSum += fa; oCount++; }
    const overall  = oCount > 0 ? oSum / oCount : null;
    return { o, name, isActive, evals, count, pending, cleanA: ca, facA: fa, overall };
  });

  // Filter
  if (ooFilter === 'active')   list = list.filter(d => d.isActive);
  if (ooFilter === 'inactive') list = list.filter(d => !d.isActive);

  // Search
  if (ooSearch.trim()) {
    const q = ooSearch.trim().toLowerCase();
    list = list.filter(d => d.name.toLowerCase().includes(q));
  }

  // Sort
  if (ooSort === 'most-evals')    list.sort((a, b) => b.count - a.count);
  else if (ooSort === 'highest-avg') list.sort((a, b) => (b.overall ?? -1) - (a.overall ?? -1));
  else if (ooSort === 'lowest-avg')  list.sort((a, b) => (a.overall ?? 99) - (b.overall ?? 99));
  else if (ooSort === 'name-az')     list.sort((a, b) => a.name.localeCompare(b.name));
  else if (ooSort === 'pending-first') list.sort((a, b) => b.pending - a.pending);

  if (!list.length) {
    el.innerHTML = '<div style="color:#94a3b8;font-family:\'DM Sans\',sans-serif;font-size:13px;padding:12px 0;">No offices match the current filter.</div>';
    return;
  }

  el.innerHTML = list.map(({ o, name, isActive, evals, count, pending, cleanA, facA, overall }) => {
    const satPct  = overall !== null ? Math.round((overall / 5) * 100) : null;

    // last eval date
    const lastTs  = evals.reduce((mx, e) => { const t = Number(e.timestamp || 0); return t > mx ? t : mx; }, 0);
    const lastDate = lastTs > 0
      ? new Date(lastTs).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      : null;

    const shortId   = o.id ? o.id.slice(0, 18) + (o.id.length > 18 ? '…' : '') : '—';
    const avgColor  = ratingColor(overall);
    const barColor  = satPct !== null
      ? (satPct >= 75 ? '#16a34a' : satPct >= 50 ? '#2563eb' : satPct >= 30 ? '#f59e0b' : '#dc2626')
      : '#e2e8f0';

    return `
      <div style="border:1.5px solid ${pending > 0 ? '#fde68a' : (isActive ? '#e2e8f0' : '#fecaca')};border-radius:16px;padding:18px;background:#fff;font-family:'DM Sans',sans-serif;position:relative;">
        <!-- Header -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#ede9fe,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">🏢</div>
            <div>
              <div style="font-weight:700;font-size:14px;color:#0f172a;line-height:1.3;">${name}</div>
              <div style="font-size:10px;color:#94a3b8;margin-top:1px;">ID: ${shortId}</div>
            </div>
          </div>
          <span style="padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;flex-shrink:0;${isActive ? 'background:#dcfce7;color:#166534;' : 'background:#fee2e2;color:#991b1b;'}">${isActive ? 'Active' : 'Inactive'}</span>
        </div>

        <!-- Stats row -->
        <div style="display:flex;gap:16px;margin-bottom:14px;">
          <div>
            <div style="font-size:22px;font-weight:800;color:#0f172a;line-height:1;">${count}</div>
            <div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;">Evaluations</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:800;color:${avgColor};line-height:1;">${overall !== null ? overall.toFixed(2) : '—'}</div>
            <div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;">Avg Rating</div>
          </div>
        </div>

        <!-- Section averages -->
        <div style="display:flex;gap:12px;margin-bottom:14px;">
          <div style="flex:1;background:#f8fafc;border-radius:10px;padding:10px;">
            <div style="font-size:18px;line-height:1;">${ratingEmoji(cleanA)} <span style="font-size:14px;font-weight:700;color:${ratingColor(cleanA)};">${cleanA !== null ? cleanA.toFixed(1) : '—'}</span></div>
            <div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-top:4px;">Cleanliness</div>
          </div>
          <div style="flex:1;background:#f8fafc;border-radius:10px;padding:10px;">
            <div style="font-size:18px;line-height:1;">${ratingEmoji(facA)} <span style="font-size:14px;font-weight:700;color:${ratingColor(facA)};">${facA !== null ? facA.toFixed(1) : '—'}</span></div>
            <div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-top:4px;">Facilities</div>
          </div>
        </div>

        <!-- Satisfaction bar -->
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
            <span style="font-size:11px;color:#64748b;">Overall satisfaction</span>
            <span style="font-size:12px;font-weight:700;color:${avgColor};">${satPct !== null ? satPct + '%' : '—'}</span>
          </div>
          <div style="height:7px;border-radius:999px;background:#f1f5f9;overflow:hidden;">
            <div style="height:100%;width:${satPct !== null ? satPct : 0}%;background:${barColor};border-radius:999px;transition:width .4s ease;"></div>
          </div>
        </div>

        <!-- Footer -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid #f1f5f9;">
          <span style="font-size:11px;color:#94a3b8;">${lastDate ? 'Last eval: ' + lastDate : 'No evaluations yet'}</span>
          ${pending > 0 ? `<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:#fef3c7;color:#b45309;">⏱ ${pending} pending</span>` : ''}
        </div>
      </div>`;
  }).join('');
}

function renderAll() { updateStats(); renderOfficeOverview(); renderAccountsTable(); renderOfficesCoverage(); }

// Office Overview toolbar interactivity
document.getElementById('oo-search').addEventListener('input', e => {
  ooSearch = e.target.value;
  renderOfficeOverview();
});

document.getElementById('oo-sort').addEventListener('change', e => {
  ooSort = e.target.value;
  renderOfficeOverview();
});

document.getElementById('oo-filter-btns').addEventListener('click', e => {
  const btn = e.target.closest('.oo-filter');
  if (!btn) return;
  ooFilter = btn.dataset.filter;
  document.querySelectorAll('.oo-filter').forEach(b => {
    const isActive = b === btn;
    b.style.background = isActive ? '#7c3aed' : 'transparent';
    b.style.color      = isActive ? '#fff' : '#374151';
  });
  renderOfficeOverview();
});

onSnapshot(fcOffices, snap => {
  officesData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAll();
});

onSnapshot(fcAccounts, snap => {
  accountsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAll();
});

onSnapshot(fcEvals, snap => {
  evalsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAll();
});
</script>
</body>
</html>

<style>


.page-sub {
  color: #64748b;
  font-size: 14px;
  margin-bottom: 24px;
}


.card {
  background: #fff;
  border-radius: 18px;
  padding: 18px;
  border: 1px solid #bae6fd;
  margin-bottom: 28px;
}

.card-title {
  font-size: 18px;
  font-weight: 700;
}


.btn {
  border: none;
  cursor: pointer;
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}

.btn-primary {
  background: #2563eb;
  color: #fff;
}

.btn-secondary {
  background: #e2e8f0;
  color: #0f172a;
}

.btn:hover {
  opacity: 0.92;
}


.filter-row {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.filter-input,
.filter-select {
  height: 46px;
  border: 1px solid #dbe4ee;
  border-radius: 12px;
  padding: 0 16px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  background: #f8fafc;
  color: #0f172a;
  -webkit-appearance: none;
  appearance: none;
  box-sizing: border-box;
}

.filter-input {
  flex: 1;
  min-width: 250px;
}

.filter-select {
  width: 220px;
}

.filter-input:focus,
.filter-select:focus {
  border-color: #2563eb;
  background: #fff;
}


.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.modern-table {
  width: 100%;
  border-collapse: collapse;
}

.modern-table th {
  text-align: left;
  font-size: 11px;
  color: #64748b;
  padding: 14px 10px;
  border-bottom: 1px solid #e2e8f0;
  white-space: nowrap;
}

.modern-table td {
  padding: 16px 10px;
  border-bottom: 1px solid #edf2f7;
  font-size: 13px;
  white-space: nowrap;
}

.modern-table tbody tr:hover {
  background: #f8fafc;
}

.txn-code {
  color: #2563eb;
  font-weight: 700;
}

.empty-row {
  text-align: center;
  padding: 40px !important;
  color: #94a3b8;
}


.btn-view {
  border: none;
  background: none;
  color: #2563eb;
  cursor: pointer;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  padding: 4px 8px;
}

.btn-view:hover {
  text-decoration: underline;
}


.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 24px;
}

.stat-card {
  position: relative;
  background: #ffffff;
  border: 1px solid #bae6fd;
  border-top: 4px solid var(--accent3, #2563eb);
  border-radius: 16px;
  padding: 20px 20px 22px;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.stat-card.blue {
  border-top-color: #2563eb;
}

.stat-card.green {
  border-top-color: #2563eb;
}

.stat-icon {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.stat-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.stat-value {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 30px;
  color: #0f172a;
  line-height: 1.1;
}

.stat-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: #94a3b8;
}


.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(15, 23, 42, 0.45);
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 16px;
  box-sizing: border-box;
}

.modal-content {
  background: #fff;
  padding: 28px;
  border-radius: 18px;
  width: 650px;
  max-width: 95vw;
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
  box-sizing: border-box;
}

.modal-content h3 {
  margin: 0 0 20px;
  font-size: 18px;
  color: #0f172a;
}


.modal-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid #f1f5f9;
  font-size: 14px;
  gap: 20px;
}

.modal-row:last-of-type {
  border-bottom: none;
}

.modal-label {
  color: #64748b;
  font-weight: 600;
  width: 170px;
  min-width: 170px;
  flex-shrink: 0;
}

.modal-value {
  color: #0f172a;
  font-weight: 500;
  word-break: break-word;
  text-align: right;
  flex: 1;
}


.modal-footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 20px;
}


.loading-row td {
  text-align: center;
  padding: 40px !important;
  color: #94a3b8;
  font-style: italic;
}


.modal-content::-webkit-scrollbar {
  width: 7px;
}

.modal-content::-webkit-scrollbar-track {
  background: #f1f5f9;
  border-radius: 10px;
}

.modal-content::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 10px;
}

.modal-content::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}


@media (max-width: 1200px) {

  .stat-value {
    font-size: 30px;
  }

}

@media (max-width: 1024px) {

  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 900px) {

  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 768px) {

  .stat-grid {
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .filter-row {
    flex-direction: column;
  }

  .filter-input,
  .filter-select {
    width: 100%;
  }

  .modal-content {
    padding: 20px;
    width: 95vw;
  }

  .modal-row {
    gap: 12px;
  }

  }

}

@media (max-width: 600px) {

  .stat-card {
    padding: 16px 16px 18px;
  }

  .stat-value {
    font-size: 26px;
  }

  .stat-icon {

    font-size: 14px;

    right: 14px;
  }

  .modal-content {
    padding: 18px;
  }

  .modal-row {

  }

  .modal-label {
    width: 100%;

  }

  .modal-value {

  }

}

@media (max-width: 480px) {

  .stat-grid {
    grid-template-columns: 1fr;
  }

  .stat-value {

  }

}

@media (max-width: 360px) {

  .stat-grid {
    gap: 10px;
  }

  }

</style>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAnalytics
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

  apiKey:
    "AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",

  authDomain:
    "kristal-adb78.firebaseapp.com",

  databaseURL:
    "https://kristal-adb78-default-rtdb.firebaseio.com",

  projectId:
    "kristal-adb78",

  storageBucket:
    "kristal-adb78.firebasestorage.app",

  messagingSenderId:
    "1016283938031",

  appId:
    "1:1016283938031:web:54c4d13409d9784ad7af1a",

  measurementId:
    "G-LK8D1CBQ2J"

};



const app =
  initializeApp(firebaseConfig);

const analytics =
  getAnalytics(app);

const db =
  getFirestore(app);



document.getElementById(
  "sidebar-mount"
).innerHTML =
  buildSidebar(
    "admin1",
    "eval-mgmt"
  );


document.getElementById(
  "topbar-mount"
).innerHTML =
  buildTopbar(
    "Evaluation Management",
    "admin1"
  );



const table =
  document.getElementById(
    "evaluationTable"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const officeFilter =
  document.getElementById(
    "officeFilter"
  );



let allData = {};


const evaluationsCol =
  collection(
    db,
    "services",
    "evaluations",
    "records"
  );


const officesCol =
  collection(
    db,
    "services",
    "offices",
    "records"
  );



onSnapshot(
  officesCol,
  (snapshot) => {

    const prevValue =
      officeFilter.value;

    officeFilter.innerHTML =
      `<option value="">All Offices</option>`;

    if (snapshot.empty) {
      return;
    }

    const names = [];

    snapshot.forEach(
      (docSnap) => {

        const data =
          docSnap.data();

        const name =
          data.name ||
          docSnap.id;

        if (name) {
          names.push(name);
        }

      }
    );

    names
      .sort(
        (a, b) =>
          a.localeCompare(b)
      )
      .forEach(
        (name) => {

          const opt =
            document.createElement(
              "option"
            );

          opt.value =
            name;

          opt.textContent =
            name;

          if (
            name === prevValue
          ) {
            opt.selected = true;
          }

          officeFilter.appendChild(
            opt
          );

        }
      );

  },

  (error) => {

    console.error(
      "Error loading offices:",
      error
    );

  }
);



onSnapshot(
  evaluationsCol,
  (snapshot) => {

    allData = {};

    snapshot.forEach(
      (docSnap) => {

        allData[
          docSnap.id
        ] = docSnap.data();

      }
    );

    updateSummaryStats();

    renderTable();

  },

  (error) => {

    console.error(
      "Error loading evaluations:",
      error
    );

    table.innerHTML = `
      <tr>
        <td
          colspan="15"
          class="empty-row"
        >
          Unable to load evaluations.
        </td>
      </tr>
    `;

  }
);



function updateSummaryStats() {

  const entries =
    Object.values(allData);

  document.getElementById(
    "statTotal"
  ).textContent =
    entries.length;


  document.getElementById(
    "statOffices"
  ).textContent =
    new Set(
      entries
        .map(
          e => e.office
        )
        .filter(Boolean)
    ).size;

}



function renderTable() {

  const search =
    searchInput.value
      .toLowerCase()
      .trim();

  const office =
    officeFilter.value;


  const filtered =
    Object.entries(allData)
      .filter(
        ([, item]) => {

          const matchSearch =
            JSON.stringify(item)
              .toLowerCase()
              .includes(search);

          const matchOffice =
            !office ||
            item.office === office;

          return (
            matchSearch &&
            matchOffice
          );

        }
      );



  filtered.sort(
    (a, b) => {

      const dateA =
        getDateValue(
          a[1].submittedAt ||
          a[1].date
        );

      const dateB =
        getDateValue(
          b[1].submittedAt ||
          b[1].date
        );

      return dateB - dateA;

    }
  );



  if (!filtered.length) {

    table.innerHTML = `
      <tr>
        <td
          colspan="15"
          class="empty-row"
        >
          No evaluations found.
        </td>
      </tr>
    `;

    return;

  }


  table.innerHTML =
    filtered
      .map(
        ([key, item], i) => {

          const sqd =
            Array.from(
              { length: 9 },
              (_, n) =>
                item[
                  `sqd${n}`
                ] ?? "-"
            );



          const dateDisplay =
            formatFirestoreValue(
              item.submittedAt
            );


          return `

            <tr>

              <td
                style="
                  color:#94a3b8;
                  font-size:12px;
                "
              >
                ${i + 1}
              </td>


              <td class="txn-code">
                ${escapeHTML(
                  item.transactionCode ||
                  item.code ||
                  "-"
                )}
              </td>


              <td>
                ${escapeHTML(
                  item.office ||
                  "-"
                )}
              </td>


              <td>
                ${escapeHTML(
                  sqd[0]
                )}
              </td>

              <td>
                ${escapeHTML(
                  sqd[1]
                )}
              </td>

              <td>
                ${escapeHTML(
                  sqd[2]
                )}
              </td>

              <td>
                ${escapeHTML(
                  sqd[3]
                )}
              </td>

              <td>
                ${escapeHTML(
                  sqd[4]
                )}
              </td>

              <td>
                ${escapeHTML(
                  sqd[5]
                )}
              </td>

              <td>
                ${escapeHTML(
                  sqd[6]
                )}
              </td>

              <td>
                ${escapeHTML(
                  sqd[7]
                )}
              </td>

              <td>
                ${escapeHTML(
                  sqd[8]
                )}
              </td>


              <td
                style="
                  max-width:160px;
                  overflow:hidden;
                  text-overflow:ellipsis;
                "
              >
                ${escapeHTML(
                  item.suggestions ||
                  "-"
                )}
              </td>


              <td>
                ${escapeHTML(
                  dateDisplay
                )}
              </td>


              <td>

                <button
                  class="btn-view"
                  onclick="openModal('${escapeAttribute(key)}')"
                >
                  View
                </button>

              </td>

            </tr>

          `;

        }
      )
      .join("");

}



function formatFirestoreValue(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "-";
  }



  if (
    typeof value === "object" &&
    value.seconds !== undefined
  ) {

    return new Date(
      value.seconds * 1000
    ).toLocaleString(
      "en-PH",
      {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

  }



  if (
    value instanceof Date
  ) {

    return value.toLocaleString(
      "en-PH"
    );

  }



  if (
    typeof value === "object"
  ) {

    try {

      return JSON.stringify(
        value
      );

    } catch (error) {

      return String(value);

    }

  }


  return String(value);

}



function getDateValue(value) {

  if (!value) {
    return 0;
  }



  if (
    typeof value === "object" &&
    value.seconds !== undefined
  ) {

    return (
      Number(value.seconds) *
      1000
    );

  }


  const parsed =
    new Date(value)
      .getTime();


  return isNaN(parsed)
    ? 0
    : parsed;

}


function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "-";
  }

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



function escapeAttribute(value) {

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}



window.openModal =
  (key) => {

    const item =
      allData[key];


    if (!item) {
      return;
    }



    const sqd =
      Array.from(
        { length: 9 },
        (_, n) =>
          item[
            `sqd${n}`
          ] ?? "-"
      );



    const rows = [


      [
        "Age",
        item.age
      ],

      [
        "Category",
        item.category
      ],

      [
        "Client Type",
        item.clientType
      ],

      [
        "Sex",
        item.sex
      ],

      [
        "Region",
        item.region
      ],



      [
        "Office",
        item.office
      ],

      [
        "Service Availed",
        item.serviceAvailed
      ],



      [
        "CC1",
        item.cc1
      ],

      [
        "CC2",
        item.cc2
      ],

      [
        "CC3",
        item.cc3
      ],



      [
        "SQD0",
        sqd[0]
      ],

      [
        "SQD1",
        sqd[1]
      ],

      [
        "SQD2",
        sqd[2]
      ],

      [
        "SQD3",
        sqd[3]
      ],

      [
        "SQD4",
        sqd[4]
      ],

      [
        "SQD5",
        sqd[5]
      ],

      [
        "SQD6",
        sqd[6]
      ],

      [
        "SQD7",
        sqd[7]
      ],

      [
        "SQD8",
        sqd[8]
      ],



      [
        "Evaluation ID",
        item.evaluationId ||
        key
      ],

      [
        "Submitted At",
        item.submittedAt
      ],

      [
        "Suggestions",
        item.suggestions
      ],



      [
        "Transaction Code",
        item.transactionCode ||
        item.code
      ],

      [
        "User ID",
        item.userId
      ]

    ];



    document.getElementById(
      "modalBody"
    ).innerHTML =

      rows
        .map(
          ([label, value]) => `

            <div class="modal-row">

              <span class="modal-label">
                ${escapeHTML(
                  label
                )}
              </span>

              <span class="modal-value">
                ${escapeHTML(
                  formatFirestoreValue(
                    value
                  )
                )}
              </span>

            </div>

          `
        )
        .join("");



    document.getElementById(
      "modal"
    ).style.display =
      "flex";

  };



window.closeModal =
  () => {

    document.getElementById(
      "modal"
    ).style.display =
      "none";

  };



document
  .getElementById("modal")
  .addEventListener(
    "click",
    (e) => {

      if (
        e.target ===
        e.currentTarget
      ) {

        closeModal();

      }

    }
  );



document.getElementById(
  "exportBtn"
).onclick = () => {


  const headers = [

    "#",

    "Age",

    "Category",

    "CC1",
    "CC2",
    "CC3",

    "Client Type",

    "Evaluation ID",

    "Office",

    "Region",

    "Service Availed",

    "Sex",

    "SQD0",
    "SQD1",
    "SQD2",
    "SQD3",
    "SQD4",
    "SQD5",
    "SQD6",
    "SQD7",
    "SQD8",

    "Submitted At",

    "Suggestions",

    "Transaction Code",

    "User ID"

  ];


  const rows =
    Object.values(
      allData
    ).map(
      (item, i) => {

        const sqd =
          Array.from(
            { length: 9 },
            (_, n) =>
              item[
                `sqd${n}`
              ] ?? ""
          );


        return [

          i + 1,

          item.age ??
            "",

          item.category ??
            "",

          item.cc1 ??
            "",

          item.cc2 ??
            "",

          item.cc3 ??
            "",

          item.clientType ??
            "",

          item.evaluationId ??
            "",

          item.office ??
            "",

          item.region ??
            "",

          item.serviceAvailed ??
            "",

          item.sex ??
            "",

          ...sqd,

          formatFirestoreValue(
            item.submittedAt
          ),

          item.suggestions ??
            "",

          item.transactionCode ??
            item.code ??
            "",

          item.userId ??
            ""

        ]
          .map(
            value =>
              `"${String(value)
                .replace(
                  /"/g,
                  '""'
                )}"`
          )
          .join(",");

      }
    );


  const csv =
    [
      headers.join(","),
      ...rows
    ].join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    "evaluations.csv";

  a.click();


  URL.revokeObjectURL(
    url
  );

};



document.getElementById(
  "refreshBtn"
).onclick = () =>
  location.reload();



searchInput.addEventListener(
  "input",
  renderTable
);



officeFilter.addEventListener(
  "change",
  renderTable
);

</script>

</body>
</html>

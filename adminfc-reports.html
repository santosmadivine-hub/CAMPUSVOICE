<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Reports | Admin FC</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @media print {
    @page { size: A4; margin: 0; }
    #sidebar-mount, #topbar-mount, .filter-row, .stats-row, .saved-reports-section, #rsCard { display: none !important; }
    .preview-bar { display: none !important; }
    #reportPreview { border: none !important; border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; }
    .report-section { break-inside: avoid; }
    .report-page-2 { border-top: none !important; margin-top: 0 !important; padding-top: 0 !important; }
    .page-break-label { display: none !important; }
    body, .layout, .main { margin: 0 !important; padding: 0 !important; }
    .official-report {
      min-height: 296mm !important;
      height: 296mm !important;
      overflow: hidden;
      page-break-inside: avoid;
    }
    .page-content-wrap { margin: 0 !important; padding: 0 !important; }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
  }

  .filter-row {
    display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
    background: #ffffff; border-radius: 12px; padding: 18px; border: 1px solid #bae6fd;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }
  .filter-select, .filter-date {
    padding: 10px 14px; border: 1px solid #bae6fd; border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; background: #f8fafc; cursor: pointer; color: #0f172a;
  }
  .filter-select:focus, .filter-date:focus { outline: none; border-color: #0284c7; }
  .filter-date { cursor: text; }
  .filter-select { flex: 1; min-width: 160px; }

  .btn-generate, .btn-save, .btn-print {
    border: none; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #fff;
    cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn-generate { padding: 10px 18px; background: #2563eb; border-radius: 10px; }
  .btn-generate:hover { background: #1d4ed8; }
  .btn-save { padding: 10px 18px; background: #16a34a; border-radius: 10px; }
  .btn-save:hover { background: #15803d; }
  .btn-save:disabled, .btn-print:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn-print { padding: 8px 14px; background: #0284c7; border-radius: 8px; }
  .btn-print:hover { background: #0369a1; }

  .empty-state { text-align: center; color: #94a3b8; padding: 40px 0; font-family: 'DM Sans', sans-serif; }

  .page-break-label {
    text-align: center; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; margin: 8px 0;
  }
  .report-page-2 { page-break-before: always; border-top: 2px dashed #bae6fd; padding-top: 24px; margin-top: 8px; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
  .stat-card {
    position: relative; background: #ffffff; border: 1px solid #bae6fd; border-top: 4px solid #2563eb;
    border-radius: 16px; padding: 20px 20px 22px; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat-card::before {
    content: attr(data-icon); position: absolute; top: 18px; right: 18px; width: 38px; height: 38px;
    border-radius: 10px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .stat-label {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #64748b;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 700; color: #0f172a; line-height: 1.1; }

  #reportPreview {
    display: none; background: #fff; border: 1px solid #bae6fd; border-radius: 12px;
    overflow: hidden; margin-bottom: 32px;
  }

  .preview-bar {
    display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: #f0f9ff;
    border-bottom: 1px solid #bae6fd; flex-wrap: wrap;
  }
  .preview-bar .preview-label { flex: 1; font-size: 13px; font-weight: 700; color: #0c4a6e; }
  .btn-close {
    background: #e2e8f0; color: #475569; border: none; border-radius: 8px; padding: 8px 14px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-close:hover { background: #cbd5e1; }

  .report-section { background: #fff; border-radius: 12px; padding: 32px; margin-bottom: 32px; border: 1px solid #bae6fd; }

  .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-family: 'DM Sans', sans-serif; }
  .report-table thead { background: #dbeafe; color: #1e40af; }
  .report-table th { padding: 14px 16px; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .report-table td { padding: 14px 16px; border-bottom: 1px solid #bae6fd; font-size: 13px; }
  .report-table tbody tr:last-child td { border-bottom: none; }
  .report-table tbody tr:hover { background: #f0f9ff; }
  .dimension-name { font-weight: 600; color: #0f1b32; }
  .percentage { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: #0f1b32; }

  .rating-badge {
    display: inline-flex; align-items: center; justify-content: center; padding: 6px 12px;
    border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .rating-outstanding { background: #d1fae5; color: #065f46; }
  .rating-very-satisfactory { background: #dbeafe; color: #1e40af; }
  .rating-satisfactory { background: #fef3c7; color: #92400e; }
  .rating-poor { background: #fee2e2; color: #991b1b; }
  .no-data-message { text-align: center; padding: 24px; color: #94a3b8; font-style: italic; }

  .saved-reports-section {
    background: #ffffff; border-radius: 12px; padding: 24px; border: 1px solid #bae6fd;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }
  .saved-reports-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .saved-reports-header h2 {
    font-family: 'Syne', sans-serif; font-size: 18px; color: #0f1b32; margin: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .saved-reports-count {
    background: #dbeafe; color: #0c4a6e; font-family: 'DM Sans', sans-serif; font-size: 12px;
    font-weight: 700; padding: 5px 12px; border-radius: 999px;
  }
  .saved-reports-table { width: 100%; border-collapse: collapse; font-family: 'DM Sans', sans-serif; }
  .saved-reports-table th {
    text-align: left; padding: 14px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: #475569; border-bottom: 2px solid #bae6fd; background: #f0f9ff;
  }
  .saved-reports-table td { padding: 14px 16px; font-size: 13px; color: #334155; border-bottom: 1px solid #f0f9ff; }
  .saved-reports-table tbody tr:last-child td { border-bottom: none; }
  .saved-reports-table tbody tr:hover { background: #f0f9ff; }
  .saved-office-name { font-weight: 700; color: #0f1b32; }
  .saved-avg { font-family: 'Syne', sans-serif; font-weight: 700; }
  .saved-comments-count { font-family: 'Syne', sans-serif; font-weight: 700; color: #7c3aed; }
  .action-btns { display: flex; gap: 8px; align-items: center; }
  .btn-view {
    background: #dbeafe; color: #1e40af; border: none; border-radius: 8px; padding: 7px 14px;
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-view:hover { background: #bfdbfe; }

  .official-report {
    display: flex; flex-direction: column; background: #fff; font-family: 'Times New Roman', Times, serif;
    color: #000; line-height: 1.5; width: 100%; max-width: 210mm; min-height: 297mm; margin: 0 auto;
    box-sizing: border-box; padding: 10px 40px 20px;
  }
  .lh-row { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 4px; }
  .lh-logo-box, .lh-seal-box { width: 110px; height: 100px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .lh-logo-box img, .lh-seal-box img { width: 100%; height: 100%; object-fit: contain; }
  .lh-text { flex: 1; text-align: center; line-height: 1.35; font-size: 11pt; }
  .lh-text .rep { font-size: 9.5pt; color: #1a3a6b; }
  .lh-text .uni { font-size: 11.5pt; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1px; color: #000000; line-height: 1.25; display: inline-block; margin: 2px 0; }
  .lh-text .dept { font-size: 11pt; font-weight: bold; text-transform: uppercase; color: #000000; }
  .lh-text .addr { font-size: 8.5pt; color: #64748b; }
  .lh-divider { border: none; border-top: 2.5px solid #1a3a6b; margin: 2px 0 6px; }

  .official-title { text-align: center; font-size: 13.5pt; font-weight: bold; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .official-meta { font-size: 11.5pt; line-height: 1.5; margin-bottom: 8px; }
  .official-meta b { font-weight: bold; }
  .official-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 11pt; border: 1px solid #a9c2e0; }
  .official-table th { background: #1e3a5f; color: #ffffff; padding: 7px 11px; border: 1px solid #a9c2e0; text-align: center; font-weight: bold; font-size: 10.5pt; }
  .official-table td { border: 1px solid #cddcef; padding: 6px 11px; vertical-align: middle; font-size: 10.5pt; }
  .official-table tbody tr:nth-child(even) td { background: #eef2f9; }
  .official-table .dim-cell { color: #000000; font-weight: 500; }
  .official-narrative { font-size: 11pt; line-height: 1.5; text-align: justify; margin-bottom: 10px; }
  .official-narrative p { margin-bottom: 6px; }

  .official-signatures { display: flex; gap: 24px; margin-top: 8px; font-size: 10pt; }
  .sig-block { flex: 1; }
  .sig-label { color: #555; font-size: 9.5pt; margin-bottom: 6px; }
  .sig-line { border-top: 1px solid #000; width: 100%; margin-bottom: 4px; }
  .sig-name { font-weight: bold; text-transform: uppercase; padding-top: 0; display: inline-block; font-size: 10pt; }
  .sig-title { font-size: 9pt; font-style: italic; color: #333; margin-top: 0; line-height: 1.2; }

  .official-footer { margin-top: auto; padding-top: 6px; display: block; width: 100%; }
  .official-footer img { display: block; width: 100%; height: auto; object-fit: contain; }
  .official-footer .official-signatures { margin-top: 0; margin-bottom: 10px; }

  @media (max-width: 1200px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 768px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .filter-row { flex-direction: column; align-items: stretch; }
    .filter-select { width: 100%; min-width: unset; }
    .filter-date { width: 100%; }
    .btn-generate, .btn-save { width: 100%; justify-content: center; }
  }
  @media (max-width: 600px) {
    .stats-row { grid-template-columns: 1fr; gap: 12px; }
    .stat-card { padding: 16px 16px 18px; }
    .stat-value { font-size: 26px; }
    .stat-card::before { width: 32px; height: 32px; font-size: 14px; top: 14px; right: 14px; }
  }

  @keyframes cvRise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .stat-card, .filter-row, .saved-reports-section { animation: cvRise .5s cubic-bezier(.2,.7,.2,1) backwards; }
  .stat-card:nth-child(2) { animation-delay: .06s; }
  .stat-card:nth-child(3) { animation-delay: .12s; }
  .stat-card:nth-child(4) { animation-delay: .18s; }
  .filter-row { animation-delay: .24s; }
  .saved-reports-section { animation-delay: .30s; }

  .stat-card {
    background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%); overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .stat-card::after {
    content: ""; position: absolute; right: -30px; bottom: -30px; width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,.10), transparent 70%);
    transition: transform .35s ease; pointer-events: none;
  }
  .stat-card:nth-child(2)::after { background: radial-gradient(circle, rgba(16,185,129,.12), transparent 70%); }
  .stat-card:nth-child(3)::after { background: radial-gradient(circle, rgba(239,68,68,.12), transparent 70%); }
  .stat-card:nth-child(4)::after { background: radial-gradient(circle, rgba(139,92,246,.12), transparent 70%); }
  .stat-card:hover { transform: translateY(-6px); border-color: #7dd3fc; box-shadow: 0 14px 30px rgba(37,99,235,.16); }
  .stat-card:hover::after { transform: scale(1.5); }
  .stat-card::before { transition: transform .3s ease, background .3s ease; }
  .stat-card:hover::before { background: #dbeafe; transform: rotate(-8deg) scale(1.12); }
  .stat-value { transition: color .25s ease; }
  .stat-card:hover .stat-value { color: #2563eb; }
  .stat-card:nth-child(2):hover .stat-value { color: #059669; }
  .stat-card:nth-child(3):hover .stat-value { color: #dc2626; }
  .stat-card:nth-child(4):hover .stat-value { color: #7c3aed; }

  .filter-row { transition: box-shadow .25s ease, border-color .25s ease; }
  .filter-row:hover { border-color: #7dd3fc; box-shadow: 0 12px 28px rgba(15,23,42,.08); }
  .filter-select, .filter-date { transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
  .filter-select:hover, .filter-date:hover { border-color: #7dd3fc; }
  .filter-select:focus, .filter-date:focus { background: #ffffff; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); outline: none; }

  .btn-generate, .btn-save, .btn-print, .btn-close { transition: background .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease; }
  .btn-generate:hover:not(:disabled), .btn-save:hover:not(:disabled),
  .btn-print:hover:not(:disabled), .btn-close:hover:not(:disabled) { transform: translateY(-2px); }
  .btn-generate:active:not(:disabled), .btn-save:active:not(:disabled),
  .btn-print:active:not(:disabled), .btn-close:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
  .btn-generate { background: linear-gradient(160deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%); box-shadow: 0 4px 12px rgba(37,99,235,.28); }
  .btn-generate:hover:not(:disabled) { background: linear-gradient(160deg, #60a5fa 0%, #2563eb 55%, #1e40af 100%); box-shadow: 0 8px 18px rgba(37,99,235,.35); }
  .btn-save { background: linear-gradient(160deg, #22c55e 0%, #16a34a 55%, #15803d 100%); box-shadow: 0 4px 12px rgba(22,163,74,.28); }
  .btn-save:hover:not(:disabled) { background: linear-gradient(160deg, #4ade80 0%, #16a34a 55%, #166534 100%); box-shadow: 0 8px 18px rgba(22,163,74,.35); }
  .btn-save:disabled { background: #9ca3af; box-shadow: none; }
  .btn-print { background: linear-gradient(160deg, #0ea5e9 0%, #0284c7 55%, #0369a1 100%); box-shadow: 0 4px 12px rgba(2,132,199,.28); }
  .btn-print:hover:not(:disabled) { background: linear-gradient(160deg, #38bdf8 0%, #0284c7 55%, #075985 100%); box-shadow: 0 8px 18px rgba(2,132,199,.35); }
  .btn-print:disabled { background: #9ca3af; box-shadow: none; }
  .btn-close:hover { background: #fee2e2; color: #991b1b; box-shadow: 0 6px 14px rgba(220,38,38,.15); }

  #reportPreview { transition: box-shadow .25s ease, border-color .25s ease; max-width: 100%; overflow-x: auto; overflow-y: hidden; }
  #reportPreview:hover { border-color: #7dd3fc; box-shadow: 0 12px 28px rgba(15,23,42,.08); }
  #report-container { width: 210mm; margin: 0 auto; padding: 12px 0; }
  #report-container .official-report { width: 210mm; max-width: none; flex-shrink: 0; }
  #report-container .empty-state { width: 100%; box-sizing: border-box; }
  #report-container .page-break-label { width: 100%; }

  .saved-reports-section { transition: box-shadow .25s ease, border-color .25s ease; }
  .saved-reports-section:hover { border-color: #7dd3fc; box-shadow: 0 12px 28px rgba(15,23,42,.08); }
  .saved-reports-header h2 { transition: color .2s ease; }
  .saved-reports-section:hover .saved-reports-header h2 { color: #1d4ed8; }
  .saved-reports-count { transition: background .2s ease, transform .2s ease; }
  .saved-reports-section:hover .saved-reports-count { background: #bfdbfe; transform: scale(1.06); }

  #saved-reports-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .saved-reports-table { min-width: 900px; }

  .preview-bar .preview-label { min-width: 0; overflow-wrap: anywhere; transition: color .2s ease; }
  .preview-bar:hover .preview-label { color: #1d4ed8; }
  .filter-date, .filter-select { min-width: 0; }

  @media (max-width: 900px) {
    .page-content-wrap { padding: 0 12px 32px !important; margin-top: 16px !important; }
    .filter-row { padding: 14px; }
    .saved-reports-section { padding: 16px; }
  }
  @media (max-width: 768px) {
    .preview-bar { padding: 10px 12px; }
    .preview-bar .preview-label { flex: 1 1 100%; }
    .preview-bar > button { flex: 1 1 auto; justify-content: center; }
    .saved-reports-header { flex-wrap: wrap; gap: 8px; }
    .saved-reports-header h2 { font-size: 16px; }
  }
  @media (max-width: 480px) {
    .stat-card { padding-right: 56px; }
    .stat-label { font-size: 12px; }
    .page-content-wrap { padding: 0 8px 28px !important; }
  }

  @media print {
    .stat-card, .filter-row, .saved-reports-section { animation: none !important; }
    * { transition: none !important; }
    #reportPreview { overflow: visible !important; }
    #report-container { zoom: 1 !important; width: 210mm !important; padding: 0 !important; margin: 0 !important; }
    .cv-modal-backdrop { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stat-card, .filter-row, .saved-reports-section { animation: none; }
    * { transition: none !important; }
  }

  .btn-delete {
    width: 34px; height: 34px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff; color: #dc2626;
    border: 1.5px solid #fecaca; border-radius: 10px; cursor: pointer;
    transition: background .2s ease, color .2s ease, border-color .2s ease,
                transform .2s ease, box-shadow .2s ease;
  }
  .btn-delete .trash-lid { transform-origin: 6px 6px; transition: transform .25s ease; }
  .btn-delete:hover {
    background: #dc2626; color: #fff; border-color: #dc2626;
    transform: translateY(-2px); box-shadow: 0 6px 14px rgba(220, 38, 38, .3);
  }
  .btn-delete:hover .trash-lid { transform: rotate(-14deg) translateY(-1px); }
  .btn-delete:active { transform: translateY(0); box-shadow: none; background: #b91c1c; }
  .btn-delete:focus-visible { outline: 2px solid #dc2626; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .btn-delete, .btn-delete .trash-lid { transition: none !important; }
  }

  .cv-modal-backdrop {
    position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(15, 23, 42, .55); backdrop-filter: blur(4px);
    opacity: 0; transition: opacity .2s ease !important;
  }
  .cv-modal-backdrop.show { opacity: 1; }
  .cv-modal {
    position: relative; width: 100%; max-width: 400px; background: #fff; border-radius: 20px;
    padding: 32px 28px 24px; text-align: center; overflow: hidden;
    box-shadow: 0 24px 60px rgba(15, 23, 42, .3);
    transform: translateY(16px) scale(.96); transition: transform .25s cubic-bezier(.2,.9,.3,1.2) !important;
  }
  .cv-modal::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #f87171, #dc2626);
  }
  .cv-modal-backdrop.show .cv-modal { transform: translateY(0) scale(1); }
  .cv-modal-icon {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%;
    background: #fee2e2; color: #dc2626; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 8px #fef2f2;
  }
  .cv-modal h3 { margin: 0 0 8px; font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: #0f172a; }
  .cv-modal p { margin: 0 0 24px; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6; color: #64748b; }
  .cv-modal p b { color: #0f172a; font-weight: 700; }
  .cv-modal-actions { display: flex; gap: 10px; }
  .cv-modal-actions button {
    flex: 1; padding: 12px 16px; border-radius: 12px; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 700; cursor: pointer; border: 1.5px solid transparent;
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease !important;
  }
  .cv-modal-cancel { background: #fff; color: #475569; border-color: #e2e8f0 !important; }
  .cv-modal-cancel:hover { background: #f1f5f9; }
  .cv-modal-confirm { background: #dc2626; color: #fff; box-shadow: 0 6px 16px rgba(220, 38, 38, .3); }
  .cv-modal-confirm:hover { background: #b91c1c; transform: translateY(-2px); }

let facDimensions = [];  // { field, label }  — section=facilities

const RATING_SCALE = [
  { min: 90, label: "Outstanding",        class: "rating-outstanding" },
  { min: 75, label: "Very Satisfactory",  class: "rating-very-satisfactory" },
  { min: 60, label: "Satisfactory",       class: "rating-satisfactory" },
  { min: 0,  label: "Needs Improvement",  class: "rating-poor" }
];

// ======================
// HELPERS
// ======================
function getRatingLabel(percentage) {
  for (const r of RATING_SCALE) if (percentage >= r.min) return { label: r.label, class: r.class };
  return { label: "Needs Improvement", class: "rating-poor" };
}

function parseEvalTimestamp(ev) {
  if (ev.timestamp !== undefined && ev.timestamp !== null && ev.timestamp !== "") {
    const t = Number(ev.timestamp);
    if (!Number.isNaN(t) && t > 0) return t;
  }
  if (ev.date) {
    if (typeof ev.date === "object" && typeof ev.date.toMillis === "function") return ev.date.toMillis();
    const p = new Date(ev.date).getTime();
    if (!Number.isNaN(p)) return p;
  }
  return 0;
}

function parseDateOnly(value) {
  if (!value) return null;
  const str = String(value).trim();
  const iso = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);
  if (iso) {
    const dt = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
    return isNaN(dt.getTime()) ? null : dt;
  }
  const p = new Date(str);
  if (isNaN(p.getTime())) return null;
  return new Date(p.getFullYear(), p.getMonth(), p.getDate());
}

function getCommentText(item, field) {
  const v = item[field];
  return (typeof v === "string" && v.trim()) ? v.trim() : "";
}

function evalAvgScore(e) {
  const ratings = [];
  for (const key of Object.keys(e)) {
    if (/^(cleanliness|facilities)Rating\d+$/.test(key)) {
      const v = Number(e[key]);
      if (v > 0) ratings.push(v);
    }
  }
  return ratings.length ? ratings.reduce((s, v) => s + v, 0) / ratings.length : 0;
}

function populateOfficeFilter() {
  const sel = document.getElementById("location-filter");

}

onSnapshot(collection(db, QUESTIONS_COLLECTION), snap => {

    .filter(q => q.section === "cleanliness" && q.active !== false)
    .sort((a, b) => (a.order || 0) - (b.order || 0))
    .map((q, idx) => ({ field: `cleanlinessRating${idx + 1}`, label: q.label || `Q${idx + 1}` }));
  facDimensions = all
    .filter(q => q.section === "facilities" && q.active !== false)
    .sort((a, b) => (a.order || 0) - (b.order || 0))
    .map((q, idx) => ({ field: `facilitiesRating${idx + 1}`, label: q.label || `Q${idx + 1}` }));
}, err => console.error("Failed to load questions:", err));

// ======================
// LOAD: evaluations
// ======================
onSnapshot(collection(db, EVAL_COLLECTION), snap => {
  evaluations = snap.docs.map(d => {
    const ev = d.data();
    return { id: d.id, ...ev, timestamp: parseEvalTimestamp(ev) };
  });
  renderStats();
}, err => console.error("Failed to load evaluations:", err));

// ======================
// LOAD: saved reports
// ======================
onSnapshot(collection(db, SAVED_COLLECTION), snap => {
  savedReports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  savedReports.sort((a, b) => (b.savedOn || 0) - (a.savedOn || 0));

}, err => console.error("Failed to load saved reports:", err));

// ======================

function renderStats() {
  const total = evaluations.length;
  document.getElementById("stat-total").textContent = total;
  if (total === 0) {
    document.getElementById("stat-positive").textContent = "0";
    document.getElementById("stat-negative").textContent = "0";
    return;
  }
  document.getElementById("stat-positive").textContent = evaluations.filter(e => evalAvgScore(e) >= 4).length;
  document.getElementById("stat-negative").textContent = evaluations.filter(e => evalAvgScore(e) < 3).length;
}

// ======================
// NARRATIVE
// ======================
function generateNarrative(office, respondents, overallPct, clDimAvgs, facDimAvgs, category) {
  const s = window.ReportSettings.get();
  const orgLine = [s.orgName, s.campusName].filter(Boolean).join(" – ");
  const perfWord = overallPct >= 90 ? "outstanding" : overallPct >= 75 ? "very satisfactory" : overallPct >= 60 ? "satisfactory" : "needs improvement";
  const catLine = category ? ` (${category})` : "";

  const clPct = clDimAvgs.length ? clDimAvgs.reduce((s, d) => s + parseFloat(d.percentage), 0) / clDimAvgs.length : null;
  const facPct = facDimAvgs.length ? facDimAvgs.reduce((s, d) => s + parseFloat(d.percentage), 0) / facDimAvgs.length : null;
  const topCl = clDimAvgs.filter(d => parseFloat(d.percentage) >= 90).map(d => d.dimension);
  const topFac = facDimAvgs.filter(d => parseFloat(d.percentage) >= 90).map(d => d.dimension);
  const lowFac = facDimAvgs.filter(d => parseFloat(d.percentage) < 75).map(d => d.dimension);

  const p1 = `The <strong>Facilities and Cleanliness Evaluation Report${esc(catLine)}</strong> for <strong>${esc(office)}</strong>, ${esc(orgLine)}, summarizes data from <strong>${respondents}</strong> respondent(s), yielding an overall satisfaction rate of <strong>${overallPct.toFixed(2)}%</strong>, rated as <strong>${perfWord}</strong>.`;

  const clPart = clPct !== null
    ? `Cleanliness achieved <strong>${clPct.toFixed(1)}%</strong>${topCl.length ? `, excelling in: ${esc(topCl.join(", "))}` : ""}.`
    : "No cleanliness data was recorded for this period.";
  const facPart = facPct !== null
    ? `Facility Assessment achieved <strong>${facPct.toFixed(1)}%</strong>${topFac.length ? `, excelling in: ${esc(topFac.join(", "))}` : ""}${lowFac.length ? `. Areas for improvement include: ${esc(lowFac.join(", "))}` : ""}.`
    : "No facilities data was recorded for this period.";
  const p2 = `<strong>Section Results: </strong>${clPart} ${facPart}`;

  const p3 = `<strong>Overall</strong>, the office demonstrates <strong>${perfWord} standards</strong> in facilities and cleanliness management. Continued evaluation and targeted improvements in lower-scoring dimensions will help sustain and elevate the quality of service and environment for all users.`;

  return [p1, p2, p3];
}

// ======================
// PAGINATION HELPERS (identical to admin3)
// ======================
const MM_TO_PX = 96 / 25.4;
const A4_HEIGHT_PX = 297 * MM_TO_PX;
const PAGE_V_PADDING_PX = 10 + 20;
const PAGE_SAFETY_BUFFER_PX = 24;
const PAGE_CONTENT_WIDTH_PX = 210 * MM_TO_PX - 80;

let footerRatioCache = { src: null, ratio: null };

function preloadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function getFooterAspectRatio() {
  const rs = window.ReportSettings;
  await rs.loadReportSettings();
  const src = rs.get().footerImage;
  if (!src) return null;
  if (footerRatioCache.src === src) return footerRatioCache.ratio;
  const dims = await preloadImage(src);
  const ratio = (dims && dims.w) ? (dims.h / dims.w) : 0.18;
  footerRatioCache = { src, ratio };
  return ratio;
}

function buildFooterInnerHtml(ratio, src) {
  if (!src) return "";
  const r = ratio || 0.18;
  const h = Math.round(PAGE_CONTENT_WIDTH_PX * r);
  return `<img src="${esc(src)}" alt="Footer" crossorigin="anonymous" style="display:block;width:100%;height:${h}px;object-fit:contain;">`;
}

function withMeasuringPage(fn) {
  const root = document.createElement("div");
  root.style.cssText = "position:fixed;left:-99999px;top:0;width:210mm;visibility:hidden;pointer-events:none;";
  const page = document.createElement("div");
  page.className = "official-report";
  page.style.minHeight = "0";
  page.style.height = "auto";
  root.appendChild(page);
  document.body.appendChild(root);
  try { return fn(page); } finally { document.body.removeChild(root); }
}

function measureFragmentHeight(page, html) {
  page.innerHTML = html;
  return Math.max(page.getBoundingClientRect().height - PAGE_V_PADDING_PX, 0);
}

function measureRowHeights(page, theadHtml, rowHtmls) {
  page.innerHTML = `<table class="official-table">${theadHtml}<tbody>${rowHtmls.join("")}</tbody></table>`;
  return Array.from(page.querySelectorAll("tbody tr")).map(tr => tr.getBoundingClientRect().height);
}

function paginateReportDocument(idPrefix, buildChrome, theadHtml, rowHtmls, trailing, footerInnerHtml) {
  return withMeasuringPage(page => {
    const trailingBlocks = Array.isArray(trailing) ? trailing.filter(Boolean) : (trailing ? [trailing] : []);
    const footerHtml = `<div class="official-footer">${footerInnerHtml}</div>`;

    const chromeWithTableHeight = measureFragmentHeight(page, buildChrome(false) + `<table class="official-table">${theadHtml}<tbody></tbody></table>`);
    const chromeOnlyHeight = measureFragmentHeight(page, buildChrome(true));
    const footerHeight = measureFragmentHeight(page, footerHtml) || 60;
    const blockHeights = trailingBlocks.map(b => measureFragmentHeight(page, b));
    const rowHeights = measureRowHeights(page, theadHtml, rowHtmls);

    const capacityWithTable = Math.max(A4_HEIGHT_PX - PAGE_V_PADDING_PX - chromeWithTableHeight - footerHeight - PAGE_SAFETY_BUFFER_PX, 0);
    const capacityNoTable = Math.max(A4_HEIGHT_PX - PAGE_V_PADDING_PX - chromeOnlyHeight - footerHeight - PAGE_SAFETY_BUFFER_PX, 0);

    const pagesRows = [];
    let current = { rows: [], height: 0 };
    rowHtmls.forEach((rowHtml, i) => {
      const h = rowHeights[i] || 0;
      if (current.rows.length > 0 && current.height + h > capacityWithTable) {
        pagesRows.push(current);
        current = { rows: [], height: 0 };
      }
      current.rows.push(rowHtml);
      current.height += h;
    });
    pagesRows.push(current);

    const pages = [];

    pagesRows.slice(0, -1).forEach((bucket, idx) => {
      const isContinuation = idx > 0;
      const id = idx === 0 ? idPrefix : `${idPrefix}_${idx + 1}`;
      pages.push({ id, html: `
        <div class="official-report" id="${id}">
          ${buildChrome(isContinuation)}
          <table class="official-table">${theadHtml}<tbody>${bucket.rows.join("")}</tbody></table>
          ${footerHtml}
        </div>` });
    });

    const lastPageIdx = pagesRows.length - 1;
    const lastBucket = pagesRows[lastPageIdx];
    let blockIdx = 0;
    let leftover = capacityWithTable - lastBucket.height;
    const blocksOnLast = [];
    while (blockIdx < blockHeights.length && blockHeights[blockIdx] <= leftover) {
      blocksOnLast.push(trailingBlocks[blockIdx]);
      leftover -= blockHeights[blockIdx];
      blockIdx++;
    }
    const lastId = lastPageIdx === 0 ? idPrefix : `${idPrefix}_${lastPageIdx + 1}`;
    pages.push({ id: lastId, html: `
      <div class="official-report" id="${lastId}">
        ${buildChrome(lastPageIdx > 0)}
        <table class="official-table">${theadHtml}<tbody>${lastBucket.rows.join("")}</tbody></table>
        ${blocksOnLast.join("")}
        ${footerHtml}
      </div>` });

    while (blockIdx < blockHeights.length) {
      const pageBlocks = [];
      let remaining = capacityNoTable;
      while (blockIdx < blockHeights.length && (pageBlocks.length === 0 || blockHeights[blockIdx] <= remaining)) {
        pageBlocks.push(trailingBlocks[blockIdx]);
        remaining -= blockHeights[blockIdx];
        blockIdx++;
      }
      const id = `${idPrefix}_${pages.length + 1}`;
      pages.push({ id, html: `
        <div class="official-report" id="${id}">
          ${buildChrome(true)}
          ${pageBlocks.join("")}
          ${footerHtml}
        </div>` });
    }

    return pages;
  });
}

// ======================
// CREATE OFFICIAL DOCUMENT — PAGE 1 (dual-section ratings: Cleanliness + Facilities)
// ======================
function createOfficialDocument(report, footerRatio) {
  const rs = window.ReportSettings;
  const s = rs.get();

  const reportStart = new Date(report.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const reportEnd   = new Date(report.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

  const narrative = generateNarrative(report.office, report.respondents, parseFloat(report.avgSatisfaction), report.clDimAvgs, report.facDimAvgs, report.category);

  const catMeta = report.category ? `<br><b>Category:</b> ${esc(report.category)}` : "";

  const buildChrome = (isContinuation) => `
    ${rs.headerHtml(s, null)}
    ${isContinuation ? "" : `
    ${titleHtml(s.reportTitle)}
    <div class="official-meta">
      <b>Office:</b> ${esc(rs.officeLine(report.office, s))}${catMeta}<br>
      <b>Covered Period:</b> ${esc(reportStart)} – ${esc(reportEnd)}<br>
      <b>No. of Respondents:</b> ${report.respondents}
    </div>
    `}
  `;

  const theadHtml = `
    <thead><tr>
      <th style="width:55%;text-align:left;padding-left:10px;">Evaluation Question</th>
      <th style="width:22%;">Percentage (%)</th>
      <th style="width:23%;">Rating</th>
    </tr></thead>
  `;

  const SECTION_ROW_STYLE = `background:#0369a1;color:#fff;font-weight:bold;padding:7px 11px;border:1px solid #0369a1;`;

  const rowHtmls = [];
  if (report.clDimAvgs.length > 0) {
    rowHtmls.push(`<tr><td colspan="3" style="${SECTION_ROW_STYLE}">🧹 Section 1: Cleanliness${report.category ? ` — ${esc(report.category)}` : ""}</td></tr>`);
    report.clDimAvgs.forEach(d => rowHtmls.push(`
      <tr>
        <td class="dim-cell" style="padding-left:10px;">${esc(d.dimension)}</td>
        <td style="text-align:center;">${d.percentage}</td>
        <td style="text-align:center;">${d.rating.label}</td>
      </tr>`));
  }
  rowHtmls.push(`<tr><td colspan="3" style="${SECTION_ROW_STYLE}">🏢 Section 2: Facility Assessment</td></tr>`);
  if (report.facDimAvgs.length > 0) {
    report.facDimAvgs.forEach(d => rowHtmls.push(`
      <tr>
        <td class="dim-cell" style="padding-left:10px;">${esc(d.dimension)}</td>
        <td style="text-align:center;">${d.percentage}</td>
        <td style="text-align:center;">${d.rating.label}</td>
      </tr>`));
  } else {
    rowHtmls.push(`<tr><td colspan="3" style="text-align:center;color:#777;font-style:italic;padding:12px;">No facility ratings recorded for this period.</td></tr>`);
  }

  const trailingBlocks = narrative.map(p => `<div class="official-narrative"><p>${p}</p></div>`);
  const footerInnerHtml = rs.signaturesHtml(s) + buildFooterInnerHtml(footerRatio, s.footerImage);

  return paginateReportDocument("fcrPage", buildChrome, theadHtml, rowHtmls, trailingBlocks, footerInnerHtml);
}

// ======================
// CREATE COMMENTS DOCUMENT — PAGE 2 (both sections, 3 columns)
// ======================
function createCommentsDocument(report, footerRatio) {
  const rs = window.ReportSettings;
  const s = rs.get();

  const reportStart = new Date(report.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const reportEnd   = new Date(report.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const comments = report.comments || [];
  const commentsCount = report.commentsCount ?? comments.length;
  const catMeta = report.category ? `<br><b>Category:</b> ${esc(report.category)}` : "";

  const rowHtmls = comments.length
    ? comments.map(c => `
        <tr>
          <td style="text-align:center;white-space:nowrap;">${c.timestamp ? new Date(c.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : "-"}</td>
          <td style="text-align:center;white-space:nowrap;">${c.section === "Cleanliness" ? "🧹 Cleanliness" : "🏢 Facilities"}</td>
          <td style="padding-left:8px;">${esc(c.text)}</td>
        </tr>`)
    : [`<tr><td colspan="3" style="text-align:center;color:#777;font-style:italic;padding:18px;">No comments or suggestions were submitted for this period.</td></tr>`];

  const summaryLine = commentsCount
    ? `During the covered period, the <strong>${esc(report.office)}</strong> received <strong>${commentsCount}</strong> written comment(s) and suggestion(s) from <strong>${report.respondents}</strong> respondent(s). These qualitative responses provide additional context to the quantitative ratings and are provided here to support the office in identifying areas for improvement.`
    : `No written comments or suggestions were submitted by respondents of <strong>${esc(report.office)}</strong> during the covered period.`;

  const buildChrome = (isContinuation) => `
    ${rs.headerHtml(s, null)}
    ${titleHtml(s.commentsTitle, isContinuation ? " (Continued)" : "")}
    <div class="official-meta">
      <b>Office:</b> ${esc(rs.officeLine(report.office, s))}${catMeta}<br>
      <b>Covered Period:</b> ${esc(reportStart)} – ${esc(reportEnd)}<br>
      <b>No. of Respondents:</b> ${report.respondents}<br>
      <b>No. of Comments/Suggestions Received:</b> ${commentsCount}
    </div>
  `;

  const theadHtml = `
    <thead><tr>
      <th style="width:16%;">Date</th>
      <th style="width:18%;">Section</th>
      <th style="text-align:left;padding-left:8px;">Comment / Suggestion</th>
    </tr></thead>
  `;

  const trailingHtml = `<div class="official-narrative"><p>${summaryLine}</p></div>`;
  const footerInnerHtml = rs.signaturesHtml(s) + buildFooterInnerHtml(footerRatio, s.footerImage);

  return paginateReportDocument("fccPage", buildChrome, theadHtml, rowHtmls, trailingHtml, footerInnerHtml);
}

// ======================
// BUILD FULL PREVIEW HTML
// ======================
async function buildReportPreviewHtml(report) {
  const footerRatio = await getFooterAspectRatio();
  const ratingsPages  = createOfficialDocument(report, footerRatio);
  const commentsPages = createCommentsDocument(report, footerRatio);

  let html = "";
  ratingsPages.forEach((p, idx) => {
    html += idx === 0 ? p.html : `<div class="report-page-2">${p.html}</div>`;
  });
  commentsPages.forEach((p, idx) => {
    if (idx === 0) html += `<div class="page-break-label">— Page ${ratingsPages.length + 1}: Comments &amp; Suggestions —</div>`;
    html += `<div class="report-page-2">${p.html}</div>`;
  });
  return html;
}

// ======================
// GENERATE REPORT
// ======================
async function generateReport() {
  if (!selectedOffice) { alert("Please select an office"); return; }
  if (!startDate || !endDate) { alert("Please select both start and end dates"); return; }

  const start = parseDateOnly(startDate);
  const end   = parseDateOnly(endDate);
  if (!start || !end) { alert("Invalid date range selected."); return; }

  start.setHours(0, 0, 0, 0);
  end.setHours(23, 59, 59, 999);
  const startTs = start.getTime();
  const endTs   = end.getTime();

  let filtered = evaluations.filter(e =>
    e.officeName === selectedOffice &&
    e.timestamp >= startTs &&
    e.timestamp <= endTs
  );

  if (selectedCategory) {
    filtered = filtered.filter(e => e.cleanlinessCategory === selectedCategory);
  }

  renderStats();

  if (filtered.length === 0) {
    document.getElementById("report-container").innerHTML = `<div class="empty-state">No evaluations found for the selected filters.</div>`;
    currentReport = null;
    document.getElementById("btn-save-report").disabled = true;
    document.getElementById("btn-print-report").disabled = true;
    document.getElementById("reportPreview").style.display = "block";
    fitReportToScreen();
    return;
  }

  // Compute per-dimension averages
  function dimAvgs(dims) {
    return dims.map(dim => {
      const values = filtered.map(e => Number(e[dim.field])).filter(v => v > 0);
      if (!values.length) return null;
      const avg = values.reduce((a, b) => a + b, 0) / values.length;
      const pct = (avg / 5) * 100;
      return { dimension: dim.label, percentage: pct.toFixed(1), rating: getRatingLabel(pct) };
    }).filter(Boolean);
  }

  const clDimAvgs  = dimAvgs(clDimensions);
  const facDimAvgs = dimAvgs(facDimensions);
  const allDims    = [...clDimAvgs, ...facDimAvgs];
  const overallPct = allDims.length ? allDims.reduce((s, d) => s + parseFloat(d.percentage), 0) / allDims.length : 0;
  const overallRating = getRatingLabel(overallPct);

  // Gather comments from both sections
  const comments = [];
  filtered.forEach(e => {
    const cl  = getCommentText(e, "cleanlinessComments");
    const fac = getCommentText(e, "facilitiesComments");
    if (cl)  comments.push({ text: cl,  section: "Cleanliness", timestamp: e.timestamp });
    if (fac) comments.push({ text: fac, section: "Facilities",  timestamp: e.timestamp });
  });
  comments.sort((a, b) => a.timestamp - b.timestamp);

  currentReport = {
    office: selectedOffice,
    category: selectedCategory,
    startDate, endDate,
    respondents: filtered.length,
    avgSatisfaction: overallPct.toFixed(1),
    ratingLabel: overallRating.label,
    ratingClass: overallRating.class,
    clDimAvgs, facDimAvgs,
    commentsCount: comments.length,
    comments,
    generatedAt: new Date().toISOString()
  };

  document.getElementById("report-container").innerHTML = await buildReportPreviewHtml(currentReport);

  const catPart = selectedCategory ? ` [${selectedCategory}]` : "";
  document.getElementById("previewLabel").textContent = `📄 Report Preview — ${selectedOffice}${catPart}  (${startDate} → ${endDate})`;
  document.getElementById("reportPreview").style.display = "block";
  fitReportToScreen();
  document.getElementById("reportPreview").scrollIntoView({ behavior: "smooth", block: "start" });
  document.getElementById("btn-save-report").disabled = false;
  document.getElementById("btn-print-report").disabled = false;
}

// ======================
// CLOSE / FIT
// ======================
window.closeReport = () => {
  document.getElementById("reportPreview").style.display = "none";
};

function fitReportToScreen() {
  const preview   = document.getElementById("reportPreview");
  const container = document.getElementById("report-container");
  if (!preview || !container || preview.style.display === "none") return;
  container.style.zoom = 1;
  const pageWidthPx = 210 * MM_TO_PX;
  const available = preview.clientWidth - 16;
  container.style.zoom = Math.min(1, available / pageWidthPx);
}
window.fitReportToScreen = fitReportToScreen;
window.addEventListener("resize", fitReportToScreen);
window.addEventListener("beforeprint", () => { document.getElementById("report-container").style.zoom = 1; });
window.addEventListener("afterprint", fitReportToScreen);

// ======================
// EXPORT PDF
// ======================
window.exportPDF = async () => {
  if (document.getElementById("reportPreview").style.display === "none" || !currentReport) {
    alert("Please generate or view a report first.");
    return;
  }
  const reportContainer = document.getElementById("report-container");
  reportContainer.style.zoom = 1;

  const margin = 10, marginTop = 3, pageWidthMM = 210;
  const usableW = pageWidthMM - margin * 2;
  const { jsPDF } = window.jspdf;
  let pdf = null;

  async function addCanvasPage(el) {
    if (!el) return;
    let canvas;
    try {
      canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff", scrollX: 0, scrollY: -window.scrollY });
    } catch (err) {
      console.error(err);
      alert("⚠ PDF export blocked by the browser.\n\nPlease serve this page over HTTP.");
      throw err;
    }
    const img = canvas.toDataURL("image/png");
    const scale = usableW / canvas.width;
    const pdfH = canvas.height * scale;
    const pageHeightMM = pdfH + marginTop + margin;
    if (!pdf) {
      pdf = new jsPDF({ unit: "mm", format: [pageWidthMM, pageHeightMM] });
    } else {
      pdf.addPage([pageWidthMM, pageHeightMM]);
    }
    pdf.addImage(img, "PNG", margin, marginTop, usableW, pdfH);
  }

  const pageElements = document.querySelectorAll("#report-container .official-report");
  try {
    for (const el of pageElements) await addCanvasPage(el);
  } catch (err) {
    fitReportToScreen();
    return;
  }
  fitReportToScreen();
  if (!pdf) { alert("Nothing to export."); return; }
  const name = (currentReport?.office || "report").replace(/\s+/g, "_");
  pdf.save(`FCER_Report_${name}.pdf`);
};

// ======================
// SAVE REPORT
// ======================
function saveReport() {
  if (!currentReport) return;
  addDoc(collection(db, SAVED_COLLECTION), { ...currentReport, savedOn: Date.now() })
    .then(() => { document.getElementById("btn-save-report").disabled = true; })
    .catch(err => alert("Could not save report: " + err.message));
}

// ======================
// PRINT REPORT
// ======================
function printReport() {
  if (document.getElementById("reportPreview").style.display === "none" || !currentReport) {
    alert("Please generate or view a report first.");
    return;
  }
  window.print();
}

async function viewSavedReport(id) {
  const r = savedReports.find(sr => sr.id === id);
  if (!r) return;
  document.getElementById("report-container").innerHTML = await buildReportPreviewHtml(r);
  const catPart = r.category ? ` [${r.category}]` : "";
  document.getElementById("previewLabel").textContent = `📄 Report Preview — ${r.office}${catPart}  (${r.startDate} → ${r.endDate})`;
  document.getElementById("reportPreview").style.display = "block";
  fitReportToScreen();
  document.getElementById("reportPreview").scrollIntoView({ behavior: "smooth", block: "start" });
  document.getElementById("location-filter").value = r.office;
  document.getElementById("start-date").value = r.startDate;
  document.getElementById("end-date").value = r.endDate;
  document.getElementById("category-filter").value = r.category || "";
  selectedOffice   = r.office;
  startDate        = r.startDate;
  endDate          = r.endDate;
  selectedCategory = r.category || "";
  currentReport = r;
  document.getElementById("btn-save-report").disabled = true;
  document.getElementById("btn-print-report").disabled = false;
}

// ======================
// DELETE CONFIRM MODAL
// ======================
function confirmDeleteModal({ title, name, confirmText = "Delete" }) {
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "cv-modal-backdrop";
    backdrop.innerHTML = `
      <div class="cv-modal" role="alertdialog" aria-modal="true" aria-labelledby="cvModalTitle">
        <div class="cv-modal-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>
          </svg>
        </div>
        <h3 id="cvModalTitle"></h3>
        <p>Are you sure you want to delete <b class="cv-name"></b>? This action cannot be undone.</p>
        <div class="cv-modal-actions">
          <button type="button" class="cv-modal-cancel">Cancel</button>
          <button type="button" class="cv-modal-confirm"></button>
        </div>
      </div>`;
    backdrop.querySelector("h3").textContent = title;
    backdrop.querySelector(".cv-name").textContent = name;
    backdrop.querySelector(".cv-modal-confirm").textContent = confirmText;
    document.body.appendChild(backdrop);
    requestAnimationFrame(() => backdrop.classList.add("show"));
    const close = result => {
      document.removeEventListener("keydown", onKey);
      backdrop.classList.remove("show");
      setTimeout(() => backdrop.remove(), 200);
      resolve(result);
    };
    const onKey = e => { if (e.key === "Escape") close(false); };
    document.addEventListener("keydown", onKey);
    backdrop.querySelector(".cv-modal-cancel").onclick = () => close(false);
    backdrop.querySelector(".cv-modal-confirm").onclick = () => close(true);
    backdrop.addEventListener("click", e => { if (e.target === backdrop) close(false); });
    backdrop.querySelector(".cv-modal-cancel").focus();
  });
}

async function deleteSavedReport(id) {
  const r = savedReports.find(sr => sr.id === id);
  const ok = await confirmDeleteModal({
    title: "Delete Report?",
    name: r ? `${r.office}${r.category ? " [" + r.category + "]" : ""} (${r.startDate} → ${r.endDate})` : "this report",
    confirmText: "Delete Report"
  });
  if (!ok) return;
  deleteDoc(doc(db, SAVED_COLLECTION, id)).catch(err => alert("Could not delete report: " + err.message));
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CampusVoice – Office Management | Admin 1</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<style>

.office-section {
  max-width: 1200px;
  margin: 0 auto;
}

.search-add-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.search-input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #bae6fd;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
  box-sizing: border-box;
  color: #1e293b;
  flex: 1;
  min-width: 0;
}
.search-input:focus { border-color: #0284c7; }
.search-input::placeholder { color: #94a3b8; }

.office-table-wrap {
  max-height: 600px;
  overflow-y: auto;
  border-radius: 12px;
  border: 1px solid #bae6fd;
}
.office-table-wrap::-webkit-scrollbar { width: 6px; }
.office-table-wrap::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 999px; }
.office-table-wrap::-webkit-scrollbar-track { background: transparent; }

.office-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

.office-table th {
  text-align: left;
  padding: 14px 16px;
  font-size: 11px;
  color: #475569;
  letter-spacing: .06em;
  text-transform: uppercase;
  border-bottom: 2px solid #bae6fd;
  background: #f0f9ff;
  position: sticky;
  top: 0;
  font-weight: 500;
}

.office-table td {
  padding: 14px 16px;
  border-bottom: 1px solid #f0f9ff;
  font-size: 14px;
  color: #1e293b;
}

.office-table tr:hover td {
  background: #f0f9ff;
}

.rating-cell {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 220px;
}

.rating-track {
  flex: 1;
  height: 8px;
  background: #bae6fd;
  border-radius: 999px;
  overflow: hidden;
  min-width: 130px;
}

.rating-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg,#0284c7,#0ea5e9);
  transition: width .6s ease;
}

.rating-number {
  font-weight: 700;
  color: #0c4a6e;
  width: 34px;
  flex-shrink: 0;
  text-align: right;
}

.eval-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  padding: 4px 10px;
  background: #e0f2fe;
  color: #0c4a6e;
  font-weight: 700;
  font-size: 13px;
  border-radius: 999px;
}

.action-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.action-btn {
  border: none;
  padding: 7px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  transition: opacity .2s, transform .2s;
}

.action-btn:hover {
  opacity: .85;
  transform: translateY(-1px);
}
.action-view { background: #dbeafe; color: #1e40af; }

.edit-btn {
  background: linear-gradient(160deg, #fef9e7 0%, #fef3c7 100%);
  color: #92400e;
  border: 1px solid #fde68a;
  box-shadow: 0 1px 2px rgba(146,64,14,.08);
}

.action-btn.edit-btn:hover {
  opacity: 1;
  background: linear-gradient(160deg, #fef3c7 0%, #fde68a 100%);
  border-color: #fbbf24;
  box-shadow: 0 3px 10px rgba(146,64,14,.2);
  transform: translateY(-1px);
}

.action-btn.edit-btn:active {
  transform: translateY(0);
  box-shadow: 0 1px 2px rgba(146,64,14,.15);
}

.action-btn.edit-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(217,119,6,.2), 0 1px 2px rgba(146,64,14,.15);
}

.delete-btn {
  background: #fee2e2;
  color: #991b1b;
}

.primary-btn {
  border: 1px solid rgba(255,255,255,.12);
  background: linear-gradient(160deg, #0ea5e9 0%, #0284c7 55%, #0369a1 100%);
  color: white;
  padding: 11px 18px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  letter-spacing: .01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 4px 12px rgba(2,132,199,.28), 0 1px 2px rgba(2,132,199,.35);
  transition: background .25s ease, box-shadow .2s ease, transform .15s ease;
  white-space: nowrap;
  flex-shrink: 0;
}

.primary-btn:hover {
  background: linear-gradient(160deg, #38bdf8 0%, #0369a1 55%, #075985 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 8px 20px rgba(2,132,199,.35), 0 2px 4px rgba(2,132,199,.4);
  transform: translateY(-1.5px);
}

.primary-btn:active {
  transform: translateY(0);
  box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 2px 6px rgba(2,132,199,.3);
}

.primary-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(2,132,199,.25), 0 4px 12px rgba(2,132,199,.28);
}

.dark-btn {
  border: none;
  background: #1e3a8a;
  color: white;
  padding: 11px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  box-shadow: 0 4px 12px rgba(30,58,138,.25);
  transition: background .2s, transform .2s;
}

.dark-btn:hover {
  background: #1e40af;
  transform: translateY(-1px);
}

.no-results {
  padding: 40px 20px;
  text-align: center;
  color: #64748b;
  font-size: 14px;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}

.header-title {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.header-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
  margin-bottom: 24px;
}

.stat-card{
  position:relative;
  background:#ffffff;
  border:1px solid #bae6fd;
  border-top:4px solid var(--accent3, #2563eb);
  border-radius:16px;
  padding:20px 20px 22px;
  box-shadow:0 4px 14px rgba(15,23,42,0.05);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.stat-card.blue{ border-top-color:#2563eb; }
.stat-card.green{ border-top-color:#2563eb; }

.stat-icon{
  position:absolute;
  top:18px;
  right:18px;
  width:38px;
  height:38px;
  border-radius:10px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.stat-label{
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.stat-value{
  font-family:'Syne',sans-serif;
  font-weight:700;
  font-size:30px;
  color:#0f172a;
  line-height:1.1;
  overflow-wrap:anywhere;
}

.stat-sub{
  font-family:'DM Sans',sans-serif;
  font-size:12px;
  color:#94a3b8;
}


.stat-value-text{
  font-size:20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #bae6fd;
}

@media (max-width: 1200px) {
  .stat-value {
    font-size: 30px;
  }
  .stat-value-text {
    font-size: 18px;
  }
}

@media (max-width: 1024px) {
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 900px) {
  .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 768px) {
  .stat-grid {
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .header-row {
    flex-direction: column;
    align-items: flex-start;
  }

  .header-actions {
    width: 100%;
  }

  .header-actions button {
    flex: 1;
    min-width: 120px;
  }

  .rating-cell {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .search-add-row {
    flex-direction: column;
    align-items: stretch;
  }

  .search-add-row .primary-btn {
    width: 100%;
  }
}

@media (max-width: 600px) {
  .stat-card {
    padding: 16px 16px 18px;
  }
  .stat-value {
    font-size: 26px;
  }
  .stat-value-text {
    font-size: 16px;
  }
  .stat-icon {
    width: 32px;
    height: 32px;
    font-size: 14px;
    top: 14px;
    right: 14px;
  }
}

@media (max-width: 480px) {
  .stat-grid {
    grid-template-columns: 1fr;
  }
  .stat-value {
    font-size: 28px;
  }
  .stat-value-text {
    font-size: 18px;
  }
}

@media (max-width: 360px) {
  .stat-grid {
    gap: 10px;
  }
  .stat-card {
    padding: 14px 14px 18px;
  }
}


/* ---------- Office Add/Edit modal dialogs (replaces prompt()/confirm()) ---------- */

.cv-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(2px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}
.cv-modal-overlay.open { display: flex; }

.cv-modal {
  background: #ffffff;
  border-radius: 18px;
  width: 440px;
  max-width: 100%;
  box-shadow: 0 24px 60px rgba(15,23,42,.25);
  overflow: hidden;
  animation: cvModalIn .18s ease;
}

@keyframes cvModalIn {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.cv-modal-header {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 22px 24px 16px;
  border-bottom: 1px solid #f0f9ff;
}

.cv-modal-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: #e0f2fe;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
}
.cv-modal-icon.warn { background: #ffedd5; }

.cv-modal-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 17px;
  color: #0f172a;
  line-height: 1.3;
}

.cv-modal-sub {
  font-size: 12.5px;
  color: #64748b;
  margin-top: 4px;
  line-height: 1.45;
}

.cv-modal-body {
  padding: 18px 24px 6px;
}

.cv-field-label {
  display: block;
  font-size: 11.5px;
  font-weight: 700;
  color: #334155;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 8px;
}

.cv-field-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #bae6fd;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: #0f172a;
  outline: none;
  box-sizing: border-box;
  background: #f8fafc;
  transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.cv-field-input:focus {
  border-color: #0284c7;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(2,132,199,.12);
}
.cv-field-input.error {
  border-color: #f87171;
}

.cv-field-error {
  min-height: 18px;
  font-size: 12px;
  color: #dc2626;
  margin-top: 8px;
  font-weight: 600;
}

.cv-modal-text {
  font-size: 13.5px;
  color: #334155;
  line-height: 1.65;
  margin: 0;
}

.cv-modal-text strong { color: #0f172a; }

.cv-modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 18px 24px 22px;
}

.cv-btn {
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s ease, box-shadow .18s ease, transform .12s ease;
}

.cv-btn-ghost {
  background: #f1f5f9;
  color: #334155;
}
.cv-btn-ghost:hover { background: #e2e8f0; }

.cv-btn-primary {
  background: linear-gradient(160deg, #0ea5e9 0%, #0284c7 55%, #0369a1 100%);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(2,132,199,.28);
}
.cv-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(2,132,199,.32); }
.cv-btn-primary:active { transform: translateY(0); }

.cv-btn-warn {
  background: linear-gradient(160deg, #fb923c 0%, #f97316 55%, #ea580c 100%);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(234,88,12,.28);
}
.cv-btn-warn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(234,88,12,.32); }
.cv-btn-warn:active { transform: translateY(0); }

.cv-toast-stack {
  position: fixed;
  bottom: 26px;
  right: 26px;
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
  z-index: 1100;
  max-width: calc(100vw - 40px);
}

.cv-toast {
  background: #0f172a;
  color: #ffffff;
  padding: 13px 18px;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  box-shadow: 0 10px 24px rgba(15,23,42,.28);
  max-width: 340px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .2s ease, transform .2s ease;
}
.cv-toast.show { opacity: 1; transform: translateY(0); }
.cv-toast.error { background: #7f1d1d; }

@media (max-width: 480px) {
  .cv-modal-header { padding: 20px 18px 14px; }
  .cv-modal-body { padding: 16px 18px 4px; }
  .cv-modal-footer { padding: 16px 18px 20px; flex-direction: column-reverse; }
  .cv-modal-footer .cv-btn { width: 100%; }
}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>

  <main class="main fade-in">
    <div id="topbar-mount"></div>

    <div class="office-section">
     
      <div class="stat-grid">
        <div class="stat-card blue">
          <div class="stat-icon">🏢</div>
          <div class="stat-label">Total Offices</div>
          <div class="stat-value" id="totalOffices">0</div>
          <div class="stat-sub">All Offices</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">📋</div>
          <div class="stat-label">Total Evaluations</div>
          <div class="stat-value" id="totalEvals">0</div>
          <div class="stat-sub">All Time</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">⭐</div>
          <div class="stat-label">Highest Rating</div>
          <div class="stat-value stat-value-text" id="highestOffice">—</div>
          <div class="stat-sub">Top Office</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon">📊</div>
          <div class="stat-label">Lowest Rating</div>
          <div class="stat-value stat-value-text" id="lowestOffice">—</div>
          <div class="stat-sub">Needs Support</div>
        </div>
      </div>

      <div class="card">
       
        <div class="search-add-row">
          <input type="text" id="officeTableSearch" class="search-input" placeholder="🔍 Search offices by name...">
          <button id="addOfficeBtn" class="primary-btn">+ Add Office</button>
        </div>

        <div class="office-table-wrap">
          <table class="office-table">
            <thead>
              <tr>
                <th>Office Name</th>
                <th>Avg Rating</th>
                <th>Total Evaluations</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="officeTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="cv-modal-overlay" id="cvInputOverlay">
  <div class="cv-modal">
    <div class="cv-modal-header">
      <div class="cv-modal-icon" id="cvInputIcon">🏢</div>
      <div>
        <div class="cv-modal-title" id="cvInputTitle">Add Office</div>
        <div class="cv-modal-sub" id="cvInputSub">Create a new office record for evaluations.</div>
      </div>
    </div>
    <div class="cv-modal-body">
      <label class="cv-field-label" for="cvInputField">Office Name</label>
      <input type="text" id="cvInputField" class="cv-field-input" placeholder="e.g. Registrar's Office" autocomplete="off"/>
      <div class="cv-field-error" id="cvInputError"></div>
    </div>
    <div class="cv-modal-footer">
      <button class="cv-btn cv-btn-ghost" id="cvInputCancel">Cancel</button>
      <button class="cv-btn cv-btn-primary" id="cvInputConfirm">Add Office</button>
    </div>
  </div>
</div>

<div class="cv-modal-overlay" id="cvConfirmOverlay">
  <div class="cv-modal">
    <div class="cv-modal-header">
      <div class="cv-modal-icon" id="cvConfirmIcon">❓</div>
      <div>
        <div class="cv-modal-title" id="cvConfirmTitle">Confirm</div>
      </div>
    </div>
    <div class="cv-modal-body">
      <p class="cv-modal-text" id="cvConfirmMessage"></p>
    </div>
    <div class="cv-modal-footer">
      <button class="cv-btn cv-btn-ghost" id="cvConfirmCancel">Cancel</button>
      <button class="cv-btn cv-btn-primary" id="cvConfirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="cv-toast-stack" id="cvToastStack"></div>

<script src="shared.js"></script>
<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import {
  getFirestore,
  collection,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  query,
  where,
  getDocs,
  writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBGLm1iZIMEfNfZIWbGXs8teGwJXHmLr1E",authDomain:"kristal-adb78.firebaseapp.com",
  databaseURL:"https://kristal-adb78-default-rtdb.firebaseio.com",projectId:"kristal-adb78",
  storageBucket:"kristal-adb78.firebasestorage.app",messagingSenderId:"1016283938031",
  appId:"1:1016283938031:web:54c4d13409d9784ad7af1a",measurementId:"G-LK8D1CBQ2J"
};

const app      = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db        = getFirestore(app);

document.getElementById('sidebar-mount').innerHTML = buildSidebar('admin1','office-mgmt');
document.getElementById('topbar-mount').innerHTML  = buildTopbar('Office Management','admin1');

const officesCol     = collection(db, "services", "offices", "records");
const evaluationsCol = collection(db, "services", "evaluations", "records");
const reportsCol     = collection(db, "services", "reports", "records");
const officeTableBody = document.getElementById("officeTableBody");

let offices   = {};
let officeKeys = {};
let allEvaluations = [];
let tableSearchTerm = "";
let renameInProgress = false;

function avgScore(item) {
  let s=0,c=0;
  for(let x=1;x<=8;x++){
    const v=parseFloat(item["sq"+x]??item["sqd"+x]);
    if(!isNaN(v)){s+=v;c++;}
  }
  return c?s/c:0;
}

/* ---------- Modal & toast helpers (replace prompt()/confirm()/alert()) ---------- */

const cvInputOverlay   = document.getElementById("cvInputOverlay");
const cvInputIcon      = document.getElementById("cvInputIcon");
const cvInputTitle     = document.getElementById("cvInputTitle");
const cvInputSub       = document.getElementById("cvInputSub");
const cvInputField     = document.getElementById("cvInputField");
const cvInputError     = document.getElementById("cvInputError");
const cvInputCancelBtn = document.getElementById("cvInputCancel");
const cvInputConfirmBtn = document.getElementById("cvInputConfirm");

let cvInputResolve = null;

// Opens the styled input modal and resolves with the entered text, or
// `null` if the user cancels / closes it. Call again with `error` set to
// re-open pre-filled with a validation message (used for inline duplicate /
// empty-name feedback instead of a blocking alert()).
function openInputModal({ title, subtitle, icon, placeholder, value, confirmText, error }) {
  cvInputTitle.textContent = title || "";
  cvInputSub.textContent = subtitle || "";
  cvInputIcon.textContent = icon || "🏢";
  cvInputField.placeholder = placeholder || "";
  cvInputField.value = value || "";
  cvInputError.textContent = error || "";
  cvInputField.classList.toggle("error", !!error);
  cvInputConfirmBtn.textContent = confirmText || "Save";
  cvInputOverlay.classList.add("open");
  requestAnimationFrame(() => { cvInputField.focus(); cvInputField.select(); });

  return new Promise((resolve) => { cvInputResolve = resolve; });
}

function closeInputModal(result) {
  cvInputOverlay.classList.remove("open");
  if (cvInputResolve) {
    const r = cvInputResolve;
    cvInputResolve = null;
    r(result);
  }
}

cvInputConfirmBtn.addEventListener("click", () => closeInputModal(cvInputField.value));
cvInputCancelBtn.addEventListener("click", () => closeInputModal(null));
cvInputField.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); closeInputModal(cvInputField.value); }
  if (e.key === "Escape") { e.preventDefault(); closeInputModal(null); }
});
cvInputOverlay.addEventListener("click", (e) => {
  if (e.target === cvInputOverlay) closeInputModal(null);
});

const cvConfirmOverlay   = document.getElementById("cvConfirmOverlay");
const cvConfirmIcon      = document.getElementById("cvConfirmIcon");
const cvConfirmTitle     = document.getElementById("cvConfirmTitle");
const cvConfirmMessage   = document.getElementById("cvConfirmMessage");
const cvConfirmCancelBtn = document.getElementById("cvConfirmCancel");
const cvConfirmOkBtn     = document.getElementById("cvConfirmOk");

let cvConfirmResolve = null;

// Opens the styled confirm modal and resolves true/false. `message` may
// contain simple inline HTML (e.g. <strong>) for emphasis.
function openConfirmModal({ title, message, icon, confirmText, tone }) {
  cvConfirmTitle.textContent = title || "Confirm";
  cvConfirmMessage.innerHTML = message || "";
  cvConfirmIcon.textContent = icon || "❓";
  cvConfirmIcon.classList.toggle("warn", tone === "warn");
  cvConfirmOkBtn.textContent = confirmText || "Confirm";
  cvConfirmOkBtn.classList.toggle("cv-btn-warn", tone === "warn");
  cvConfirmOkBtn.classList.toggle("cv-btn-primary", tone !== "warn");
  cvConfirmOverlay.classList.add("open");

  return new Promise((resolve) => { cvConfirmResolve = resolve; });
}

function closeConfirmModal(result) {
  cvConfirmOverlay.classList.remove("open");
  if (cvConfirmResolve) {
    const r = cvConfirmResolve;
    cvConfirmResolve = null;
    r(result);
  }
}

cvConfirmOkBtn.addEventListener("click", () => closeConfirmModal(true));
cvConfirmCancelBtn.addEventListener("click", () => closeConfirmModal(false));
cvConfirmOverlay.addEventListener("click", (e) => {
  if (e.target === cvConfirmOverlay) closeConfirmModal(false);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && cvConfirmOverlay.classList.contains("open")) closeConfirmModal(false);
});

const cvToastStack = document.getElementById("cvToastStack");

// Non-blocking success/error notification, replacing alert().
function showToast(message, isError) {
  const el = document.createElement("div");
  el.className = "cv-toast" + (isError ? " error" : "");
  el.textContent = message;
  cvToastStack.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, 3800);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* ---------- Add Office ---------- */

async function handleAddOffice() {
  let prefillValue = "";
  let fieldError = "";

  while (true) {
    const result = await openInputModal({
      title: "Add Office",
      subtitle: "Create a new office record for evaluations.",
      icon: "🏢",
      placeholder: "e.g. Registrar's Office",
      value: prefillValue,
      confirmText: "Add Office",
      error: fieldError
    });

    if (result === null) return; // cancelled

    const trimmed = result.trim();

    if (!trimmed) {
      prefillValue = "";
      fieldError = "Office name is required.";
      continue;
    }

    const duplicate = Object.keys(offices).some(
      o => o.toLowerCase() === trimmed.toLowerCase()
    );
    if (duplicate) {
      prefillValue = trimmed;
      fieldError = `An office named "${trimmed}" already exists.`;
      continue;
    }

    try {
      await addDoc(officesCol, { name: trimmed });
      showToast(`✓ "${trimmed}" added successfully!`);
      return;
    } catch (error) {
      prefillValue = trimmed;
      fieldError = "Error adding office: " + error.message;
      continue;
    }
  }
}

document.getElementById("addOfficeBtn").addEventListener("click", handleAddOffice);

document.getElementById("officeTableSearch").addEventListener("input", (e) => {
  tableSearchTerm = e.target.value.toLowerCase();
  renderOfficeTable();
});

onSnapshot(officesCol, (snapshot) => {
  offices = {};
  officeKeys = {};

  if (snapshot.empty) {
    document.getElementById("totalOffices").textContent = 0;
    officeTableBody.innerHTML = "";
    updateStats();
    return;
  }

  snapshot.forEach(docSnap => {
    const name = docSnap.data().name;
    if (!name) return;
    officeKeys[name] = docSnap.id;
    offices[name] = { total: 0, count: 0 };
  });

  document.getElementById("totalOffices").textContent = Object.keys(offices).length;
  renderOfficeTable();
  updateStats();
});

onSnapshot(evaluationsCol, (snapshot) => {
  allEvaluations = [];

  Object.keys(offices).forEach(o => {
    offices[o].total = 0;
    offices[o].count = 0;
  });

  snapshot.forEach(docSnap => {
    const item = docSnap.data();
    allEvaluations.push(item);
    const avg = avgScore(item);

    if (offices[item.office]) {
      offices[item.office].total += avg;
      offices[item.office].count++;
    }
  });

  renderOfficeTable();
  updateStats();
});

function updateStats() {
  let totalEvals = allEvaluations.length;
  let highestOffice = "—";
  let lowestOffice = "—";
  let highestRating = -1;
  let lowestRating = 6;
  
  Object.keys(offices).forEach(office => {
    if(offices[office].count > 0) {
      const avg = offices[office].total / offices[office].count;
      
      if(avg > highestRating) {
        highestRating = avg;
        highestOffice = office;
      }
      
      if(avg < lowestRating) {
        lowestRating = avg;
        lowestOffice = office;
      }
    }
  });
  
  document.getElementById("totalEvals").textContent = totalEvals;
  document.getElementById("highestOffice").textContent = highestOffice;
  document.getElementById("lowestOffice").textContent = lowestOffice;
}

function renderOfficeTable() {
  officeTableBody.innerHTML = "";
  
  let entries = Object.keys(offices).map(office => {
    const d = offices[office];
    const avg = d.count > 0 ? d.total / d.count : 0;
    return { office, avg, count: d.count };
  });

  if (tableSearchTerm) {
    entries = entries.filter(e => e.office.toLowerCase().includes(tableSearchTerm));
  }

  if (entries.length === 0) {
    officeTableBody.innerHTML = `<tr><td colspan="4" class="no-results">No offices found</td></tr>`;
    return;
  }

  entries.sort((a, b) => a.office.localeCompare(b.office));

  entries.forEach(({office, avg, count}) => {
    const ratingPercent = (avg / 5) * 100;
    officeTableBody.innerHTML += `
      <tr>
        <td><strong>${office}</strong></td>
        <td>
          <div class="rating-cell">
            <div class="rating-track"><div class="rating-fill" style="width:${ratingPercent}%"></div></div>
            <span class="rating-number">${avg.toFixed(1)}</span>
          </div>
        </td>
        <td><span class="eval-count">${count}</span></td>
        <td>
          <div class="action-buttons">
             <button class="action-btn view-btn" onclick="viewOffice('${office.replace(/'/g, "\\'")}')">👁 View</button>
            <button class="action-btn edit-btn" onclick="editOffice('${office.replace(/'/g, "\\'")}')">✏ Edit</button>
            <button class="action-btn delete-btn" onclick="deleteOffice('${office.replace(/'/g, "\\'")}')">🗑 Delete</button>
          </div>
        </td>
      </tr>
    `;
  });
}

  window.viewOffice = function(office) {
  const key = officeKeys[office];
  const params = new URLSearchParams({ office: key || "", name: office });
  window.location.href = `admin1-office-analytics.html?${params.toString()}`;
};


/**
 * Renames an office while keeping it fully connected to its existing data.
 *
 * The office's Firestore document ID never changes and the document is never
 * deleted/recreated — only its `name` field is updated. Because evaluations,
 * transaction codes, and saved reports are currently linked to an office by
 * its NAME (not its ID), a rename also has to migrate those records so the
 * relationship survives:
 *   1. evaluations   -> update `office` field: oldName -> newName
 *   2. reports        -> update `office` field: oldName -> newName
 *   3. transaction codes -> copy from .../office_name/{oldName}/codes
 *                           to .../office_name/{newName}/codes, then delete
 *                           the old ones (Firestore can't "rename" a path
 *                           segment directly, so copy+delete is the safe
 *                           equivalent of moving them)
 *
 * Each linked record is also stamped with `officeId` (the permanent doc ID)
 * so that future tooling can look records up by ID instead of by name,
 * without requiring another migration.
 */
window.editOffice = async function(office) {
  if (renameInProgress) {
    showToast("A rename is already in progress. Please wait for it to finish.", true);
    return;
  }

  const sourceOfficeId = officeKeys[office];
  if (!sourceOfficeId) {
    showToast("Could not find this office's record. Please refresh and try again.", true);
    return;
  }

  let prefillValue = office;
  let fieldError = "";

  while (true) {
    const result = await openInputModal({
      title: "Edit Office",
      subtitle: `Rename "${office}"`,
      placeholder: "Office name",
      value: prefillValue,
      confirmText: "Save Changes",
      error: fieldError
    });

    if (result === null) return; // cancelled

    const trimmedNew = result.trim();

    if (!trimmedNew) {
      prefillValue = "";
      fieldError = "Office name is required.";
      continue;
    }

    if (trimmedNew === office) {
      showToast("No changes made.");
      return;
    }

    // Does a DIFFERENT office already use the target name? If so this isn't a
    // simple rename anymore — it's a merge (see below), so we never end up
    // with two offices sharing the same name.
    const existingTargetName = Object.keys(offices).find(
      o => o.toLowerCase() === trimmedNew.toLowerCase() && o !== office
    );

    renameInProgress = true;

    try {
      if (existingTargetName) {
        // MERGE: "trimmedNew" is already a separate, existing office. Move
        // everything from "office" onto that existing office, then remove
        // the now-empty source record so it doesn't linger as a duplicate.
        const targetOfficeId = officeKeys[existingTargetName];
        const targetCount = offices[existingTargetName]?.count || 0;

        const confirmed = await openConfirmModal({
          title: "Merge Offices?",
          icon: "🔀",
          tone: "warn",
          confirmText: "Merge Offices",
          message:
            `An office named "<strong>${escapeHtml(existingTargetName)}</strong>" already exists ` +
            `(${targetCount} evaluation${targetCount === 1 ? "" : "s"}).<br><br>` +
            `Merge "<strong>${escapeHtml(office)}</strong>" into "<strong>${escapeHtml(existingTargetName)}</strong>"? ` +
            `All evaluations, transaction codes, and reports currently under "${escapeHtml(office)}" will be moved ` +
            `onto "${escapeHtml(existingTargetName)}", and the "${escapeHtml(office)}" record will be removed. ` +
            `Nothing is deleted — everything is combined under "${escapeHtml(existingTargetName)}".`
        });

        if (!confirmed) {
          renameInProgress = false;
          prefillValue = trimmedNew;
          fieldError = "";
          continue;
        }

        await migrateOfficeData(office, existingTargetName, targetOfficeId);

        // All of the source office's data has moved to the existing target
        // office, so this record is now empty — remove it so it doesn't show
        // up as a duplicate/leftover row.
        await deleteDoc(doc(db, "services", "offices", "records", sourceOfficeId));

        showToast(`✓ Merged "${office}" into "${existingTargetName}" successfully!`);
      } else {
        // Plain rename: the target name is free, so we keep the same office
        // document (same permanent ID) and just update its name.
        const confirmed = await openConfirmModal({
          title: "Rename Office?",
          icon: "✏️",
          tone: "primary",
          confirmText: "Rename Office",
          message:
            `Rename "<strong>${escapeHtml(office)}</strong>" to "<strong>${escapeHtml(trimmedNew)}</strong>"?<br><br>` +
            `All existing evaluations, transaction codes, and reports linked to "${escapeHtml(office)}" will be ` +
            `moved to "${escapeHtml(trimmedNew)}". No data will be deleted.`
        });

        if (!confirmed) {
          renameInProgress = false;
          prefillValue = trimmedNew;
          fieldError = "";
          continue;
        }

        await updateDoc(doc(db, "services", "offices", "records", sourceOfficeId), {
          name: trimmedNew
        });
        await migrateOfficeData(office, trimmedNew, sourceOfficeId);

        showToast(`✓ Office renamed to "${trimmedNew}" successfully!`);
      }

      renameInProgress = false;
      return;
    } catch (error) {
      renameInProgress = false;
      console.error("Office rename/merge failed:", error);
      showToast(
        "Error updating office: " + error.message +
        ". Some records may have already been migrated — please re-check the office's data and retry if needed.",
        true
      );
      return;
    }
  }
};

// Moves every evaluation, report, and transaction code from `oldName` onto
// `newName` (which belongs to Firestore doc `targetOfficeId`). Used for both
// plain renames (targetOfficeId === the same office being renamed) and
// merges (targetOfficeId belongs to a different, already-existing office).
async function migrateOfficeData(oldName, newName, targetOfficeId) {
  await batchUpdateFieldWhere(evaluationsCol, "office", oldName, newName, targetOfficeId);
  await batchUpdateFieldWhere(reportsCol, "office", oldName, newName, targetOfficeId);
  await migrateTransactionCodes(oldName, newName, targetOfficeId);
}

// Batch-updates every document in `colRef` where `field === oldValue`,
// setting `field` to `newValue` and stamping `officeId` for future use.
// Chunked to stay under Firestore's 500-writes-per-batch limit.
async function batchUpdateFieldWhere(colRef, field, oldValue, newValue, officeId) {
  const q = query(colRef, where(field, "==", oldValue));
  const snap = await getDocs(q);
  if (snap.empty) return;

  const docs = snap.docs;
  const CHUNK = 450;

  for (let i = 0; i < docs.length; i += CHUNK) {
    const batch = writeBatch(db);
    docs.slice(i, i + CHUNK).forEach(d => {
      batch.update(d.ref, { [field]: newValue, officeId });
    });
    await batch.commit();
  }
}

// Copies every code doc from services/transaction_code/office_name/{oldName}/codes
// to .../office_name/{newName}/codes (preserving doc ID, status, createdAt, etc.),
// then deletes the originals. Nothing is lost between the copy and the delete
// because both happen inside the same committed batch per chunk.
async function migrateTransactionCodes(oldName, newName, officeId) {
  const oldCodesCol = collection(db, "services", "transaction_code", "office_name", oldName, "codes");
  const snap = await getDocs(oldCodesCol);
  if (snap.empty) return;

  const newCodesCol = collection(db, "services", "transaction_code", "office_name", newName, "codes");

  const docs = snap.docs;
  const CHUNK = 200; // 2 writes per code (set + delete), keep well under 500

  for (let i = 0; i < docs.length; i += CHUNK) {
    const batch = writeBatch(db);
    docs.slice(i, i + CHUNK).forEach(d => {
      batch.set(doc(newCodesCol, d.id), { ...d.data(), officeId });
      batch.delete(d.ref);
    });
    await batch.commit();
  }
}

window.deleteOffice = async function(office) {
  if(!confirm(`Delete "${office}"? This action cannot be undone.`)) return;
  
  try {
    const key = officeKeys[office];
    await deleteDoc(doc(db, "services", "offices", "records", key));
    alert("✓ Office deleted successfully!");
  } catch (error) {
    alert("Error deleting office: " + error.message);
  }
};

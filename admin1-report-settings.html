<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVoice – Report Settings | Admin 1</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:white;color:#0f172a}
.layout{display:flex;min-height:100vh}
.main{flex:1;padding:24px;min-width:0}
.card{background:#fff;border:1px solid #bae6fd;border-radius:14px;padding:18px;margin-bottom:18px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.card-title{font-size:16px;font-weight:700;color:#0f172a}
.input,select{padding:10px 12px;border:1px solid #dbe4ee;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;background:#f8fafc;color:#0f172a;outline:none}
.btn{padding:10px 16px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-family:'DM Sans',sans-serif;font-size:14px}
.btn-green{background:#16a34a;color:#fff}.btn-gray{background:#e2e8f0;color:#475569}.btn-purple{background:#7c3aed;color:#fff}

/* settings form */
.rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rs-col h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:#64748b}
label{display:block;font-size:12px;font-weight:600;color:#475569;margin:10px 0 4px}
#rsCard .input,#rsCard select,#rsCard textarea{width:100%;box-sizing:border-box}
textarea{min-height:70px;resize:vertical;padding:10px 12px;border:1px solid #dbe4ee;border-radius:10px;background:#f8fafc;font-family:'DM Sans',sans-serif;font-size:14px}
.rs-img{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rs-img img{max-width:90px;max-height:44px;border:1px solid #e2e8f0;border-radius:6px;background:#fff}
.rs-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.rs-preview{background:#f1f5f9;border-radius:12px;padding:14px;position:sticky;top:12px;overflow-x:auto}
.rs-preview .generated-report{min-height:0}
.rs-note{font-size:12px;color:#94a3b8;margin:6px 0 0}
@media(max-width:1100px){.rs-grid{grid-template-columns:1fr}}

/* report header/footer look (same as the report page) */
.generated-report{display:flex;flex-direction:column;width:100%;max-width:210mm;margin:0 auto;box-sizing:border-box;background:#fff;font-family:'Times New Roman',Times,serif;font-size:11pt;color:#000;box-shadow:0 1px 3px rgba(15,23,42,.10),0 1px 2px rgba(15,23,42,.06);border:1px solid #e2e8f0}
.generated-report-header,.generated-report-footer{width:100%;box-sizing:border-box;padding-left:15mm;padding-right:15mm}
.generated-report-header{padding-top:6px}
.generated-report-footer{padding-top:10px;padding-bottom:10px}
.lh-row{display:flex;align-items:center;gap:9px;margin-bottom:1px}
.lh-logo-box{width:100px;height:100px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.lh-logo-box img{width:100%;height:100%;object-fit:contain}
.lh-text{flex:1;text-align:center;line-height:1.3}
.lh-text .rep{font-family:'Times New Roman',Times,serif;font-size:10pt;color:#000}
.lh-text .uni{font-family:'Times New Roman',Times,serif;font-size:11.5pt;font-weight:bold;color:#0f172a}
.lh-text .addr1{font-family:'Times New Roman',Times,serif;font-size:9.5pt;color:#000}
.lh-text .dept{font-family:Arial,Helvetica,sans-serif;font-size:11pt;font-weight:bold;text-transform:uppercase;color:#1f4e9c}
.lh-text .addr{font-family:Arial,Helvetica,sans-serif;font-size:7.5pt;color:#222;white-space:nowrap}
.lh-divider{border:none;border-top:2px solid #1f4e9c;margin:3px 0 8px}
.csm-doc-title{text-align:center;font-size:11.5pt;font-weight:bold;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.csm-sigs{display:flex;gap:40px;margin-top:8px;margin-bottom:16px;font-size:10.5pt}
.csm-sig-block{flex:1}
.csm-sig-label{color:#555;font-size:9.5pt;margin-bottom:30px}
.csm-sig-name{font-weight:bold;text-transform:uppercase;border-top:1px solid #000;padding-top:4px;display:inline-block}
.csm-sig-title{font-size:9.5pt;font-style:italic;color:#333;margin-top:2px}
.csm-footer{display:block;width:100%}
.csm-footer img{display:block;width:100%;height:auto;object-fit:contain}
/* ================= HOVER + DESIGN POLISH ================= */

/* Entrance animation (main card only) */
@keyframes cvRise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
#rsCard {
  animation: cvRise .5s cubic-bezier(.2,.7,.2,1) both;
}

/* Main card */
.card {
  border-radius: 18px;
  box-shadow: 0 4px 14px rgba(15,23,42,.05);
  transition: box-shadow .25s ease, border-color .25s ease;
}
.card:hover {
  border-color: #7dd3fc;
  box-shadow: 0 12px 28px rgba(15,23,42,.08);
}
.card-title { font-family: 'Syne', sans-serif; }
.card-title::after {
  content: "";
  display: block;
  width: 28px; height: 3px;
  margin-top: 6px;
  border-radius: 3px;
  background: #2563eb;
  transition: width .3s ease;
}
.card:hover .card-title::after { width: 56px; }

/* Form section headings */
.rs-col h4 {
  font-family: 'Syne', sans-serif;
  padding-left: 10px;
  border-left: 3px solid #2563eb;
}

/* Labels react when their field is focused */
label { transition: color .2s ease; }
#rsForm label:has(+ .input:focus),
#rsForm label:has(+ textarea:focus),
#rsForm label:has(+ select:focus) { color: #2563eb; }

/* Inputs */
.input, select, textarea {
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
.input:hover, select:hover, textarea:hover { border-color: #7dd3fc; }
.input:focus, select:focus, textarea:focus {
  background: #ffffff;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  outline: none;
}
select { cursor: pointer; }

/* Image upload rows */
.rs-img img {
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.rs-img img:hover {
  transform: scale(1.08);
  border-color: #7dd3fc;
  box-shadow: 0 6px 14px rgba(15,23,42,.15);
}
.rs-img input[type=file] { font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; }
.rs-img input[type=file]::file-selector-button {
  border: none;
  border-radius: 8px;
  padding: 7px 12px;
  margin-right: 10px;
  background: #dbeafe;
  color: #1e40af;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: background .2s ease, box-shadow .2s ease;
}
.rs-img input[type=file]::file-selector-button:hover {
  background: #bfdbfe;
  box-shadow: 0 3px 10px rgba(37,99,235,.2);
}

/* Buttons */
.btn {
  transition: background .2s ease, box-shadow .2s ease, transform .2s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-green { box-shadow: 0 4px 12px rgba(22,163,74,.25); }
.btn-green:hover { background: #15803d; box-shadow: 0 8px 18px rgba(22,163,74,.35); }
.btn-purple { box-shadow: 0 4px 12px rgba(124,58,237,.25); }
.btn-purple:hover { background: #6d28d9; box-shadow: 0 8px 18px rgba(124,58,237,.35); }
.btn-gray:hover { background: #dbeafe; color: #1e40af; box-shadow: 0 6px 14px rgba(37,99,235,.15); }
.btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }

/* Live preview panel */
.rs-preview {
  border: 1px solid #e2e8f0;
  box-shadow: inset 0 1px 3px rgba(15,23,42,.05);
  transition: border-color .25s ease, box-shadow .25s ease;
}
.rs-preview:hover {
  border-color: #7dd3fc;
  box-shadow: inset 0 1px 3px rgba(15,23,42,.05), 0 8px 20px rgba(15,23,42,.08);
}

/* Footer note */
.rs-note { font-style: italic; }

/* Accessibility: reduced motion */
@media (prefers-reduced-motion: reduce) {
  #rsCard { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-mount"></div>

  <main class="main">
    <div id="topbar-mount"></div>

    <div class="card" id="rsCard">
      <div class="card-header">
        <button class="btn btn-gray" id="rsBack" type="button">← Back to Reports</button>
        <div class="card-title">⚙️ Report Settings</div>
      </div>

      <div class="rs-grid">
        <div class="rs-col" id="rsForm"></div>
        <div class="rs-col">
          <h4>Live preview</h4>
          <div class="rs-preview"><div class="generated-report">
            <div class="generated-report-header" id="rsPvH"></div>
            <div class="generated-report-footer" id="rsPvF"></div>
          </div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="shared.js"></script>

<!-- 2) Settings editor -->
<script type="module">
import { GROUPS, ALL, DEFAULTS, curRef, defRef, renderReportHeader, renderReportFooter }
  from "./admin1-report-settings.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const db = getFirestore(getApp());
const $ = id => document.getElementById(id);

document.getElementById('sidebar-mount').innerHTML = buildSidebar('admin1','reports');
document.getElementById('topbar-mount').innerHTML  = buildTopbar('Report Settings','admin1');


let draft = {};
let formDirty = false;

/* ---------- build the form ---------- */
$("rsForm").innerHTML =
  GROUPS.map(g => `<h4 style="margin-top:14px">${g.title} settings</h4>` + g.fields.map(f => `
    <label for="rs_${f.k}">${f.l}</label>` + (
    f.t === "text"  ? `<input class="input" id="rs_${f.k}" data-k="${f.k}">` :
    f.t === "area"  ? `<textarea id="rs_${f.k}" data-k="${f.k}"></textarea>` :
    f.t === "align" ? `<select id="rs_${f.k}" data-k="${f.k}"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>` :
    `<div class="rs-img"><img id="rs_${f.k}_img" style="display:none"><input type="file" accept="image/*" data-img="${f.k}" data-max="${f.max}"><button class="btn btn-gray" type="button" data-clear="${f.k}">Remove</button></div>`
  )).join("")).join("") + `
  <div class="rs-actions">
    <button class="btn btn-green"  id="rsSave" type="button">💾 Save Changes</button>
    <button class="btn btn-gray"   id="rsReset" type="button">↺ Reset to Default</button>
    <button class="btn btn-purple" id="rsSaveDefault" type="button">⭐ Save as Default</button>
  </div>
  <p class="rs-note">Saved to Firebase and used by the preview, print, PDF export and newly saved reports. Saved reports keep the header/footer they were created with.</p>`;

function fillForm() {
  ALL.forEach(f => {
    if (f.t === "image") {
      const img = $(`rs_${f.k}_img`);
      img.src = draft[f.k] || ""; img.style.display = draft[f.k] ? "block" : "none";
    } else $(`rs_${f.k}`).value = draft[f.k] ?? (f.t === "align" ? "center" : "");
  });
  livePreview();
}
function livePreview() {
  renderReportHeader($("rsPvH"), draft, "reportTitle");
  renderReportFooter($("rsPvF"), draft);
}

/* ---------- load from Firestore (does not overwrite unsaved edits) ---------- */
onSnapshot(curRef, snap => {
  if (formDirty) return;
  draft = snap.exists() ? { ...DEFAULTS, ...snap.data() } : { ...DEFAULTS };
  fillForm();
}, err => alert("Could not load report settings: " + err.message));

/* ---------- editing ---------- */
const card = $("rsCard");
card.addEventListener("input", e => {
  const k = e.target.dataset.k; if (!k) return;
  draft[k] = e.target.value; formDirty = true; livePreview();
});
card.addEventListener("change", async e => {
  const k = e.target.dataset.img; if (!k || !e.target.files[0]) return;
  try {
    draft[k] = await fileToDataUrl(e.target.files[0], +e.target.dataset.max || 400);
    formDirty = true; fillForm();
  } catch { alert("Could not read that image."); }
});
card.addEventListener("click", e => {
  const k = e.target.dataset.clear; if (!k) return;
  draft[k] = ""; formDirty = true; fillForm();
});

function fileToDataUrl(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", 0.85));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const payload = () => { const o = {}; ALL.forEach(f => o[f.k] = draft[f.k] ?? ""); o.updatedAt = new Date().toISOString(); return o; };

$("rsSave").onclick = async () => {
  try { await setDoc(curRef, payload()); formDirty = false; alert("✅ Header & footer settings saved."); }
  catch (err) { alert("❌ Failed to save: " + err.message); }
};
$("rsSaveDefault").onclick = async () => {
  if (!confirm("Use the current form values as the default that “Reset to Default” restores?")) return;
  try { await setDoc(defRef, payload()); alert("✅ Default saved."); }
  catch (err) { alert("❌ Failed to save default: " + err.message); }
};
$("rsReset").onclick = async () => {
  try {
    const snap = await getDoc(defRef);
    if (!confirm("Replace the current settings with the default?")) return;
    draft = snap.exists() ? { ...DEFAULTS, ...snap.data() } : { ...DEFAULTS };
    await setDoc(curRef, payload()); formDirty = false; fillForm();
  } catch (err) { alert("❌ Failed to reset: " + err.message); }
};

/* ---------- back to reports ---------- */
$("rsBack").onclick = () => {
  if (formDirty && !confirm("You have unsaved changes. Leave without saving?")) return;
  formDirty = false;
  window.location.href = "admin1-reports.html";
};
window.addEventListener("beforeunload", e => { if (formDirty) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
